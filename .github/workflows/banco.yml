# Aplica sozinho o SQL novo de supabase/migrations:
# - pedido de mudança (PR) para a main → banco de teste (guiatennis-teste),
#   o mesmo que a prévia do Netlify usa;
# - merge na main ("pode subir") → banco de verdade.
# As URLs dos bancos ficam nos segredos do repositório: BANCO_TESTE_URL e
# BANCO_REAL_URL (Settings → Secrets and variables → Actions), com o
# endereço "Session pooler" do Supabase — o GitHub não alcança o endereço
# direto, que é só IPv6. Sem o segredo, avisa e não faz nada.
# Também dá para rodar à mão: Actions → Banco de dados → Run workflow.
name: Banco de dados

on:
  pull_request:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/banco.yml", "divulgacao/email-codigo.html"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/banco.yml", "divulgacao/email-codigo.html"]
  workflow_dispatch:
    inputs:
      destino:
        description: "Em qual banco aplicar"
        type: choice
        options: [teste, real]
        default: teste

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      DESTINO: ${{ github.event_name == 'push' && 'real' || inputs.destino || 'teste' }}
    # Um de cada vez em cada banco, na ordem em que chegaram.
    concurrency:
      group: banco-${{ github.event_name == 'push' && 'real' || inputs.destino || 'teste' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Aplicar o SQL novo no banco ${{ env.DESTINO }}
        env:
          BANCO_TESTE_URL: ${{ secrets.BANCO_TESTE_URL }}
          BANCO_REAL_URL: ${{ secrets.BANCO_REAL_URL }}
        run: |
          if [ "$DESTINO" = real ]; then BANCO_URL="$BANCO_REAL_URL"; else BANCO_URL="$BANCO_TESTE_URL"; fi
          if [ -z "$BANCO_URL" ]; then
            echo "::warning::Falta o segredo do banco $DESTINO no GitHub. Nada foi aplicado."
            exit 0
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          BANCO_URL="$BANCO_URL" bash supabase/aplicar.sh "$DESTINO"
          echo "APLICADO=sim" >> "$GITHUB_ENV"

      # Avisos por e-mail (SQL 20261005160000): a chave do Resend vai do
      # segredo RESEND_API_KEY para o cofre (Vault) do banco, sem aparecer no
      # registro; o endereço dos links é o do site de verdade ou a prévia do PR.
      - name: Ligar os avisos por e-mail no banco ${{ env.DESTINO }}
        if: env.APLICADO == 'sim'
        env:
          BANCO_TESTE_URL: ${{ secrets.BANCO_TESTE_URL }}
          BANCO_REAL_URL: ${{ secrets.BANCO_REAL_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$DESTINO" = real ]; then
            BANCO_URL="$BANCO_REAL_URL"; SITE=https://guiatennis.com.br
          else
            BANCO_URL="$BANCO_TESTE_URL"; SITE="${PR:+https://deploy-preview-$PR--stately-salamander-652f72.netlify.app}"
          fi
          BANCO_URL="$(printf '%s' "$BANCO_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::Falta o segredo RESEND_API_KEY no GitHub: os avisos por e-mail ficam na fila do banco $DESTINO."
          fi
          psql "$BANCO_URL" -X -q -At -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
            -v chave="$RESEND_API_KEY" -v site="$SITE" <<'SQL' \
            || echo "::warning::Não consegui guardar a chave do Resend no banco $DESTINO (veja o erro acima)."
          \set VERBOSITY terse
          select public.configurar_emails(:'chave', :'site');
          SQL

      # Código da disputa pelo WhatsApp (SQL 20261007140000): o token da Meta
      # vai do segredo WHATSAPP_TOKEN para o cofre (Vault) do banco. No banco
      # de teste, a mensagem só vai para WHATSAPP_NUMERO_DE_TESTE (as fichas
      # de teste têm WhatsApp inventado); sem ele, não manda nada.
      - name: Ligar o código pelo WhatsApp no banco ${{ env.DESTINO }}
        if: env.APLICADO == 'sim'
        env:
          BANCO_TESTE_URL: ${{ secrets.BANCO_TESTE_URL }}
          BANCO_REAL_URL: ${{ secrets.BANCO_REAL_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_NUMERO_ID: ${{ secrets.WHATSAPP_NUMERO_ID }}
          WHATSAPP_NUMERO_DE_TESTE: ${{ secrets.WHATSAPP_NUMERO_DE_TESTE }}
        run: |
          if [ "$DESTINO" = real ]; then BANCO_URL="$BANCO_REAL_URL"; REAL=true; else BANCO_URL="$BANCO_TESTE_URL"; REAL=false; fi
          BANCO_URL="$(printf '%s' "$BANCO_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$WHATSAPP_TOKEN" ] || [ -z "$WHATSAPP_NUMERO_ID" ]; then
            echo "Sem os segredos WHATSAPP_TOKEN e WHATSAPP_NUMERO_ID: o código da disputa continua pelo admin."
          fi
          psql "$BANCO_URL" -X -q -At -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
            -v token="$WHATSAPP_TOKEN" -v numero="$WHATSAPP_NUMERO_ID" -v teste="$WHATSAPP_NUMERO_DE_TESTE" -v real="$REAL" <<'SQL' \
            || echo "::warning::Não consegui guardar o token do WhatsApp no banco $DESTINO (veja o erro acima)."
          \set VERBOSITY terse
          select public.configurar_whatsapp(:'token', :'numero', :'teste', :'real'::boolean);
          SQL

      # E-mail do código (confirmar o e-mail e "Esqueci a senha", regra 67):
      # o modelo divulgacao/email-codigo.html vai sozinho para o Supabase
      # (Authentication › Emails › Templates › Magic Link) pela API de
      # gerenciamento, com o segredo SUPABASE_ACCESS_TOKEN (token pessoal do
      # Supabase, Account › Access Tokens), em vez de o Breno colar à mão nos
      # dois projetos. Na prévia, a logo vem da prévia do PR (o
      # email-logo.png só chega ao site de verdade com o merge). A resposta
      # do Supabase traz a configuração inteira (com a senha do SMTP): não
      # vai para o registro, só a mensagem de erro, se houver.
      - name: Modelo do e-mail do código no Supabase ${{ env.DESTINO }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub: o modelo do e-mail do código não foi trocado no Supabase $DESTINO."
            exit 0
          fi
          if [ "$DESTINO" = real ]; then
            REF=eultezheqwmxyakvgyjy; SITE=https://guiatennis.com.br
          else
            REF=ohvbengbujdioxdtewsy; SITE="${PR:+https://deploy-preview-$PR--stately-salamander-652f72.netlify.app}"; SITE="${SITE:-https://guiatennis.com.br}"
          fi
          SITE="$SITE" python3 - > "$RUNNER_TEMP/modelo.json" <<'PY'
          import json, os, re
          html = open("divulgacao/email-codigo.html", encoding="utf-8").read()
          html = re.sub(r"^\s*<!--.*?-->\s*", "", html, count=1, flags=re.S)  # o comentário de instruções fica só no repositório
          html = html.replace("https://guiatennis.com.br/email-logo.png", os.environ["SITE"] + "/email-logo.png")
          assert "{{ .Token }}" in html and "<!--" not in html
          print(json.dumps({"mailer_subjects_magic_link": "Seu código do GuiaTennis", "mailer_templates_magic_link_content": html}))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/resposta.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n ')" \
            -H "Content-Type: application/json" --data @"$RUNNER_TEMP/modelo.json" || echo 000)
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Modelo do e-mail do código trocado no Supabase $DESTINO (logo de $SITE)."
          else
            erro=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("message") or d.get("error") or "")[:200])' "$RUNNER_TEMP/resposta.json" 2>/dev/null)
            echo "::warning::O Supabase $DESTINO não aceitou o modelo do e-mail do código (HTTP $code): $erro"
          fi
          rm -f "$RUNNER_TEMP/resposta.json"

      - name: Conferir o que o site lê do banco ${{ env.DESTINO }}
        if: env.APLICADO == 'sim'
        env:
          # Endereços e chaves públicos — os mesmos do index.html.
          API_TESTE: https://ohvbengbujdioxdtewsy.supabase.co
          CHAVE_TESTE: sb_publishable_NEF5wHWslCi3Uu9GfbHruQ_Ut3r_BBT
          API_REAL: https://eultezheqwmxyakvgyjy.supabase.co
          CHAVE_REAL: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bHRlemhlcXdteHlha3ZneWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDk5OTcsImV4cCI6MjEwMzg4NTk5N30.JORQlxn0UjezbntZAiQGyA7Mo26zEpnHriPh9IceuuY
        run: bash supabase/conferir.sh "$DESTINO"
