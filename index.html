<!DOCTYPE html>
<html lang="pt-BR">
<head>

     automático do Android inverte as cores e desmonta o visual. -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F4EC;
    --bg-alt: #EFEADD;
    --card: #FFFFFF;
    --border: #E1DACB;
    --green: #1F4D3D;
    --green-light: #2E6B54;
    --gold: #B8933F;
    --gold-light: #D8B865;
    --text: #211F1A;
    --muted: #7A7362;
    --muted-dark: #A79F8C;
    --red: #A8462C;
  }
  * { box-sizing: border-box; }
  .ficha-basica { display: flex; gap: 6px; align-items: flex-start; margin: 10px 0 0; padding: 8px 10px; background: var(--bg-alt); border-radius: 10px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .ficha-basica svg { flex-shrink: 0; margin-top: 2px; }
  .ficha-confirmada { display: flex; gap: 6px; align-items: center; margin: 14px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .selo-confirmada { display: inline-flex; vertical-align: -0.12em; margin-left: 6px; padding: 0; border: 0; background: none; line-height: 0; flex-shrink: 0; }
  button.selo-confirmada { cursor: pointer; }
  .ficha-confirmada .selo-confirmada { margin-left: 0; }
  .ficha-confirmada strong { color: var(--green); font-weight: 600; }
  .ficha-confirmada svg { flex-shrink: 0; }
  .ficha-dono { margin-top: 14px; }
  .ficha-dono .inline-link { font-size: inherit; font-weight: 700; }
  /* Área da academia */
  .conta-rotulo { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  .conta-situacao { display: flex; gap: 7px; align-items: flex-start; margin: 12px 0 0; padding: 9px 11px; background: var(--bg-alt); border-radius: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .conta-situacao.ok { background: var(--green-soft); color: var(--green); }
  .conta-situacao svg, .conta-aviso svg { flex-shrink: 0; margin-top: 1px; }
  .conta-aviso { display: flex; gap: 7px; align-items: center; margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--green); }
  .conta-faltas { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .conta-faltas-t { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  .conta-falta { border: 1px dashed var(--muted-dark); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .conta-revs { grid-template-columns: 1fr !important; }
  .conta-dados { background: var(--bg-alt); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .conta-dados p { margin: 2px 0; overflow-wrap: anywhere; }
  .conta-acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .conta-acoes .cta-btn { flex: 1 1 140px; width: auto; margin: 0; }
  .conta-sair-link { display: block; margin: 18px auto 0; background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; font-family: inherit; }
  .dono-box { background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 14px; padding: 14px; }
  .dono-texto { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
  .rev-resp { margin-top: 12px; padding: 10px 12px; background: var(--bg-alt); border-left: 3px solid var(--green); border-radius: 0 10px 10px 0; }
  .rev-resp-t { margin: 0; font-size: 12px; font-weight: 700; color: var(--green); }
  .rev-resp-texto { margin: 4px 0 2px; font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .rev-resp .inline-link { display: block; margin-top: 6px; color: var(--red); }
  .rev-resp-links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
  .rev-resp-links .inline-link { font-size: 13px; font-weight: 700; }
  .rev-resp-form { margin-top: 12px; }
  .rev-resp-acoes { display: flex; gap: 8px; margin-top: 8px; }
  .rev-resp-acoes .cta-btn { flex: 1; width: auto; margin: 0; padding: 9px; font-size: 13px; }
  .admin-pago-box.acesso-admin { flex-direction: column; align-items: stretch; gap: 8px; margin-right: 0; }
  .acesso-rotulo { font-weight: 700; }
  .acesso-erro { color: var(--red); }
  .acesso-novo { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--green-line); border-radius: 10px; padding: 10px; }
  .acesso-novo strong { font-size: 15px; letter-spacing: 0.04em; user-select: all; }
  .admin-pago-box button.acesso-remover { background: var(--red); }
  .acesso-item { display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer; color: var(--text); }
  .acesso-item .pending-name, .acesso-item .pending-detail { display: block; }
  /* Academia sem foto: nada no lugar da foto, o texto ocupa o espaço. */
  .cmp-add.sem-foto { grid-template-columns: minmax(0, 1fr) auto; }
  .ht-viz-c.sem-foto { grid-template-columns: minmax(0, 1fr) auto; }
  .mini.sem-foto .mini-badge { position: static; display: inline-block; margin: 12px 0 0 12px; }
  .rcard-tag.solto { position: static; display: inline-block; margin: 0 6px 8px 0; }
  .footnote a, .ficha-dono a { color: var(--green); font-weight: 700; }
  .sf-col a.contato-link { display: flex; align-items: center; gap: 7px; }
  .ba-nota a { color: var(--gold-light); font-weight: 700; text-decoration: underline; }
  .mapa-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .mapa-acoes .cta-btn { flex: 1 1 auto; width: auto; margin: 0; padding: 10px 12px; font-size: 13px; }
  .faixa-banco-teste { background: var(--gold-light); color: var(--text); font-size: 12px; font-weight: 700; text-align: center; padding: 6px 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--fonte-texto); font-weight: 400; line-height: 1.55; font-size: 15px;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
  }
  input, select, textarea, button { font-family: inherit; }
  .display { font-family: var(--fonte-titulo); }
  .container { max-width: 480px; margin: 0 auto; min-height: 100vh; }

  .admin-banner { background: var(--green); color: #fff; font-weight: 600; font-size: 12px; text-align: center; padding: 6px; letter-spacing: 0.07em; text-transform: uppercase; }
  .admin-banner a, .admin-banner button { background: none; border: none; color: #fff; text-decoration: underline; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; margin-left: 8px; padding: 0; }

  /* Painel do admin (06/10/2026): um site à parte, como o admin da Shopify
     e a extranet do Booking — barra escura em cima, seções do lado. */
  .container.adm-cheio { max-width: none; }
  .adm { min-height: 100vh; background: #F3F1EA; }
  .adm-topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; background: #163A2E; color: #fff; }
  .adm-marca { display: flex; align-items: center; gap: 9px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; }
  .adm-marca .logo-mark { width: 30px; height: 30px; border-radius: 8px; }
  .adm-marca em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--gold-light); color: #163A2E; border-radius: 999px; padding: 2px 8px; }
  .adm-topo-acoes { margin-left: auto; display: flex; gap: 6px; }
  .adm-topo-acoes button { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .adm-topo-acoes button:hover { background: rgba(255,255,255,0.2); }
  .adm-menu-btn { display: inline-flex; flex-direction: column; justify-content: center; gap: 4px; width: 36px; height: 36px; background: none; border: none; cursor: pointer; padding: 8px; flex-shrink: 0; }
  .adm-menu-btn span { display: block; height: 2px; background: #fff; border-radius: 2px; }
  .adm-nav { display: none; flex-direction: column; gap: 2px; padding: 10px; background: var(--card); border-bottom: 1px solid var(--border); }
  .adm-nav.aberta { display: flex; }
  .adm-nav-i { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; }
  .adm-nav-i:hover { background: var(--bg-alt); }
  .adm-nav-i.ativo { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .adm-nav-n { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 20px; padding: 1px 6px; text-align: center; }
  .adm-nav-pe { margin: 12px 12px 4px; font-size: 12px; color: var(--muted); }
  .adm-main { padding: 20px 16px 60px; max-width: 1100px; }
  .adm-h1 { font-size: 24px; font-weight: 700; margin: 0; color: var(--text); letter-spacing: -0.01em; }
  .adm-sub { margin: 4px 0 16px; color: var(--muted); font-size: 14px; }
  .adm-h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .adm-cont { background: var(--bg-alt); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--muted); }
  .adm-bloco { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .adm-bloco > .chip-row:first-child { margin-top: 0 !important; }
  /* O que vem das janelas antigas ganha a letra e o tamanho do painel. */
  .adm .display, .adm .sheet-title { font-family: var(--fonte-texto); }
  .adm-bloco .sheet-title { font-size: 15px !important; font-weight: 700; margin: 22px 0 4px !important; }
  .adm-bloco > .sheet-title:first-child { margin-top: 0 !important; }
  .adm-bloco .subtitle { font-size: 13px; margin-top: 0 !important; }
  .adm-bloco .pending-name { font-weight: 700; }
  .adm-nota { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .adm-vazio { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
  .adm-tudo-certo { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; color: var(--green); }
  .adm-tarefas { display: flex; flex-direction: column; gap: 6px; }
  .adm-tarefa { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text); cursor: pointer; }
  .adm-tarefa:hover { border-color: var(--green-line); }
  .adm-tarefa > span:nth-child(2) { flex: 1; }
  .adm-tarefa-n { min-width: 28px; height: 28px; border-radius: 999px; background: #FFF4D6; color: #7A5A12; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; padding: 0 8px; }
  .adm-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .adm-kpi { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); min-width: 0; }
  .adm-kpi-l { margin: 0; font-size: 13px; color: var(--muted); }
  .adm-kpi-v { margin: 2px 0 0; font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .adm-delta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .adm-delta.bom { color: var(--green); font-weight: 600; }
  .adm-delta.ruim { color: var(--red); font-weight: 600; }
  .adm-delta small { font-weight: 400; color: var(--muted); }
  .adm-linha { display: block; width: 100%; max-width: 160px; height: 32px; margin-top: 8px; overflow: visible; }
  .adm-colunas { display: grid; }
  .adm-lista-num { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .adm-linha-num { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); text-align: left; cursor: pointer; }
  .adm-linha-num:last-child { border-bottom: none; }
  .adm-linha-num:hover { background: var(--bg); }
  .adm-linha-num strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .adm-linha-num small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .adm-barra { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .adm-busca { margin-top: 0; flex: 1 1 240px; }
  .adm-nova { flex: 0 0 auto; padding: 10px 14px; }
  .adm-filtros { margin-top: 12px; flex-wrap: wrap; }
  .adm-filtros small { color: var(--muted); font-weight: 500; margin-left: 2px; }
  .adm-filtros .chip.active small { color: inherit; opacity: 0.85; }
  .adm-acads { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .adm-acad { border-bottom: 1px solid var(--border); }
  .adm-acad:last-child { border-bottom: none; }
  .adm-acad.aberta { background: var(--bg); }
  .adm-acad-cab { display: grid; grid-template-columns: 1fr; gap: 6px; width: 100%; text-align: left; background: none; border: none; padding: 12px; cursor: pointer; color: var(--text); font-size: 14px; }
  .adm-acad-nome strong { display: block; }
  .adm-acad-nome small { color: var(--muted); font-size: 12.5px; }
  .adm-pilulas { display: flex; gap: 6px; flex-wrap: wrap; }
  .adm-pilula { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--bg-alt); color: var(--muted); white-space: nowrap; display: inline-block; }
  .adm-pilula.no-ar { background: var(--green-soft); color: var(--green); }
  .adm-pilula.analise { background: #FFF4D6; color: #7A5A12; }
  .adm-pilula.pausada, .adm-pilula.erro { background: #F8E3DC; color: var(--red); }
  .adm-pilula.plano-completo, .adm-pilula.plano-premium { background: #F3EAD3; color: #6E5520; }
  .adm-acad-nums { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .adm-acad-nums span { display: inline-flex; align-items: center; gap: 4px; }
  .adm-acad-corpo { padding: 0 12px 14px; }
  .adm-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .adm-acoes .cta-btn { flex: 1 1 160px; }
  .adm-rotulo { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .adm-tabela { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13.5px; }
  .adm-tr { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .adm-tr:last-child { border-bottom: none; }
  .adm-tr small { display: block; color: var(--muted); font-size: 12.5px; word-break: break-word; }
  .adm-th { display: none; }
  .adm-tr .chip { margin-top: 6px; }
  .adm-aval { border-top: 1px solid var(--border); padding: 12px 0; }
  .adm-aval:first-of-type { border-top: none; }
  .adm-aval-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .adm-aval-top .adm-nota { margin: 0; }
  .adm-aval-top .delete-review-btn { margin-left: auto; }
  .adm-estrelas { color: var(--gold); letter-spacing: 1px; }
  .adm-estrelas i { font-style: normal; color: var(--border); }
  .adm-aval-texto { margin: 6px 0 0; font-size: 14px; }
  .adm-aval-resp { margin: 8px 0 0; font-size: 13px; background: var(--bg-alt); border-radius: 8px; padding: 8px 10px; }
  .adm-botao { width: auto; display: inline-flex; margin-top: 10px; }
  .adm-excluir { display: inline-block; margin-top: 6px; background: none; border: none; padding: 0; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--red); text-decoration: underline; cursor: pointer; }
  @media (min-width: 720px) {
    .adm-kpis { grid-template-columns: repeat(4, 1fr); }
    .adm-colunas { grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .adm-acad-cab { grid-template-columns: minmax(0, 1.4fr) auto minmax(0, 1fr); align-items: center; }
    .adm-acad-nums { justify-content: flex-end; }
    .adm-tr { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; align-items: start; }
    .adm-th { display: grid; background: var(--bg); font-size: 12px; font-weight: 700; color: var(--muted); }
  }
  @media (min-width: 960px) {
    .adm-menu-btn { display: none; }
    .adm-corpo { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .adm-nav { display: flex; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; border-bottom: none; border-right: 1px solid var(--border); padding: 16px 10px; }
    .adm-main { padding: 28px 32px 80px; }
  }
  @media (max-width: 560px) { .adm-topo-acoes button span { display: none; } .adm-marca span { display: none; } }

  .header { padding: 32px 20px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  .title { font-size: 34px; font-weight: 700; line-height: 1.05; margin: 0; color: var(--green); }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .logo-mark { flex-shrink: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  .btn-primary { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-family: var(--fonte-texto); font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 10px; }
  .status-error { color: var(--red); }
  .status-info { color: var(--muted); }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { font-family: var(--fonte-texto); font-weight: 600; border-radius: 999px; padding: 6px 13px; font-size: 13px; border: 1px solid var(--border); background: var(--card); color: var(--green); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .chip.small { padding: 5px 11px; font-size: 12px; }
  .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .results { padding: 16px 20px 96px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0; }
  .footer { text-align: center; padding: 24px 20px 8px; }
  .footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .footer span { color: var(--muted); font-size: 12px; }
  .footer-copy { color: var(--muted-dark); font-size: 12px; margin-top: 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; box-shadow: 0 1px 3px rgba(33,31,26,0.05); }
  .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.35); border: none; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .pending-preview-btn .pending-name { display: flex; align-items: center; gap: 6px; }
  .admin-pago-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 40px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .admin-pago-box button { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .delete-review-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; }
  /* ======================================================================
     Interface de busca estilo Trivago — listagem, filtros e ficha completa
     ====================================================================== */

  :root { --green-dark: #14332A; --shadow: 0 1px 3px rgba(33,31,26,0.06); --shadow-lg: 0 14px 34px rgba(33,31,26,0.16); }

  @media (min-width: 720px) { .container { max-width: 760px; } }
  @media (min-width: 1024px) { .container { max-width: 1180px; } }

  /* ---- toolbar (contagem + ordenação + filtros) ---- */
  .toolbar { flex-wrap: wrap; row-gap: 10px; }
  .toolbar-left { display: flex; flex-direction: column; min-width: 0; }
  .toolbar-count { font-size: 14px; font-weight: 700; margin: 0; color: var(--text); }
  .toolbar-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fonte-texto); font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .tbtn.on { border-color: var(--green); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .tbtn-badge { background: var(--green); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px; }
  .tbtn .caret { font-size: 11px; opacity: 0.7; }

  .sortwrap { position: relative; }
  .sort-backdrop { position: fixed; inset: 0; z-index: 35; }
  /* No celular a barra quebra a linha e o botão fica na esquerda, então o
     menu abre para a direita. No computador o botão fica na direita e o menu
     abre para a esquerda. O ajuste fino fica por conta do JavaScript. */
  .sort-menu { position: absolute; left: 0; right: auto; top: calc(100% + 6px); z-index: 40; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); width: 262px; max-width: calc(100vw - 32px); overflow: hidden; }
  @media (min-width: 720px) { .sort-menu { left: auto; right: 0; } }
  .sort-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 13px; cursor: pointer; font-size: 13px; font-family: var(--fonte-texto); color: var(--text); font-weight: 600; }
  .sort-opt + .sort-opt { border-top: 1px solid var(--bg-alt); }
  .sort-opt:hover { background: var(--bg-alt); }
  .sort-opt .radio { width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
  .sort-opt.on .radio { border: 5px solid var(--green); }
  .sort-opt small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; line-height: 1.35; }

  /* ---- chips de filtros ativos ---- */
  .active-chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px 0; }
  .achip { display: inline-flex; align-items: center; gap: 6px; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; font-family: var(--fonte-texto); cursor: pointer; }
  .achip .x { font-size: 13px; line-height: 1; opacity: 0.8; }
  .achip-clear { background: transparent; color: var(--green); border: 1px dashed var(--muted-dark); }

  /* ---- gaveta de filtros (mobile/tablet) ---- */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(33,31,26,0.55); z-index: 60; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(390px, 92vw); background: var(--card); display: flex; flex-direction: column; }
  @media (max-width: 560px) { .drawer { top: auto; bottom: 0; height: 90vh; width: 100%; border-radius: 18px 18px 0 0; } }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .drawer-head strong { font-size: 17px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 2px 18px 18px; }
  .drawer-foot { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .drawer-foot .cta-btn { flex: 1; margin: 0; }
  .drawer-close { background: none; border: none; font-size: 18px; color: var(--text); cursor: pointer; padding: 4px 6px; }

  /* ---- grupos de filtro ---- */
  .fgroup { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .fgroup:last-child { border-bottom: none; }
  .fgroup-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; color: var(--text); background: none; border: none; width: 100%; text-align: left; font-family: var(--fonte-texto); }
  .opt:disabled { opacity: 0.4; cursor: default; }
  .opt-check { width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; box-sizing: border-box; }
  .opt.on .opt-check { background: var(--green); border-color: var(--green); }
  .opt-radio { width: 17px; height: 17px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; box-sizing: border-box; }
  .opt.on .opt-radio { border: 5px solid var(--green); }
  .opt-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .opt-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .range { width: 100%; accent-color: var(--green); margin: 8px 0 2px; }
  .range-val { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .range-now { font-size: 15px; font-weight: 700; color: var(--green); }
  .fgroup-note { font-size: 12px; color: var(--muted-dark); margin: 6px 0 0; line-height: 1.4; }

  /* ---- card horizontal estilo Trivago ---- */
  .card { display: block; transition: box-shadow 0.15s, border-color 0.15s; }
  .card:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .card-media { position: relative; height: 172px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .media-count { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .media-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.9); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text); padding: 0; line-height: 1; }
  .media-prev { left: 8px; } .media-next { right: 8px; }
  .card-rail { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rail-price-col { display: flex; flex-direction: column; }
  .rail-from { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  .rail-price { font-size: 20px; font-weight: 700; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .rail-unit { font-size: 12px; color: var(--muted); }
  .rail-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-family: var(--fonte-texto); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .card-quote { font-size: 12px; color: var(--muted); font-style: italic; margin: 8px 0 0; border-left: 2px solid var(--gold); padding-left: 8px; line-height: 1.4; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  @media (min-width: 720px) {
    .card { display: grid; grid-template-columns: 250px minmax(0, 1fr) 196px; align-items: stretch; }
    .card-media { height: 100%; min-height: 208px; }
    .card-rail { border-top: none; border-left: 1px solid var(--border); flex-direction: column; align-items: stretch; justify-content: space-between; padding: 14px; text-align: right; }
    .card-rail .rail-btn { width: 100%; }
    .card-rail .score-box { justify-content: flex-end; }
  }

  /* ---- selo de nota (estilo Trivago) ---- */
  .score-box { display: inline-flex; align-items: center; gap: 8px; }
  .score-num { background: var(--green); color: #fff; font-weight: 700; font-size: 15px; border-radius: 8px 8px 8px 2px; padding: 5px 9px; line-height: 1; flex-shrink: 0; }
  .score-num.empty { background: var(--bg-alt); color: var(--muted); font-weight: 700; }
  .score-word { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.15; }
  .score-count { font-size: 12px; color: var(--muted); display: block; font-weight: 500; }

  /* ---- ficha estilo hotel ---- */
  .sheet-wide { max-width: 920px; }
  @media (min-width: 640px) { .sheet-wide { max-height: 92vh; } }
  .hero-act { background: rgba(255,255,255,0.93); border: none; border-radius: 999px; height: 34px; min-width: 34px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: var(--fonte-texto); font-size: 12px; font-weight: 700; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.22); }
  .hero-act.on { background: var(--green); color: #fff; }
  .hero-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 240px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }
  .sheet-wide { display: flex; flex-direction: column; overflow: hidden; }
  .sheet-scroll { flex: 1; overflow-y: auto; min-height: 0; }


  .sec { margin-top: 24px; }
  .sec-title { font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; margin: 0 0 10px; color: var(--text); }

  .rating-panel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .rp-score { text-align: center; flex-shrink: 0; }
  .rp-num { font-family: var(--fonte-texto); font-size: 36px; font-weight: 700; color: var(--green); line-height: 1; }
  .rp-word { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .rp-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .bar-row .bar-lbl { width: 26px; flex-shrink: 0; color: var(--gold); font-weight: 600; }
  .bar-track { flex: 1; height: 7px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
  .bar-row .bar-n { width: 18px; text-align: right; flex-shrink: 0; }

  .rev-avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rev-name { font-size: 13px; font-weight: 700; margin: 0; }
  .rev-date { font-size: 12px; color: var(--muted-dark); }
  .rev-text { font-size: 13px; margin: 5px 0 0; line-height: 1.45; color: var(--text); }
  .rev-more { width: 100%; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--green); font-family: var(--fonte-texto); cursor: pointer; }


  /* ---- barra de busca no formato do Trivago ---- */
  .searchcard { border: 1px solid var(--border); border-radius: 14px; background: var(--card); overflow: hidden; margin-top: 18px; box-shadow: var(--shadow); }
  .sc-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .sc-icon { flex-shrink: 0; display: flex; }
  .sc-field { flex: 1; min-width: 0; }
  .sc-label { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .sc-input { width: 100%; border: none; background: transparent; outline: none; font-family: var(--fonte-texto); font-size: 15px; font-weight: 700; color: var(--text); padding: 3px 0 1px; }
  .sc-input::placeholder { color: var(--muted-dark); font-weight: 500; }
  .sc-select { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .sc-caret { flex-shrink: 0; color: var(--muted); font-size: 12px; }
  .sc-locate { flex-shrink: 0; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sc-foot { padding: 12px 14px; }
  .sc-go { width: 100%; border: none; border-radius: 10px; background: var(--green); color: #fff; font-family: var(--fonte-texto); font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .sc-go:disabled { opacity: 0.65; cursor: default; }

  /* ---- mapa ---- */
  .mapwrap { position: relative; z-index: 0; height: calc(100vh - 98px); height: calc(100dvh - 98px); min-height: 380px; border-top: 1px solid var(--border); background: var(--bg-alt); }
  .map { width: 100%; height: 100%; }
  .leaflet-container { font-family: var(--fonte-texto); background: var(--bg-alt); }
  .pin { display: inline-block; transform: translate(-50%, -100%); background: var(--green); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .pin.on { background: var(--gold); color: var(--green-dark); }
  .pin-me { display: block; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 999px; background: #fff; border: 4px solid var(--green); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .map-card-holder { position: absolute; left: 12px; right: 12px; bottom: 90px; z-index: 900; }
  .map-card-holder.up { bottom: 152px; }
  @media (min-width: 720px) { .map-card-holder { max-width: 440px; right: auto; } }
  .map-card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 12px; padding: 10px 32px 10px 10px; align-items: center; cursor: pointer; text-align: left; }
  .map-card-photo { width: 84px; height: 72px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }
  .map-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .map-card-name { font-family: var(--fonte-texto); font-size: 16px; font-weight: 700; margin: 0; line-height: 1.15; }
  .map-card-meta { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .map-card-price { font-size: 17px; font-weight: 700; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .map-close { position: absolute; top: 6px; right: 8px; background: none; border: none; font-size: 14px; color: var(--muted); cursor: pointer; padding: 2px 4px; line-height: 1; }
  .map-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; color: var(--muted); font-size: 14px; background: var(--bg-alt); z-index: 900; }
  .map-fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 45; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 12px 20px; font-family: var(--fonte-texto); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(31,77,61,0.35); display: inline-flex; align-items: center; gap: 8px; }
  .map-fab { bottom: 26px; }
  .map-fab.up { bottom: 88px; }

  /* ======================================================================
     Três telas: página inicial, busca e página da academia
     ====================================================================== */

  :root { --green-soft: #EDF4F0; --green-line: #C6DBD1; }

  /* ---- card de resultado (formato do Trivago) ---- */
  .rcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow 0.15s, border-color 0.15s; }
  .rcard:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .rcard-top { display: flex; gap: 12px; padding: 12px; }
  .rcard-photo { position: relative; width: 132px; height: 132px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }

  .rcard-tag { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; }
  .rcard-info { flex: 1; min-width: 0; }
  .rcard-head { display: flex; align-items: flex-start; gap: 8px; }
  .rcard-name { font-size: 18px; font-weight: 700; line-height: 1.18; margin: 0; flex: 1; min-width: 0; }

  .rcard-acts { display: flex; gap: 2px; flex-shrink: 0; }

  /* ---- página inicial ---- */

  .city-tab.on { color: var(--green); border-bottom-color: var(--green); font-weight: 700; }
  .city-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .menu-btn { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; flex-shrink: 0; }
  .viagem-cartao { margin-top: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; align-items: start; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .viagem-cartao-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }

  .viagem-cartao-t { margin: 2px 0 0; font-weight: 700; font-size: 17px; color: var(--text); }

  .viagem-pergunta-x { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px; }
  /* Buscas salvas (05/10/2026): "Salvar busca" embaixo da barra da busca e o
     aviso depois de salvar, no verde claro da pergunta da viagem. */
  /* Admin no GuiaTennis Parceiros (06/10/2026): a faixa do modo admin. */
  .pc-admin-faixa { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; background: #FFF4D6; border-bottom: 1px solid #F2D27A; padding: 10px 20px; font-size: 13px; line-height: 1.45; color: var(--text); }

  .busca-salva-aviso strong { display: block; }

  .emails-situacao { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--green-soft); font-size: 13px; line-height: 1.5; }
  .emails-situacao.falta { background: #FFF4D6; }
  .senha-caixa { position: relative; display: block; }

  .senha-forca { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; font-size: 13px; color: var(--muted); min-height: 0; }
  .senha-forca:empty { display: none; }
  .senha-barra { display: inline-flex; gap: 3px; }
  .senha-barra i { width: 22px; height: 4px; border-radius: 2px; background: var(--border); }
  .senha-barra.n0 i:nth-child(1) { background: var(--red, #C0392B); }
  .senha-barra.n1 i:nth-child(-n+2) { background: var(--gold); }
  .senha-barra.n2 i { background: var(--green); }
  .conta-topo { width: 44px; height: 44px; margin-left: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-family: inherit; }
  .conta-topo.destaque { background: #FFF6D8; border-color: #F2D27A; box-shadow: 0 0 0 4px rgba(242, 196, 64, 0.22), 0 0 14px rgba(242, 196, 64, 0.45); }
  .conta-topo.logado { border-radius: 50%; background: var(--green); color: #fff; font-weight: 700; font-size: 17px; border-color: var(--green); }
  .home-head .conta-topo + .menu-btn { margin-left: 0; }
  .convite-conta { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 40; max-width: 520px; margin: 0 auto; display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 16px 16px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.16); }
  .convite-ic { width: 52px; height: 52px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .convite-txt { flex: 1; min-width: 0; }
  .convite-t { margin: 0 24px 4px 0; font-weight: 700; font-size: 16px; }
  .convite-s { margin: 0 0 12px; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .convite-btn { width: 100%; }
  .convite-viagem .convite-ic { background: var(--green); }
  /* Conta no topo piscando em amarelo e os avisos para entrar (05/10/2026) */
  .conta-topo { position: relative; }
  .conta-topo.destaque { animation: contaPisca 1.6s ease-in-out infinite; }
  .conta-topo.destaque::after { content: "!"; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #F2B705; color: #3A2A00; font-size: 12px; font-weight: 800; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
  /* E-mail ainda não confirmado (05/10/2026): o círculo da conta ganha o
     mesmo "!" amarelo, como o Google e a Microsoft lembram de confirmar. */
  .conta-topo.confirmar::after { content: "!"; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #F2B705; color: #3A2A00; font-size: 12px; font-weight: 800; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
  @keyframes contaPisca {
    0%, 100% { background: #FFF6D8; box-shadow: 0 0 0 3px rgba(242,183,5,0.25), 0 0 10px rgba(242,183,5,0.35); }
    50% { background: #FFE38A; box-shadow: 0 0 0 7px rgba(242,183,5,0.45), 0 0 22px rgba(242,183,5,0.75); }
  }
  .push-conta { position: fixed; top: 74px; right: 12px; left: 12px; margin-left: auto; z-index: 42; max-width: 340px; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid #F2D27A; border-left: 5px solid #F2B705; border-radius: 14px; padding: 12px 34px 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.16); cursor: pointer; text-align: left; font-family: inherit; color: var(--text); animation: pushEntra 0.35s ease-out; }
  .push-conta::before { content: ""; position: absolute; top: -8px; right: 64px; width: 14px; height: 14px; background: var(--card); border-left: 1px solid #F2D27A; border-top: 1px solid #F2D27A; transform: rotate(45deg); }
  .push-conta-ic { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #FFF1C2; display: flex; align-items: center; justify-content: center; }
  .push-conta-t { margin: 0; font-weight: 700; font-size: 14px; }
  .push-conta-s { margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .push-conta-cta { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--green); }
  .push-conta-x { position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--muted); font-size: 14px; padding: 6px; cursor: pointer; }
  @keyframes pushEntra { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .conta-topo.destaque, .push-conta { animation: none; } }
  /* Grátis para jogadores (05/10/2026): o primeiro card, no mesmo jeito dos outros */
  .dif-largo { grid-column: 1 / -1; }
  /* Minhas quadras pela distância */
  .lista-ordem { display: flex; align-items: center; gap: 6px; margin: -4px 0 6px; font-size: 12px; color: var(--muted); }
  /* Seletor da comparação: bandeja com "Comparar" */
  .cmp-bandeja { display: flex; align-items: center; gap: 10px; }
  .cmp-pick-bandeja { position: sticky; bottom: 0; margin: 12px -4px 0; padding: 12px 4px 4px; background: var(--card); border-top: 1px solid var(--border); }
  .cmp-bandeja-fotos { display: flex; flex-shrink: 0; }
  .cmp-bandeja-f { width: 32px; height: 32px; border-radius: 999px; overflow: hidden; border: 2px solid var(--card); background: var(--bg-alt); margin-left: -9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--green); }
  .cmp-bandeja-f:first-child { margin-left: 0; }
  .cmp-bandeja-f img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-bandeja-n { font-size: 12px; color: var(--muted); }
  .cmp-bandeja-btn { margin-left: auto; flex-shrink: 0; border: none; border-radius: 999px; background: var(--green); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; padding: 11px 20px; cursor: pointer; }
  .cmp-bandeja-btn.fraco { background: var(--card); color: var(--muted); border: 1px solid var(--border); cursor: default; }
  /* Comparação: cada academia em cima da coluna dela, sem rolar de lado */
  .ct-scroll { overflow: visible; }
  .ct-grade { grid-template-columns: minmax(70px, 0.8fr) repeat(var(--cols), minmax(0, 1fr)); min-width: 0; }
  .ct-topo { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 8px 4px 10px; border-bottom: 1px solid var(--border); display: flex; }

  .ct-cel { min-width: 0; overflow-wrap: anywhere; }
  .ct-rot { overflow-wrap: anywhere; }
  .cmp-pagina > .cmp-vagas-n { margin-top: 14px; }
  @media (max-width: 899px) {
    .ct-n3 .ct-cel { font-size: 12px; padding: 9px 20px 9px 7px; }

    .ct-n4 .ct-secao, .ct-n5 .ct-secao { font-size: 10px; }
  }
  /* "Ainda em dúvida?": botão na página, aviso e folha */
  .decide-abrir { width: 100%; margin-top: 20px; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-family: inherit; color: var(--text); cursor: pointer; }
  .decide-abrir > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .decide-abrir small { font-size: 13px; color: var(--muted); }
  .decide-abrir-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--green-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .decide-push .convite-ic { background: var(--green); }
  .decide-push-lista { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 4px; }
  .decide-push-lista li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .decide-push-lista span { color: var(--muted); }
  .decide-push-lista strong { text-align: right; }
  #decide-overlay .decide-box { margin-top: 0; background: none; border: none; padding: 0; }
  #decide-overlay .decide-title { font-family: var(--fonte-titulo); font-size: 24px; }
  /* Parceiros: "Começar agora — é de graça!" no meio e com vida */
  .pc-como-fim { text-align: center; }
  .pc-como-fim .cta-btn.pc-gratis { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: auto; padding: 0 30px; animation: gratisPulsa 2.4s ease-in-out infinite; }
  .pc-gratis::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent); transform: skewX(-20deg); animation: gratisBrilho 3s ease-in-out infinite; }
  .pc-gratis-selo { background: #F2B705; color: #3A2A00; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 800; }
  @keyframes gratisPulsa { 0%, 100% { transform: scale(1); box-shadow: 0 6px 16px rgba(31,77,58,0.25); } 50% { transform: scale(1.04); box-shadow: 0 10px 26px rgba(31,77,58,0.38); } }
  @keyframes gratisBrilho { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @media (prefers-reduced-motion: reduce) { .pc-como-fim .cta-btn.pc-gratis, .pc-gratis::after { animation: none; } }
  .pc-beneficio { position: relative; }
  .pc-beneficio-tag { position: absolute; top: 18px; right: 18px; background: var(--gold); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .pc-beneficio-nota { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
  .convite-fechar { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 16px; color: var(--muted); cursor: pointer; padding: 6px; }
  .menu-btn > span:not(.menu-conta) { display: block; width: 20px; height: 2px; border-radius: 2px; background: var(--green); }
  .menu-overlay { justify-content: flex-end; align-items: stretch; }
  .menu-drawer { width: min(340px, 88vw); height: 100%; background: var(--card); overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); box-shadow: -10px 0 30px rgba(33,31,26,0.18); animation: menuEntra 0.18s ease-out; }
  @keyframes menuEntra { from { transform: translateX(24px); opacity: 0.4 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .menu-drawer { animation: none; } }
  .menu-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .menu-marca { display: flex; align-items: center; gap: 9px; font-size: 17px; color: var(--green); }
  .menu-marca svg { width: 30px; height: 30px; }
  .menu-fechar { width: 38px; height: 38px; border: none; background: var(--bg-alt); border-radius: 999px; font-size: 15px; color: var(--text); cursor: pointer; flex-shrink: 0; }
  .menu-grupo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-dark); margin: 18px 0 4px; }
  .menu-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; border-radius: 10px; padding: 11px 10px; font-family: var(--fonte-texto); font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; cursor: pointer; }

  .menu-rodape { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
  .menu-versao { font-size: 12px; color: var(--muted-dark); margin: 10px 10px 0; }

  /* médias mostradas para quem pensa em cadastrar a academia */
  /* Os números ficam lado a lado, em colunas iguais, no celular e no
     computador. */
  .ba-numeros { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.18); text-align: center; }
  .ban-item { min-width: 0; }
  .ban-item strong { display: block; font-size: 22px; font-weight: 700; color: var(--gold-light); line-height: 1.1; white-space: nowrap; }
  .ban-item span { font-size: 12px; color: rgba(255,255,255,0.72); line-height: 1.35; display: block; margin-top: 4px; }
  .ban-nota { margin: 12px 0 0; font-size: 11.5px; line-height: 1.45; color: rgba(255,255,255,0.6); text-align: center; }
  @media (min-width: 640px) { .ban-item strong { font-size: 26px; } }

  /* por que o GuiaTennis */
  .dif-grade { display: grid; gap: 12px; }
  @media (min-width: 720px) { .dif-grade { grid-template-columns: 1fr 1fr; gap: 14px; } }
  .dif-item { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 16px; }
  .dif-ic { display: flex; margin-bottom: 10px; }
  .dif-t { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.3; }
  .dif-d { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }

  /* por que estar no guia (academias) */
  .bloco-academias { margin: 16px 20px 28px; background: var(--green); border-radius: 18px; padding: 24px 20px; color: #fff; }
  @media (min-width: 720px) { .bloco-academias { padding: 30px 28px; } }
  .ba-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-light); margin: 0; font-weight: 700; }
  .bloco-academias h3 { font-size: 23px; font-weight: 700; margin: 8px 0 0; color: #fff; }
  @media (min-width: 720px) { .bloco-academias h3 { font-size: 27px; } }
  .ba-lista { display: grid; gap: 14px; margin-top: 18px; }
  @media (min-width: 720px) { .ba-lista { grid-template-columns: 1fr 1fr; gap: 16px 24px; } }
  .ba-item { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; }
  .ba-ic { flex-shrink: 0; margin-top: 3px; display: flex; }
  .ba-d { font-size: 14px; color: rgba(255,255,255,0.78); }
  .ba-btn { width: 100%; margin-top: 22px; background: var(--gold); color: var(--green-dark); border: none; border-radius: 12px; padding: 15px; font-family: var(--fonte-texto); font-size: 16px; font-weight: 700; cursor: pointer; }
  .ba-nota { font-size: 12px; color: rgba(255,255,255,0.7); margin: 10px 0 0; text-align: center; }


  /* ---- rodapé em colunas ---- */
  .sitefooter { background: var(--bg-alt); border-top: 1px solid var(--border); padding: 26px 20px 30px; }
  .sf-cols { display: grid; gap: 22px; }
  @media (min-width: 720px) { .sf-cols { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 30px; } }
  .sf-col h4 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .sf-col button, .sf-col a { display: block; background: none; border: none; padding: 5px 0; font-size: 14px; color: var(--muted); cursor: pointer; text-align: left; text-decoration: none; }
  .sf-col button:hover, .sf-col a:hover { color: var(--green); }
  .sf-base { border-top: 1px solid var(--border); margin-top: 22px; padding-top: 16px; font-size: 12px; color: var(--muted-dark); }
  .sf-base p { margin: 3px 0; }

  /* ---- página da academia ---- */
  .courtbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .courtbar button { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--green); padding: 4px; }
  .courtbar-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .courtpage { padding-bottom: 60px; }
  @media (min-width: 720px) { .courtpage-inner { max-width: 1140px; margin: 0 auto; } }
  .search-header { padding: 16px 20px 18px; border-bottom: 1px solid var(--border); background: var(--card); }

  /* ---- página da academia: preços como opções que se escolhe ---- */
  .court-name { font-size: 27px; font-weight: 700; line-height: 1.12; margin: 4px 0 0; }
  @media (min-width: 720px) { .court-name { font-size: 34px; } }
  .court-stars { color: var(--gold); font-size: 15px; letter-spacing: 1px; margin-top: 6px; }
  .court-addr { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; color: var(--muted); margin: 12px 0 0; line-height: 1.4; }
  .court-addr button { background: none; border: none; padding: 0; color: var(--green); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: underline; font-family: inherit; }

  .opt-nota { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

  /* barra de contato que acompanha a rolagem, como a de reservar do hotel */
  .court-cta { position: sticky; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--border); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; box-shadow: 0 -4px 16px rgba(33,31,26,0.08); }
  .court-cta .cta-btn { margin: 0; }
  .court-cta .cta-primary { flex: 1; }
  .court-cta .cta-secondary { flex: 0 0 auto; padding: 11px 15px; }
  .court-cta.up { bottom: 64px; }

  /* o preço do card da busca também passa a mostrar a faixa inteira */
  .offer-price { font-size: 23px; }
  .offer-body { flex-wrap: wrap; }

  /* ---- comodidades afastadas da modalidade, na caixa de oferta ---- */
  .offer-head { align-items: baseline; gap: 8px 16px; }
  .offer-mod { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .offer-perks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-left: auto; }
  .offer-from { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

  /* ---- vídeo de como funciona a busca ---- */
  .sec-sub { font-size: 14px; color: var(--muted); margin: -6px 0 12px; }
  .video-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--bg-alt); border: 1px solid var(--border); aspect-ratio: 16 / 9; }
  .video-player { width: 100%; height: 100%; display: block; border: 0; }
  .video-holder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }

  /* ---- selo de recomendada nos cards da página inicial ---- */
  .mini { position: relative; }
  .mini-badge { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; }

  /* ---- contato único, que serve para aula e para locação ---- */
  .offer-contact { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none; }
  .offer-contact:hover { text-decoration: underline; }
  .offer-contact .mod { font-weight: 500; color: var(--muted); }
  .contato-card { border: 1px solid var(--green-line); background: var(--green-soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .contato-card p { margin: 0; font-size: 14px; }
  .contato-card .contato-mod { font-weight: 700; font-size: 15px; }
  .contato-card .contato-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .contato-card .cta-btn { margin-top: 12px; }

  /* ---- animação "como funciona a busca" ---- */
  .demo { width: 100%; height: 100%; display: block; }
  .demo text { font-family: var(--fonte-texto); }
  .demo .cena { opacity: 0; }
  .demo .cena1 { animation: demoCena1 9s infinite; }
  .demo .cena2 { animation: demoCena2 9s infinite; }
  .demo .cena3 { animation: demoCena3 9s infinite; }
  @keyframes demoCena1 { 0% { opacity: 0 } 3%, 29% { opacity: 1 } 33%, 100% { opacity: 0 } }
  @keyframes demoCena2 { 0%, 33% { opacity: 0 } 36%, 62% { opacity: 1 } 66%, 100% { opacity: 0 } }
  @keyframes demoCena3 { 0%, 66% { opacity: 0 } 69%, 96% { opacity: 1 } 99%, 100% { opacity: 0 } }

  .demo .digita { animation: demoDigita 9s infinite; }
  @keyframes demoDigita { 0%, 5% { width: 0 } 22%, 100% { width: 104px } }
  .demo .cursor { animation: demoCursor 0.9s steps(1) infinite; }
  @keyframes demoCursor { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

  .demo .sobe1 { animation: demoSobe 9s infinite; }
  .demo .sobe2 { animation: demoSobe2 9s infinite; }
  .demo .sobe3 { animation: demoSobe3 9s infinite; }
  @keyframes demoSobe  { 0%, 34% { transform: translateY(16px) } 41%, 100% { transform: translateY(0) } }
  @keyframes demoSobe2 { 0%, 37% { transform: translateY(16px) } 44%, 100% { transform: translateY(0) } }
  @keyframes demoSobe3 { 0%, 40% { transform: translateY(16px) } 47%, 100% { transform: translateY(0) } }

  .demo .toque { animation: demoToque 9s infinite; }
  @keyframes demoToque { 0%, 74% { r: 4; opacity: 0.55 } 88%, 100% { r: 54; opacity: 0 } }
  .demo .aperta { animation: demoAperta 9s infinite; transform-origin: 320px 224px; transform-box: view-box; }
  @keyframes demoAperta { 0%, 73% { transform: scale(1) } 76% { transform: scale(0.96) } 80%, 100% { transform: scale(1) } }

  .demo .passo1 { animation: demoCena1 9s infinite; }
  .demo .passo2 { animation: demoCena2 9s infinite; }
  .demo .passo3 { animation: demoCena3 9s infinite; }

  /* quem pediu menos movimento vê a cena do meio, parada */
  @media (prefers-reduced-motion: reduce) {
    .demo .cena, .demo .digita, .demo .cursor, .demo [class*="sobe"], .demo .toque, .demo .aperta,
    .demo .passo1, .demo .passo2, .demo .passo3 { animation: none; }
    .demo .cena2, .demo .passo2 { opacity: 1; }
  }

  /* ================= ficha da academia no formato das páginas de hotel ================= */

  /* caminho: Início › Quadras em São Paulo › Bairro › Academia */
  .ht-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 10px 20px 8px; }
  .ht-crumbs button, .ht-crumbs a { background: none; border: none; padding: 0; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--green); cursor: pointer; text-decoration: underline; }
  /* Página de uma região (/quadras/sao-paulo/moema) e aviso de link antigo */
  .regiao-titulo { font-size: 22px; line-height: 1.2; margin: 14px 20px 0; }
  .aviso-link { margin: 12px 20px 0; padding: 10px 12px; background: var(--bg-alt); border-radius: 10px; font-size: 13px; color: var(--muted); }
  .cidade-link { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--green); }
  .ht-crumbs .sep { color: var(--muted-dark); }
  .ht-crumbs .cur { color: var(--muted); }

  /* galeria em mosaico: uma foto grande e até quatro menores */
  .ht-gal { position: relative; display: grid; gap: 3px; background: var(--border); height: 240px; grid-template-columns: 1fr; }
  .ht-gal .g { position: relative; overflow: hidden; background: var(--bg-alt); cursor: pointer; }
  .ht-gal .g img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ht-gal .g:not(:first-child) { display: none; }
  .ht-gal-all { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; background: rgba(20,51,42,0.82); color: #fff; border: none; border-radius: 9px; padding: 8px 13px; font-size: 12px; font-weight: 700; font-family: var(--fonte-texto); cursor: pointer; }
  @media (min-width: 720px) {
    .ht-gal { height: 400px; grid-template-rows: 1fr 1fr; }
    .ht-gal .g:not(:first-child) { display: block; }
    .ht-gal.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .ht-gal.duo { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr; }
    .ht-gal.trio { grid-template-columns: 2fr 1fr; }
    .ht-gal.trio .g:first-child { grid-row: span 2; }
    .ht-gal.quad { grid-template-columns: 2fr 1fr 1fr; }
    .ht-gal.quad .g:first-child { grid-row: span 2; }
    .ht-gal.quad .g:nth-child(4) { grid-column: span 2; }
    .ht-gal.penta { grid-template-columns: 2fr 1fr 1fr; }
    .ht-gal.penta .g:first-child { grid-row: span 2; }
  }
  @media (min-width: 1000px) { .ht-gal { border-radius: 16px; overflow: hidden; margin: 0 20px; } }

  /* duas colunas: conteúdo à esquerda, cartão de contato fixo à direita */
  .ht-body { display: block; }
  .ht-main { min-width: 0; }
  .ht-aside { display: none; }
  @media (min-width: 1000px) {
    .ht-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 30px; align-items: start; padding: 0 20px; }
    .ht-aside { display: block; position: sticky; top: 74px; padding-top: 22px; }
  }

  .ht-head { padding: 18px 20px 0; }
  @media (min-width: 1000px) { .ht-head { padding: 22px 0 0; } }
  .ht-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ht-tag { font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 999px; padding: 4px 10px; }
  .ht-score { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; text-align: left; }
  .ht-score-num { background: var(--green); color: #fff; border-radius: 10px 10px 10px 3px; font-size: 20px; font-weight: 700; padding: 8px 11px; line-height: 1; flex-shrink: 0; }
  .ht-score-num.empty { background: var(--bg-alt); color: var(--muted); }
  .ht-score-txt strong { font-size: 15px; display: block; }
  .ht-score-txt span { font-size: 13px; color: var(--muted); text-decoration: underline; }

  /* barra de seções que acompanha a rolagem */
  .ht-tabs { position: sticky; top: 54px; z-index: 15; display: flex; gap: 2px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; margin-top: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .ht-tabs::-webkit-scrollbar { display: none; }
  .ht-tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 13px 11px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .ht-tabs button.on { color: var(--green); border-bottom-color: var(--green); }
  @media (min-width: 1000px) { .ht-tabs { padding: 0; margin-top: 18px; } }

  .ht-sections { padding: 0 20px 20px; }
  @media (min-width: 1000px) { .ht-sections { padding: 0 0 24px; } }
  .ht-sec { padding-top: 26px; margin-top: 26px; border-top: 1px solid var(--border); scroll-margin-top: 110px; }
  .ht-sec:first-child { border-top: none; margin-top: 0; padding-top: 22px; }
  .ht-sec .sec-title { font-size: 21px; margin-bottom: 8px; }
  .ht-sec-sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .ht-sec .cta-btn { width: 100%; }
  .ht-about { font-size: 15px; line-height: 1.55; margin: 0; color: var(--text); }

  /* destaques do topo, no lugar das "informações populares" dos hotéis */
  .ht-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (min-width: 720px) { .ht-tiles { grid-template-columns: repeat(4, 1fr); } }
  .ht-tile { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 13px; }
  .ht-tile-ic { display: block; margin-bottom: 7px; }
  .ht-tile-t { font-size: 14px; font-weight: 700; margin: 0; line-height: 1.25; }
  .ht-tile-s { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.35; }

  /* opções de preço, no formato da lista de quartos */
  .ht-room { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; margin-top: 12px; }
  @media (min-width: 720px) { .ht-room { grid-template-columns: minmax(0, 1fr) 210px; } }
  .ht-room-info { padding: 15px 16px; }
  .ht-room-name { font-size: 19px; font-weight: 700; margin: 0; }
  .ht-room-desc { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
  .ht-room-price { background: var(--green-soft); border-top: 1px solid var(--green-line); padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; }
  @media (min-width: 720px) { .ht-room-price { border-top: none; border-left: 1px solid var(--green-line); align-items: flex-end; text-align: right; } }
  .ht-room-val { font-size: 24px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .sem-valor { font-size: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .court-cta-val.sem-valor { font-size: 15px; }
  .ht-room-unit { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* comodidades em grade de ícones */
  .ht-amen { display: grid; grid-template-columns: 1fr; gap: 9px; margin-top: 8px; }
  @media (min-width: 560px) { .ht-amen { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1000px) { .ht-amen { grid-template-columns: 1fr 1fr 1fr; } }
  .ht-amen-i { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--text); }

  /* localização: mapa, endereço e academias vizinhas */
  .ht-map { position: relative; z-index: 0; isolation: isolate; height: 230px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg-alt); margin-bottom: 12px; }
  .ht-map-empty { display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 24px; text-align: center; font-size: 13px; color: var(--muted); }
  .ht-addr-line { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; margin: 0; line-height: 1.45; }
  .ht-addr-line > span:first-child { flex-shrink: 0; margin-top: 2px; }
  .pin-court { display: inline-block; width: 18px; height: 18px; border-radius: 999px; background: var(--gold); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .ht-poi { display: grid; gap: 16px; margin: 8px 0 0; }
  @media (min-width: 720px) { .ht-poi { grid-template-columns: 1fr 1fr; gap: 16px 28px; } }
  .ht-poi-t { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  .ht-poi-i { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .ht-poi-n { min-width: 0; }
  .ht-poi-d { flex-shrink: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* horário na ficha */
  .hr-agora { margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: none; border-radius: 999px; padding: 2px 9px; }
  .hr-agora.sim { background: rgba(31,77,58,0.12); color: var(--green); }
  .hr-agora.nao { background: var(--bg-alt); color: var(--muted); }
  .hr-lista { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .hr-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 13px; font-size: 14px; border-bottom: 1px solid var(--border); }
  .hr-linha:last-child { border-bottom: none; }
  .hr-linha strong { font-weight: 700; }
  .hr-linha.fechado strong { color: var(--muted); font-weight: 400; }

  /* horário no cadastro */
  .pol-horas { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .pol-horas-campo { width: 80px; margin-top: 0; text-align: center; }
  .pol-form-t { font-size: 14px; font-weight: 700; color: var(--text); margin: 16px 0 6px; }
  .pol-titulo { font-size: 15px; font-weight: 700; color: var(--text); margin: 18px 0 8px; }
  .pol-titulo:first-child { margin-top: 0; }
  .hr-form { display: grid; gap: 14px; }
  .hr-form-linha { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
  .hr-form-dia { font-size: 14px; font-weight: 700; }
  .hr-fechado { justify-self: end; }
  .hr-form-campos { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .hr-form-campos.off { opacity: 0.4; }
  .hr-form-ate { font-size: 13px; color: var(--muted); }
  .hr-time { margin-top: 0; flex: 1 1 0; min-width: 0; }
  @media (min-width: 560px) {
    .hr-form-linha { grid-template-columns: 150px 1fr auto; }
    .hr-form-campos { grid-column: 2; grid-row: 1; }
    .hr-fechado { grid-column: 3; grid-row: 1; }
  }

  .ht-poi-nota { font-size: 12px; color: var(--muted-dark); margin: 12px 0 0; line-height: 1.45; }
  .ht-poi-carregando { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); margin-top: 8px; text-align: center; }
  .ht-poi-carregando p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; max-width: 320px; }
  .ht-poi-motivo { font-size: 11px; color: var(--red); margin: 10px 0 0; word-break: break-word; }
  .ht-poi-tentar { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none; cursor: pointer; }

  /* bola de tênis girando — serve para qualquer espera do site */
  .tela-carregando { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 70vh; padding: 40px 20px; text-align: center; }
  .tela-carregando p { margin: 0; font-size: 14px; color: var(--muted); }
  .bola { display: inline-flex; flex-shrink: 0; animation: bolaGira 0.9s linear infinite; }
  @keyframes bolaGira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bola { animation-duration: 3.5s; } }

  .ht-viz { display: grid; gap: 12px; }
  @media (min-width: 1000px) { .ht-viz { grid-template-columns: 1fr 1fr; } }
  .ht-viz-c { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
  .ht-viz-foto { width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }

  .ht-viz-p { font-size: 16px; font-weight: 700; margin-top: 3px; color: var(--text); }
  .ht-viz-p small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .ht-viz-seta { display: flex; }

  /* avaliações em cartões */
  .ht-revs { display: grid; gap: 12px; margin-top: 8px; }
  @media (min-width: 720px) { .ht-revs { grid-template-columns: 1fr 1fr; } }
  .ht-rev { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 14px; display: flex; flex-direction: column; }
  .ht-rev-top { display: flex; align-items: center; gap: 8px; }
  .acesso-qtas { font-family: Inter, sans-serif; font-size: 13px; color: var(--muted); font-weight: 400; }
  .acesso-pessoa { display: block; margin-top: 6px; }
  .rev-analise { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: underline; white-space: nowrap; }
  .ht-rev-badge { background: var(--green); color: #fff; border-radius: 8px 8px 8px 2px; font-size: 13px; font-weight: 700; padding: 4px 8px; line-height: 1; }
