  /* "bom saber", no lugar do "você precisa saber" dos hotéis */
  /* cancelamento e reposição */
  .pol-faixa { display: flex; align-items: center; gap: 14px; background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 14px; padding: 15px 17px; font-size: 15px; line-height: 1.45; }
  .pol-faixa.sem { background: var(--bg-alt); border-color: var(--border); }
  .pol-faixa-h { flex-shrink: 0; font-size: 32px; font-weight: 700; color: var(--green); line-height: 1; }
  .pol-faixa-ic { flex-shrink: 0; display: flex; }
  .pol-lados { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 560px) { .pol-lados { grid-template-columns: 1fr 1fr; } }
  .pol-lado { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 15px; }
  .pol-lado.ok { border-color: var(--green-line); }
  .pol-lado-ic { display: flex; margin-bottom: 9px; }
  .pol-lado-t { font-size: 15px; font-weight: 700; margin: 0; }
  .pol-lado-d { font-size: 14px; color: var(--muted); margin: 5px 0 0; line-height: 1.5; }
  .pol-texto { font-size: 15px; line-height: 1.55; border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 15px 17px; }

  .ht-know { display: grid; gap: 10px; margin-top: 6px; }
  @media (min-width: 720px) { .ht-know { grid-template-columns: 1fr 1fr; } }
  .ht-know-i { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 12px 13px; font-size: 14px; line-height: 1.45; }
  .ht-know-ic { flex-shrink: 0; margin-top: 2px; display: flex; }
  .ht-know-d { font-size: 13px; color: var(--muted); }
  .est-linha { display: block; }
  .est-linha + .est-linha { margin-top: 3px; }
  .est-linha b { color: var(--text); font-weight: 600; }
  .est-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 999px; padding: 1px 8px; }

  /* perguntas frequentes em sanfona */
  .ht-faq { border-top: 1px solid var(--border); margin-top: 6px; }
  .ht-faq details { border-bottom: 1px solid var(--border); }
  .ht-faq details:last-child { border-bottom: none; }
  .ht-faq summary { list-style: none; cursor: pointer; padding: 14px 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .ht-faq summary::-webkit-details-marker { display: none; }
  .ht-faq-ic { flex-shrink: 0; display: flex; transition: transform 0.15s ease; }
  .ht-faq details[open] .ht-faq-ic { transform: rotate(90deg); }
  .ht-faq p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 14px; }

  /* cartão fixo de contato (a coluna da direita) */
  .ht-book { border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: var(--shadow-lg); padding: 16px; }
  .ht-book-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .ht-book-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .ht-book-opt { font-size: 14px; color: var(--muted); }
  .ht-book-val { font-size: 19px; font-weight: 700; white-space: nowrap; }
  .ht-book-div { border-top: 1px solid var(--border); margin: 12px 0; }
  .ht-book-score { display: flex; align-items: center; gap: 9px; font-size: 14px; }
  .ht-book-sub { font-size: 12px; color: var(--muted); }
  .ht-book .cta-btn { width: 100%; }
  .ht-book-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; text-align: center; line-height: 1.4; }

  /* barra fixa do rodapé, só no celular (no desktop o cartão da direita resolve) */
  .court-cta-price { display: flex; flex-direction: column; margin-right: 4px; min-width: 0; }
  .court-cta-val { font-size: 17px; font-weight: 700; white-space: nowrap; line-height: 1.1; }
  .court-cta-unit { font-size: 11px; color: var(--muted); white-space: nowrap; }
  @media (min-width: 1000px) { .court-cta { display: none; } }

  /* ================= Acabamento limpo (30/09/2026) =================
     Pedido do Breno: o site estava aglomerado. Como Airbnb e Booking:
     letra sem serifa no texto (Inter), a Playfair só nos títulos e na
     marca, texto de 15–16px, mais ar entre os blocos, bordas mais leves e
     botões e campos maiores para o dedo. Fica no fim para valer sobre o
     resto. */
  :root {
    --fonte-texto: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --fonte-titulo: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --border: #E9E3D7;
    --muted: #6B6557;
    --muted-dark: #9A937F;
    --shadow: 0 1px 2px rgba(33,31,26,0.04), 0 6px 18px rgba(33,31,26,0.05);
  }
  strong, b { font-weight: 600; }

  /* textos pequenos: nada abaixo de 12px, o comum em 13–14px */
  .footnote { font-size: 13px; line-height: 1.5; margin-top: 18px; }
  .subtitle { font-size: 15px; line-height: 1.5; }
  .pending-detail { font-size: 13px; line-height: 1.45; }
  .status-line { font-size: 13px; }
  .inline-link { font-size: inherit; }
  .consent-row { font-size: 13px; line-height: 1.5; gap: 10px; }
  .consent-row input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 1px; }

  /* botões e campos maiores, com texto de 16px (o iPhone não dá zoom) */
  .cta-btn { padding: 13px 16px; font-size: 15px; border-radius: 12px; min-height: 48px; }
  .cta-col { gap: 10px; }
  .btn-primary { font-size: 15px; border-radius: 12px; min-height: 48px; }
  .form-field { font-size: 16px; padding: 13px 14px; border-radius: 12px; margin-top: 12px; background: var(--card); }
  .form-field:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,77,61,0.12); }
  .field-label { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--text); margin: 22px 0 8px; }
  .chip { font-weight: 500; font-size: 14px; padding: 8px 14px; }
  .chip.small { font-size: 13px; padding: 7px 12px; }
  .chip-row { gap: 8px 8px; }
  .sheet-content { padding: 26px 22px 30px; }
  .sheet-title { font-size: 28px; line-height: 1.15; }
  .sheet-close { top: 18px; right: 18px; width: 36px; height: 36px; background: var(--bg-alt); }

  /* cabeçalho e página inicial com mais ar */
  .home-head { padding: 14px 20px; border-bottom-color: transparent; box-shadow: 0 1px 0 var(--border); }
  .home-brand h1 { font-size: 24px; }
  .home-hero { padding: 34px 20px 30px; }
  .home-hero h2 { font-size: 32px; line-height: 1.15; }
  @media (min-width: 720px) { .home-hero { padding: 56px 20px 40px; } .home-hero h2 { font-size: 46px; } }
  .home-hero .home-hero-sub { margin-top: 16px; font-size: 15px; line-height: 1.55; }
  .searchcard { margin-top: 24px; border-radius: 16px; box-shadow: 0 2px 4px rgba(33,31,26,0.04), 0 10px 30px rgba(33,31,26,0.07); }
  .sc-row { padding: 12px 16px; }
  .sc-label { font-size: 12px; font-weight: 500; }
  .sc-input { font-size: 16px; font-weight: 600; }
  .sc-foot { padding: 14px 16px 16px; }
  .sc-go { font-size: 16px; font-weight: 600; border-radius: 12px; }
  .home-sec { padding: 26px 20px 30px; }

  @media (min-width: 720px) { .home-sec { padding: 34px 20px 38px; } .home-sec h3 { font-size: 28px; } }
  .home-strip { gap: 14px; padding-bottom: 10px; }
  .mini { flex-basis: 220px; border-radius: 14px; }
  .mini-body { padding: 14px 16px 16px; }
  .mini-name { font-size: 16px; font-weight: 600; }
  .mini-score, .mini-stars { margin-top: 6px; }
  .dif-grade { gap: 14px; }
  /* ícone ao lado do texto, como os destaques do Airbnb: mais curto */
  /* "Organize isso reto" (06/10/2026): cartões do mesmo tamanho, duas
     colunas, título e texto colados em cima — sem o texto descer quando o
     cartão do lado é mais alto. */
  .dif-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; column-gap: 14px; padding: 20px; border-radius: 16px; }
  .dif-ic { grid-row: span 2; margin: 2px 0 0; align-self: start; }
  .dif-t { font-size: 16px; font-weight: 600; }
  .dif-d { font-size: 15px; line-height: 1.55; margin-top: 4px; }
  .city-tabs { gap: 22px; margin-bottom: 16px; }
  .city-note { font-size: 14px; margin-bottom: 16px; }
  .bloco-academias { margin: 24px 20px 36px; padding: 30px 22px; border-radius: 20px; }
  .ba-lista { gap: 18px; margin-top: 22px; }
  .ba-item { font-size: 16px; line-height: 1.5; }
  .ba-d { font-size: 15px; line-height: 1.55; margin-top: 2px; }
  .ba-btn { font-weight: 600; border-radius: 14px; padding: 16px; }
  .ba-nota { font-size: 13px; margin-top: 14px; }
  .ban-item strong { font-weight: 700; }
  .ban-item span { font-size: 13px; }

  /* busca: lista com respiro, cartão mais limpo */
  .search-header { padding: 20px 20px 22px; border-bottom-color: transparent; }
  .regiao-titulo { font-size: 26px; margin: 22px 20px 0; }
  .toolbar { padding: 14px 20px; background: rgba(247,244,236,0.96); backdrop-filter: saturate(1.4) blur(8px); }
  .toolbar-count { font-size: 15px; font-weight: 600; }
  .toolbar-sub { font-size: 13px; }
  .tbtn { font-size: 14px; font-weight: 500; padding: 9px 14px; border-radius: 999px; }
  .results { gap: 18px; padding: 20px 20px 112px; }
  .rcard { border-radius: 16px; border-color: var(--border); }
  .rcard-top { padding: 16px; gap: 14px; }
  .rcard-name { font-size: 18px; font-weight: 600; line-height: 1.25; }
  @media (min-width: 720px) { .rcard-name { font-size: 21px; } }
  .rcard-score { margin-top: 8px; }
  .rcard-line { font-size: 14px; margin-top: 8px; }
  .sbadge { font-weight: 600; }
  .sword { font-weight: 600; }
  .offer { margin: 0 16px 16px; padding: 14px 16px; border-radius: 12px; background: #F4F8F6; border-color: #DCE9E2; }
  .offer-head { font-size: 14px; }
  .offer-mod { font-weight: 600; }
  .offer-um-val, .offer-price { font-weight: 700; }
  .offer-btn { font-weight: 600; border-radius: 10px; }
  .offer-contact { font-weight: 600; margin-top: 12px; }
  /* comodidades do cartão, em verde, como o "✓ Wi-Fi grátis" do Trivago */

  .rcard-selos span { display: inline-flex; align-items: center; gap: 5px; }
  .offer-body { margin-top: 0; align-items: center; }
  .offer-dois { gap: 24px; }
  .offer-um-lbl { font-size: 13px; }
  .offer-um-val { font-size: 22px; }
  .offer-um-val.sem-valor { font-size: 16px; color: var(--muted); }
  /* "/h" do lado do valor, menor, como o "/noite" do Airbnb e do Booking. */
  .offer-por-hora { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .offer-sub { font-size: 13px; margin-top: 2px; }
  .rail-btn { font-weight: 600; }
  .rcard-tag, .mini-badge, .card-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 9px; }

  /* gaveta de filtros */
  .drawer-head { padding: 18px 20px; }
  .drawer-head strong { font-size: 18px; font-weight: 600; }
  .drawer-body { padding: 4px 20px 20px; }
  .drawer-foot { padding: 14px 20px; }
  .fgroup { padding: 20px 0; }
  .fgroup-title { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 10px; }
  .opt { font-size: 15px; padding: 10px 0; gap: 12px; }
  .opt-count { font-size: 13px; font-weight: 500; }
  .sort-opt { font-size: 14px; font-weight: 500; padding: 12px 14px; }
  .sort-opt small { font-size: 13px; font-weight: 400; }
  .active-chips { padding: 14px 20px 0; }
  .achip { font-weight: 500; font-size: 13px; padding: 6px 12px; }

  /* ficha da academia: seções separadas por espaço, não por caixas */
  .courtbar { padding: 10px 16px; }
  .courtbar-name { font-weight: 600; }
  .ht-crumbs { font-size: 13px; padding: 14px 20px 10px; }
  .ht-crumbs button, .ht-crumbs a { font-size: 13px; font-weight: 500; }
  .ht-head { padding: 22px 20px 0; }
  .court-name { font-size: 30px; line-height: 1.15; }
  @media (min-width: 720px) { .court-name { font-size: 38px; } }
  .ht-tags { gap: 8px; margin-top: 14px; }
  .ht-tag { font-size: 13px; font-weight: 500; padding: 5px 12px; }
  .ht-score { margin-top: 16px; }
  .ht-score-num { font-weight: 700; }
  .ht-score-txt strong { font-weight: 600; }
  .court-addr { font-size: 15px; margin-top: 14px; }
  .ficha-basica { font-size: 13.5px; padding: 11px 13px; margin-top: 16px; border-radius: 12px; line-height: 1.5; }
  .ht-tabs { margin-top: 22px; }
  .ht-tabs button { padding: 15px 12px; font-weight: 500; }
  .ht-tabs button.on { font-weight: 600; }
  .ht-sec { padding-top: 34px; margin-top: 34px; }
  .ht-sec:first-child { padding-top: 28px; }
  .ht-sec .sec-title { font-size: 24px; margin-bottom: 14px; }
  .ht-sec-sub { font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .ht-about { font-size: 16px; line-height: 1.7; }
  .ht-tiles { gap: 12px; margin-top: 22px; }
  .ht-tile { padding: 16px; border-radius: 14px; }
  .ht-tile-t { font-weight: 600; font-size: 15px; }
  .ht-tile-s { font-size: 13px; margin-top: 4px; }
  .ht-room { border-radius: 16px; margin-top: 14px; }
  .ht-room-info { padding: 18px 18px; }
  .ht-room-name { font-size: 20px; font-weight: 600; }
  .ht-room-desc { font-size: 14px; margin-top: 4px; }
  .ht-room-price { padding: 16px 18px; background: #F4F8F6; }
  .ht-room-val { font-weight: 700; }
  .ht-amen { gap: 12px; margin-top: 12px; }
  .ht-amen-i { font-size: 15px; gap: 11px; }
  .hr-linha { padding: 13px 16px; font-size: 15px; }

  .ht-poi-t { font-weight: 600; }
  .ht-poi-i { padding: 9px 0; }
  .contato-card { padding: 18px; border-radius: 14px; margin-top: 16px; background: #F4F8F6; border-color: #DCE9E2; }
  .rating-panel { padding: 18px 20px; border-radius: 16px; gap: 22px; }
  .rp-num { font-weight: 700; }
  .rate-box { padding: 20px; border-radius: 14px; margin-top: 22px; }
  .rate-box p { font-size: 14px; }
  .ht-revs { gap: 14px; margin-top: 12px; }
  .ht-rev { padding: 18px; border-radius: 16px; }
  .ht-rev-text { font-size: 15px; line-height: 1.6; margin-top: 12px; }
  .ht-rev-foot { margin-top: 14px; padding-top: 14px; }
  .rev-name { font-size: 14px; font-weight: 600; }
  .rev-date { font-size: 13px; }
  .court-cta { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(33,31,26,0.06); border-top-color: transparent; }
  .court-cta-price { min-width: 0; }

  /* ================= GuiaTennis Parceiros (/parceiros) =================
     O site da academia, no padrão do trivago Business Studio e do Booking
     para Parceiros: cabeçalho próprio, página de apresentação, planos,
     painel com os números; no celular, tudo pelo menu (sem barra embaixo). */
  /* Conta do GuiaTennis Parceiros: etapas do cadastro, pedido, pessoas e
     a oferta do próximo plano. */
  .pc-botao-cheio { width: 100%; justify-content: center; margin-top: 16px; padding: 12px 0; text-decoration: none; display: flex; }

  .pc-card-s { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 6px 0 0; }

  .pc-passos { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px; }

  .pc-plano { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 26px 20px 22px; }

  .pc-plano.atual .pc-plano-tag { background: var(--gold); color: var(--green-dark); }
  .pc-plano-n { font-size: 20px; font-weight: 700; margin: 0; }
  .pc-plano-p { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 700; color: var(--green); margin: 6px 0 0; }
  .pc-plano-lista { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }

  .pc-traco { width: 15px; text-align: center; flex-shrink: 0; }
  .pc-plano .cta-btn { margin-top: 20px; width: 100%; }
  .pc-plano-ok { display: flex; align-items: center; gap: 6px; margin: 18px 0 0; font-weight: 600; color: var(--green); }
  .pc-link-btn { display: inline-block; margin-top: 12px; background: none; border: none; padding: 0; color: var(--green) !important; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; font-family: inherit; text-align: left; }
  .pc-fim { margin: 52px 20px 0; padding: 36px 22px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; text-align: center; }

  .pc-bloco { margin-top: 24px; }

  .pc-numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

  .pc-var.desce { color: var(--red); }
  .pc-duas { display: grid; gap: 14px; margin-top: 16px; }
  @media (min-width: 900px) { .pc-duas { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
  .pc-progresso { height: 8px; border-radius: 999px; background: var(--bg-alt); overflow: hidden; margin-top: 12px; }
  .pc-progresso i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .pc-checklist { list-style: none; padding: 0; margin: 18px 0 14px; display: grid; gap: 12px; }
  @media (min-width: 640px) { .pc-checklist { grid-template-columns: 1fr 1fr 1fr; } }
  .pc-checklist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }

  .pc-bolinha { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--muted-dark); flex-shrink: 0; }
  .pc-atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (min-width: 900px) { .pc-atalhos { grid-template-columns: repeat(4, 1fr); } }
  .pc-atalho { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: left; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text) !important; text-decoration: none; cursor: pointer; line-height: 1.35; }

  .pc-trancado { display: flex; gap: 14px; align-items: flex-start; margin-top: 16px; border-style: dashed; }

  .pc-cadeado { display: inline-flex; width: 40px; height: 40px; border-radius: 12px; background: #FBF4E4; align-items: center; justify-content: center; flex-shrink: 0; }
  /* gráfico de colunas: uma série por gráfico, eixo com três marcas */
  .pc-graf { margin: 0 0 16px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 16px 12px; }
  .pc-graf figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }

  .pc-graf-leitura { font-size: 13px; color: var(--muted); }
  .pc-graf-area { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; height: 150px; }
  .pc-graf-eixo { display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--muted); text-align: right; line-height: 1; }
  .pc-graf-barras { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); align-items: end; column-gap: 2px; height: 100%;
    background: linear-gradient(var(--border), var(--border)) top / 100% 1px no-repeat, linear-gradient(var(--border), var(--border)) center / 100% 1px no-repeat, linear-gradient(var(--border), var(--border)) bottom / 100% 1px no-repeat; }
  .pc-barra { height: 100%; display: flex; align-items: flex-end; justify-content: center; background: none; border: none; padding: 0; cursor: pointer; min-width: 0; }
  .pc-barra i { display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; }

  .pc-graf-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 8px 0 0 36px; }
  .pc-tabela { margin-top: 4px; font-size: 14px; }
  .pc-tabela summary { cursor: pointer; color: var(--green); font-weight: 600; padding: 6px 0; }
  .pc-tabela table { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--card); border-radius: 12px; }
  .pc-tabela th, .pc-tabela td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .pc-tabela th:not(:first-child), .pc-tabela td:not(:first-child) { text-align: right; }
  .pc-lista { display: grid; gap: 12px; margin-top: 14px; }

  .pc-lista-i { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 14px; }
  .pc-lista-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-lista-bar { height: 8px; border-radius: 999px; background: var(--bg-alt); overflow: hidden; }
  .pc-lista-bar i { display: block; height: 100%; border-radius: 999px; }
  .pc-lista-i strong { font-weight: 600; min-width: 28px; text-align: right; }
  .pc-achada { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
  .pc-achada .cta-btn { flex-shrink: 0; margin: 0; min-height: 40px; padding: 8px 14px; font-size: 14px; }
  #pc-resultados { margin-top: 12px; }
  .pc-acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .pc-acoes .cta-btn { flex: 1 1 200px; margin: 0; }
  .pc-reivindicar { border-color: var(--green-line); background: #F4F8F6; }
  .pc-contato { margin-top: 24px; }
  .pc-rodape { margin-top: 56px; background: var(--card); border-top: 1px solid var(--border); }
  .pc-rodape-in { padding: 36px 20px 44px; display: grid; gap: 28px; }
  @media (min-width: 900px) { .pc-rodape-cols { grid-template-columns: repeat(3, 1fr); } }
  .pc-rodape-t { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
  .pc-rodape-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px; }
  .pc-rodape h4 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  .pc-rodape-cols a, .pc-rodape-cols button { display: block; background: none; border: none; padding: 6px 0; font-family: inherit; font-size: 14px; color: var(--muted) !important; text-decoration: none; cursor: pointer; text-align: left; }
  .ba-btn { display: block; text-align: center; text-decoration: none; }

  /* ================= Menu no jeito do trivago (01/10/2026) =================
     Título "Menu" no meio, grupos com título em negrito, ícone de traço e o
     valor na direita. Só o menu do site: o dos parceiros tem o próprio. */
  #menu-overlay .menu-drawer { width: min(420px, 100vw); padding: 8px 18px calc(28px + env(safe-area-inset-bottom)); }
  #menu-overlay .menu-topo { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-bottom: none; padding: 6px 0 10px; }
  #menu-overlay .menu-fechar { width: 44px; height: 44px; background: none; display: flex; align-items: center; justify-content: center; }
  .menu-titulo { margin: 0; text-align: center; font-size: 18px; font-weight: 700; color: var(--text); }
  #menu-overlay .menu-grupo { text-transform: none; letter-spacing: 0; font-size: 17px; font-weight: 700; color: var(--text); margin: 22px 0 2px; padding: 0 2px; }
  #menu-overlay .menu-item { gap: 18px; padding: 14px 2px; font-size: 16px; font-weight: 400; border-radius: 0; }
  #menu-overlay .menu-item:hover { background: var(--bg-alt); }
  .menu-valor { margin-left: auto; padding-left: 12px; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%; }
  #menu-overlay .menu-rodape { margin-top: 22px; }

  /* Blocos pessoais da home: a última busca como primeiro cartão das vistas,
     com fundo cinza e a lupa, como no trivago. */
  .home-sec-sub { margin: -8px 0 14px; color: var(--muted); font-size: 14px; }
  .mini-busca { background: var(--bg-alt); box-shadow: none; border-color: transparent; position: relative; }
  .mini-busca .mini-body { padding-right: 46px; }
  .mini-busca-ic { position: absolute; top: 14px; right: 14px; }
  .mini-busca-l { margin: 6px 0 0; font-size: 14px; color: var(--text); }
  .mini-extra { margin: 8px 0 0; font-size: 13px; color: var(--green); font-weight: 500; }

  /* Minhas quadras: abas e linhas com foto, nome e região. */
  .lista-abas { display: flex; gap: 8px; overflow-x: auto; margin: 14px 0 6px; scrollbar-width: none; }
  .lista-abas::-webkit-scrollbar { display: none; }
  .lista-aba { flex-shrink: 0; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 14px; font-family: var(--fonte-texto); font-size: 14px; color: var(--text); cursor: pointer; }
  .lista-aba.on { background: var(--green); border-color: var(--green); color: #fff; }
  .lista-linha { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
  .lista-foto { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .lista-busca-ic { width: 64px; height: 64px; border-radius: 10px; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lista-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .lista-txt strong { font-size: 16px; font-weight: 600; }
  .lista-txt span { font-size: 14px; color: var(--muted); }
  .lista-txt .lista-nota { color: var(--green); font-weight: 500; }
  .lista-txt .lista-extra { color: var(--green); }
  .lista-titulo { margin: 14px 0 0; font-size: 15px; font-weight: 600; }
  .lista-vazia { color: var(--muted); font-size: 15px; margin: 22px 0; }
  .lista-limpar { margin-top: 18px; background: none; border: none; padding: 8px 0; font-family: var(--fonte-texto); font-size: 14px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .reg-trava { border: 0; margin: 0; padding: 0; min-width: 0; }
  .reg-trava:disabled { opacity: 0.55; }
  .rate-login { font-size: 14px; color: var(--muted); margin: 4px 0 8px; }
  .jog-email-volta { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; padding: 4px 0; background: none; border: none; font-family: var(--fonte-texto); font-size: 16px; color: var(--text); cursor: pointer; max-width: 100%; }
  .jog-email-volta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #jogador-overlay .trilha { margin: 18px 0 4px; padding: 16px 14px 12px; }
  .pc-confirmar-email { border-color: #EBD9AE; background: #FFFBF1; margin-bottom: 18px; }
  .pc-confirmar-email .pc-acoes .cta-btn { flex: 1 1 160px; }
  .email-sugestao { margin-top: 12px; padding: 14px; border-radius: 12px; background: #FBF4E4; border: 1px solid #EBD9AE; font-size: 15px; }
  .email-sugestao-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .email-sugestao-acoes .cta-btn { margin: 0; flex: 1 1 140px; min-height: 42px; }
  .jog-grupo { margin: 26px 0 0; font-size: 17px; font-weight: 700; }
  .jog-rodape { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .jog-excluir { color: var(--red) !important; }
  .pref-cidades { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* Cadastro passo a passo: progresso em cima, uma parte por tela e a barra
     de Voltar/Continuar presa embaixo, como no Airbnb e no Booking. */
  #register-overlay .sheet { display: flex; flex-direction: column; }
  #register-overlay .reg-passos-tela { width: 100%; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; padding-bottom: 0; }
  .reg-cabeca { margin: 2px 52px 0 0; font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reg-contexto { margin: 12px 0 0; font-size: 14px; }
  .reg-progresso-t { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .reg-progresso { height: 6px; border-radius: 999px; background: var(--bg-alt); overflow: hidden; }
  .reg-progresso i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width 0.25s ease; }
  #register-overlay .reg-secoes { position: static; margin: 14px -22px 0; border-bottom: none; padding: 4px 22px 6px; }
  .reg-secoes button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .reg-titulo { margin: 22px 0 0; font-size: 28px; line-height: 1.15; }
  .reg-porque { margin: 8px 0 4px; }
  .reg-passo { padding-bottom: 24px; }

  .reg-rodape { position: sticky; bottom: 0; margin: auto -22px 0; padding: 12px 22px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 4; }
  .reg-rodape-dir { display: flex; gap: 10px; flex: 1; justify-content: flex-end; }
  .reg-rodape .cta-btn { margin: 0; flex: 0 1 auto; padding-left: 22px; padding-right: 22px; white-space: nowrap; }
  @media (max-width: 400px) {
    .reg-rodape { gap: 8px; padding-left: 16px; padding-right: 16px; margin-left: -22px; margin-right: -22px; }
    .reg-rodape-dir { gap: 8px; }
    .reg-rodape .cta-btn { padding-left: 13px; padding-right: 13px; font-size: 14px; }
  }
  .reg-voltar { background: none; border: none; padding: 10px 2px; font-family: var(--fonte-texto); font-size: 15px; font-weight: 600; color: var(--text); text-decoration: underline; cursor: pointer; }
  .reg-revisao { margin-top: 14px; border-top: 1px solid var(--border); }
  .reg-rev-linha { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 14px 0; font-family: var(--fonte-texto); cursor: pointer; color: var(--text); }
  .reg-rev-sinal { width: 28px; height: 28px; border-radius: 999px; background: var(--bg-alt); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .reg-rev-sinal.ok { background: var(--green-soft); color: var(--green); }
  .reg-rev-sinal.falta { background: #FBE9E7; color: var(--red); }
  .reg-rev-t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .reg-rev-t strong { font-size: 15px; font-weight: 600; }
  .reg-rev-t span { font-size: 13px; color: var(--muted); }


  /* Respiro (pedido do Breno em 04/10/2026): como Airbnb e Booking, cada
     campo com o título separado do campo de cima. O título é <label>, que
     ignorava a margem por ser inline: em bloco, a margem vale. */
  .field-label { display: block; }
  .field-label + .form-field, .field-label + .senha-caixa, .field-label + select { margin-top: 0; }
  .consent-row { margin-top: 18px; }
  .consent-row + .consent-row { margin-top: 14px; }
  .pc-declaro { color: var(--text); }
  .pc-declaro.falta input { outline: 2px solid var(--red); outline-offset: 2px; }
  .fgroup-note { margin-top: 8px; }
  .senha-forca { margin-top: 8px; }
  .form-error { margin-top: 14px; }
  .pc-linha { margin-top: 20px; }
  .reg-porque { margin-bottom: 8px; }
  .cta-btn + .footnote, .btn-primary + .footnote { margin-top: 20px; }
  .pc-card-t + .conta-dados { margin-top: 14px; }
  .conta-dados + .conta-acoes { margin-top: 16px; }

  /* Perfil da conta (05/10/2026), como o "Meu trivago": a inicial num
     círculo, o nome e as partes da conta em cartões. Vale para o site dos
     jogadores e para o GuiaTennis Parceiros. */
  .perfil-topo { display: flex; align-items: center; gap: 16px; margin: 4px 0 8px; }
  .perfil-topo h1 { margin: 0; font-size: 28px; line-height: 1.15; }
  .perfil-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .perfil-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .perfil-pagina { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

// O banco guarda as escolhas na ordem em que foram clicadas. Esta função coloca
// tudo de volta na ordem das listas acima, para que piso, cobertura,
// modalidade e comodidades apareçam sempre na mesma sequência — na busca, no
// cadastro, na ficha e na comparação.
function naOrdem(opcoes, escolhidas) {
  const tem = new Set(escolhidas || []);
  return opcoes.filter(o => tem.has(o.key));
}

function rotulosNaOrdem(opcoes, escolhidas) {
  return naOrdem(opcoes, escolhidas).map(o => o.label);
}

// Nos filtros, gratuito e pago aparecem como uma única opção "Estacionamento";

  ...AMENITY_OPTS.filter(a => a.key !== "estacionamento_gratuito" && a.key !== "estacionamento_pago"),
];

function matchesAmenityFilter(court, filterKey) {

    return court.amenities?.includes("estacionamento_gratuito") || court.amenities?.includes("estacionamento_pago");

// Planos de presença no site. O básico é a listagem gratuita; os outros
// dois são pagos. Guardados na coluna "plano" da tabela academias.

// O que cada plano libera na ficha (pedido do Breno em 02/10/2026). Nome,
// endereço, quadras e os tipos, modalidade, preço e horário são de todos.
// O Básico mostra até 3 comodidades, até 3 fotos e só o WhatsApp, sem

// Completo e o Premium mostram tudo. Números (Desempenho)
// só no Premium — o banco confere (SQL 20261002120000).
const LIMITES_DO_PLANO = {
  basico: { fotos: 3, comodidades: 3, contatos: ["whatsapp"], cancelamento: false, chegada: false, numeros: false },
  completo: { fotos: 5, comodidades: Infinity, contatos: ["whatsapp", "instagram", "site"], cancelamento: true, chegada: true, numeros: false },
  premium: { fotos: 5, comodidades: Infinity, contatos: ["whatsapp", "instagram", "site"], cancelamento: true, chegada: true, numeros: true },
};
// O máximo de fotos de qualquer plano: o cadastro aceita até aqui, e a ficha
// mostra o que o plano da academia libera.
const FOTOS_MAXIMO = 5;
function limitesDoPlano(plano) {
  return LIMITES_DO_PLANO[plano] || LIMITES_DO_PLANO.basico;
}
// A ficha como aparece no site: cortada pelo plano. O que a academia
// guardou além disso continua no banco (c.integral) e volta se ela
// aprimorar o plano; o formulário de edição usa o integral.
function aplicarPlano(c) {
  const l = limitesDoPlano(c.plano);
  const integral = { photos: c.photos || [], amenities: c.amenities || [], instagram: c.instagram, site: c.site, acesso: c.acesso || {}, politica: c.politica || {} };
  return {
    ...c,
    integral,
    photos: integral.photos.slice(0, l.fotos),
    amenities: integral.amenities.slice(0, l.comodidades),
    instagram: l.contatos.includes("instagram") ? c.instagram : "",
    site: l.contatos.includes("site") ? c.site : "",
    acesso: l.chegada ? integral.acesso : {},
    politica: l.cancelamento ? integral.politica : {},
  };
}

// Política de cancelamento e reposição. Fica na coluna "politica" (jsonb) da
// tabela academias, no formato { reposicao, foraDoPrazo }.
// Uma escolha só: com quantas horas de antecedência a academia gera a
// reposição da aula desmarcada. "nao" é para quem não faz reposição.
const REPOSICAO_OPTS = [
  { key: "12", label: "12h", horas: 12 },
  { key: "24", label: "24h", horas: 24 },
  { key: "48", label: "48h", horas: 48 },
  { key: "nao", label: "Não tem reposição", horas: null },
];

// Além das três opções, a academia pode escrever o prazo que usa de verdade
// (6h, 36h, 72h...). Fica guardado só com o número de horas.
const REPOSICAO_MAX_HORAS = 720;

function horasDaReposicao(key) {
  const opcao = REPOSICAO_OPTS.find(x => x.key === key);
  if (opcao) return opcao.horas;
  const n = /^\d+$/.test(String(key || "")) ? parseInt(key, 10) : 0;
  return n >= 1 && n <= REPOSICAO_MAX_HORAS ? n : null;
}

function reposicaoValida(key) {
  return key === "nao" || horasDaReposicao(key) !== null;
}

// Duas dicas curtas que a academia escreve: como achar o lugar e o que fazer
// ao chegar. Ficam na coluna "acesso" (jsonb) da tabela academias.
// Onde dá para deixar o carro quando a academia não tem vaga própria.
function acessoDe(c) {
  const a = (c && c.acesso) || {};
  return {
    fachada: (a.fachada || "").trim(),
    entrada: (a.entrada || "").trim(),
    // Estacionamento é texto da academia, não lista de opção: cada lugar tem
    // uma regra própria, e o que resolve é a frase de quem conhece a rua.
    estacionar: (a.estacionar || a.estacionamentoNota || "").trim(),
  };
}

function temAcesso(c) {
  const a = acessoFicha(c);
  return !!(a.fachada || a.entrada || estacionarLinhas(c).length);
}

// ---------- entendimento dos textos da academia ----------
// Cada academia escreve de um jeito. Antes de mostrar, o site arruma a
// forma (maiúscula, ponto final, horas e valores num formato só) e entende
// do que cada frase fala, como a comparação faz com as anotações: por
// palavras-chave. Nada é inventado; só muda a forma e o lugar.

const PALAVRAS_ACENTO = [
  [/\bate\b/g, "até"], [/\bnao\b/g, "não"], [/\bvoce\b/g, "você"], [/\btambem\b/g, "também"],
  [/\bproximo\b/g, "próximo"], [/\bproxima\b/g, "próxima"], [/\bgratis\b/g, "grátis"],
  [/\bportao\b/g, "portão"], [/\brecepcao\b/g, "recepção"],
  [/\btenis\b/g, "tênis"], [/\bpra\b/g, "para"], [/\bas (?=\d{1,2}h)/g, "às "],
  [/\bfacil\b/g, "fácil"], [/\bdificil\b/g, "difícil"], [/\bsabado\b/g, "sábado"], [/\bferiado\b/g, "feriado"],
];

function arrumarTexto(texto) {
  let t = String(texto || "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
  if (!t) return "";
  // Texto todo em maiúsculas vira texto normal.
  const letras = t.replace(/[^A-Za-zÀ-ÿ]/g, "");
  if (letras.length > 6 && letras === letras.toUpperCase()) t = t.toLowerCase();
  t = t
    .replace(/([!?])\1+/g, ".")
    .replace(/!/g, ".")
    .replace(/\b(\d{1,2})\s*(?::|h)\s*00\b/gi, "$1h")
    .replace(/\b(\d{1,2})\s*(?::|h)\s*(\d{2})\b/gi, "$1h$2")
    .replace(/\b(\d{1,2})\s*(?:hs|hrs|horas)\b/gi, "$1h")
    .replace(/r\$\s*(\d+)(?:,00)?/gi, "R$ $1")
    .replace(/\b(\d+)(?:,00)?\s*reais\b/gi, "R$ $1")
    .replace(/\s+([.,;:])/g, "$1")
    .replace(/([.,;:])(?=[^\s\d])/g, "$1 ");
  PALAVRAS_ACENTO.forEach(([re, certo]) => { t = t.replace(re, certo); });
  // Maiúscula no começo de cada frase e ponto no fim.
  t = t.replace(/(^|[.;]\s+)([a-zà-ÿ])/g, (m, antes, l) => antes + l.toUpperCase());
  if (!/[.:]$/.test(t)) t += ".";
  return t;
}

// Do que cada trecho fala, na ordem em que é testado.
const TERMOS_ESTACIONAR = [
  { tipo: "manobrista", termos: ["manobrista", "valet", "vallet"] },
  { tipo: "convenio", termos: ["convenio", "conveniado", "desconto", "parceria", "parceiro"] },
  { tipo: "zona_azul", termos: ["zona azul", "area azul", "rotativo", "parquimetro", "zona verde"] },
  { tipo: "restrita", termos: ["proibido", "dificil", "nao da para parar", "nao tem vaga", "sem vaga", "complicado", "lotado"] },
  { tipo: "pago", termos: ["estacionamento", "garagem", "r$", "reais", "pago", "cobra"] },
  { tipo: "livre", termos: ["rua", "na frente", "na porta", "calcada", "livre", "gratis", "de graca", "tranquilo", "facil", "sobra vaga", "tem vaga", "vaga"] },
];

// Só o que é claramente sobre estacionar. "Garagem" e "vaga" ficam de fora:
// também servem de referência para achar o portão.
const TERMOS_E_ESTACIONAR = ["estacion", "zona azul", "manobrista", "valet", "parar o carro", "deixar o carro", "vaga na rua", "vagas na rua"];

function falaDeEstacionar(frase) {
  const t = semAcento(frase);
  return TERMOS_E_ESTACIONAR.some(x => t.includes(x));
}

function frases(texto) {
  return String(texto || "")
    .replace(/r\$\s*(\d+),(\d{2})/gi, "R$ $1") // a vírgula do valor não separa frase
    .split(/[.;\n]+|,\s+|\s+e\s+(?=depois|na |no |tem |dá |da |zona|estacion|manobr)/i)
    .map(x => x.trim())
    .filter(Boolean);
}

// O texto de estacionamento vira o modelo único: rua, pago perto,
// manobrista, convênio. Trecho sem palavra-chave segue o anterior
// ("zona azul até as 19h, depois libera").
function entenderEstacionar(texto) {
  const grupos = { rua: [], pago: [], manobrista: [], convenio: [], outros: [] };
  let rua = "";
  let ultimo = "outros";
  const forca = { zona_azul: 3, restrita: 2, livre: 1 };
  frases(texto).forEach(f => {
    const t = semAcento(f);
    const achado = TERMOS_ESTACIONAR.find(k => k.termos.some(x => t.includes(x)));
    let grupo = ultimo;
    if (achado) {
      if (achado.tipo in forca) {
        grupo = "rua";
        if (!rua || forca[achado.tipo] > forca[rua]) rua = achado.tipo;
      } else {
        grupo = achado.tipo;
      }
    }
    grupos[grupo].push(f);
    ultimo = grupo;
  });
  const junta = (lista) => lista.map(arrumarTexto).join(" ");
  return {
    rua,
    ruaDetalhe: junta(grupos.rua),
    pagoPerto: junta(grupos.pago),
    manobrista: junta(grupos.manobrista),
    convenio: junta(grupos.convenio),
    outros: junta(grupos.outros),
  };
}

// Fachada e chegada arrumadas. Frase sobre estacionamento escrita ali muda
// para o bloco de estacionamento, onde é o lugar dela — mas só quando a
// academia não tem vaga própria (senão o bloco mostra só "No local" e a frase
// sumiria) e nunca a ponto de deixar a fachada ou a chegada vazia.
function acessoFicha(c) {
  const a = acessoDe(c);
  const podeMover = !temEstacionamentoProprio(c);
  const separa = (texto) => {
    const fica = [], sai = [];
    String(texto || "").split(/(?<=[.!?;])\s+|\n+/).map(x => x.trim()).filter(Boolean)
      .forEach(f => (podeMover && falaDeEstacionar(f) ? sai : fica).push(f));
    if (!fica.length) return { fica: sai.join(" "), sai: "" };
    return { fica: fica.join(" "), sai: sai.join(". ") };
  };
  const fac = separa(a.fachada), ent = separa(a.entrada);
  return {
    fachada: arrumarTexto(fac.fica),
    entrada: arrumarTexto(ent.fica),
    estacionar: [a.estacionar, fac.sai, ent.sai].filter(Boolean).join(". "),
  };
}

const RUA_OPTS = [
  { key: "livre", label: "Livre" },
  { key: "zona_azul", label: "Zona azul" },
  { key: "restrita", label: "Difícil parar" },
];

// As linhas do estacionamento, sempre na mesma ordem: no local, na rua,
// pago perto, manobrista, convênio. Com vaga própria, a comodidade responde
// sozinha.
function estacionarLinhas(c) {
  const am = (c && c.amenities) || [];
  if (am.includes("estacionamento_gratuito")) return [{ rot: "No local", txt: "Estacionamento grátis." }];
  if (am.includes("estacionamento_pago")) return [{ rot: "No local", txt: "Estacionamento pago." }];
  const p = entenderEstacionar(acessoFicha(c).estacionar);
  const linhas = [];
  if (p.rua || p.ruaDetalhe) {
    const tag = (RUA_OPTS.find(o => o.key === p.rua) || {}).label;
    linhas.push({ rot: "Na rua", tag, txt: p.ruaDetalhe });
  }
  if (p.pagoPerto) linhas.push({ rot: "Pago perto", txt: p.pagoPerto });
  if (p.manobrista) linhas.push({ rot: "Manobrista", txt: p.manobrista });
  if (p.convenio) linhas.push({ rot: "Convênio", txt: p.convenio });
  if (p.outros) linhas.push({ rot: "", txt: p.outros });
  return linhas;
}

function estacionarTexto(c) {
  return estacionarLinhas(c)
    .map(l => [l.rot ? l.rot + ":" : "", l.tag ? l.tag + "." : "", l.txt].filter(Boolean).join(" "))
    .join(" ");
}

// ---------- horário de funcionamento ----------

// Dois jeitos de preencher: o mesmo horário de segunda a sexta, ou um
// horário para cada dia. Sábado e domingo são sempre à parte.
const HORARIO_SIMPLES = [
  { key: "semana", label: "Segunda a sexta" },
  { key: "sabado", label: "Sábado" },
  { key: "domingo", label: "Domingo" },
];

const HORARIO_POR_DIA = [
  { key: "seg", label: "Segunda", curto: "Seg" },
  { key: "ter", label: "Terça", curto: "Ter" },
  { key: "qua", label: "Quarta", curto: "Qua" },
  { key: "qui", label: "Quinta", curto: "Qui" },
  { key: "sex", label: "Sexta", curto: "Sex" },
  { key: "sabado", label: "Sábado", curto: "Sáb" },
  { key: "domingo", label: "Domingo", curto: "Dom" },
];

const HORARIO_CHAVES = ["semana", "seg", "ter", "qua", "qui", "sex", "sabado", "domingo"];

function horarioDe(c) {
  const h = (c && c.horario) || {};
  const out = { modo: h.modo === "dia" ? "dia" : "igual", nota: (h.nota || "").trim() };
  HORARIO_CHAVES.forEach(k => {
    const f = h[k] || {};
    out[k] = { de: (f.de || "").trim(), ate: (f.ate || "").trim(), fechado: !!f.fechado };
  });
  return out;
}

// Dias seguidos com o mesmo horário viram uma linha só: "Seg a qua 6h às 22h".
function agruparDias(h) {
  const grupos = [];
  HORARIO_POR_DIA.forEach((d, i) => {
    const f = h[d.key];
    if (!faixaVale(f)) return;
    const txt = faixaTexto(f);
    const ult = grupos[grupos.length - 1];
    if (ult && ult.texto === txt && ult.fimIdx === i - 1) { ult.fim = d; ult.fimIdx = i; }
    else grupos.push({ ini: d, fim: d, fimIdx: i, texto: txt, fechado: f.fechado });
  });
  return grupos.map(g => ({
    label: g.ini.key === g.fim.key ? g.ini.label : `${g.ini.curto} a ${g.fim.curto.toLowerCase()}`,
    texto: g.texto,
    fechado: g.fechado,
  }));
}

function horarioLinhas(c) {
  const h = horarioDe(c);
  if (h.modo === "dia") return agruparDias(h);
  return HORARIO_SIMPLES.filter(d => faixaVale(h[d.key]))
    .map(d => ({ label: d.label, texto: faixaTexto(h[d.key]), fechado: h[d.key].fechado }));
}

// Qual faixa vale hoje, seja qual for o modo de preenchimento.
function faixaDeHoje(c, quando) {
  const h = horarioDe(c);
  const d = quando.getDay();
  if (h.modo === "dia") return h[["domingo", "seg", "ter", "qua", "qui", "sex", "sabado"][d]];
  return d === 0 ? h.domingo : d === 6 ? h.sabado : h.semana;
}

function faixaVale(f) {
  return !!(f && (f.fechado || (f.de && f.ate)));
}

function temHorario(c) {
  return horarioLinhas(c).length > 0;
}

// "06:00" vira "6h"; "06:30" vira "6h30".
function horaTexto(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
  if (!m) return hhmm || "";
  const h = parseInt(m[1], 10);
  return m[2] === "00" ? `${h}h` : `${h}h${m[2]}`;
}

function faixaTexto(f) {
  if (!faixaVale(f)) return "";
  return f.fechado ? "Fechado" : `${horaTexto(f.de)} às ${horaTexto(f.ate)}`;
}

// Usa a hora do próprio aparelho, que para quem está no Brasil é a certa.
// Devolve null quando não dá para saber.
function abertoAgora(c) {
  const agora = new Date();
  const f = faixaDeHoje(c, agora);
  if (!faixaVale(f) || f.fechado) return faixaVale(f) ? false : null;
  const minutos = (t) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(t || "");
    return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
  };
  const ini = minutos(f.de), fim = minutos(f.ate);
  if (ini === null || fim === null) return null;
  const q = agora.getHours() * 60 + agora.getMinutes();
  return fim > ini ? (q >= ini && q < fim) : (q >= ini || q < fim);
}

// Uma regra de cancelamento: o prazo e o que acontece fora dele.
function parteDaPolitica(o) {
  o = o || {};
  let reposicao = String(o.reposicao || "");
  // Formatos antigos: "sim"/"consultar" não diziam o prazo, e o prazo vinha
  // em outro campo. Aproveita o que dá e descarta o resto.
  if (!reposicaoValida(reposicao)) {
    const antigo = numeroOuNulo(o.cancelamentoHoras);
    reposicao = (antigo && reposicaoValida(String(antigo))) ? String(antigo) : "";
  }
  return {
    reposicao,
    horas: horasDaReposicao(reposicao),
    foraDoPrazo: (o.foraDoPrazo || o.obs || "").trim(),
  };
}

function parteVale(p) {
  return !!(p.reposicao || p.foraDoPrazo);
}

// Sem modalidade marcada, não dá para excluir nenhuma das duas.
function ofereceModalidade(c, key) {
  const m = (c && c.modalidades) || [];
  return !m.length || m.includes(key);
}

// A academia escolhe: a mesma regra para aula e locação, ou uma para cada.
// Quem só dá aula (ou só aluga a quadra) fica só com a regra do que oferece.
function politicaDe(c) {
  const pol = (c && c.politica) || {};
  const aula = parteDaPolitica(pol.aula);
  const locacao = parteDaPolitica(pol.locacao);
  const temAula = ofereceModalidade(c, "aulas_proprias");
  const temLocacao = ofereceModalidade(c, "locacao");
  let modo = pol.modo === "separado" ? "separado" : "igual";
  let geral = parteDaPolitica(pol);
  if (modo === "separado" && !(temAula && temLocacao)) {
    modo = "igual";
    geral = temAula ? aula : locacao;
  }
  return { modo, geral, aula, locacao, oque: temAula ? "aula" : "reserva" };
}

function temPolitica(c) {
  const pol = politicaDe(c);
  return pol.modo === "separado"
    ? (parteVale(pol.aula) || parteVale(pol.locacao))
    : parteVale(pol.geral);
}

// de `typeof lat === "number"` falha e o mapa, a distância e o "o que tem por
// perto" somem sem dizer por quê.
function numeroOuNulo(v) {
  if (v === null || v === undefined || v === "") return null;

}

// logada leem pela mesma lista: desde o acesso das academias, quem está
// logado também não lê as colunas de contato (o admin vê pela função
// contatos_privados).
async function lerPublico(tabela, colunas, montar, novas = []) {
  const listas = [colunas];
  if (novas.length) listas.push(colunas.split(", ").filter(c => !novas.includes(c)).join(", "));
  for (const lista of listas) {
    const r = await montar(sb.from(tabela).select(lista));
    if (!r.error) return r;
    diag(`o banco recusou a leitura de ${tabela}: ${r.error.message}${r.error.code ? " (" + r.error.code + ")" : ""}`);
  }
  return montar(sb.from(tabela).select('*'));
}

async function loadEverything() {
  const { data: published, error: erroAcademias } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('status', 'published').order('created_at'), COLUNAS_ACADEMIA_NOVAS);
  state.allCourts = (published || []).map(mapRow);
  diag(`academias lidas: ${state.allCourts.length}${erroAcademias ? ` · o banco recusou: ${erroAcademias.message}` : ""}`);

  // A academia logada lê a própria ficha mesmo pausada ou em análise.
  state.minhaAcademia = null;
  if (temAcademia()) {
    const { data: minha } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('id', contaAcademia.academiaId), COLUNAS_ACADEMIA_NOVAS);
    state.minhaAcademia = minha && minha[0] ? mapRow(minha[0]) : null;
  }

  if (isAdmin) {
    const { data: pend } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('status', 'pending').order('created_at'), COLUNAS_ACADEMIA_NOVAS);
    state.pending = (pend || []).map(mapRow);

    const { data: clicks } = await sb.from('cliques').select('*').order('created_at', { ascending: false }).limit(20000);
    state.clicksRaw = clicks || [];
    // Sem as colunas da busca, a gravação cai para uma versão sem elas e o
    // admin fica sem saber. Aqui ele fica sabendo, com o SQL.
    state.faltaSqlCliques = "";
    for (const coluna of ["detalhe", "cep", "lat", "origem"]) {
      const { error: semColuna } = await sb.from('cliques').select(coluna).limit(1);
      if (semColuna) { state.faltaSqlCliques = coluna; break; }
    }
    const clicksCache = {};
    (clicks || []).forEach(c => {
      if (!clicksCache[c.academia_id]) clicksCache[c.academia_id] = { whatsapp: 0, site: 0, instagram: 0 };
      clicksCache[c.academia_id][c.tipo] = (clicksCache[c.academia_id][c.tipo] || 0) + 1;
    });
    state.clicksCache = clicksCache;
  } else {
    state.pending = [];
  }

  await carregarEstatisticasPublicas();

  const { data: reviews } = await lerPublico('avaliacoes', COLUNAS_AVALIACAO_PUBLICAS, q => q.order('created_at', { ascending: false }));
  const respostas = await lerRespostas();
  const reviewsCache = {};
  (reviews || []).forEach(r => {
    if (!reviewsCache[r.academia_id]) reviewsCache[r.academia_id] = [];
    reviewsCache[r.academia_id].push({ id: r.id, stars: r.stars, comment: r.comment, nome_autor: r.nome_autor, contato_autor: r.contato_autor, ts: r.created_at, resposta: respostas[r.id] || null });
  });
  state.reviewsCache = reviewsCache;

  if (isAdmin) {
    const contatos = await lerContatosPrivados();
    const porId = {};
    contatos.forEach(x => { porId[x.tabela + ":" + x.id] = x; });
    [...state.allCourts, ...state.pending].forEach(c => {
      const x = porId["academias:" + c.id];
      if (x) { c.nomeSolicitante = x.nome; c.contatoSolicitante = x.contato; }
    });
    Object.values(reviewsCache).forEach(lista => lista.forEach(r => {
      const x = porId["avaliacoes:" + r.id];
      if (x) r.contato_autor = x.contato;
    }));
    await carregarAcessos();
  }
}

// `extras` são as colunas que o banco pode ainda não ter (cep, lat, lng,
// origem, dispositivo). Se a gravação falhar por causa delas, tenta de novo
// com menos, em vez de perder o evento.
// Tempo até agir, como o "tempo até a conversão" dos painéis grandes: em
// cada visita, a chegada leva 0, e a primeira busca e o primeiro contato
// com uma academia levam quantos segundos se passaram desde a chegada (e,
// no contato, quanto tempo a pessoa olhou a ficha). SQL 20261001130000.
const CHEGADA_AO_SITE = Date.now();
const TIPOS_DE_CONTATO = ["whatsapp", "instagram", "site"];
function segundosDesde(momento) {
  return Math.max(0, Math.min(86400, Math.round((Date.now() - momento) / 1000)));
}
function tempoAteAgir(courtId, type) {
  const t = {};
  // A chegada leva 0: marca a visita como medida, para a porcentagem de
  // quem buscou ou chamou contar só as visitas desde que o tempo existe.
  if (type === "acesso_site") t.segundos = 0;
  if (type === "visualizacao") window.__fichaAbertaEm = { id: courtId, em: Date.now() };
  if (type === "busca" && !window.__jaBuscou) {
    window.__jaBuscou = true;
    t.segundos = segundosDesde(CHEGADA_AO_SITE);
  }
  if (TIPOS_DE_CONTATO.includes(type) && !window.__jaChamou) {
    window.__jaChamou = true;
    t.segundos = segundosDesde(CHEGADA_AO_SITE);
    const ficha = window.__fichaAbertaEm;
    if (ficha && ficha.id === courtId) t.segundos_ficha = segundosDesde(ficha.em);
  }
  return t;
}

function trackClick(courtId, type, detalhe, extras) {
  // A academia chamada fica na lista do próprio aparelho ("Academias que você
  // chamou"), mesmo com o admin conectado: isso não vai para o banco.
  if (courtId && TIPOS_DE_CONTATO.includes(type)) lembrarChamada(courtId, type);
  if (courtId && TIPOS_DE_CONTATO.includes(type)) registrarPasso("contato", { academia: courtId, detalhe: `${NOME_DO_CONTATO[type] || type} · ${nomeDaAcademiaDoPasso(courtId)}` });
  if (courtId && type === "compartilhar") registrarPasso("acao", { academia: courtId, detalhe: `Compartilhou a ficha · ${nomeDaAcademiaDoPasso(courtId)}` });
  // Quem está logado não entra na conta: nem acesso, nem busca, nem clique
  // na ficha — o admin testando e a academia olhando a própria ficha.
  if (naoConta()) return;
  const tempo = tempoAteAgir(courtId, type);
  // Clique de academia (ficha aberta, WhatsApp, Instagram, site,
  // compartilhar) leva junto de onde a pessoa veio, o aparelho e a região
  // da busca que ela fez antes — é o que permite ver isso por academia.
  if (courtId) {
    const b = state.ultimaBusca || {};
    detalhe = detalhe || b.detalhe || null;
    extras = { origem: origemDoAcesso(), dispositivo: dispositivoDoAcesso(), cep: b.cep, lat: b.lat, lng: b.lng, ...(extras || {}) };
  }
  const base = { academia_id: courtId, tipo: type };
  const comDetalhe = detalhe ? { ...base, detalhe: String(detalhe).slice(0, 120) } : base;
  const limpos = {};
  Object.entries(extras || {}).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== "") limpos[k] = v; });
  const tentativas = [];
  // Banco ainda sem as colunas do tempo: a mesma linha vai sem elas.
  if (Object.keys(tempo).length) tentativas.push({ ...comDetalhe, ...limpos, ...tempo });
  if (Object.keys(limpos).length) tentativas.push({ ...comDetalhe, ...limpos });
  if (limpos.cep && Object.keys(limpos).length > 1) tentativas.push({ ...comDetalhe, cep: limpos.cep });
  if (detalhe) tentativas.push(comDetalhe);
  tentativas.push(base);
  const enviar = (i) => sb.from('cliques').insert(tentativas[i]).then(({ error }) => {
    if (!error) { diag(`gravado no banco: ${JSON.stringify(tentativas[i])}`); return; }
    diag(`o banco recusou ${JSON.stringify(tentativas[i])}\n   motivo: ${error.message}${error.code ? " (" + error.code + ")" : ""}`);
    if (i + 1 < tentativas.length) enviar(i + 1);
    else console.warn("GuiaTennis: não consegui gravar o clique.", error.message);
  }, (erro) => diag(`sem resposta do banco: ${erro && erro.message}`));
  enviar(0);
}

// De onde a pessoa veio: link com ?utm_source, ou o site anterior, ou o
// navegador de dentro do app (Instagram e Facebook abrem o site por dentro).
function origemDoAcesso() {
  if (window.__origemAcesso !== undefined) return window.__origemAcesso;
  window.__origemAcesso = calcularOrigem();
  return window.__origemAcesso;
}

function calcularOrigem() {
  try {
    const utm = new URLSearchParams(location.search).get("utm_source");
    if (utm) return utm.slice(0, 40);
    const ua = navigator.userAgent || "";
    if (/Instagram/i.test(ua)) return "Instagram";
    if (/FBAN|FBAV/i.test(ua)) return "Facebook";
    const ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : "";
    if (!ref || ref === location.hostname) return "Direto";
    if (/instagram/.test(ref)) return "Instagram";
    if (/google\./.test(ref)) return "Google";
    if (/facebook|fb\./.test(ref)) return "Facebook";
    if (/whatsapp|wa\.me/.test(ref)) return "WhatsApp";
    if (/bing\./.test(ref)) return "Bing";
    return ref.slice(0, 40);
  } catch { return ""; }
}

function dispositivoDoAcesso() {
  const ua = navigator.userAgent || "";
  if (/iPad|Tablet/i.test(ua)) return "Tablet";
  if (/Mobi|Android|iPhone/i.test(ua)) return "Celular";
  return "Computador";
}

// Ponto da busca arredondado para ~100 m: mostra o quarteirão onde há
// procura, não a casa de ninguém.
function pontoAproximado(v) {
  return typeof v === "number" && isFinite(v) ? Math.round(v * 1000) / 1000 : null;
}

// Guarda a região que a busca alcançou — bairro, cidade, CEP (o digitado ou o
// da região achada) e o ponto arredondado para ~100 m. Nunca o endereço
// digitado nem a coordenada exata: serve para saber onde tem procura por
// quadra, não para seguir ninguém.
function registrarBusca(geo, cep) {
  if (!geo) return;
  diag(`busca pronta — região: ${[geo.bairro, geo.cidade].filter(Boolean).join(", ") || "não identificada"} · CEP: ${cep || "nenhum"} · admin: ${isAdmin ? "sim (não grava)" : "não"}`);
  if (isAdmin) { state.avisoBuscaAdmin = true; return; }
  if (contaAcademia) return;
  const regiao = [geo.bairro, geo.cidade].filter(Boolean).join(", ");
  const digitos = String(cep || geo.cep || "").replace(/\D/g, "");
  state.ultimaBusca = {
    detalhe: regiao || null,
    cep: digitos.length === 8 ? digitos.slice(0, 5) + "-" + digitos.slice(5) : null,
    lat: pontoAproximado(geo.lat),
    lng: pontoAproximado(geo.lng),
  };
  trackClick(null, "busca", regiao || "região não identificada", {
    ...state.ultimaBusca,
    dispositivo: dispositivoDoAcesso(),
  });
  const filtros = activeFilterCount();
  registrarPasso("busca", { detalhe: `${regiao || "região não identificada"}${filtros ? ` · ${filtros} ${filtros === 1 ? "filtro" : "filtros"}` : ""}` });
}

// ---------- percurso da visita (pedido do Breno em 05/10/2026) ----------
// Como a "exploração de caminho" e o "funil" do Google Analytics: cada passo
// da visita — chegada, telas, buscas, fichas, contatos, ações e as etapas
// do cadastro do GuiaTennis Parceiros — vai para passos_das_visitas, com o
// tempo desde a chegada, de onde a pessoa veio, por qual meio e o aparelho.
// A visita é um número sorteado que vale só para ela (some ao fechar a aba
// ou depois de 30 minutos parada): não identifica a pessoa nem o aparelho.
// Da busca vai a região, nunca o endereço digitado; da tela, o caminho do
// link sem o "?". O admin não grava; a conta de academia só grava no
// GuiaTennis Parceiros. Banco sem a tabela: para de mandar, sem erro.
const VISITA_KEY = "guiatennis_visita_v1";
const VISITA_PARADA_MIN = 30;
let semPercurso = false;
function visitaAtual() {
  let v = null;
  try { v = JSON.parse(sessionStorage.getItem(VISITA_KEY) || "null"); } catch {}
  const agora = Date.now();
  if (!v || !v.id || agora - (v.ultimo || 0) > VISITA_PARADA_MIN * 60000) {
    let id = "";
    try { id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => (b % 36).toString(36)).join(""); }
    catch { id = (Math.random().toString(36) + Math.random().toString(36)).replace(/[^a-z0-9]/g, "").slice(0, 16); }
    v = { id, inicio: agora, ultimo: agora, ordem: 0, origem: origemDoAcesso(), meio: meioDoAcesso() };
  }
  return v;
}
function guardarVisita(v) {
  try { sessionStorage.setItem(VISITA_KEY, JSON.stringify(v)); } catch {}
}
// Por qual meio: o utm_medium do link, a parte de depois do traço da
// etiqueta (Instagram-bio → bio), o navegador do app ou o site anterior.
function meioDoAcesso() {
  if (window.__meioAcesso !== undefined) return window.__meioAcesso;
  window.__meioAcesso = (() => {
    try {
      const q = new URLSearchParams(location.search);
      const med = q.get("utm_medium");
      if (med) return med.slice(0, 40);
      const src = q.get("utm_source") || "";
      if (src === "Compartilhado") return "link compartilhado";
      if (src.includes("-")) return src.split("-").slice(1).join(" ").slice(0, 40);
      if (src) return "link com etiqueta";
      const ua = navigator.userAgent || "";
      if (/Instagram/i.test(ua)) return "navegador do Instagram";
      if (/FBAN|FBAV/i.test(ua)) return "navegador do Facebook";
      const ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : "";
      if (!ref) return "digitou o endereço ou favorito";
      if (ref === location.hostname.replace(/^www\./, "")) return "navegando no próprio site";
      if (/google\./.test(ref)) return "busca do Google";
      if (/bing\./.test(ref)) return "busca do Bing";
      return "link em outro site";
    } catch { return ""; }
  })();
  return window.__meioAcesso;
}
function nomeDaAcademiaDoPasso(id) {
  const c = todasAsFichas().find(x => x.id === id);
  return c ? c.name : "";
}
function registrarPasso(tipo, dados = {}) {
  if (semPercurso || isAdmin) return;
  const site = dados.site || (state.page === "parceiros" ? "parceiros" : "jogadores");
  if (contaAcademia && site === "jogadores") return;
  const v = visitaAtual();
  if (tipo === "saida" && v.ultimoTipo === "saida") return;
  v.ordem = (v.ordem || 0) + 1;
  v.ultimo = Date.now();
  v.ultimoTipo = tipo;
  guardarVisita(v);
  const linha = {
    visita: v.id, site, ordem: Math.min(v.ordem, 1000), tipo,
    tela: String(dados.tela || location.pathname || "/").slice(0, 120),
    detalhe: dados.detalhe ? String(dados.detalhe).slice(0, 160) : null,
    academia_id: dados.academia || null,
    origem: String(v.origem || "").slice(0, 60) || null,
    meio: String(v.meio || "").slice(0, 60) || null,
    dispositivo: dispositivoDoAcesso(),
    segundos: Math.min(86400, Math.max(0, Math.round((Date.now() - v.inicio) / 1000))),
  };
  // Saindo da página: o navegador pode cortar o pedido normal; vai com
  // keepalive, direto na API do banco.
  if (tipo === "saida") {
    try {
      fetch(`${SUPABASE_URL}/rest/v1/passos_das_visitas`, { method: "POST", keepalive: true,
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(linha) }).catch(() => {});
    } catch {}
    return;
  }
  sb.from('passos_das_visitas').insert(linha).then(({ error }) => {
    if (!error) { diag(`passo do percurso: ${tipo} · ${linha.detalhe || linha.tela}`); return; }
    diag(`o banco recusou o passo do percurso: ${error.message}`);
    if (/does not exist|could not find|schema cache/i.test(error.message || "")) semPercurso = true;
  }, () => {});
}

// ---------- geocoding (real network calls) ----------

async function fetchViaCep(rawCep) {
  const cep = rawCep.replace(/\D/g, "");
  if (cep.length !== 8) throw new Error("CEP precisa ter 8 dígitos.");
  const viaCepRes = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  if (!viaCepRes.ok) throw new Error("Não consegui consultar esse CEP.");
  const viaCepData = await viaCepRes.json();
  if (viaCepData.erro) throw new Error("CEP não encontrado.");
  return viaCepData;
}

function stripAccents(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function geocodeCep(rawCep) {
  const cep = rawCep.replace(/\D/g, "");
  if (cep.length !== 8) throw new Error("CEP precisa ter 8 dígitos.");

  // Fonte principal: devolve a coordenada já ligada diretamente ao CEP (base IBGE),
  // mais confiável que tentar geocodificar o endereço por texto.
  try {
    const res = await fetch(`https://cep.awesomeapi.com.br/json/${cep}`);
    if (res.ok) {
      const data = await res.json();
      if (data && data.lat && data.lng) {
        return {
          lat: parseFloat(data.lat),
          lng: parseFloat(data.lng),
          bairro: data.neighborhood || data.city,
          cidade: data.city,
          uf: data.state,
          approximate: false,
        };
      }
    }
  } catch (e) { /* sem sorte, tenta o método reserva abaixo */ }

  // Reserva: ViaCEP (endereço) + OpenStreetMap (texto → coordenada), com degradação progressiva.
  const viaCepData = await fetchViaCep(rawCep);
  const logradouro = viaCepData.logradouro || "";
  const bairro = viaCepData.bairro || "";
  const cidade = viaCepData.localidade;
  const uf = viaCepData.uf;

  const attempts = [
    `${logradouro}, ${bairro}, ${cidade}, ${uf}, Brasil`,
    `${stripAccents(logradouro)}, ${stripAccents(bairro)}, ${stripAccents(cidade)}, ${uf}, Brasil`,
    `${bairro}, ${cidade}, ${uf}, Brasil`,
    `${stripAccents(bairro)}, ${stripAccents(cidade)}, Brasil`,
    `${bairro}, ${cidade}, Brasil`,
    `${cidade}, ${uf}, Brasil`,
  ];

  let geo = null;
  let approximate = false;
  for (let i = 0; i < attempts.length; i++) {
    if (!attempts[i].replace(/[,\s]/g, "")) continue;
    try {
      geo = await geocodeAddress(attempts[i]);
      approximate = i >= 2;
      break;
    } catch (e) { /* tenta a próxima tentativa, mais genérica */ }
  }
  if (!geo) throw new Error("Não consegui localizar esse CEP no mapa.");
  return { ...geo, bairro: bairro || cidade, cidade, uf, approximate };
}

async function geocodeAddress(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("Não consegui localizar esse endereço no mapa.");
  const data = await res.json();
  if (!data.length) throw new Error("Endereço não encontrado. Tente incluir bairro e cidade.");
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
}

// O CEP que ficou no fim do endereço completo ("... - São Paulo - 05422-000").
function cepDoTexto(texto) {
  const m = String(texto || "").match(/\b(\d{5})-?(\d{3})\b/);
  return m ? m[1] + m[2] : "";
}

// Acha a coordenada de uma academia já cadastrada. Usa o CEP e o endereço
// completo quando a rua, o bairro e a cidade não estão preenchidos em
// separado — é o que fazia academias antigas ficarem fora do mapa.
async function localizarAcademia(c) {
  const pelaRua = await localizarPeloEndereco(c);
  // O mapa costuma conhecer a academia pelo nome, com o ponto exato da
  // quadra. Vale se ficar perto do endereço; senão é homônimo em outro lugar.
  // Quando o endereço só achou o bairro ou a cidade, a distância aceita é
  // maior, porque o ponto de referência é o centro deles.
  if (c.name) {
    try {
      await new Promise(r => setTimeout(r, 1100)); // Nominatim: uma busca por segundo
      const pelaNome = await geocodeAddress(`${c.name}, ${c.cidade || c.bairro || "Brasil"}`);
      const limite = pelaRua.grosso ? 20 : 1.5;
      if (haversineKm(pelaRua.lat, pelaRua.lng, pelaNome.lat, pelaNome.lng) <= limite) return pelaNome;
    } catch (e) { /* fica com o endereço */ }
  }
  // Centro do bairro ou da cidade não é o lugar da academia: melhor ficar
  // sem coordenada (e o admin ser avisado) do que aparecer no marco zero.
  if (pelaRua.grosso) throw new Error("Só achei o bairro ou a cidade, não a rua.");
  return pelaRua;
}

async function localizarPeloEndereco(c) {
  const cep = cepDoTexto(c.endereco);
  const temCampos = !!(c.address && (c.bairro || c.cidade));
  if (!temCampos && c.endereco) {
    if (cep) { try { return await geocodeCep(cep); } catch (e) { /* tenta pelo texto */ } }
    try { return await geocodeAddress(c.endereco.replace(/\s*-\s*\d{5}-?\d{3}\s*$/, "") + ", Brasil"); } catch (e) { /* tenta pelos campos */ }
  }
  return geocodeFormAddress({
    cep, address: c.address || "", numero: c.numero || "",
    bairro: c.bairro || "", cidade: c.cidade || "",
  });
}

// Com o admin conectado, o site completa sozinho as coordenadas que faltam,
// uma vez por visita. O Nominatim aceita uma busca por segundo.
async function completarCoordenadas() {
  if (!isAdmin || window.__completandoCoordenadas) return;
  const faltando = semCoordenada();
  if (!faltando.length) return;
  window.__completandoCoordenadas = true;
  state.localizando = { feito: 0, total: faltando.length };
  state.naoLocalizadas = [];
  render();
  for (let i = 0; i < faltando.length; i++) {
    const c = faltando[i];
    try {
      const geo = await localizarAcademia(c);
      const { error } = await sb.from('academias').update({ lat: geo.lat, lng: geo.lng }).eq('id', c.id);
      if (error) throw error;
    } catch (e) {
      state.naoLocalizadas.push(c.name);
    }
    state.localizando.feito = i + 1;
    if (i < faltando.length - 1) await new Promise(r => setTimeout(r, 1100));
  }
  state.localizando = null;
  await loadEverything();
  render();
}

// Academias (publicadas e pendentes) que ficam fora do mapa e da busca por
// distância por não ter coordenada.
function semCoordenada() {
  return [...state.allCourts, ...(state.pending || [])]
    .filter(c => typeof c.lat !== "number" || typeof c.lng !== "number");
}

async function geocodeFormAddress(f) {
  // Tenta primeiro pelo CEP (mais confiável), se a pessoa preencheu um
  const cepDigits = (f.cep || "").replace(/\D/g, "");
  if (cepDigits.length === 8) {
    try {
      const res = await fetch(`https://cep.awesomeapi.com.br/json/${cepDigits}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.lat && data.lng) return { lat: parseFloat(data.lat), lng: parseFloat(data.lng), approximate: false };
      }
    } catch (e) { /* segue pras tentativas por texto */ }
  }

  // Da mais exata para a mais genérica. O bairro atrapalha quando o mapa
  // conhece o lugar por outro nome ("Vila Progredior" x "Morumbi"), por
  // isso a rua com a cidade vem antes da rua com o bairro.
  const temRua = !!(f.address || "").trim();
  const attempts = [
    temRua && { q: `${f.address}, ${f.numero}, ${f.cidade}, Brasil`, nivel: "rua" },
    temRua && { q: `${f.address}, ${f.numero}, ${f.bairro}, ${f.cidade}, Brasil`, nivel: "rua" },
    temRua && { q: `${stripAccents(f.address)}, ${f.numero}, ${stripAccents(f.cidade)}, Brasil`, nivel: "rua" },
    temRua && { q: `${f.address}, ${f.cidade}, Brasil`, nivel: "rua" },
    temRua && { q: `${f.address}, ${f.bairro}, ${f.cidade}, Brasil`, nivel: "rua" },
    { q: `${f.bairro}, ${f.cidade}, Brasil`, nivel: "bairro" },
    { q: `${stripAccents(f.bairro)}, ${stripAccents(f.cidade)}, Brasil`, nivel: "bairro" },
    { q: `${f.cidade}, Brasil`, nivel: "cidade" },
  ].filter(Boolean);
  for (let i = 0; i < attempts.length; i++) {
    if (!attempts[i].q.replace(/[,\s]|Brasil/g, "")) continue;
    try {
      const geo = await geocodeAddress(attempts[i].q);
      // "grosso": só achou o bairro ou a cidade. Serve para a busca de quem
      // procura, nunca para gravar como o lugar da academia.
      return { ...geo, approximate: i >= 3, grosso: attempts[i].nivel !== "rua" };
    } catch (e) { /* tenta a próxima, mais genérica */ }
  }
  throw new Error("Não consegui localizar esse endereço. Confira o CEP, bairro e cidade.");
}

async function reverseGeocode(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("Não consegui identificar seu endereço.");
  const data = await res.json();
  const a = data.address || {};
  const bairro = a.suburb || a.neighbourhood || a.city_district || a.village || "sua região";
  const cidade = a.city || a.town || a.municipality || "";
  return { lat, lng, bairro, cidade, cep: (a.postcode || "").replace(/\D/g, "") };
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getReviews(courtId) {
  return state.reviewsCache[courtId] || [];
}
function getAppRating(courtId) {
  const reviews = getReviews(courtId);
  if (!reviews.length) return { avg: 0, count: 0 };
  const sum = reviews.reduce((s, r) => s + r.stars, 0);
  return { avg: sum / reviews.length, count: reviews.length };
}
async function submitRating(courtId, stars, comment) {
  const trimmed = (comment || "").trim();
  // Avaliar exige a conta do jogador: o banco preenche o nome e o e-mail dela.
  const v = { nome: (jogador && jogador.nome) || "", contato: (jogador && jogador.email) || "" };
  const { data, error } = await sb.from('avaliacoes').insert({ academia_id: courtId, stars, comment: trimmed, nome_autor: v.nome, contato_autor: v.contato }).select('id').single();
  // Quem administra a academia não avalia ela (o banco confere).
  if (error) {

    if (/já avaliou/.test(m)) marcarAvaliada(courtId);
    throw new Error(/administra essa academia|própria academia|academias? não avaliam|não avaliam academias/.test(m)
      ? "Você administra essa academia, então não avalia ela. As outras academias você avalia normalmente."
      : /já avaliou/.test(m) ? "Você já avaliou essa academia."
      : /Entre na sua conta|row-level security/.test(m) ? "Entre na sua conta para avaliar."
      : "Não consegui enviar a avaliação agora. Tente de novo em instantes.");
  }
  marcarAvaliada(courtId);
  registrarPasso("acao", { academia: courtId, detalhe: `Avaliou com ${stars} ${stars === 1 ? "estrela" : "estrelas"} · ${nomeDaAcademiaDoPasso(courtId)}` });
  if (!state.reviewsCache[courtId]) state.reviewsCache[courtId] = [];
