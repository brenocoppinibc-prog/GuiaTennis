// ---------- o que tem em volta da academia (OpenStreetMap / Overpass) ----------

// As categorias que aparecem no "Explore a região", na ordem em que são
// mostradas. "query" é o que vai para o Overpass; "casa" decide em qual
// categoria cai cada lugar que voltar.
const POI_CATS = [
  {
    key: "restaurante", label: "Restaurantes", ic: "cup",
    query: ['nwr["amenity"="restaurant"]'],
    casa: t => t.amenity === "restaurant",
  },
  {
    key: "musculacao", label: "Academias de musculação", ic: "bolt",
    query: ['nwr["leisure"="fitness_centre"]'],
    casa: t => t.leisure === "fitness_centre",
  },
  {
    key: "padaria", label: "Padarias e cafeterias", ic: "bag",
    query: ['nwr["shop"="bakery"]', 'nwr["amenity"="cafe"]'],
    casa: t => t.shop === "bakery" || t.amenity === "cafe",
  },
  {
    key: "turismo", label: "Pontos turísticos e parques", ic: "sparkle",
    query: ['nwr["tourism"~"^(attraction|museum|viewpoint|theme_park|zoo|gallery)$"]', 'nwr["leisure"="park"]'],
    casa: t => /^(attraction|museum|viewpoint|theme_park|zoo|gallery)$/.test(t.tourism || "") || t.leisure === "park",
  },
];

const POI_RAIO = 1500;          // metros em volta da academia
const POI_POR_TIPO = 4;         // no máximo 4 lugares de cada tipo
const POI_KEY = "guiatennis_perto_v1";
const POI_VALIDADE = 30 * 24 * 60 * 60 * 1000;  // guarda por 30 dias
const POI_MAX_GUARDADAS = 60;                    // academias guardadas no navegador

// Dois servidores públicos do Overpass: se o primeiro não responder, tenta o segundo.
const POI_SERVIDORES = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

function poiCacheLer(id) {
  try {
    const tudo = JSON.parse(localStorage.getItem(POI_KEY) || "{}");
    const reg = tudo[id];
    if (!reg || !Array.isArray(reg.itens)) return null;
    if (Date.now() - reg.ts > POI_VALIDADE) return null;
    return reg.itens;
  } catch { return null; }
}

function poiCacheGravar(id, itens) {
  try {
    const tudo = JSON.parse(localStorage.getItem(POI_KEY) || "{}");
    tudo[id] = { ts: Date.now(), itens };
    const ids = Object.keys(tudo).sort((a, b) => tudo[b].ts - tudo[a].ts);
    const enxuto = {};
    ids.slice(0, POI_MAX_GUARDADAS).forEach(k => { enxuto[k] = tudo[k]; });
    localStorage.setItem(POI_KEY, JSON.stringify(enxuto));
  } catch { /* navegador sem espaço ou em modo anônimo: segue sem guardar */ }
}

// Lê o que já está em memória ou no navegador, sem disparar busca nova.
function pertoDe(c) {
  if (state.perto[c.id]) return state.perto[c.id];
  const guardado = poiCacheLer(c.id);
  if (guardado) state.perto[c.id] = { status: "ok", itens: guardado };
  return state.perto[c.id];
}

// Busca no Overpass só na primeira vez que alguém abre a ficha da academia.
// Depois disso vem do navegador por 30 dias, então o servidor do
// OpenStreetMap recebe pouquíssimos pedidos.
async function carregarPerto(c) {
  if (!c || typeof c.lat !== "number" || typeof c.lng !== "number") return;
  if (state.perto[c.id]) return;
  state.perto[c.id] = { status: "carregando", itens: [] };
  try {
    const itens = await buscarPerto(c.lat, c.lng);
    state.perto[c.id] = { status: "ok", itens };
    poiCacheGravar(c.id, itens);
  } catch {
    state.perto[c.id] = { status: "erro", itens: [] };
  }
  if (state.page === "court" && state.selected && state.selected.id === c.id) render();
}

async function buscarPerto(lat, lng) {
  const filtros = POI_CATS.flatMap(x => x.query)
    .map(q => `${q}(around:${POI_RAIO},${lat},${lng});`).join("");
  const consulta = `[out:json][timeout:20];(${filtros});out center 200;`;
  let ultimoErro;
  for (const url of POI_SERVIDORES) {
    try {
      const corte = new AbortController();
      const relogio = setTimeout(() => corte.abort(), 12000);
      const resposta = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(consulta),
        signal: corte.signal,
      });
      clearTimeout(relogio);
      if (!resposta.ok) throw new Error("resposta " + resposta.status);
      const dados = await resposta.json();
      return organizarPerto(dados.elements || [], lat, lng);
    } catch (e) { ultimoErro = e; }
  }
  throw ultimoErro || new Error("nenhum servidor respondeu");
}

function organizarPerto(elementos, lat, lng) {
  const vistos = new Set();
  const itens = [];
  elementos.forEach(el => {
    const tags = el.tags || {};
    const nome = (tags.name || "").trim();
    if (!nome) return;
    const cat = POI_CATS.find(x => x.casa(tags));
    if (!cat) return;
    const ponto = el.center || el;
    if (typeof ponto.lat !== "number" || typeof ponto.lon !== "number") return;
    const chave = cat.key + "|" + nome.toLowerCase();
    if (vistos.has(chave)) return;
    vistos.add(chave);
    itens.push({ n: nome, c: cat.key, km: haversineKm(lat, lng, ponto.lat, ponto.lon) });
  });
  itens.sort((a, b) => a.km - b.km);
  const conta = {};
  return itens.filter(i => (conta[i.c] = (conta[i.c] || 0) + 1) <= POI_POR_TIPO);
}

// Tempo aproximado até o lugar, como o "5 min a pé" das páginas de hotel.
function tempoAte(km) {
  const aPe = Math.max(1, Math.round((km / 4.8) * 60));
  if (aPe <= 25) return `${aPe} min a pé`;
  return `${Math.max(1, Math.round((km / 22) * 60))} min de carro`;
}

// O bloco "O que tem por perto" dentro de "Explore a região".
function htPerto(c) {
  if (typeof c.lat !== "number" || typeof c.lng !== "number") return "";
  const dados = pertoDe(c);

  if (!dados || dados.status === "carregando") {
    return `
      <p class="field-label">O que tem por perto</p>
      <div class="ht-poi">
        ${POI_CATS.slice(0, 2).map(() => `
          <div class="ht-poi-g">
            <span class="ht-poi-skel t"></span>
            <span class="ht-poi-skel"></span>
            <span class="ht-poi-skel"></span>
          </div>`).join("")}
      </div>
      <p class="ht-poi-nota">Procurando restaurantes, padarias, academias de musculação e pontos turísticos em volta...</p>`;
  }

  if (dados.status === "erro") {
    return `
      <p class="field-label">O que tem por perto</p>
      <p class="ht-poi-nota">Não consegui consultar o mapa aberto agora para listar o que tem em volta. Recarregue a página para tentar de novo.</p>`;
  }

  const grupos = POI_CATS
    .map(cat => ({ cat, itens: dados.itens.filter(i => i.c === cat.key) }))
    .filter(g => g.itens.length);

  if (!grupos.length) {
    return `
      <p class="field-label">O que tem por perto</p>
      <p class="ht-poi-nota">Não achei restaurante, padaria, academia de musculação nem ponto turístico cadastrado no mapa aberto a até 1,5 km daqui.</p>`;
  }

  return `
    <p class="field-label">O que tem por perto</p>
    <div class="ht-poi">
      ${grupos.map(g => `
        <div class="ht-poi-g">
          <p class="ht-poi-t">${icon(g.cat.ic, 15, 'var(--green)')} ${esc(g.cat.label)}</p>
          ${g.itens.map(i => `
            <div class="ht-poi-i">
              <span class="ht-poi-n">${esc(i.n)}</span>
              <span class="ht-poi-d">${distanceText(i.km)} · ${tempoAte(i.km)}</span>
            </div>`).join("")}
        </div>`).join("")}
    </div>
    <p class="ht-poi-nota">Lugares num raio de 1,5 km, tirados do OpenStreetMap. Distância em linha reta e tempo estimado — o caminho real pode ser maior.</p>`;
}

// ---------- ficha da academia no formato das páginas de hotel ----------

// Galeria em mosaico: uma foto grande e até quatro menores, como nas páginas de
// hotel. No celular aparece só a primeira, ocupando a largura toda.
function htGaleria(c) {
  const photos = courtPhotos(c);
  if (!photos.length) {
    return `<div class="hero-empty">${icon('ball', 40, 'var(--muted-dark)')}<span class="card-photo-caption">Foto em breve</span></div>`;
  }
  const n = Math.min(photos.length, 5);
  const cls = ["", "solo", "duo", "trio", "quad", "penta"][n];
  const celulas = photos.slice(0, n).map((p, i) => `
    <div class="g" data-lightbox-open="${i}">
      <img src="${esc(p)}" alt="Foto ${i + 1} da ${esc(c.name)}" ${i ? 'loading="lazy"' : ""} />
    </div>`).join("");
  return `
    <div class="ht-gal ${cls}">
      ${celulas}
      <button type="button" class="ht-gal-all" data-lightbox-open="0">
        ${icon('camera', 14, '#fff')} ${photos.length === 1 ? "Ver a foto" : `Ver as ${photos.length} fotos`}
      </button>
    </div>`;
}

// O caminho até a academia, como o "Brasil › São Paulo › Hotel" das páginas de hotel.
function htCaminho(c) {
  const itens = [`<button type="button" data-crumb="home">Início</button>`];
  if (c.cidade) itens.push(`<button type="button" data-crumb="busca" data-termo="${esc(c.cidade)}">Quadras em ${esc(c.cidade)}</button>`);
  if (c.bairro) itens.push(`<button type="button" data-crumb="busca" data-termo="${esc([c.bairro, c.cidade].filter(Boolean).join(", "))}">${esc(c.bairro)}</button>`);
  itens.push(`<span class="cur">${esc(c.name)}</span>`);
  return `<nav class="ht-crumbs" aria-label="Onde você está">${itens.join(`<span class="sep">›</span>`)}</nav>`;
}

// Os selinhos ao lado do nome: modalidade, quadras e o que tem de melhor.
function htEtiquetas(c) {
  const out = [];
  const mod = modalidadesTexto(c);
  if (mod) out.push(mod);
  const total = totalQuadras(c);
  if (total) out.push(`${total} ${plural(total, "quadra", "quadras")}`);
  const pisos = (c.pisos || []).map(k => (PISO_OPTS.find(p => p.key === k) || {}).label).filter(Boolean);
  if (pisos.length) out.push(listaTexto(pisos));
  const cobs = (c.cobertura || []).map(k => (COBERTURA_OPTS.find(x => x.key === k) || {}).label).filter(Boolean);
  if (cobs.length) out.push(listaTexto(cobs));
  if (!out.length) return "";
  return `<div class="ht-tags">${out.slice(0, 4).map(t => `<span class="ht-tag">${esc(t)}</span>`).join("")}</div>`;
}

// O menor e o maior valor considerando todas as opções de preço da academia.
function faixaGeral(c) {
  const opcoes = opcoesPreco(c);
  if (!opcoes.length) return null;
  const mins = opcoes.map(o => parseInt(priceMin(o.faixa) || "0", 10)).filter(Boolean);
  if (!mins.length) return null;
  const barata = opcoes.find(o => parseInt(priceMin(o.faixa) || "0", 10) === Math.min(...mins)) || opcoes[0];
  return { opcao: barata, texto: precoTexto(barata.faixa) };
}

// Texto corrido sobre a academia, montado a partir do que ela cadastrou —
// o equivalente ao "Sobre esta acomodação" das páginas de hotel.
function descricaoAcademia(c) {
  const frases = [];
  const local = [c.bairro, c.cidade].filter(Boolean).join(", ");
  const dist = distanceText(c.distanceKm);
  if (local) frases.push(`${c.name} fica em ${local}${dist ? `, a ${dist} de onde você buscou` : ""}.`);

  const total = totalQuadras(c);
  if (total) frases.push(textoQuadras(c));

  const mod = modalidadesTexto(c);
  const opcoes = opcoesPreco(c);
  if (opcoes.length) {
    frases.push(`A academia cobra, por hora de quadra, ${listaTexto(opcoes.map(o => `${precoTexto(o.faixa)} ${o.nome === "Preço" ? "no uso da quadra" : "na " + o.nome.toLowerCase()}`))}.`);
  } else if (mod) {
    frases.push(`A academia atende ${mod.toLowerCase()}, mas ainda não informou os valores.`);
  }

  const com = (c.amenities || []).map(a => AMENITY_MAP[a] && AMENITY_MAP[a].label.toLowerCase()).filter(Boolean);
  if (com.length) frases.push(`Entre as comodidades ${plural(com.length, "está", "estão")} ${listaTexto(com.slice(0, 4))}.`);

  if (c.appCount) {
    frases.push(`Quem já jogou aqui deu nota ${c.appAvg.toFixed(1).replace(".", ",")} de 5, em ${c.appCount} ${plural(c.appCount, "avaliação feita", "avaliações feitas")} no GuiaTennis.`);
  }
  return frases.join(" ");
}

// "São 8 quadras: 3 de saibro cobertas, 2 de saibro descobertas..." — a mesma
// frase serve para a descrição e para as perguntas frequentes.
function textoQuadras(c) {
  const total = totalQuadras(c);
  if (!total) return "";
  const combos = QUADRA_COMBOS.filter(q => c.quadras[q.key] > 0).map(q => ({
    n: c.quadras[q.key],
    piso: q.piso === "rapida" ? "piso rápido" : "saibro",
    cob: q.cobertura === "coberta" ? "coberta" : "descoberta",
    cobs: q.cobertura === "coberta" ? "cobertas" : "descobertas",
  }));
  if (combos.length === 1) {
    const u = combos[0];
    return total === 1
      ? `É 1 quadra de ${u.piso}, ${u.cob}.`
      : `São ${total} quadras, todas de ${u.piso} e ${u.cobs}.`;
  }
  return `São ${total} quadras no total: ${listaTexto(combos.map(u => `${u.n} de ${u.piso} ${u.n === 1 ? u.cob : u.cobs}`))}.`;
}

function listaTexto(itens) {
  if (itens.length <= 1) return itens.join("");
  return itens.slice(0, -1).join(", ") + " e " + itens[itens.length - 1];
}

// Os quatro destaques do topo, como as "Informações populares" dos hotéis.
function htDestaques(c) {
  const faixa = faixaGeral(c);
  const total = totalQuadras(c);
  const dist = distanceText(c.distanceKm);
  const tem = k => (c.amenities || []).includes(k);
  const candidatos = [
    c.appCount && { ic: 'sparkle', cor: 'var(--gold)', t: `${c.appAvg.toFixed(1).replace(".", ",")} ${scoreWord(c.appAvg, c.appCount)}`, s: `${c.appCount} ${plural(c.appCount, "avaliação", "avaliações")} no app` },
    faixa && { ic: 'key', cor: 'var(--green)', t: `${faixa.texto}`, s: `${faixa.opcao.nome.toLowerCase()}, por hora de quadra` },
    dist && { ic: 'pin', cor: 'var(--green)', t: `${dist} de você`, s: [c.bairro, c.cidade].filter(Boolean).join(", ") || "a partir da sua busca" },
    tem("estacionamento_gratuito") && { ic: 'parking', cor: 'var(--green)', t: "Estacionamento grátis", s: "No próprio local" },
    tem("vestiario") && { ic: 'droplet', cor: 'var(--green)', t: "Vestiário", s: "Para trocar de roupa e tomar banho" },
    tem("camera") && { ic: 'camera', cor: 'var(--green)', t: "Câmera nas quadras", s: "Grava os seus pontos" },
    tem("lanchonete") && { ic: 'cup', cor: 'var(--green)', t: "Lanchonete", s: "Para comer algo depois do jogo" },
    tem("wifi") && { ic: 'wifi', cor: 'var(--green)', t: "Wi-Fi", s: "Rede disponível no local" },
    tem("loja") && { ic: 'bag', cor: 'var(--green)', t: "Loja de materiais", s: "Corda, bola e acessórios no local" },
    tem("agua") && { ic: 'watercup', cor: 'var(--green)', t: "Água grátis", s: "Para se hidratar durante o jogo" },
    tem("assinatura_fitness") && { ic: 'pass', cor: 'var(--green)', t: "App de assinatura fitness", s: "Aceita crédito de plano fitness" },
    tem("estacionamento_pago") && { ic: 'parking', cor: 'var(--gold)', t: "Estacionamento pago", s: "No próprio local" },
    total && { ic: 'ball', cor: 'var(--green)', t: `${total} ${plural(total, "quadra", "quadras")}`, s: "estrutura cadastrada pela academia" },
  ].filter(Boolean).slice(0, 4);
  if (!candidatos.length) return "";
  return `<div class="ht-tiles">${candidatos.map(d => `
    <div class="ht-tile">
      <span class="ht-tile-ic">${icon(d.ic, 20, d.cor)}</span>
      <p class="ht-tile-t">${esc(d.t)}</p>
      <p class="ht-tile-s">${esc(d.s)}</p>
    </div>`).join("")}</div>`;
}

// As opções de preço viram cartões parecidos com a lista de quartos de um hotel:
// o que é de um lado, o valor do outro. O contato é um só, logo abaixo.
function htOpcoes(c) {
  const opcoes = opcoesPreco(c);
  const marcas = selos(c);
  if (!opcoes.length) {
    return `
      <div class="ht-room">
        <div class="ht-room-info">
          <p class="ht-room-name">Preço a consultar</p>
          <p class="ht-room-desc">A academia ainda não informou os valores no GuiaTennis. Pergunte no WhatsApp.</p>
        </div>
      </div>
      ${blocoContato(c)}`;
  }
  const cartoes = opcoes.map(o => `
    <div class="ht-room">
      <div class="ht-room-info">
        <p class="ht-room-name">${esc(o.nome)}</p>
        <p class="ht-room-desc">${esc(o.desc)}</p>
        ${marcas.length ? `<div class="ht-room-perks">${marcas.map(m => `<span class="offer-check">${icon('check', 13, 'var(--green)')} ${esc(m.label)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="ht-room-price">
        <div class="ht-room-val">${esc(precoTexto(o.faixa))}</div>
        <div class="ht-room-unit">por hora</div>
      </div>
    </div>`).join("");
  return cartoes + blocoContato(c);
}

// Quadras e comodidades, na grade de ícones das "Comodidades da acomodação".
function htComodidades(c) {
  const total = totalQuadras(c);
  const lista = (c.amenities || []).map(a => AMENITY_MAP[a]).filter(Boolean);
  if (!total && !lista.length) return "";
  return `
    ${total ? `
      <p class="field-label" style="margin-top:0">Quadras — ${total} no total</p>
      <div class="ht-amen">
        ${QUADRA_COMBOS.filter(q => c.quadras[q.key] > 0).map(q => `
          <div class="ht-amen-i">${(PISO_OPTS.find(p => p.key === q.piso) || {}).icon || ""}
            <span>${c.quadras[q.key]}x ${(PISO_OPTS.find(p => p.key === q.piso) || {}).label} ${((COBERTURA_OPTS.find(x => x.key === q.cobertura) || {}).label || "").toLowerCase()}</span>
          </div>`).join("")}
      </div>` : ""}
    ${lista.length ? `
      <p class="field-label">Comodidades</p>
      <div class="ht-amen">
        ${lista.map(a => `<div class="ht-amen-i">${a.icon}<span>${esc(a.label)}</span></div>`).join("")}
      </div>` : ""}`;
}

// "Explore a região": mapinha, endereço, direções e as academias mais próximas.
function htLocalizacao(c) {
  const temCoord = typeof c.lat === "number" && typeof c.lng === "number";
  const perto = academiasPerto(c, 3);
  return `
    <div class="ht-map" id="court-mini-map">${temCoord ? "" : `<div class="ht-map-empty">A academia ainda não tem coordenada no mapa. O endereço abaixo abre no Google Maps e no Waze.</div>`}</div>
    <p class="ht-addr-line">${icon('pin', 15, 'var(--green)')} <span>${esc(c.endereco || [c.bairro, c.cidade].filter(Boolean).join(", ") || "Endereço não informado")}</span></p>
    ${navLinks(c)}
    ${htPerto(c)}
    ${perto.length ? `
      <p class="field-label">Outras academias por perto</p>
      <div class="ht-perto">
        ${perto.map(p => `
          <button type="button" class="ht-perto-i" data-open="${p.c.id}">
            <span class="ht-perto-n">${esc(p.c.name)}</span>
            <span class="ht-perto-d">${distanceText(p.km)} daqui${p.c.appCount ? ` · nota ${p.c.appAvg.toFixed(1).replace(".", ",")}` : ""}</span>
          </button>`).join("")}
      </div>` : ""}`;
}

function academiasPerto(c, quantas) {
  if (typeof c.lat !== "number" || typeof c.lng !== "number") return [];
  return state.allCourts
    .filter(x => x.id !== c.id && typeof x.lat === "number" && typeof x.lng === "number")
    .map(x => ({ c: decorate(x), km: haversineKm(c.lat, c.lng, x.lat, x.lng) }))
    .sort((a, b) => a.km - b.km)
    .slice(0, quantas);
}

// Painel de nota com a distribuição de estrelas, como o resumo dos hotéis.
function ratingPanel(c) {
  const dist = ratingDistribution(c.id);
  const total = c.appCount || 0;
  return `
    <div class="rating-panel">
      <div class="rp-score">
        <div class="rp-num">${total ? c.appAvg.toFixed(1).replace(".", ",") : "—"}</div>
        <div class="rp-word">${scoreWord(c.appAvg, total)}</div>
        <div class="rp-count">${total ? `${total} ${plural(total, "avaliação", "avaliações")}` : "ainda sem nota"}</div>
      </div>
      <div>
        ${[5, 4, 3, 2, 1].map(n => {
          const qtd = dist[n];
          const pct = total ? Math.round((qtd / total) * 100) : 0;
          return `<div class="bar-row">
            <span class="bar-lbl">${n} ★</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
            <span class="bar-n">${qtd}</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

// As avaliações em cartões, com a nota de cada uma em destaque.
function reviewsSection(c) {
  const reviews = getReviews(c.id);
  if (!reviews.length) return "";
  const limite = state.reviewsExpanded ? reviews.length : 4;
  const visiveis = reviews.slice(0, limite);
  return `
    <p class="field-label">O que dizem os jogadores</p>
    <div class="ht-revs">
      ${visiveis.map(r => `
        <article class="ht-rev">
          <div class="ht-rev-top">
            <span class="ht-rev-badge">${r.stars}/5</span>
            <span class="ht-rev-word">${scoreWord(r.stars, 1)}</span>
            ${isAdmin ? `<button type="button" class="delete-review-btn" data-review="${r.id}" title="Excluir avaliação">${icon('warning', 13, 'var(--red)')}</button>` : ""}
          </div>
          ${r.comment ? `<p class="ht-rev-text">${esc(r.comment)}</p>` : `<p class="ht-rev-text vazio">Avaliou sem escrever comentário.</p>`}
          <div class="ht-rev-foot">
            <span class="rev-avatar">${esc(initials(r.nome_autor))}</span>
            <div style="min-width:0">
              <p class="rev-name">${esc(r.nome_autor || "Jogador do GuiaTennis")}</p>
              <span class="rev-date">${formatReviewDate(r.ts)}${isAdmin && r.contato_autor ? ` · ${esc(r.contato_autor)}` : ""}</span>
            </div>
          </div>
        </article>`).join("")}
    </div>
    ${reviews.length > 4 ? `<button type="button" class="rev-more" id="reviews-more">${state.reviewsExpanded ? "Mostrar menos" : `Ver todas as ${reviews.length} avaliações`}</button>` : ""}
  `;
}

// O texto de preço é um só no site inteiro: faixa completa, sempre por hora.
function precoTexto(faixa) {
  const min = priceMin(faixa);
  const max = priceMax(faixa);
  if (!min) return "";
  return max && max !== min ? `R$ ${min} a ${max}` : `R$ ${min}`;
}

// Cada preço vira uma opção que a pessoa escolhe, como os quartos de um hotel.
function opcoesPreco(c) {
  const out = [];
  if (c.priceAula) out.push({ nome: "Aula", desc: "Aula com professor da academia", faixa: c.priceAula, assunto: "as aulas" });
  if (c.priceLocacao) out.push({ nome: "Locação", desc: "Aluguel da quadra por hora", faixa: c.priceLocacao, assunto: "alugar a quadra" });
  if (!out.length && c.priceRange) out.push({ nome: "Preço", desc: "Valor informado pela academia", faixa: c.priceRange, assunto: "os valores" });
  return out.sort((a, b) => (parseInt(priceMin(a.faixa), 10) || 1e9) - (parseInt(priceMin(b.faixa), 10) || 1e9));
}

// "Aula e locação", "Só aula"... — o que a academia atende, em texto curto.
function modalidadesTexto(c) {
  const temAula = !!c.priceAula || (c.modalidades || []).includes("aulas_proprias");
  const temLoc = !!c.priceLocacao || (c.modalidades || []).includes("locacao");
  if (temAula && temLoc) return "Aula e locação";
  if (temAula) return "Aula";
  if (temLoc) return "Locação";
  return "";
}

function waLink(c, assunto) {
  const wa = (c.phone || "").replace(/\D/g, "");
  const texto = assunto
    ? `Olá! Vim pelo GuiaTennis e queria saber sobre ${assunto}.`
    : "Olá! Vim pelo GuiaTennis e gostaria de saber mais informações sobre a academia.";
  return `https://wa.me/55${wa.replace(/^55/, "")}?text=${encodeURIComponent(texto)}`;
}

function blocoContato(c) {
  const quem = modalidadesTexto(c);
  return `
    <div class="contato-card">
      <p class="contato-mod">${quem ? `Contato para ${esc(quem.toLowerCase())}` : "Contato da academia"}</p>
      <p class="contato-sub">É o mesmo WhatsApp para os dois — pergunte horário, disponibilidade e o valor do seu caso.</p>
      ${c.phone
        ? `<a class="cta-btn cta-primary" data-track="whatsapp" data-court="${c.id}" href="${waLink(c)}" target="_blank" rel="noreferrer">${icon('phone', 15, '#fff')} Chamar no WhatsApp</a>`
        : `<p class="contato-sub" style="margin-top:10px">A academia ainda não informou um telefone no GuiaTennis.</p>`}
    </div>
  `;
}

// O cartão fixo da direita, no lugar do "Ver disponibilidade" dos hotéis.
function htCartaoContato(c) {
  const opcoes = opcoesPreco(c);
  return `
    <div class="ht-book">
      ${opcoes.length ? `
        <p class="ht-book-lbl">Preço por hora de quadra</p>
        ${opcoes.map(o => `
          <div class="ht-book-row">
            <span class="ht-book-opt">${esc(o.nome)}</span>
            <span class="ht-book-val">${esc(precoTexto(o.faixa))}</span>
          </div>`).join("")}
      ` : `
        <p class="ht-book-lbl">Preço</p>
        <div class="ht-book-row"><span class="ht-book-opt">A consultar</span></div>
      `}
      <div class="ht-book-div"></div>
      ${c.appCount ? `
        <div class="ht-book-score">
          <span class="sbadge">${c.appAvg.toFixed(1).replace(".", ",")}</span>
          <span><strong>${scoreWord(c.appAvg, c.appCount)}</strong><br><span class="ht-book-sub">${c.appCount} ${plural(c.appCount, "avaliação", "avaliações")} no app</span></span>

    </div>`).join("")}</div>`;
}

// Perguntas frequentes montadas com o que a academia cadastrou — nada inventado.
function perguntasAcademia(c) {
  const faq = [];
  const opcoes = opcoesPreco(c);
  if (opcoes.length) {
    faq.push({
      q: `Quanto custa jogar em ${c.name}?`,
      a: opcoes.map(o => `${o.nome}: ${precoTexto(o.faixa)} por hora`).join(". ") + ". Os valores foram informados pela academia e podem mudar conforme horário e professor — confirme no WhatsApp.",
    });
  }
  const mod = modalidadesTexto(c);
  if (mod) {
    faq.push({
      q: `${c.name} dá aula de tênis ou só aluga a quadra?`,
      a: mod === "Aula e locação" ? "As duas coisas: a academia tem aula com professor e também aluga a quadra por hora."
        : mod === "Aula" ? "A academia trabalha com aula com professor. Para alugar a quadra avulsa, pergunte direto no WhatsApp."
        : "A academia trabalha com locação da quadra por hora. Para aula com professor, pergunte direto no WhatsApp.",
    });
  }
  const total = totalQuadras(c);
  if (total) {
    faq.push({ q: `Quantas quadras ${c.name} tem?`, a: textoQuadras(c) });
  }
  if ((c.cobertura || []).length) {
    faq.push({
      q: `${c.name} tem quadra coberta?`,
      a: (c.cobertura || []).includes("coberta")
        ? "Sim, tem quadra coberta — dá para jogar mesmo com chuva. Confirme a disponibilidade no dia."
        : "As quadras cadastradas são descobertas, então o jogo depende do tempo.",
    });
  }
  const temEstGratis = (c.amenities || []).includes("estacionamento_gratuito");
  const temEstPago = (c.amenities || []).includes("estacionamento_pago");
  if (temEstGratis || temEstPago || (c.amenities || []).length) {
    faq.push({
      q: `${c.name} tem estacionamento?`,
      a: temEstGratis ? "Sim, estacionamento grátis no local."
        : temEstPago ? "Sim, mas o estacionamento é pago."
        : "A academia não informou estacionamento no cadastro. Vale perguntar no WhatsApp.",
    });
  }
  if (c.endereco || c.bairro) {
    faq.push({
      q: `Onde fica ${c.name}?`,
      a: `${c.endereco || [c.bairro, c.cidade].filter(Boolean).join(", ")}. Na seção "Explore a região" tem o mapa e o atalho para o Google Maps e o Waze.`,
    });
  }
  const contatos = [c.phone ? "WhatsApp" : null, c.instagram ? `Instagram (${c.instagram})` : null, c.site ? "site próprio" : null].filter(Boolean);
  if (contatos.length) {
    faq.push({ q: `Como falar com ${c.name}?`, a: `Pelo ${listaTexto(contatos)}. O botão de WhatsApp desta página já abre a conversa com uma mensagem pronta.` });
  }
  if (c.appCount) {
    faq.push({
      q: `Qual é a nota de ${c.name} no GuiaTennis?`,
      a: `A nota é ${c.appAvg.toFixed(1).replace(".", ",")} de 5 (${scoreWord(c.appAvg, c.appCount)}), em ${c.appCount} ${plural(c.appCount, "avaliação feita", "avaliações feitas")} por quem usou o GuiaTennis.`,
    });
  }
  return faq;
}

function htPerguntas(c) {
  const faq = perguntasAcademia(c);
  if (!faq.length) return "";
  return `<div class="ht-faq">${faq.map((f, i) => `
    <details data-faq="${i}" ${state.faqOpen[i] ? "open" : ""}>
      <summary>${esc(f.q)}<span class="ht-faq-ic">${icon('chevron', 16, 'var(--green)')}</span></summary>
      <p>${esc(f.a)}</p>
    </details>`).join("")}</div>`;
}

// A barra de seções que acompanha a rolagem, como o menu das páginas de hotel.
function htSecoesDisponiveis(c) {
  const secs = [{ id: "ht-visao", label: "Visão geral" }, { id: "ht-opcoes", label: "Preços" }];
  if (totalQuadras(c) || (c.amenities || []).length) secs.push({ id: "ht-comodidades", label: "Comodidades" });
  secs.push({ id: "ht-local", label: "Localização" });
  secs.push({ id: "avaliacoes", label: "Avaliações" });
  if (perguntasAcademia(c).length) secs.push({ id: "ht-duvidas", label: "Dúvidas" });
  return secs;
}

const STATS_PERIODOS = [
  { key: "7", label: "7 dias" },
  { key: "30", label: "30 dias" },
  { key: "90", label: "90 dias" },
  { key: "all", label: "Tudo" },
];

function statsAgregado(periodo) {
  const raw = state.clicksRaw || [];
  let lista = raw;
  if (periodo !== "all") {
    const corte = Date.now() - parseInt(periodo, 10) * 86400000;
    lista = raw.filter(c => new Date(c.created_at).getTime() >= corte);
  }
  const porAcademia = {};
  let acessos = 0;
  lista.forEach(c => {
    if (c.tipo === "acesso_site") { acessos++; return; }
    if (!c.academia_id) return;
    if (!porAcademia[c.academia_id]) porAcademia[c.academia_id] = { whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 };
    porAcademia[c.academia_id][c.tipo] = (porAcademia[c.academia_id][c.tipo] || 0) + 1;
  });
  return { porAcademia, acessos, totalEventos: lista.length };
}

function resumoTexto(court, d) {
  const contatos = d.whatsapp + d.site + d.instagram + d.compartilhar;
  const per = STATS_PERIODOS.find(p => p.key === state.statsPeriodo);
  return `GuiaTennis — ${court.name}\nPeríodo: ${per ? per.label.toLowerCase() : ""}\n\n`
    + `Visualizações da ficha: ${d.visualizacao}\n`
    + `Cliques no WhatsApp: ${d.whatsapp}\n`
    + `Cliques no Instagram: ${d.instagram}\n`
    + `Cliques no site: ${d.site}\n`
    + `Compartilhamentos: ${d.compartilhar}\n\n`
    + `Total de contatos: ${contatos}\n`
    + `guiatennis.com.br`;
}

function renderStatsPanel() {
  const periodo = state.statsPeriodo || "30";
  const { porAcademia, acessos } = statsAgregado(periodo);

  const linhas = state.allCourts.map(c => {
    const d = Object.assign({ whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 }, porAcademia[c.id] || {});
    const contatos = d.whatsapp + d.site + d.instagram + d.compartilhar;
    const taxa = d.visualizacao ? (contatos / d.visualizacao) * 100 : 0;
    return { court: c, d, contatos, taxa };
  });

  const ativas = linhas.filter(r => r.d.visualizacao > 0 || r.contatos > 0);
  const paradas = linhas.filter(r => r.d.visualizacao === 0 && r.contatos === 0);

  const ordem = state.statsOrdem || "views";
  ativas.sort((a, b) => {
    if (ordem === "contatos") return b.contatos - a.contatos;
    if (ordem === "taxa") return b.taxa - a.taxa;
    return b.d.visualizacao - a.d.visualizacao;
  });

  const totViews = ativas.reduce((s, r) => s + r.d.visualizacao, 0);
  const totContatos = ativas.reduce((s, r) => s + r.contatos, 0);
  const taxaGeral = totViews ? (totContatos / totViews) * 100 : 0;

  return `
    <div class="overlay open" id="stats-overlay">
      <div class="sheet"><div class="sheet-content">
        <button class="sheet-close" id="stats-close">✕</button>
        <p class="sheet-title display">Estatísticas</p>
        <p class="subtitle" style="margin-top:4px">Registrado por todos os visitantes</p>

        <div class="chip-row" style="margin-top:12px">
          ${STATS_PERIODOS.map(p => `<button class="chip small ${periodo===p.key?"active":""}" data-stats-per="${p.key}">${p.label}</button>`).join("")}
        </div>

        <div class="stats-grid">
          <div class="stat-card"><p class="stat-num">${acessos}</p><p class="stat-lbl">Acessos ao site</p></div>
          <div class="stat-card"><p class="stat-num">${totViews}</p><p class="stat-lbl">Fichas abertas</p></div>
          <div class="stat-card"><p class="stat-num">${totContatos}</p><p class="stat-lbl">Contatos gerados</p></div>
          <div class="stat-card"><p class="stat-num">${taxaGeral.toFixed(0)}%</p><p class="stat-lbl">Ficha → contato</p></div>
        </div>

        <div class="chip-row" style="margin-top:16px">
          <span class="stats-ord-lbl">Ordenar:</span>
          <button class="chip small ${ordem==="views"?"active":""}" data-stats-ord="views">Mais vistas</button>
          <button class="chip small ${ordem==="contatos"?"active":""}" data-stats-ord="contatos">Mais contatos</button>
          <button class="chip small ${ordem==="taxa"?"active":""}" data-stats-ord="taxa">Melhor taxa</button>
        </div>

        <p class="field-label" style="margin-top:16px">Com movimento (${ativas.length})</p>
        ${ativas.length === 0 ? `<p class="empty">Nenhum registro nesse período.</p>` : ""}
        ${ativas.map(r => `
          <div class="pending-item">
            <div class="stat-row-top">
              <p class="pending-name display" style="margin:0">${esc(r.court.name)}</p>
              ${r.d.visualizacao ? `<span class="stat-taxa ${r.taxa >= 15 ? 'boa' : (r.taxa > 0 ? 'media' : 'zero')}">${r.taxa.toFixed(0)}%</span>` : ""}
            </div>
            <p class="pending-detail">${icon('eye',12)} ${r.d.visualizacao} ficha${r.d.visualizacao===1?"":"s"} aberta${r.d.visualizacao===1?"":"s"} &nbsp;·&nbsp; ${r.contatos} contato${r.contatos===1?"":"s"}</p>
            <p class="pending-detail">${icon('phone',12)} ${r.d.whatsapp} &nbsp; ${icon('instagram',12)} ${r.d.instagram} &nbsp; ${icon('globe',12)} ${r.d.site} &nbsp; ${icon('share',12)} ${r.d.compartilhar}</p>
            <button type="button" class="stat-copy" data-copy-stats="${r.court.id}">Copiar resumo pra mandar</button>
          </div>
        `).join("")}

        ${paradas.length ? `
          <p class="field-label" style="margin-top:20px">Sem movimento no período (${paradas.length})</p>
          <p class="pending-detail" style="margin-bottom:8px">${paradas.map(r => esc(r.court.name)).join(" · ")}</p>
        ` : ""}
      </div></div>
    </div>
  `;
}

// ---------- events ----------

function attachEvents() {
  // ---- ordenação estilo Trivago (botão + menu suspenso) ----
  const sortToggle = document.getElementById("sort-toggle");
  if (sortToggle) sortToggle.onclick = () => { state.showSort = !state.showSort; render(); };
  const sortBackdrop = document.getElementById("sort-backdrop");
  if (sortBackdrop) sortBackdrop.onclick = () => { state.showSort = false; render(); };

  const brandHome = document.getElementById("brand-home");
  if (brandHome) brandHome.onclick = goHome;

  const irBusca = document.getElementById("home-ir-busca");
  if (irBusca) irBusca.onclick = goSearch;

  const irAvaliacoes = document.getElementById("ir-avaliacoes");
  if (irAvaliacoes) irAvaliacoes.onclick = () => {
    const alvo = document.getElementById("avaliacoes");
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const shareBtn2 = document.getElementById("share-btn-2");
  if (shareBtn2) shareBtn2.onclick = () => shareCourt(shareBtn2.dataset.court);

  const courtBack = document.getElementById("court-back");
  if (courtBack) courtBack.onclick = voltarDaFicha;

  // ---- ficha: caminho, barra de seções e perguntas frequentes ----
  document.querySelectorAll("[data-crumb]").forEach(el => {
    el.onclick = () => {
      if (el.dataset.crumb === "home") { goHome(); return; }
      state.cep = el.dataset.termo || "";
      goSearch();
      doSearch();
    };
  });

  const shareBtn3 = document.getElementById("share-btn-3");
  if (shareBtn3) shareBtn3.onclick = () => shareCourt(shareBtn3.dataset.court);

  document.querySelectorAll(".ht-faq details").forEach(el => {
    el.ontoggle = () => { state.faqOpen[el.dataset.faq] = el.open; };
  });

  if (__htSpy) { window.removeEventListener("scroll", __htSpy); __htSpy = null; }
  const htTabs = document.getElementById("ht-tabs");
  if (htTabs) {
    const botoes = Array.from(htTabs.querySelectorAll("button[data-goto]"));
    botoes.forEach(b => {
      b.onclick = () => {
        const alvo = document.getElementById(b.dataset.goto);
        if (!alvo) return;
        const topo = alvo.getBoundingClientRect().top + window.scrollY - (htTabs.offsetHeight + 56);
        window.scrollTo({ top: Math.max(0, topo), behavior: "smooth" });
      };
    });
    __htSpy = () => {
      if (!document.body.contains(htTabs)) {
        window.removeEventListener("scroll", __htSpy);
        __htSpy = null;
        return;
      }
      const limite = htTabs.getBoundingClientRect().bottom + 30;
      let atual = botoes[0];
      botoes.forEach(b => {
        const alvo = document.getElementById(b.dataset.goto);
        if (alvo && alvo.getBoundingClientRect().top <= limite) atual = b;
      });
      botoes.forEach(b => b.classList.toggle("on", b === atual));
    };
    window.addEventListener("scroll", __htSpy, { passive: true });
    __htSpy();
  }

  document.querySelectorAll(".city-tab").forEach(el => {
    el.onclick = () => { state.homeCity = el.dataset.city; render(); };

        window.prompt("Copie o resumo:", txt);
      }
    };
  });

  const statsClose = document.getElementById("stats-close");
  const statsOverlay = document.getElementById("stats-overlay");
  if (statsClose) statsClose.onclick = () => { state.showStatsPanel = false; render(); };
  if (statsOverlay) statsOverlay.onclick = (e) => { if (e.target === statsOverlay) { state.showStatsPanel = false; render(); } };

  const regClose = document.getElementById("register-close");
  const regClose2 = document.getElementById("register-close-2");
  const regOverlay = document.getElementById("register-overlay");
  if (regClose) regClose.onclick = () => { state.showRegister = false; render(); };
  if (regClose2) regClose2.onclick = () => { state.showRegister = false; render(); };
  if (regOverlay) regOverlay.onclick = (e) => { if (e.target === regOverlay) { state.showRegister = false; render(); } };

  const adminClose = document.getElementById("admin-close");
  const adminOverlay = document.getElementById("admin-overlay");
  if (adminClose) adminClose.onclick = () => { state.showAdminPanel = false; render(); };
  if (adminOverlay) adminOverlay.onclick = (e) => { if (e.target === adminOverlay) { state.showAdminPanel = false; render(); } };

  document.querySelectorAll("[data-preview]").forEach(el => {
    el.onclick = () => {
      if (!state.pending.some(x => x.id === el.dataset.preview)) return;
      openCourt(el.dataset.preview);
    };
  });

  document.querySelectorAll("[data-approve]").forEach(el => {
    el.onclick = async () => {
      await sb.from('academias').update({ status: 'published' }).eq('id', el.dataset.approve);
      await loadEverything();
      render();
    };
  });
  document.querySelectorAll("[data-reject]").forEach(el => {
    el.onclick = async () => {
      await sb.from('academias').delete().eq('id', el.dataset.reject);
      await loadEverything();
      render();
    };
  });

  bindFormField("f-name", "name"); bindFormField("f-address", "address"); bindFormField("f-bairro", "bairro");
  bindFormField("f-cidade", "cidade"); bindFormField("f-numero", "numero"); bindFormField("f-complemento", "complemento");
  bindPriceField("f-price-aula", "priceAula"); bindPriceField("f-price-locacao", "priceLocacao");
  bindFormField("f-phone", "phone"); bindFormField("f-instagram", "instagram");
  bindFormField("f-site", "site");

  document.querySelectorAll("[data-track]").forEach(el => {
    el.addEventListener("click", () => trackClick(el.dataset.court, el.dataset.track));
  });

  document.querySelectorAll(".reg-quadra-count").forEach(el => {
    el.oninput = (e) => {
      const f = window.__form;
      if (!f.quadras) f.quadras = {};
      f.quadras[el.dataset.combo] = Math.max(0, parseInt(e.target.value, 10) || 0);
    };
  });
  document.querySelectorAll(".reg-amenity").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.amenity;
      const f = window.__form;
      f.amenities = f.amenities.includes(k) ? f.amenities.filter(x=>x!==k) : [...f.amenities, k];
      render();
    };
  });
  document.querySelectorAll(".reg-modalidade").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.modalidade;
      const f = window.__form;
      f.modalidades = f.modalidades.includes(k) ? f.modalidades.filter(x=>x!==k) : [...f.modalidades, k];
      render();
    };
  });

  const regSubmit = document.getElementById("register-submit");
  if (regSubmit) regSubmit.onclick = () => {
    const f = window.__form;
    if (isAdmin || f.__editingId) {
      doRegisterSubmit();
    } else {
      ensureVisitorThen(doRegisterSubmit);
    }
  };

  const consentBox = document.getElementById("f-consent");
  if (consentBox) consentBox.onchange = (e) => { window.__form.consent = e.target.checked; };

  const openTermsFromForm = document.getElementById("open-terms-from-form");
  if (openTermsFromForm) openTermsFromForm.onclick = () => { state.showTerms = true; render(); };
  const openPrivacyFromForm = document.getElementById("open-privacy-from-form");
  if (openPrivacyFromForm) openPrivacyFromForm.onclick = () => { state.showPrivacy = true; render(); };

  const cepField = document.getElementById("f-cep");
  if (cepField) {
    cepField.oninput = (e) => { window.__form.cep = e.target.value; };
    cepField.onblur = () => autoFillFromCep(window.__form.cep);
  }

  const photoFile = document.getElementById("f-photo-file");
  if (photoFile) {
    photoFile.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const f = window.__form;
      if (!f.photos) f.photos = [];
      const room = Math.max(0, 5 - f.photos.length);
      const toAdd = files.slice(0, room);
      let pending = toAdd.length;
      toAdd.forEach((file) => {
        compressImage(file, 1280, 0.72).then((dataUrl) => {
          f.photos.push(dataUrl);
          pending--;
          if (pending === 0) render();
        }).catch(() => {
          pending--;
          if (pending === 0) render();
        });
      });
    };
  }

  document.querySelectorAll("[data-photo-idx]").forEach(el => {
    el.onclick = () => {
      window.__form.photos.splice(parseInt(el.dataset.photoIdx, 10), 1);
      render();
    };
  });
}

async function autoFillFromCep(rawCep) {
  const digits = (rawCep || "").replace(/\D/g, "");
  if (digits.length !== 8) return;
  state.cepStatus = "loading";
  render();
  try {
    const data = await fetchViaCep(digits);
    const f = window.__form;
    f.address = data.logradouro || f.address;
    f.bairro = data.bairro || f.bairro;
    f.cidade = data.localidade || f.cidade;
    state.cepStatus = "idle";
  } catch (e) {
    state.cepStatus = "error";
  }
  render();
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round(height * (maxDimension / width));
            width = maxDimension;
          } else {
            width = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindFormField(id, key) {
  const el = document.getElementById(id);
  if (el) el.oninput = (e) => { window.__form[key] = e.target.value; };
}

function bindPriceField(id, key) {
  const el = document.getElementById(id);
  if (el) el.oninput = (e) => {
    const cleaned = e.target.value.replace(/[^0-9-]/g, "");
    e.target.value = cleaned;
    window.__form[key] = cleaned;
  };
}

function useMyLocation() {
  if (!navigator.geolocation) {
    state.errorMsg = "Seu navegador não suporta localização automática.";
    state.searchStatus = "error";
    render();
    return;
  }
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const geo = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
        state.origin = geo;
        state.cep = "";
        state.sortBy = "distance";
        state.searchStatus = "done";
      } catch (e) {
        state.errorMsg = e.message || "Não consegui identificar sua região.";
        state.searchStatus = "error";
      }
      render();
    },
    () => {
      state.errorMsg = "Não consegui acessar sua localização. Permita o acesso ou digite um CEP.";
      state.searchStatus = "error";
      render();
    },
    { timeout: 10000 }
  );
}

function shareCourt(courtId) {
  const c = (state.allCourts.find(x => x.id === courtId)) || (state.pending && state.pending.find(x => x.id === courtId));
  if (!c) return;
  trackClick(courtId, "compartilhar");
  const url = `${location.origin}${location.pathname}?court=${c.id}`;
  const text = `Olha essa quadra/academia que eu achei, no GuiaTennis:\n${c.name}${c.endereco ? " - " + c.endereco : (c.bairro ? " - " + c.bairro : "")}`;
  const fullText = `${text} ${url}`;

  function lastResort() {
    window.prompt("Copie o link abaixo pra compartilhar:", fullText);
  }

  try {
    if (navigator.share) {
      navigator.share({ title: c.name, text, url }).catch((err) => {
        if (err && err.name === "AbortError") return; // usuário só fechou o menu de compartilhar
        lastResort();
      });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Link copiado! Cole onde quiser compartilhar.");
      }).catch(lastResort);
    } else {
      lastResort();
    }
  } catch (e) {
    lastResort();
  }
}

async function doSearch() {
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  const termo = state.cep.trim();
  const digitsOnly = termo.replace(/\D/g, "");
  try {
    let geo;
    if (digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0) {
      geo = await geocodeCep(termo);
    } else {
      // Aceita endereço OU ponto de referência ("Escola Adventista", "Shopping Morumbi").
      const tentativas = [
        `${termo}, Brasil`,
        termo,
        state.origin && state.origin.cidade ? `${termo}, ${state.origin.cidade}, Brasil` : null,
      ].filter(Boolean);

      let result = null;
      for (const q of tentativas) {
        try { result = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
      }
      if (!result) throw new Error("Não achei esse endereço ou local. Tente incluir o bairro e a cidade.");

      // Descobre bairro/cidade reais pela coordenada, em vez de adivinhar pelo texto digitado
      let bairro = "", cidade = "";
      try {
        const rev = await reverseGeocode(result.lat, result.lng);
        bairro = rev.bairro || "";
        cidade = rev.cidade || "";
      } catch (e) {
        const parts = termo.split(",").map(s => s.trim()).filter(Boolean);
        bairro = parts.length > 1 ? parts[parts.length - 2] : parts[0];
        cidade = parts[parts.length - 1] || "";
      }
      geo = { ...result, bairro: bairro || termo, cidade, approximate: false };
    }
    state.origin = geo;
    state.sortBy = "distance";
    state.searchStatus = "done";
  } catch (e) {
    state.errorMsg = e.message || "Não consegui buscar esse endereço ou CEP.";
    state.searchStatus = "error";
  }
  render();
}

async function doRegisterSubmit() {
  const f = window.__form;
  const quadras = f.quadras || {};
  const hasQuadra = QUADRA_COMBOS.some(q => quadras[q.key] > 0);
  const pisos = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.piso))];
  const cobertura = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.cobertura))];

  if (f.__editingId) {
    if (!f.name.trim()) {
      state.registerError = "O nome não pode ficar em branco.";
      state.registerStatus = "error";
      render();
      return;
    }
    state.registerStatus = "saving";
    render();
    const endereco = (f.address || f.numero || f.bairro || f.cidade)
      ? `${f.address}${f.numero ? ", " + f.numero : ""}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}`
      : undefined;
    const payload = toRow({ ...f, pisos, cobertura });
    if (endereco) payload.endereco = endereco; else delete payload.endereco;
    try {
      const { error } = await sb.from('academias').update(payload).eq('id', f.__editingId);
      if (error) throw error;
      await loadEverything();
      if (state.selected && state.selected.id === f.__editingId) {
        state.selected = state.allCourts.find(c => c.id === f.__editingId) || state.pending.find(c => c.id === f.__editingId) || state.selected;
      }
      state.registerStatus = "done";
    } catch (e) {
      state.registerError = e.message || "Não consegui salvar as alterações.";
      state.registerStatus = "error";
    }
    render();
    return;
  }

  const missing = [];
  if (!f.name.trim()) missing.push("nome");
  if (!f.address.trim() || !f.numero.trim() || !f.bairro.trim() || !f.cidade.trim()) missing.push("endereço completo");
  if (!f.phone.trim()) missing.push("WhatsApp");
  if (f.modalidades.includes("aulas_proprias") && !/\d/.test(f.priceAula || "")) missing.push("faixa de preço da aula");
  if (f.modalidades.includes("locacao") && !/\d/.test(f.priceLocacao || "")) missing.push("faixa de preço da locação");
  if (!hasQuadra) missing.push("quantidade de quadras");
  if (!f.modalidades.length) missing.push("modalidade");
  if (!f.consent) missing.push("aceite dos Termos de Uso e Política de Privacidade");

  if (missing.length) {
    state.registerError = `Preencha: ${missing.join(", ")}.`;
    state.registerStatus = "error";
    render();
    return;
  }

  state.registerStatus = "saving";
  render();
  try {
    const geo = await geocodeFormAddress(f);
    const endereco = `${f.address}, ${f.numero}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}${f.cep ? " - " + f.cep : ""}`;
    const visitor = loadVisitor() || {};
    const payload = {
      ...toRow({ ...f, pisos, cobertura }),
      endereco, lat: geo.lat, lng: geo.lng,
      source: 'custom', status: 'pending',
      nome_solicitante: isAdmin ? null : visitor.nome,
      contato_solicitante: isAdmin ? null : visitor.contato,
    };
    let insertQuery = sb.from('academias').insert(payload);
    if (isAdmin) insertQuery = insertQuery.select().single();
    const { data, error } = await insertQuery;
    if (error) throw error;
    if (isAdmin) {
      const { error: pubError } = await sb.from('academias').update({ status: 'published' }).eq('id', data.id);
      if (pubError) throw pubError;
    }
    await loadEverything();
    state.registerStatus = "done";
  } catch (e) {
    state.registerError = e.message || "Não consegui localizar esse endereço.";
    state.registerStatus = "error";
  }
  render();
}

async function init() {
  app_showLoading();
  const { data: { session } } = await sb.auth.getSession();
  isAdmin = !!session;
  if (!isAdmin) trackClick(null, "acesso_site");
  await loadEverything();

  const q = new URLSearchParams(location.search);
  const sharedCourtId = q.get("court");
  const shared = sharedCourtId ? state.allCourts.find(c => c.id === sharedCourtId) : null;
  if (shared) {
    state.selected = decorate(shared);
    state.page = "court";
    state.backTo = "home";
    pushRecent(shared.id);
    if (!isAdmin) trackClick(shared.id, "visualizacao");
  } else {
    state.page = q.has("busca") ? "search" : "home";
  }

  // Remove da comparação academias que não existem mais (excluídas ou pausadas)
  if (state.compareList.length) {
    const validos = state.compareList.filter(id => state.allCourts.some(c => c.id === id));
    if (validos.length !== state.compareList.length) setCompareList(validos);
  }

  state.loaded = true;
  syncUrl(false);
  render();
}

function app_showLoading() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--muted)">Carregando...</div>`;
}

init();
</script>
