<style>
  :root {
    --bg: #F7F4EC;
    --bg-alt: #EFEADD;
    --card: #FFFFFF;
    --border: #E1DACB;
    --green: #1F4D3D;
    --green-light: #2E6B54;

    --red: #A8462C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Playfair Display', serif; font-weight: 500; line-height: 1.45;
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
  }
  input, select, textarea, button { font-family: inherit; }
  .display { font-family: 'Playfair Display', serif; }
  .container { max-width: 480px; margin: 0 auto; min-height: 100vh; }

  .admin-banner { background: var(--green); color: #fff; font-weight: 600; font-size: 12px; text-align: center; padding: 6px; letter-spacing: 0.07em; text-transform: uppercase; }

  .header { padding: 32px 20px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  .title { font-size: 34px; font-weight: 700; line-height: 1.05; margin: 0; color: var(--green); }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .logo-mark { flex-shrink: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  .btn-primary { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .locate-hint { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; margin-top: 8px; }

  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 10px; }
  .status-error { color: var(--red); }
  .status-info { color: var(--muted); }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { font-family: 'Playfair Display', serif; font-weight: 600; border-radius: 999px; padding: 6px 13px; font-size: 13px; border: 1px solid var(--border); background: var(--card); color: var(--green); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .chip.small { padding: 5px 11px; font-size: 12px; }
  .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .results { padding: 16px 20px 96px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0; }
  .footer { text-align: center; padding: 24px 20px 8px; }
  .footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .footer span { color: var(--muted); font-size: 12px; }
  .footer-copy { color: var(--muted-dark); font-size: 12px; margin-top: 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; box-shadow: 0 1px 3px rgba(33,31,26,0.05); }
  .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.35); border: none; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .compare-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.45); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .compare-btn.active { background: var(--green); border-color: var(--green); }
  .sheet-compare-btn { position: absolute; top: 16px; right: 100px; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .sheet-compare-btn.active { background: var(--green); border-color: var(--green); }
  .compare-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--green); color: #fff; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 60; box-shadow: 0 -4px 18px rgba(0,0,0,0.2); }
  .compare-bar-info { font-size: 13px; line-height: 1.3; }

  .compare-bar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .compare-bar button { border: none; border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 800; cursor: pointer; }
  .compare-bar .btn-go { background: var(--gold); color: var(--green-dark, #14332a); }
  .compare-bar .btn-go:disabled { opacity: 0.45; cursor: not-allowed; }
  .compare-bar .btn-clear { background: transparent; color: #fff; text-decoration: underline; padding: 10px 4px; }
  .cmp-table { display: flex; overflow-x: auto; gap: 12px; padding: 4px 0 8px; }
  .cmp-col { flex: 0 0 240px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .cmp-photo { height: 120px; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }

  .cmp-sub { font-size: 12px; color: var(--muted); padding: 0 12px 10px; }
  .cmp-row { border-top: 1px solid var(--border); padding: 8px 12px; }
  .cmp-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .cmp-val { font-size: 13px; color: var(--text); margin-top: 2px; }
  .cmp-remove { width: 100%; background: none; border: none; border-top: 1px solid var(--border); padding: 9px; font-size: 12px; color: var(--red); cursor: pointer; }
  .decide-box { margin-top: 20px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .decide-title { font-size: 17px; font-weight: 800; color: var(--text); margin: 0; }
  .decide-sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .decide-result { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }

  .decide-why { font-size: 13px; color: var(--text); margin: 6px 0 0; line-height: 1.45; }
  .decide-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }

  .decide-name { font-size: 14px; font-weight: 700; margin: 0; }

  .decide-score { font-size: 15px; font-weight: 800; color: var(--green); flex-shrink: 0; }
  .decide-notes-echo { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 8px; padding: 8px 10px; margin: 4px 0 0; white-space: pre-wrap; }
  .note-hit { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; margin-top: 6px; background: var(--card); border-left: 3px solid var(--border); }
  .note-hit strong { font-size: 13px; text-transform: capitalize; flex-shrink: 0; }
  .note-hit span { font-size: 12px; color: var(--muted); }
  .note-hit-some { border-left-color: var(--green); }
  .note-hit-all { border-left-color: var(--gold); }
  .note-hit-none { border-left-color: var(--red); }
  .confirmar-box { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
  .confirmar-txt { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 10px; }
  .confirmar-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .decidida-box { margin-top: 16px; background: var(--green); border-radius: 14px; padding: 16px; }
  .decidida-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin: 0; }
  .decidida-name { font-size: 22px; font-weight: 800; color: #fff; margin: 6px 0 0; }
  .decidida-end { font-size: 13px; color: rgba(255,255,255,0.75); margin: 4px 0 0; }
  .decidida-box .field-label { color: rgba(255,255,255,0.8); }
  .decidida-box .cta-btn { width: 100%; }
  .nav-link-dark { background: rgba(255,255,255,0.12) !important; border-color: rgba(255,255,255,0.35) !important; color: #fff !important; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stat-card { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--green); margin: 0; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.07em; }
  .stats-ord-lbl { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
  .stat-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .stat-taxa { font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 999px; flex-shrink: 0; }
  .stat-taxa.boa { background: var(--green); color: #fff; }
  .stat-taxa.media { background: var(--gold); color: #1F4D3D; }
  .stat-taxa.zero { background: var(--bg-alt); color: var(--muted); }
  .stat-copy { margin-top: 8px; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--green); font-weight: 700; cursor: pointer; }
  .decidida-voltar { width: 100%; background: none; border: none; color: rgba(255,255,255,0.75); text-decoration: underline; font-size: 13px; padding: 12px 0 2px; cursor: pointer; }
  .card-photo-caption { font-size: 12px; color: var(--muted-dark); }
  .card-badge { position: absolute; top: 10px; left: 10px; background: var(--gold); color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 4px 10px; border-radius: 999px; }
  .card-body { padding: 16px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-name { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; line-height: 1.15; color: var(--text); margin: 0; }
  .card-meta { color: var(--muted); font-size: 12px; margin: 5px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .stars { color: var(--gold); font-size: 14px; letter-spacing: 1px; }
  .rating-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .distance-pill { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 4px; color: var(--green); }

  .price-known { color: var(--text); font-weight: 600; }
  .price-unknown { color: var(--muted-dark); font-size: 12px; }

  .fab-col { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .fab { width: 54px; height: 54px; border-radius: 999px; background: var(--green); color: #fff; border: none; font-size: 26px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(31,77,61,0.35); display: flex; align-items: center; justify-content: center; }
  .fab-admin { width: 46px; height: 46px; font-size: 18px; background: var(--card); color: var(--green); border: 1px solid var(--green); position: relative; }
  .fab-badge { position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

  .overlay { position: fixed; inset: 0; background: rgba(33,31,26,0.55); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .sheet { position: relative; width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: 18px 18px 0 0; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .sheet { border-radius: 18px; } }
  .lightbox-overlay { position: fixed; inset: 0; background: rgba(10,10,8,0.96); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .lightbox-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; }
  .lightbox-item { flex: 0 0 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
  .lightbox-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; z-index: 2; }
  .lightbox-counter { position: absolute; top: 20px; left: 16px; color: #fff; font-size: 13px; font-weight: 600; z-index: 2; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 999px; width: 40px; height: 40px; font-size: 22px; cursor: pointer; z-index: 2; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .photo-thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb-remove { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 999px; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }
  .sheet-content { padding: 20px; position: relative; }
  .sheet-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.85); border: none; color: var(--text); font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .sheet-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; line-height: 1.1; margin: 4px 0 0; }
  .sheet-meta { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .price-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }
  .price-box p:first-child { color: var(--muted); font-size: 12px; margin: 0; }
  .price-box p:last-child { color: var(--text); font-weight: 600; margin: 2px 0 0; }
  .cta-col { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .cta-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 11px; font-weight: 600; text-decoration: none; font-size: 14px; border: none; cursor: pointer; }
  .cta-primary { background: var(--green); color: #fff; }
  .cta-secondary { border: 1px solid var(--border); color: var(--text); background: transparent; }
  .cta-danger { border: 1px solid var(--red); color: var(--red); background: transparent; }
  .footnote { color: var(--muted-dark); font-size: 12px; margin-top: 16px; }

  .rate-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 20px; text-align: center; }
  .rate-box p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .star-picker { font-size: 30px; letter-spacing: 4px; cursor: pointer; }
  .star-picker span { color: var(--muted-dark); }
  .star-picker span.filled { color: var(--gold); }
  .rate-thanks { color: var(--green); font-size: 13px; font-weight: 600; margin-top: 8px; }

  .form-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: 'Playfair Display', serif; font-size: 14px; outline: none; margin-top: 10px; }
  .form-field::placeholder { color: var(--muted-dark); }
  .field-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 14px; margin-bottom: 6px; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .quadra-count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .quadra-count-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .quadra-count-item span { font-size: 12px; color: var(--muted); }
  .quadra-count-item input { padding: 6px 10px; margin-top: 6px !important; }
  .price-input-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .price-input-row span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .price-input-row .price-input-label { min-width: 52px; color: var(--text); font-weight: 600; }

  .form-error { color: var(--red); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 10px; }

  .consent-row input { margin-top: 2px; flex-shrink: 0; }
  .inline-link { background: none; border: none; padding: 0; color: var(--green); text-decoration: underline; font-size: 12px; cursor: pointer; font-family: inherit; }

  .admin-pago-box button { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .delete-review-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; }
  /* ======================================================================
     Interface de busca estilo Trivago — listagem, filtros e ficha completa
     ====================================================================== */

  :root { --green-dark: #14332A; --shadow: 0 1px 3px rgba(33,31,26,0.06); --shadow-lg: 0 14px 34px rgba(33,31,26,0.16); }

  @media (min-width: 720px) { .container { max-width: 760px; } }
  @media (min-width: 1024px) { .container { max-width: 1180px; } }

  /* ---- toolbar (contagem + ordenação + filtros) ---- */
  .toolbar { flex-wrap: wrap; row-gap: 10px; }
  .toolbar-left { display: flex; flex-direction: column; min-width: 0; }
  .toolbar-count { font-size: 14px; font-weight: 700; margin: 0; color: var(--text); }
  .toolbar-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .tbtn.on { border-color: var(--green); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .tbtn-badge { background: var(--green); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px; }
  .tbtn .caret { font-size: 11px; opacity: 0.7; }

  .sortwrap { position: relative; }
  .sort-backdrop { position: fixed; inset: 0; z-index: 35; }
  .sort-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); width: 262px; overflow: hidden; }
  .sort-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 13px; cursor: pointer; font-size: 13px; font-family: 'Playfair Display', serif; color: var(--text); font-weight: 600; }
  .sort-opt + .sort-opt { border-top: 1px solid var(--bg-alt); }
  .sort-opt:hover { background: var(--bg-alt); }
  .sort-opt .radio { width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
  .sort-opt.on .radio { border: 5px solid var(--green); }
  .sort-opt small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; line-height: 1.35; }

  /* ---- chips de filtros ativos ---- */
  .active-chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px 0; }
  .achip { display: inline-flex; align-items: center; gap: 6px; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; font-family: 'Playfair Display', serif; cursor: pointer; }
  .achip .x { font-size: 13px; line-height: 1; opacity: 0.8; }
  .achip-clear { background: transparent; color: var(--green); border: 1px dashed var(--muted-dark); }

  /* ---- gaveta de filtros (mobile/tablet) ---- */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(33,31,26,0.55); z-index: 60; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(390px, 92vw); background: var(--card); display: flex; flex-direction: column; }
  @media (max-width: 560px) { .drawer { top: auto; bottom: 0; height: 90vh; width: 100%; border-radius: 18px 18px 0 0; } }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .drawer-head strong { font-size: 17px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 2px 18px 18px; }
  .drawer-foot { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .drawer-foot .cta-btn { flex: 1; margin: 0; }
  .drawer-close { background: none; border: none; font-size: 18px; color: var(--text); cursor: pointer; padding: 4px 6px; }

  /* ---- grupos de filtro ---- */
  .fgroup { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .fgroup:last-child { border-bottom: none; }
  .fgroup-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; color: var(--text); background: none; border: none; width: 100%; text-align: left; font-family: 'Playfair Display', serif; }
  .opt:disabled { opacity: 0.4; cursor: default; }
  .opt-check { width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; box-sizing: border-box; }
  .opt.on .opt-check { background: var(--green); border-color: var(--green); }
  .opt-radio { width: 17px; height: 17px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; box-sizing: border-box; }
  .opt.on .opt-radio { border: 5px solid var(--green); }
  .opt-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .opt-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .range { width: 100%; accent-color: var(--green); margin: 8px 0 2px; }
  .range-val { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .range-now { font-size: 15px; font-weight: 700; color: var(--green); }
  .fgroup-note { font-size: 12px; color: var(--muted-dark); margin: 6px 0 0; line-height: 1.4; }

  /* ---- card horizontal estilo Trivago ---- */
  .card { display: block; transition: box-shadow 0.15s, border-color 0.15s; }
  .card:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .card-media { position: relative; height: 172px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .media-count { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .media-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.9); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text); padding: 0; line-height: 1; }
  .media-prev { left: 8px; } .media-next { right: 8px; }
  .card-rail { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rail-price-col { display: flex; flex-direction: column; }
  .rail-from { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  .rail-price { font-size: 20px; font-weight: 800; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .rail-unit { font-size: 12px; color: var(--muted); }
  .rail-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .card-quote { font-size: 12px; color: var(--muted); font-style: italic; margin: 8px 0 0; border-left: 2px solid var(--gold); padding-left: 8px; line-height: 1.4; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  @media (min-width: 720px) {
    .card { display: grid; grid-template-columns: 250px minmax(0, 1fr) 196px; align-items: stretch; }
    .card-media { height: 100%; min-height: 208px; }
    .card-rail { border-top: none; border-left: 1px solid var(--border); flex-direction: column; align-items: stretch; justify-content: space-between; padding: 14px; text-align: right; }
    .card-rail .rail-btn { width: 100%; }
    .card-rail .score-box { justify-content: flex-end; }
  }

  /* ---- selo de nota (estilo Trivago) ---- */
  .score-box { display: inline-flex; align-items: center; gap: 8px; }
  .score-num { background: var(--green); color: #fff; font-weight: 800; font-size: 15px; border-radius: 8px 8px 8px 2px; padding: 5px 9px; line-height: 1; flex-shrink: 0; }
  .score-num.empty { background: var(--bg-alt); color: var(--muted); font-weight: 700; }
  .score-word { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.15; }
  .score-count { font-size: 12px; color: var(--muted); display: block; font-weight: 500; }

  /* ---- ficha estilo hotel ---- */
  .sheet-wide { max-width: 920px; }
  @media (min-width: 640px) { .sheet-wide { max-height: 92vh; } }
  .hero-act { background: rgba(255,255,255,0.93); border: none; border-radius: 999px; height: 34px; min-width: 34px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 12px; font-weight: 700; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.22); }
  .hero-act.on { background: var(--green); color: #fff; }
  .hero-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 240px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }
  .sheet-wide { display: flex; flex-direction: column; overflow: hidden; }
  .sheet-scroll { flex: 1; overflow-y: auto; min-height: 0; }


  .sec { margin-top: 24px; }
  .sec-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 10px; color: var(--text); }

  .rating-panel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .rp-score { text-align: center; flex-shrink: 0; }
  .rp-num { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--green); line-height: 1; }
  .rp-word { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .rp-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .bar-row .bar-lbl { width: 26px; flex-shrink: 0; color: var(--gold); font-weight: 600; }
  .bar-track { flex: 1; height: 7px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
  .bar-row .bar-n { width: 18px; text-align: right; flex-shrink: 0; }

  .rev-avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rev-name { font-size: 13px; font-weight: 700; margin: 0; }
  .rev-date { font-size: 12px; color: var(--muted-dark); }
  .rev-text { font-size: 13px; margin: 5px 0 0; line-height: 1.45; color: var(--text); }
  .rev-more { width: 100%; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--green); font-family: 'Playfair Display', serif; cursor: pointer; }


  /* ---- barra de busca no formato do Trivago ---- */
  .searchcard { border: 1px solid var(--border); border-radius: 14px; background: var(--card); overflow: hidden; margin-top: 18px; box-shadow: var(--shadow); }
  .sc-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .sc-icon { flex-shrink: 0; display: flex; }
  .sc-field { flex: 1; min-width: 0; }
  .sc-label { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .sc-input { width: 100%; border: none; background: transparent; outline: none; font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--text); padding: 3px 0 1px; }
  .sc-input::placeholder { color: var(--muted-dark); font-weight: 500; }
  .sc-select { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .sc-caret { flex-shrink: 0; color: var(--muted); font-size: 12px; }
  .sc-locate { flex-shrink: 0; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sc-foot { padding: 12px 14px; }
  .sc-go { width: 100%; border: none; border-radius: 10px; background: var(--green); color: #fff; font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .sc-go:disabled { opacity: 0.65; cursor: default; }

  /* ---- mapa ---- */
  .mapwrap { position: relative; z-index: 0; height: calc(100vh - 98px); height: calc(100dvh - 98px); min-height: 380px; border-top: 1px solid var(--border); background: var(--bg-alt); }
  .map { width: 100%; height: 100%; }
  .leaflet-container { font-family: 'Playfair Display', serif; background: var(--bg-alt); }
  .pin { display: inline-block; transform: translate(-50%, -100%); background: var(--green); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .pin.on { background: var(--gold); color: var(--green-dark); }
  .pin-me { display: block; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 999px; background: #fff; border: 4px solid var(--green); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .map-card-holder { position: absolute; left: 12px; right: 12px; bottom: 90px; z-index: 900; }
  .map-card-holder.up { bottom: 152px; }
  @media (min-width: 720px) { .map-card-holder { max-width: 440px; right: auto; } }
  .map-card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 12px; padding: 10px 32px 10px 10px; align-items: center; cursor: pointer; text-align: left; }
  .map-card-photo { width: 84px; height: 72px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }
  .map-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .map-card-name { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; margin: 0; line-height: 1.15; }
  .map-card-meta { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .map-card-price { font-size: 17px; font-weight: 800; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .map-close { position: absolute; top: 6px; right: 8px; background: none; border: none; font-size: 14px; color: var(--muted); cursor: pointer; padding: 2px 4px; line-height: 1; }
  .map-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; color: var(--muted); font-size: 14px; background: var(--bg-alt); z-index: 900; }
  .map-fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 45; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 12px 20px; font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(31,77,61,0.35); display: inline-flex; align-items: center; gap: 8px; }
  .map-fab { bottom: 26px; }
  .map-fab.up { bottom: 88px; }

  /* ======================================================================
     Três telas: página inicial, busca e página da academia
     ====================================================================== */

  :root { --green-soft: #EDF4F0; --green-line: #C6DBD1; }

  /* ---- card de resultado (formato do Trivago) ---- */
  .rcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow 0.15s, border-color 0.15s; }
  .rcard:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .rcard-top { display: flex; gap: 12px; padding: 12px; }
  .rcard-photo { position: relative; width: 132px; height: 132px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }
  @media (min-width: 720px) { .rcard-photo { width: 220px; height: 190px; } }
  .rcard-strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rcard-strip::-webkit-scrollbar { display: none; }
  .rcard-strip img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; display: block; }
  .rcard-nophoto { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 4px; }
  .rcard-dots { position: absolute; left: 0; right: 0; bottom: 7px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .rcard-dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.55); box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .rcard-dots i.on { background: #fff; }
  .rcard-tag { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; }
  .rcard-info { flex: 1; min-width: 0; }
  .rcard-head { display: flex; align-items: flex-start; gap: 8px; }
  .rcard-name { font-size: 18px; font-weight: 700; line-height: 1.18; margin: 0; flex: 1; min-width: 0; }
  @media (min-width: 720px) { .rcard-name { font-size: 21px; } }
  .rcard-acts { display: flex; gap: 2px; flex-shrink: 0; }
  .rcard-acts button { background: none; border: none; padding: 3px; cursor: pointer; display: flex; line-height: 0; }
  .rcard-stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; margin-top: 3px; }
  .rcard-score { display: flex; align-items: center; gap: 7px; margin-top: 5px; flex-wrap: wrap; }
  .sbadge { background: var(--green); color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 14px; font-weight: 700; line-height: 1.1; }
  .sbadge.none { background: var(--bg-alt); color: var(--muted); }
  .sword { font-size: 14px; font-weight: 700; }
  .scount { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .rcard-line { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--muted); margin: 5px 0 0; line-height: 1.35; }
  .rcard-line span { min-width: 0; }
  .rcard-line .ico { flex-shrink: 0; margin-top: 1px; }

  .offer { margin: 0 12px 12px; background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 10px; padding: 10px 12px; }
  .offer-head { font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .offer-head strong { font-weight: 700; }
  .offer-check { color: var(--green); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .offer-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 6px; }
  .offer-price { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.05; white-space: nowrap; }
  .offer-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .offer-btn { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
  .offer-note { font-size: 12px; color: var(--muted); margin: 7px 0 0; }
  .offer-more { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .offer-more strong { color: var(--text); font-weight: 700; margin-right: 5px; }

  /* ---- página inicial ---- */
  .home-head { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .home-brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; cursor: pointer; }

  .home-hero p { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  .home-sec { padding: 6px 20px 22px; }
  .home-sec h3 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }
  @media (min-width: 720px) { .home-sec h3 { font-size: 25px; } }
  .home-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .home-strip::-webkit-scrollbar { display: none; }
  .mini { flex: 0 0 210px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-align: left; cursor: pointer; padding: 0; box-shadow: var(--shadow); }
  .mini-photo { height: 118px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); display: flex; align-items: center; justify-content: center; }
  .mini-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini-body { padding: 10px 12px 12px; }
  .mini-name { font-size: 15px; font-weight: 700; margin: 0; line-height: 1.2; }
  .mini-score { font-size: 13px; margin: 5px 0 0; }
  .mini-score strong { color: var(--green); font-weight: 700; }
  .mini-score span { color: var(--muted); }
  .mini-stars { font-size: 12px; color: var(--gold); margin: 3px 0 0; letter-spacing: 1px; }
  .mini-stars em { color: var(--muted); font-style: normal; letter-spacing: 0; margin-left: 4px; }
  .city-tabs { display: flex; gap: 18px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 14px; scrollbar-width: none; }
  .city-tabs::-webkit-scrollbar { display: none; }
  .city-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 0 9px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }

  .city-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  /* barra de contato que acompanha a rolagem, como a de reservar do hotel */
  .court-cta { position: sticky; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--border); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; box-shadow: 0 -4px 16px rgba(33,31,26,0.08); }

  @keyframes demoCena2 { 0%, 33% { opacity: 0 } 36%, 62% { opacity: 1 } 66%, 100% { opacity: 0 } }

    .ht-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 30px; align-items: start; padding: 0 20px; }

  .ht-head { padding: 18px 20px 0; }

  .ht-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .ht-sections { padding: 0 20px 20px; }

  /* destaques do topo, no lugar das "informações populares" dos hotéis */
  .ht-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

  .ht-amen { display: grid; grid-template-columns: 1fr; gap: 9px; margin-top: 8px; }

  .ht-perto { display: grid; gap: 8px; }

<script>

async function loadEverything() {
  const { data: published } = await sb.from('academias').select('*').eq('status', 'published').order('created_at');
  state.allCourts = (published || []).map(mapRow);

  if (isAdmin) {
    const { data: pend } = await sb.from('academias').select('*').eq('status', 'pending').order('created_at');
    state.pending = (pend || []).map(mapRow);

    const { data: clicks } = await sb.from('cliques').select('*').order('created_at', { ascending: false }).limit(20000);
    state.clicksRaw = clicks || [];
    const clicksCache = {};
    (clicks || []).forEach(c => {
      if (!clicksCache[c.academia_id]) clicksCache[c.academia_id] = { whatsapp: 0, site: 0, instagram: 0 };
      clicksCache[c.academia_id][c.tipo] = (clicksCache[c.academia_id][c.tipo] || 0) + 1;
    });
    state.clicksCache = clicksCache;
  } else {
    state.pending = [];
  }

  const { data: reviews } = await sb.from('avaliacoes').select('*').order('created_at', { ascending: false });
  const reviewsCache = {};
  (reviews || []).forEach(r => {
    if (!reviewsCache[r.academia_id]) reviewsCache[r.academia_id] = [];
    reviewsCache[r.academia_id].push({ id: r.id, stars: r.stars, comment: r.comment, nome_autor: r.nome_autor, contato_autor: r.contato_autor, ts: r.created_at });
  });
  state.reviewsCache = reviewsCache;
}

function getPlano(courtId) {
  const c = state.allCourts.find(x => x.id === courtId) || state.pending.find(x => x.id === courtId);
  return (c && c.plano) || "basico";
}

// O "pago" continua existindo e anda junto com o plano, para as telas e os
// relatórios antigos não quebrarem: básico é grátis, os outros dois são pagos.
async function setPlano(courtId, plano) {
  const { error } = await sb.from('academias')
    .update({ plano, pago: plano !== "basico" })
    .eq('id', courtId);
  if (error) {
    alert(
      "Não consegui salvar o plano.\n\n" +
      "Se a tabela ainda não tem a coluna, rode isto no SQL Editor do Supabase:\n\n" +
      "alter table academias add column if not exists plano text not null default 'basico';\n\n" +
      "Erro: " + error.message
    );
    return false;
  }
  await loadEverything();
  return true;
}

const COMPARE_MAX = 5;
const COMPARE_MIN = 2;
const COMPARE_KEY = "guiatennis_compare_v1";

function loadCompare() {
  try {
    const v = JSON.parse(localStorage.getItem(COMPARE_KEY) || "[]");
    return Array.isArray(v) ? v.slice(0, COMPARE_MAX) : [];
  } catch { return []; }
}
function setCompareList(arr) {
  state.compareList = arr;
  try { localStorage.setItem(COMPARE_KEY, JSON.stringify(arr)); } catch {}
}

function isComparing(courtId) {
  return state.compareList.includes(courtId);
}
function toggleCompare(courtId) {
  if (isComparing(courtId)) {
    setCompareList(state.compareList.filter(id => id !== courtId));
    return { ok: true };
  }
  if (state.compareList.length >= COMPARE_MAX) {
    return { ok: false, msg: `Você pode comparar até ${COMPARE_MAX} academias por vez.` };
  }
  setCompareList([...state.compareList, courtId]);
  return { ok: true };
}
function compareCourts() {
  return state.compareList
    .map(id => state.allCourts.find(c => c.id === id))
    .filter(Boolean)
    .map(c => {
      const r = getAppRating(c.id);
      return {
        ...c,
        appAvg: r.avg,
        appCount: r.count,
        distanceKm: state.origin ? haversineKm(state.origin.lat, state.origin.lng, c.lat, c.lng) : undefined,
      };
    });
}

function listaPt(arr) {
  const items = arr.filter(Boolean);
  if (!items.length) return "—";
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(", ") + " e " + items[items.length - 1];
}

function isFavorite(courtId) {
  return loadFavorites().includes(courtId);
}
function toggleFavorite(courtId) {
  const favs = loadFavorites();
  const next = favs.includes(courtId) ? favs.filter(id => id !== courtId) : [...favs, courtId];
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(next));
}

// ---------- geocoding (real network calls) ----------

async function fetchViaCep(rawCep) {
  const cep = rawCep.replace(/\D/g, "");
  if (cep.length !== 8) throw new Error("CEP precisa ter 8 dígitos.");
  const viaCepRes = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
  if (!viaCepRes.ok) throw new Error("Não consegui consultar esse CEP.");
  const viaCepData = await viaCepRes.json();
  if (viaCepData.erro) throw new Error("CEP não encontrado.");
  return viaCepData;
}

function stripAccents(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function geocodeCep(rawCep) {
  const cep = rawCep.replace(/\D/g, "");
  if (cep.length !== 8) throw new Error("CEP precisa ter 8 dígitos.");

  // Fonte principal: devolve a coordenada já ligada diretamente ao CEP (base IBGE),
  // mais confiável que tentar geocodificar o endereço por texto.
  try {
    const res = await fetch(`https://cep.awesomeapi.com.br/json/${cep}`);
    if (res.ok) {
      const data = await res.json();
      if (data && data.lat && data.lng) {
        return {
          lat: parseFloat(data.lat),
          lng: parseFloat(data.lng),
          bairro: data.neighborhood || data.city,
          cidade: data.city,
          uf: data.state,
          approximate: false,
        };
      }
    }
  } catch (e) { /* sem sorte, tenta o método reserva abaixo */ }

  // Reserva: ViaCEP (endereço) + OpenStreetMap (texto → coordenada), com degradação progressiva.
  const viaCepData = await fetchViaCep(rawCep);
  const logradouro = viaCepData.logradouro || "";
  const bairro = viaCepData.bairro || "";
  const cidade = viaCepData.localidade;
  const uf = viaCepData.uf;

  const attempts = [
    `${logradouro}, ${bairro}, ${cidade}, ${uf}, Brasil`,
    `${stripAccents(logradouro)}, ${stripAccents(bairro)}, ${stripAccents(cidade)}, ${uf}, Brasil`,
    `${bairro}, ${cidade}, ${uf}, Brasil`,
    `${stripAccents(bairro)}, ${stripAccents(cidade)}, Brasil`,
    `${bairro}, ${cidade}, Brasil`,
    `${cidade}, ${uf}, Brasil`,
  ];

  let geo = null;
  let approximate = false;
  for (let i = 0; i < attempts.length; i++) {
    if (!attempts[i].replace(/[,\s]/g, "")) continue;
    try {
      geo = await geocodeAddress(attempts[i]);
      approximate = i >= 2;
      break;
    } catch (e) { /* tenta a próxima tentativa, mais genérica */ }
  }
  if (!geo) throw new Error("Não consegui localizar esse CEP no mapa.");
  return { ...geo, bairro: bairro || cidade, cidade, uf, approximate };
}

async function geocodeAddress(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("Não consegui localizar esse endereço no mapa.");
  const data = await res.json();
  if (!data.length) throw new Error("Endereço não encontrado. Tente incluir bairro e cidade.");
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
}

async function geocodeFormAddress(f) {
  // Tenta primeiro pelo CEP (mais confiável), se a pessoa preencheu um
  const cepDigits = (f.cep || "").replace(/\D/g, "");
  if (cepDigits.length === 8) {
    try {
      const res = await fetch(`https://cep.awesomeapi.com.br/json/${cepDigits}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.lat && data.lng) return { lat: parseFloat(data.lat), lng: parseFloat(data.lng), approximate: false };
      }
    } catch (e) { /* segue pras tentativas por texto */ }
  }

  const attempts = [
    `${f.address}, ${f.numero}, ${f.bairro}, ${f.cidade}, Brasil`,
    `${stripAccents(f.address)}, ${f.numero}, ${stripAccents(f.bairro)}, ${stripAccents(f.cidade)}, Brasil`,
    `${f.address}, ${f.bairro}, ${f.cidade}, Brasil`,
    `${f.bairro}, ${f.cidade}, Brasil`,
    `${stripAccents(f.bairro)}, ${stripAccents(f.cidade)}, Brasil`,
    `${f.cidade}, Brasil`,
  ];
  for (let i = 0; i < attempts.length; i++) {
    if (!attempts[i].replace(/[,\s]/g, "")) continue;
    try {
      const geo = await geocodeAddress(attempts[i]);
      return { ...geo, approximate: i >= 2 };
    } catch (e) { /* tenta a próxima, mais genérica */ }
  }
  throw new Error("Não consegui localizar esse endereço. Confira o CEP, bairro e cidade.");
}

async function reverseGeocode(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("Não consegui identificar seu endereço.");
  const data = await res.json();
  const a = data.address || {};
  const bairro = a.suburb || a.neighbourhood || a.city_district || a.village || "sua região";
  const cidade = a.city || a.town || a.municipality || "";
  return { lat, lng, bairro, cidade };
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ---------- in-app ratings (compartilhadas via Supabase, lidas de um cache em memória) ----------

function getReviews(courtId) {
  return state.reviewsCache[courtId] || [];
}
function getAppRating(courtId) {
  const reviews = getReviews(courtId);
  if (!reviews.length) return { avg: 0, count: 0 };
  const sum = reviews.reduce((s, r) => s + r.stars, 0);
  return { avg: sum / reviews.length, count: reviews.length };
}
async function submitRating(courtId, stars, comment) {
  const trimmed = (comment || "").trim();
  const v = loadVisitor() || {};
  const { data } = await sb.from('avaliacoes').insert({ academia_id: courtId, stars, comment: trimmed, nome_autor: v.nome, contato_autor: v.contato }).select().single();
  if (!state.reviewsCache[courtId]) state.reviewsCache[courtId] = [];
  state.reviewsCache[courtId].unshift({ id: data && data.id, stars, comment: trimmed, nome_autor: v.nome, contato_autor: v.contato, ts: new Date().toISOString() });
}
function starsHtml(avg) {
  const rounded = Math.round(avg);
  let out = "";
  for (let i = 1; i <= 5; i++) out += i <= rounded ? "★" : "☆";
  return out;
}

// ---------- derived results ----------

function parsePriceValue(court) {
  const values = [court.priceAula, court.priceLocacao, court.priceRange]
    .filter(Boolean)
    .map(p => { const m = p.match(/\d+/); return m ? parseInt(m[0], 10) : null; })
    .filter(v => v !== null);
  return values.length ? Math.min(...values) : Infinity;
}

// Faixa de preço disponível no acervo — alimenta o slider do painel de filtros.
function priceBounds() {
  const vals = state.allCourts.map(parsePriceValue).filter(v => isFinite(v));
  if (vals.length < 2) return null;
  const min = Math.floor(Math.min(...vals) / 5) * 5;
  const max = Math.ceil(Math.max(...vals) / 5) * 5;
  if (min >= max) return null;
  return { min, max };
}

function courtDistance(c) {
  return state.origin ? haversineKm(state.origin.lat, state.origin.lng, c.lat, c.lng) : undefined;
}

// `skip` desliga um grupo de filtro — é assim que contamos quantas academias
// cada opção traria de volta, igual ao contador que o Trivago mostra ao lado
// de cada caixinha.
function applyFilters(list, skip) {
  skip = skip || "";
  if (skip !== "piso" && state.pisoFilters.length) list = list.filter(c => state.pisoFilters.some(p => c.pisos?.includes(p)));
  if (skip !== "cobertura" && state.coberturaFilters.length) list = list.filter(c => state.coberturaFilters.some(cv => c.cobertura?.includes(cv)));
  if (skip !== "amenity" && state.amenityFilters.length) list = list.filter(c => state.amenityFilters.every(a => matchesAmenityFilter(c, a)));
  if (skip !== "modalidade" && state.modalidadeFilters.length) list = list.filter(c => state.modalidadeFilters.some(m => c.modalidades?.includes(m)));
  if (skip !== "rating" && state.minRating > 0) list = list.filter(c => { const r = getAppRating(c.id); return r.count > 0 && r.avg >= state.minRating; });
  if (skip !== "price" && state.priceMax !== null) list = list.filter(c => parsePriceValue(c) <= state.priceMax);
  if (skip !== "distance" && state.maxDistance !== null && state.origin) list = list.filter(c => courtDistance(c) <= state.maxDistance);
  if (skip !== "outros") {
    if (state.favoritesOnly) list = list.filter(c => isFavorite(c.id));
    if (state.compareOnly) list = list.filter(c => isComparing(c.id));
  }
  return list;
}

function decorate(c) {
  const r = getAppRating(c.id);
  return { ...c, appAvg: r.avg, appCount: r.count, distanceKm: courtDistance(c) };
}

function activeFilterCount() {
  return state.pisoFilters.length + state.coberturaFilters.length
    + state.amenityFilters.length + state.modalidadeFilters.length
    + (state.minRating > 0 ? 1 : 0) + (state.priceMax !== null ? 1 : 0)
    + (state.maxDistance !== null ? 1 : 0)
    + (state.favoritesOnly ? 1 : 0) + (state.compareOnly ? 1 : 0);
}

function clearAllFilters() {
  state.pisoFilters = [];
  state.coberturaFilters = [];
  state.amenityFilters = [];
  state.modalidadeFilters = [];
  state.minRating = 0;
  state.priceMax = null;
  state.maxDistance = null;
  state.favoritesOnly = false;
  state.compareOnly = false;
}

// Nota "Recomendados": mistura distância, avaliação, preço e estrutura.
// Quem não tem o dado fica no meio da tabela em vez de ser punido.
function recoScore(c, ctx) {
  const dist = typeof c.distanceKm === "number" ? norm(ctx.dists, c.distanceKm, true) : 50;
  const rate = c.appCount ? norm(ctx.rates, c.appAvg, false) : 42;
  const pv = parsePriceValue(c);
  const price = isFinite(pv) ? norm(ctx.prices, pv, true) : 45;
  const estrutura = Math.min(100, totalQuadras(c) * 9 + (c.amenities || []).length * 6);
  return dist * 0.34 + rate * 0.30 + price * 0.19 + estrutura * 0.17;
}

function effectiveSort() {
  return (state.sortBy === "distance" && !state.origin) ? "recomendados" : state.sortBy;
}

function getResults() {
  let list = applyFilters(state.allCourts).map(decorate);
  const sort = effectiveSort();

  if (sort === "distance") {
    list = [...list].sort((a, b) => a.distanceKm - b.distanceKm);
  } else if (sort === "price") {
    list = [...list].sort((a, b) => parsePriceValue(a) - parsePriceValue(b));
  } else if (sort === "reviews") {
    list = [...list].sort((a, b) => (b.appCount - a.appCount) || (b.appAvg - a.appAvg));
  } else if (sort === "courts") {
    list = [...list].sort((a, b) => totalQuadras(b) - totalQuadras(a));
  } else if (sort === "rating") {
    list = [...list].sort((a, b) => {
      const aScore = a.appCount ? a.appAvg : -1;
      const bScore = b.appCount ? b.appAvg : -1;
      return bScore - aScore;
    });
  } else {
    const ctx = {
      dists: list.map(c => c.distanceKm),
      rates: list.map(c => c.appCount ? c.appAvg : null),
      prices: list.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; }),
    };
    list = list
      .map(c => ({ c, s: recoScore(c, ctx) }))
      .sort((a, b) => b.s - a.s)
      .map(x => x.c);
  }
  return list;
}

// Mapinha da seção "Explore a região", como o mapa das páginas de hotel.
function mountMiniMap(c) {
  const el = document.getElementById("court-mini-map");
  if (!el) {
    if (__miniMap) { __miniMap.remove(); __miniMap = null; }
    return;
  }
  const temCoord = typeof c.lat === "number" && typeof c.lng === "number";
  if (!temCoord) { if (__miniMap) { __miniMap.remove(); __miniMap = null; } return; }
  if (!window.L) {
    el.innerHTML = `<div class="ht-map-empty">Não consegui carregar o mapa agora. O endereço abaixo abre no Google Maps e no Waze.</div>`;
    return;
  }
  if (__miniMap && __miniMap.getContainer() !== el) { __miniMap.remove(); __miniMap = null; }
  if (!__miniMap) {
    __miniMap = L.map(el, { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© colaboradores do OpenStreetMap',
    }).addTo(__miniMap);
  } else {
    __miniMap.eachLayer(l => { if (l instanceof L.Marker) __miniMap.removeLayer(l); });
  }
  L.marker([c.lat, c.lng], {
    interactive: false,
    icon: L.divIcon({ className: "pin-wrap", iconSize: null, html: `<span class="pin-court"></span>` }),
  }).addTo(__miniMap);
  __miniMap.setView([c.lat, c.lng], 15);
  setTimeout(() => { if (__miniMap) __miniMap.invalidateSize(); }, 60);
}

const TITULO_PADRAO = document.title;
function atualizarSeo(c) {
  const ld = document.getElementById("ld-academia");
  if (!c) {
    if (document.title !== TITULO_PADRAO) document.title = TITULO_PADRAO;
    if (ld && ld.textContent) ld.textContent = "";
    return;
  }
  const local = [c.bairro, c.cidade].filter(Boolean).join(", ");
  const titulo = `${c.name}${local ? " — " + local : ""} | GuiaTennis`;
  if (document.title !== titulo) document.title = titulo;
  if (!ld) return;

  const url = `${location.origin}${location.pathname}?court=${c.id}`;
  const lugar = {
    "@type": "SportsActivityLocation",
    "@id": url,
    name: c.name,
    url,
    description: descricaoAcademia(c),
  };
  const fotos = courtPhotos(c).filter(p => /^https?:/.test(p));
  if (fotos.length) lugar.image = fotos;
  if (c.endereco || c.bairro || c.cidade) {
    lugar.address = {
      "@type": "PostalAddress",
      streetAddress: [c.address, c.numero].filter(Boolean).join(", ") || c.endereco || "",
      addressLocality: c.cidade || "",
      addressCountry: "BR",
    };
  }
  if (typeof c.lat === "number" && typeof c.lng === "number") {
    lugar.geo = { "@type": "GeoCoordinates", latitude: c.lat, longitude: c.lng };
  }
  if (c.phone) lugar.telephone = "+55" + c.phone.replace(/\D/g, "").replace(/^55/, "");
  const redes = [c.site, c.instagram ? `https://instagram.com/${c.instagram.replace("@", "")}` : null].filter(Boolean);
  if (redes.length) lugar.sameAs = redes;
  const faixa = faixaGeral(c);
  if (faixa) lugar.priceRange = faixa.texto;
  if (c.appCount) {
    lugar.aggregateRating = {
      "@type": "AggregateRating",
      ratingValue: Number(c.appAvg.toFixed(1)),
      reviewCount: c.appCount,
      bestRating: 5,
      worstRating: 1,
    };
  }

  const faq = perguntasAcademia(c);
  const grafo = [lugar];
  if (faq.length) {
    grafo.push({
      "@type": "FAQPage",
      mainEntity: faq.map(f => ({
        "@type": "Question",
        name: f.q,
        acceptedAnswer: { "@type": "Answer", text: f.a },
      })),
    });
  }
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": grafo });
}

const DECIDE_CRITERIA = [
  { key: "preco", label: "Preço" },
  { key: "distancia", label: "Distância" },
  { key: "estrutura", label: "Estrutura" },
  { key: "avaliacoes", label: "Avaliações" },
];

function norm(values, value, lowerIsBetter) {
  const valid = values.filter(v => typeof v === "number" && isFinite(v));
  if (!valid.length || typeof value !== "number" || !isFinite(value)) return 50;
  const min = Math.min(...valid), max = Math.max(...valid);
  if (min === max) return 100;
  const pct = ((value - min) / (max - min)) * 100;
  return lowerIsBetter ? 100 - pct : pct;
}

function decideRanking() {
  const courts = compareCourts();
  const an = analisarAnotacoes(state.decideNotes, courts);

  // Critérios marcados + os que a pessoa citou no texto
  const marcados = [...new Set([...state.decidePrios, ...an.criterios])];
  const prios = marcados.length ? marcados : DECIDE_CRITERIA.map(c => c.key);

  // Itens concretos citados na anotação (estacionamento, água, coberta...)
  const exigencias = an.achados.filter(a => a.atendem.length && a.atendem.length < a.total);

  const precos = courts.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; });
  const dists = courts.map(c => typeof c.distanceKm === "number" ? c.distanceKm : null);
  const estrs = courts.map(c => (c.amenities||[]).length * 2 + (totalQuadras(c) || 0));
  const notas = courts.map(c => c.appCount ? c.appAvg : null);

  return courts.map((c, i) => {
    const scores = {
      preco: norm(precos, precos[i], true),
      distancia: norm(dists, dists[i], true),
      estrutura: norm(estrs, estrs[i], false),
      avaliacoes: norm(notas, notas[i], false),
    };
    let total = prios.reduce((sum, k) => sum + scores[k], 0) / prios.length;

    // O que a pessoa escreveu pesa o dobro: se ela se deu ao trabalho de citar,
    // é porque importa mais que um critério genérico marcado.
    let atendidas = [];
    if (exigencias.length) {
      atendidas = exigencias.filter(e => e.atendem.some(x => x.id === c.id));
      const notaAnotacao = (atendidas.length / exigencias.length) * 100;
      total = (total + notaAnotacao * 2) / 3;
    }

    const melhores = Object.entries(scores)
      .filter(([k]) => prios.includes(k))
      .sort((a, b) => b[1] - a[1])
      .slice(0, 2)
      .filter(([, v]) => v >= 60)
      .map(([k]) => DECIDE_CRITERIA.find(x => x.key === k).label.toLowerCase());

    return {
      court: c,
      total,
      melhores,
      atendeAnotacao: atendidas.map(e => e.label),
      faltaAnotacao: exigencias.filter(e => !e.atendem.some(x => x.id === c.id)).map(e => e.label),
    };
  }).sort((a, b) => b.total - a.total);
}

// Dicionário de termos → o que a pessoa está procurando.
// Sem acento e minúsculo; o texto é normalizado antes de comparar.
const NOTE_KEYWORDS = [
  { tipo: "amenity", alvo: ["estacionamento_gratuito", "estacionamento_pago"], termos: ["estacionamento", "estacionar", "vaga", "garagem"], label: "estacionamento" },
  { tipo: "amenity", alvo: ["vestiario"], termos: ["vestiario", "banho", "chuveiro", "trocar de roupa"], label: "vestiário" },
  { tipo: "amenity", alvo: ["loja"], termos: ["loja", "corda", "encordoamento", "material"], label: "loja de material" },
  { tipo: "amenity", alvo: ["wifi"], termos: ["wifi", "wi-fi", "internet"], label: "Wi-Fi" },
  { tipo: "amenity", alvo: ["lanchonete"], termos: ["lanchonete", "lanche", "comer", "comida", "bar"], label: "lanchonete" },
  { tipo: "amenity", alvo: ["agua"], termos: ["agua", "bebedouro"], label: "água grátis" },
  { tipo: "amenity", alvo: ["camera"], termos: ["camera", "gravar", "filmar", "video"], label: "câmera" },
  { tipo: "amenity", alvo: ["assinatura_fitness"], termos: ["gympass", "wellhub", "totalpass", "assinatura", "plano fitness"], label: "app de assinatura fitness" },
  { tipo: "cobertura", alvo: ["coberta"], termos: ["coberta", "cobertura", "chuva", "sol forte", "sombra"], label: "quadra coberta" },
  { tipo: "piso", alvo: ["saibro"], termos: ["saibro"], label: "saibro" },
  { tipo: "piso", alvo: ["rapida"], termos: ["rapida", "dura", "cimento"], label: "quadra rápida" },
  { tipo: "criterio", alvo: ["preco"], termos: ["caro", "barato", "preco", "valor", "custo", "bolso", "gastar"], label: "preço" },
  { tipo: "criterio", alvo: ["distancia"], termos: ["perto", "longe", "distancia", "transito", "deslocamento", "chegar"], label: "distância" },
  { tipo: "criterio", alvo: ["avaliacoes"], termos: ["avaliacao", "nota", "comentario", "reputacao", "recomenda"], label: "avaliações" },
  { tipo: "criterio", alvo: ["estrutura"], termos: ["estrutura", "instalacao", "espaco", "quadras"], label: "estrutura" },
];

function semAcento(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function analisarAnotacoes(texto, courts) {
  const t = semAcento(texto);
  if (!t.trim()) return { achados: [], criterios: [] };

  const achados = [];
  const criterios = [];

  NOTE_KEYWORDS.forEach(k => {
    if (!k.termos.some(termo => t.includes(semAcento(termo)))) return;

    if (k.tipo === "criterio") {
      criterios.push(...k.alvo);
      return;
    }

    const atendem = courts.filter(c => {
      if (k.tipo === "amenity") return k.alvo.some(a => (c.amenities||[]).includes(a));
      if (k.tipo === "cobertura") return k.alvo.some(a => (c.cobertura||[]).includes(a));
      if (k.tipo === "piso") return k.alvo.some(a => (c.pisos||[]).includes(a));
      return false;
    });
    achados.push({ label: k.label, atendem, total: courts.length });
  });

  return { achados, criterios: [...new Set(criterios)] };
}

function priceBlock(c, compact) {
  const hasAula = !!c.priceAula;

      ? `<span class="price-known">${esc(c.priceRange)}</span>`
      : `<span class="price-unknown">Preço a consultar</span>`;
  }
  if (compact) {
    const parts = [];
    if (hasAula) parts.push(`<span class="price-known">${icon('cap',13,'var(--green)')} A partir de R$ ${priceMin(c.priceAula)}/hora</span>`);
    if (hasLoc) parts.push(`<span class="price-known">${icon('key',13,'var(--green)')} A partir de R$ ${priceMin(c.priceLocacao)}/hora</span>`);
    return parts.join(" &nbsp; ");
  }
  const parts = [];
  if (hasAula) parts.push(`<span class="price-known">${icon('cap',13,'var(--green)')} Faixa aula: R$ ${esc(c.priceAula)}/hora</span>`);
  if (hasLoc) parts.push(`<span class="price-known">${icon('key',13,'var(--green)')} Faixa locação: R$ ${esc(c.priceLocacao)}/hora</span>`);
  return parts.join("<br>");
}

  state.mapSelected = id;
  __markers.forEach(m => {
    if (!m._courtId) return;
    const el = m.getElement();
    const span = el && el.querySelector(".pin");
    if (span) span.classList.toggle("on", m._courtId === id);
  });
  const holder = document.getElementById("map-card");
  if (holder) {
    holder.innerHTML = mapCardHtml(id);
    attachMapCardEvents();
  }
}

function attachMapCardEvents() {
  const holder = document.getElementById("map-card");
  if (!holder) return;
  const close = holder.querySelector("#map-card-close");
  if (close) close.onclick = (e) => { e.stopPropagation(); selectOnMap(null); };
  holder.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openCourt(el.dataset.open);
  });
}

// O render() troca todo o HTML do app, então o mapa é remontado a cada
// desenho — guardamos centro e zoom pra ele voltar onde estava.
function mountMap(results) {
  const el = document.getElementById("map");
  if (!el) {
    if (__map) { __map.remove(); __map = null; __markers = []; }
    return;
  }
  if (!window.L) {
    el.innerHTML = `<div class="map-empty">Não consegui carregar o mapa agora. Confira a conexão e recarregue a página.</div>`;
    return;
  }
  if (__map && __map.getContainer() !== el) { __map.remove(); __map = null; __markers = []; }

  if (!__map) {
    __map = L.map(el, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© colaboradores do OpenStreetMap',
    }).addTo(__map);
    __map.on("moveend", () => {
      if (!__map) return;
      const c = __map.getCenter();
      state.mapCenter = [c.lat, c.lng];
      state.mapZoom = __map.getZoom();
    });
  }

  __markers.forEach(m => __map.removeLayer(m));
  __markers = [];

  const comCoord = mapCourts(results);
  comCoord.forEach(c => {
    const pv = parsePriceValue(c);
    const label = isFinite(pv) ? `R$ ${pv}` : "Consultar";
    const m = L.marker([c.lat, c.lng], {
      icon: L.divIcon({
        className: "pin-wrap",
        iconSize: null,
        html: `<span class="pin ${state.mapSelected === c.id ? "on" : ""}">${esc(label)}</span>`,
      }),
    }).addTo(__map);
    m._courtId = c.id;
    m.on("click", () => selectOnMap(c.id));
    __markers.push(m);
  });

  if (state.origin) {
    __markers.push(L.marker([state.origin.lat, state.origin.lng], {
      interactive: false,
      icon: L.divIcon({ className: "pin-wrap", iconSize: null, html: `<span class="pin-me"></span>` }),
    }).addTo(__map));
  }

  const sig = comCoord.map(c => c.id).join(",") + "|" + (state.origin ? `${state.origin.lat},${state.origin.lng}` : "");
  if (sig !== __mapSig || !state.mapCenter) {
    __mapSig = sig;
    const pts = comCoord.map(c => [c.lat, c.lng]);
    if (state.origin) pts.push([state.origin.lat, state.origin.lng]);
    if (pts.length > 1) __map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
    else if (pts.length === 1) __map.setView(pts[0], 14);
    else __map.setView([-23.55, -46.63], 11);
  } else {
    __map.setView(state.mapCenter, state.mapZoom || 12);
  }

  setTimeout(() => { if (__map) __map.invalidateSize(); }, 60);
  attachMapCardEvents();
}

function recomendadasGuia(todas) {
  if (RECOMENDADAS.length) {
    return RECOMENDADAS.map(id => todas.find(c => c.id === id)).filter(Boolean);
  }
  const ctx = {
    dists: todas.map(c => c.distanceKm),
    rates: todas.map(c => c.appCount ? c.appAvg : null),
    prices: todas.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; }),
  };
  return [...todas]
    .map(c => ({ c, nota: recoScore(c, ctx) + (courtPhotos(c).length ? 10 : 0) + (c.endereco ? 4 : 0) }))
    .sort((a, b) => b.nota - a.nota)
    .slice(0, 4)
    .map(x => x.c);
}

const RECENTS_KEY = "guiatennis_recentes_v1";

function loadRecents() {
  try { const v = JSON.parse(localStorage.getItem(RECENTS_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function pushRecent(id) {
  const next = [id, ...loadRecents().filter(x => x !== id)].slice(0, 8);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(next)); } catch {}
}

function cidadesComQuadra() {
  const map = {};
  state.allCourts.forEach(c => {
    const nome = (c.cidade || "").trim();
    if (!nome) return;
    if (!map[nome]) map[nome] = [];
    map[nome].push(c);
  });
  return Object.keys(map).sort((a, b) => map[b].length - map[a].length).map(nome => ({ nome, courts: map[nome] }));
}

function faixaCidade(courts) {
  const vals = courts.map(parsePriceValue).filter(v => isFinite(v));
  if (!vals.length) return "";
  const min = Math.min(...vals), max = Math.max(...vals);
  return min === max ? `a partir de R$ ${min}/hora` : `de R$ ${min} a R$ ${max} a hora`;
}

// O endereço acompanha a tela, então voltar pelo navegador funciona e o link
// de uma academia continua abrindo direto nela.
function syncUrl(push) {
  try {
    const u = new URL(location.href);
    u.searchParams.delete("court");
    u.searchParams.delete("busca");
    if (state.page === "court" && state.selected) u.searchParams.set("court", state.selected.id);
    else if (state.page === "search") u.searchParams.set("busca", state.cep || "quadras");
    const alvo = u.pathname + (u.search ? u.search : "") ;
    const dados = { page: state.page, court: state.page === "court" && state.selected ? state.selected.id : null };
    if (push) history.pushState(dados, "", alvo);
    else history.replaceState(dados, "", alvo);
  } catch {}
}

function goHome() {
  state.page = "home";
  state.selected = null;
  state.showSort = false;
  syncUrl(true);
  render();
  window.scrollTo(0, 0);
}

function goSearch() {
  state.page = "search";
  state.selected = null;
  state.showSort = false;
  syncUrl(true);
  render();
  window.scrollTo(0, 0);
}

function openCourt(id) {
  const c = getResults().find(r => r.id === id)
    || state.allCourts.filter(x => x.id === id).map(decorate)[0]
    || (state.pending || []).filter(x => x.id === id).map(decorate)[0];
  if (!c) return;
  state.backTo = state.page === "court" ? (state.backTo || "search") : state.page;
  state.selected = c;
  state.page = "court";
  state.pendingStar = 0;
  state.justRated = false;
  if (state.perto[id] && state.perto[id].status === "erro") delete state.perto[id];
  state.reviewsExpanded = false;
  state.showAdminPanel = false;
  window.__rateConsent = false;
  pushRecent(c.id);
  if (!isAdmin) trackClick(c.id, "visualizacao");
  syncUrl(true);
  render();
  window.scrollTo(0, 0);
}

function voltarDaFicha() {
  state.page = state.backTo === "home" ? "home" : "search";
  state.selected = null;
  syncUrl(true);
  render();
  window.scrollTo(0, 0);
}

window.addEventListener("popstate", () => {
  if (!state.loaded) return;
  const q = new URLSearchParams(location.search);
  const courtId = q.get("court");
  if (courtId) {
    const c = state.allCourts.filter(x => x.id === courtId).map(decorate)[0];
    if (c) { state.selected = c; state.page = "court"; render(); return; }
  }
  state.selected = null;
  state.page = q.has("busca") ? "search" : "home";
  render();
});

// ---------- componentes da interface de busca (estilo Trivago) ----------

function plural(n, singular, plural_) {
  return n === 1 ? singular : plural_;
}

function scoreWord(avg, count) {
  if (!count) return "Sem nota ainda";
  if (avg >= 4.6) return "Excelente";
  if (avg >= 4.2) return "Muito bom";
  if (avg >= 3.6) return "Bom";
  if (avg >= 3.0) return "Razoável";
  return "Regular";
}

// Selo de nota: número em destaque + palavra + contagem, igual ao dos hotéis.
function scoreBox(avg, count, compact) {
  const num = count ? avg.toFixed(1).replace(".", ",") : "—";
  const sub = count
    ? `${count} ${plural(count, "avaliação", "avaliações")}${compact ? "" : " no app"}`
    : (compact ? "" : "Seja o primeiro a avaliar");
  return `<span class="score-box">
    <span class="score-num ${count ? "" : "empty"}">${num}</span>
    <span class="score-word">${scoreWord(avg, count)}<span class="score-count">${sub}</span></span>
  </span>`;
}

function ratingDistribution(courtId) {
  const dist = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
  getReviews(courtId).forEach(r => { if (dist[r.stars] !== undefined) dist[r.stars]++; });
  return dist;
}

function formatReviewDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function initials(nome) {
  const parts = (nome || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

function distanceText(km) {
  if (typeof km !== "number" || !isFinite(km)) return "";
  return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1).replace(".", ",")} km`;
}


function courtPhotos(c) {
  return (c.photos && c.photos.length) ? c.photos : (c.photoUrl ? [c.photoUrl] : []);
}

function cardPhotoIndex(c) {
  const photos = courtPhotos(c);
  if (!photos.length) return 0;
  const i = state.cardPhoto[c.id] || 0;
  return Math.min(Math.max(i, 0), photos.length - 1);
}

// Cada preço vira uma "oferta": a mais barata abre o card, as outras ficam
// listadas embaixo, como os parceiros do Trivago.
function ofertas(c) {
  const out = [];
  if (c.priceAula) out.push({ label: "Aula", faixa: c.priceAula });
  if (c.priceLocacao) out.push({ label: "Locação", faixa: c.priceLocacao });
  if (!out.length && c.priceRange) out.push({ label: "Preço", faixa: c.priceRange });
  return out
    .map(o => ({ ...o, min: parseInt(priceMin(o.faixa) || "0", 10) }))
    .sort((a, b) => (a.min || 1e9) - (b.min || 1e9));
}

// Os "✓" verdes ao lado do nome do parceiro.
function selos(c) {
  const out = [];
  if ((c.cobertura || []).includes("coberta")) out.push({ k: "coberta", label: "Coberta" });
  if ((c.amenities || []).includes("estacionamento_gratuito")) out.push({ k: "estacionamento_gratuito", label: "Estacionamento grátis" });
  if (out.length < 2 && (c.amenities || []).includes("vestiario")) out.push({ k: "vestiario", label: "Vestiário" });
  if (out.length < 2 && (c.amenities || []).includes("lanchonete")) out.push({ k: "lanchonete", label: "Lanchonete" });
  return out.slice(0, 2);
}

// A linha com a estrelinha, equivalente ao "Piscina externa climatizada".
// Nunca repete o que já apareceu nos selos da oferta.
function destaque(c, usados) {
  const jaUsado = new Set(usados || []);
  const tem = k => k === "coberta" ? (c.cobertura || []).includes("coberta") : (c.amenities || []).includes(k);
  const opcoes = [
    { k: "camera", t: "Câmera para gravar seus pontos" },
    { k: "coberta", t: "Quadra coberta, joga mesmo com chuva" },
    { k: "loja", t: "Loja de materiais no local" },
    { k: "estacionamento_gratuito", t: "Estacionamento grátis" },
    { k: "lanchonete", t: "Lanchonete no local" },
    { k: "assinatura_fitness", t: "Aceita app de assinatura fitness" },
    { k: "wifi", t: "Wi-Fi no local" },
    { k: "agua", t: "Água grátis" },
    { k: "vestiario", t: "Vestiário" },
  ];
  const achou = opcoes.find(o => tem(o.k) && !jaUsado.has(o.k));
  return achou ? achou.t : "";
}

// O maior valor da faixa, quando a academia informou um intervalo.
function priceMax(faixa) {
  const nums = (faixa || "").match(/\d+/g) || [];
  return nums.length > 1 ? nums[nums.length - 1] : null;
}

function localLine(c) {
  const lugar = [c.bairro, c.cidade].filter(Boolean).join(", ");
  const d = distanceText(c.distanceKm);
  return d ? `${lugar} · ${d} de você` : lugar;
}
