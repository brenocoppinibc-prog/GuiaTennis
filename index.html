// A política vive em f.politica; esta função garante o formato mesmo quando
// o formulário ainda não tem nada preenchido.
// Com estacionamento no local, a comodidade já responde; o texto de onde
// parar só aparece para quem não tem vaga própria.
function temEstacionamentoProprio(f) {
  const am = (f && f.amenities) || [];
  return am.includes("estacionamento_gratuito") || am.includes("estacionamento_pago");
}

function acessoForm(f) {
  if (!f.acesso) f.acesso = {};
  const a = f.acesso;
  if (typeof a.fachada !== "string") a.fachada = "";
  if (typeof a.entrada !== "string") a.entrada = "";
  if (typeof a.estacionar !== "string") a.estacionar = typeof a.estacionamentoNota === "string" ? a.estacionamentoNota : "";
  return a;
}

function horarioForm(f) {
  if (!f.horario) f.horario = {};
  const h = f.horario;
  if (h.modo !== "dia") h.modo = "igual";
  HORARIO_CHAVES.forEach(k => {
    if (!h[k] || typeof h[k] !== "object") h[k] = {};
    const x = h[k];
    if (typeof x.de !== "string") x.de = "";
    if (typeof x.ate !== "string") x.ate = "";
    x.fechado = !!x.fechado;
  });
  if (typeof h.nota !== "string") h.nota = "";
  return h;
}

// Uma linha do horário no cadastro: o dia, o botão "Fechado" e as duas horas.
function linhaHorarioForm(h, key, label) {
  const x = h[key];
  return `
    <div class="hr-form-linha">
      <span class="hr-form-dia">${esc(label)}</span>
      <button type="button" class="chip small hr-fechado ${x.fechado ? "active" : ""}" data-fechado="${key}">Fechado</button>
      <div class="hr-form-campos ${x.fechado ? "off" : ""}">
        <input type="time" class="form-field hr-time" data-hora="${key}" data-parte="de" value="${esc(x.de)}" ${x.fechado ? "disabled" : ""} />
        <span class="hr-form-ate">às</span>
        <input type="time" class="form-field hr-time" data-hora="${key}" data-parte="ate" value="${esc(x.ate)}" ${x.fechado ? "disabled" : ""} />
      </div>
    </div>`;
}

function politicaForm2(f) {
  if (!f.politica) f.politica = {};
  const pol = f.politica;
  if (pol.modo !== "separado") pol.modo = "igual";
  ["aula", "locacao"].forEach(k => {
    if (!pol[k] || typeof pol[k] !== "object") pol[k] = {};
    if (typeof pol[k].reposicao !== "string") pol[k].reposicao = "";
    if (typeof pol[k].foraDoPrazo !== "string") pol[k].foraDoPrazo = "";
  });
  if (typeof pol.reposicao !== "string") pol.reposicao = "";
  if (typeof pol.foraDoPrazo !== "string") pol.foraDoPrazo = "";
  return pol;
}

// Um bloco de cancelamento no cadastro. `alvo` é "" para a regra única, ou
// "aula"/"locacao" quando a academia separa as duas.
function blocoPoliticaForm(pol, alvo, titulo) {
  const p = alvo ? pol[alvo] : pol;
  const horas = horasDaReposicao(p.reposicao);
  const id = alvo || "geral";
  // "Personalizar" fica marcado quando o prazo gravado não é 12, 24 ou 48,
  // ou enquanto a academia está digitando o dela.
  const padrao = REPOSICAO_OPTS.some(o => o.key === p.reposicao);
  const personalizado = !!p.__personalizar || (!!p.reposicao && !padrao);
  const opcoes = REPOSICAO_OPTS.filter(o => o.key !== "nao");
  const nao = REPOSICAO_OPTS.find(o => o.key === "nao");
  const chip = (o) => `<button type="button" class="chip small reg-reposicao ${!personalizado && p.reposicao === o.key ? "active" : ""}" data-reposicao="${o.key}" data-alvo="${esc(alvo)}">${o.label}</button>`;
  return `
    ${titulo ? `<p class="pol-form-t">${esc(titulo)}</p>` : ""}
    <div class="chip-row">
      ${opcoes.map(chip).join("")}
      <button type="button" class="chip small reg-reposicao-outro ${personalizado ? "active" : ""}" data-alvo="${esc(alvo)}">Personalizar</button>
      ${chip(nao)}
    </div>
    ${personalizado ? `
      <div class="pol-horas">
        <span>Avisando com pelo menos</span>
        <input type="number" inputmode="numeric" min="1" max="${REPOSICAO_MAX_HORAS}" class="form-field pol-horas-campo" id="f-politica-horas-${id}" data-alvo="${esc(alvo)}" value="${padrao ? "" : esc(p.reposicao)}" placeholder="36" />
        <span>horas de antecedência</span>
      </div>` : ""}
    <textarea class="form-field" id="f-politica-fora-${id}" data-alvo="${esc(alvo)}" rows="3" style="resize:none"
      placeholder="${horas ? `O que acontece avisando com menos de ${horas}h` : "Como funcionam os cancelamentos"}">${esc(p.foraDoPrazo)}</textarea>`;
}

// Para editar: a regra como a academia gravou, sem esconder a da modalidade
// que ela desmarcou — se voltar a marcar, a regra antiga continua lá.
function politicaParaForm(c) {
  const pol = (c && c.politica) || {};
  const parte = (o) => { const p = parteDaPolitica(o); return { reposicao: p.reposicao, foraDoPrazo: p.foraDoPrazo }; };
  return { modo: pol.modo === "separado" ? "separado" : "igual", ...parte(pol), aula: parte(pol.aula), locacao: parte(pol.locacao) };
}

// O que vai para o banco: só a regra das modalidades que a academia oferece.
function politicaParaSalvar(f) {
  const pol = politicaForm2(f);
  const temAula = (f.modalidades || []).includes("aulas_proprias");
  const temLocacao = (f.modalidades || []).includes("locacao");
  const parte = (p) => ({ reposicao: p.reposicao, foraDoPrazo: p.foraDoPrazo.trim() });
  if (temAula === temLocacao) {
    return pol.modo === "separado"
      ? { modo: "separado", aula: parte(pol.aula), locacao: parte(pol.locacao) }
      : { modo: "igual", ...parte(pol) };
  }
  const k = temAula ? "aula" : "locacao";
  return { modo: "igual", ...parte(pol.modo === "separado" ? pol[k] : pol) };
}

// Cadastro passo a passo (pedido do Breno em 01/10/2026: "em telas
// separadas, em ordem de importância para o usuário, para eles e para mim").
// Uma parte por tela, como o "Anuncie seu espaço" do Airbnb, o cadastro do
// Booking para Parceiros e o primeiro acesso do Google Business Profile:
// barra de progresso, Voltar e Continuar. Primeiro o que o jogador precisa
// para achar e chamar a academia — que é também o que a academia quer
// (contato) e o que o GuiaTennis precisa para aprovar —, depois o que
// completa a ficha. Na edição, as partes viram abas, como o "Editar perfil"
// do Google, e dá para salvar em qualquer uma.
const REG_PASSOS = [
  { id: "dados", t: "Nome e endereço", titulo: "Onde fica a academia?", porque: "É o que faz a academia aparecer para quem busca perto." },
  { id: "precos", t: "Modalidade e preço", titulo: "O que a academia oferece?", porque: "O que o jogador compara primeiro é se tem aula ou locação e o preço por hora." },
  { id: "quadras", t: "Quadras", titulo: "Quadras e estrutura", porque: "Piso, cobertura e comodidades viram filtros na busca." },
  { id: "contato", t: "Contato", titulo: "Como os jogadores falam com vocês?", porque: "O botão da ficha abre o WhatsApp da academia com a conversa começada." },
  { id: "fotos", t: "Fotos", titulo: "Fotos da academia", porque: "Ficha com foto recebe muito mais contato." },
  { id: "horario", t: "Horário", titulo: "Horário de funcionamento", porque: "A ficha mostra se a academia está aberta agora." },
  { id: "cancelamento", t: "Cancelamento", titulo: "Cancelamento e reposição", porque: "Tira a dúvida antes da primeira aula." },
  { id: "chegada", t: "Como chegar", titulo: "Como chegar", porque: "Fachada, entrada e onde parar: é o que mais evita passar direto." },
  { id: "revisar", t: "Revisar", titulo: "Tudo certo?", porque: "Confira cada parte. Um toque leva até ela." },
];

// Quem pede cadastro pelo site manda o essencial; o admin publica só com o
// nome; na edição, só o nome não pode ficar em branco (doRegisterSubmit
// confere de novo).
function regPedeTudo(f) {
  return !isAdmin && !f.__editingId;
}
function regFaltas(f, passo) {
  const falta = [];
  const tem = v => !!String(v || "").trim();
  if (passo === "dados") {
    if (!tem(f.name)) falta.push("nome");
    if (regPedeTudo(f) && !(tem(f.address) && tem(f.numero) && tem(f.bairro) && tem(f.cidade))) falta.push("endereço completo");
  }
  if (!regPedeTudo(f)) return falta;
  if (passo === "precos" && !(f.modalidades || []).length) falta.push("modalidade");
  if (passo === "quadras" && !QUADRA_COMBOS.some(q => (f.quadras || {})[q.key] > 0)) falta.push("quantidade de quadras");
  if (passo === "contato" && !tem(f.phone)) falta.push("WhatsApp");
  if (passo === "revisar" && !f.consent && !contaAcademia) falta.push("aceite dos Termos de Uso e da Política de Privacidade");
  if (passo === "revisar" && contaAcademia && !isAdmin && !f.__editingId && !f.declaro) falta.push("a declaração de que você está autorizado(a) pela academia");
  return falta;
}
// A parte já tem alguma coisa? (o ✓ das abas e da revisão)
function regPreenchido(f, passo) {
  const tem = v => !!String(v || "").trim();
  const h = f.horario || {};
  const pol = f.politica || {};
  const a = f.acesso || {};
  switch (passo) {
    case "dados": return tem(f.name) && (tem(f.address) || tem(f.bairro) || tem(f.cidade));
    case "precos": return (f.modalidades || []).length > 0;
    case "quadras": return QUADRA_COMBOS.some(q => (f.quadras || {})[q.key] > 0);
    case "contato": return tem(f.phone) || tem(f.instagram) || tem(f.site);
    case "fotos": return (f.photos || []).length > 0;
    case "horario": return HORARIO_CHAVES.some(k => h[k] && (h[k].fechado || tem(h[k].de) || tem(h[k].ate)));
    case "cancelamento": return [pol, pol.aula || {}, pol.locacao || {}].some(x => tem(x.reposicao) || tem(x.foraDoPrazo));
    case "chegada": return tem(a.fachada) || tem(a.entrada) || tem(a.estacionar);
    default: return false;
  }
}
function regPassoAtual() {
  const i = Math.max(0, Math.min(REG_PASSOS.length - 1, state.regPasso || 0));
  return { i, passo: REG_PASSOS[i] };
}

// O miolo de cada parte.
function regPassoHtml(id, f, obrigatorio) {
  const isEditing = !!f.__editingId;
  const parceiro = !isAdmin && !isEditing && !!contaAcademia;
  // Nada trava pelo plano no meio do cadastro (pedido do Breno em
  // 03/10/2026): a academia preenche do jeito dela e, ao finalizar, vê o
  // que o plano esconde e escolhe o plano (regPlanoHtml). Fotos: até 5, o
  // máximo de qualquer plano.
  const maxFotos = FOTOS_MAXIMO;
  if (id === "dados") return `
        <label class="field-label" for="f-name">Nome da academia</label>
        <input class="form-field" id="f-name" placeholder="Nome da academia/quadra *" value="${esc(f.name)}" style="margin-top:0" />
        <p class="field-label">Endereço</p>
        ${!isEditing ? `<input class="form-field" id="f-cep" inputmode="numeric" placeholder="CEP" value="${esc(f.cep || '')}" style="margin-top:0" />` : ""}
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">
          <input class="form-field" id="f-address" placeholder="Endereço (rua)${obrigatorio}" value="${esc(f.address)}" style="margin-top:10px" />
          <input class="form-field" id="f-numero" placeholder="Número${obrigatorio}" value="${esc(f.numero || '')}" style="margin-top:10px" />
        </div>
        <input class="form-field" id="f-complemento" placeholder="Complemento (opcional)" value="${esc(f.complemento || '')}" />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input class="form-field" id="f-bairro" placeholder="Bairro" value="${esc(f.bairro)}" />
          <input class="form-field" id="f-cidade" placeholder="Cidade" value="${esc(f.cidade)}" />
        </div>
        ${state.cepStatus === "loading" ? `<p class="footnote">Buscando endereço pelo CEP...</p>` : ""}
        ${state.cepStatus === "error" ? `<p class="footnote" style="color:var(--red)">CEP não encontrado — preencha manualmente.</p>` : ""}`;

  if (id === "precos") return `
        <p class="field-label" style="margin-top:0">Modalidade${obrigatorio}</p>
        <div class="chip-row">
          ${MODALIDADE_OPTS.map(m => `<button class="chip small reg-modalidade ${f.modalidades.includes(m.key)?"active":""}" data-modalidade="${m.key}">${m.icon} ${m.label}</button>`).join("")}
        </div>
        ${(f.modalidades.includes("aulas_proprias") || f.modalidades.includes("locacao")) ? `
          <p class="field-label">Faixa de preço por hora (opcional)</p>
          <p class="footnote" style="margin:0 0 8px">Deixe em branco se preferir não publicar valores — a ficha mostra "Sob consulta".</p>` : ""}
        ${f.modalidades.includes("aulas_proprias") ? `
          <div class="price-input-row">
            <span class="price-input-label">Aula</span>
            <span>R$</span>
            <input class="form-field" id="f-price-aula" placeholder="90-140" inputmode="numeric" value="${esc(f.priceAula || '')}" />
            <span>/hora</span>
          </div>
        ` : ""}
        ${f.modalidades.includes("locacao") ? `
          <div class="price-input-row">
            <span class="price-input-label">Locação</span>
            <span>R$</span>
            <input class="form-field" id="f-price-locacao" placeholder="80-120" inputmode="numeric" value="${esc(f.priceLocacao || '')}" />
            <span>/hora</span>
          </div>
        ` : ""}
        ${!f.modalidades.length ? `<p class="footnote">Escolha a modalidade para informar o preço.</p>` : ""}`;

  if (id === "quadras") return `
        <p class="field-label" style="margin-top:0">Quantas quadras de cada tipo${obrigatorio}</p>
        <div class="quadra-count-grid">
          ${QUADRA_COMBOS.map(q => `
            <div class="quadra-count-item">
              <span>${PISO_OPTS.find(p=>p.key===q.piso)?.icon} ${PISO_OPTS.find(p=>p.key===q.piso)?.label} · ${COBERTURA_OPTS.find(c=>c.key===q.cobertura)?.icon} ${COBERTURA_OPTS.find(c=>c.key===q.cobertura)?.label}</span>
              <input type="number" min="0" inputmode="numeric" class="form-field reg-quadra-count" data-combo="${q.key}" value="${f.quadras?.[q.key] || 0}" style="margin-top:6px" />
            </div>
          `).join("")}
        </div>
        <p class="field-label">Comodidades</p>
        <div class="chip-row">
          ${AMENITY_OPTS.map(a => {
            const marcada = f.amenities.includes(a.key);
            return `<button class="chip small reg-amenity ${marcada ? "active" : ""}" data-amenity="${a.key}">${a.icon} ${a.label}</button>`;
          }).join("")}
        </div>`;

  if (id === "contato") return `
        <label class="field-label" for="f-phone" style="margin-top:0">WhatsApp da academia${obrigatorio}</label>
        <input class="form-field" id="f-phone" inputmode="tel" placeholder="WhatsApp (com DDD)${obrigatorio}" value="${esc(f.phone)}" style="margin-top:0" />
        <label class="field-label" for="f-instagram">Instagram</label>
        <input class="form-field" id="f-instagram" placeholder="Instagram (@exemplo)" value="${esc(f.instagram)}" style="margin-top:0" />
        <label class="field-label" for="f-site">Site</label>
        <input class="form-field" id="f-site" inputmode="url" placeholder="Site (opcional, com https://)" value="${esc(f.site)}" style="margin-top:0" />`;

  if (id === "fotos") return `
        <label class="foto-caixa ${(f.photos||[]).length >= maxFotos ? "cheia" : ""}" for="f-photo-file">
          <span class="foto-ic">${icon('camera', 30, (f.photos||[]).length >= maxFotos ? 'var(--muted)' : 'var(--green)')}</span>
          <span class="foto-t">${(f.photos||[]).length
            ? `${f.photos.length} de ${maxFotos} fotos${f.photos.length >= maxFotos ? "" : " — toque para adicionar mais"}`
            : "Toque para escolher as fotos"}</span>
          <span class="foto-s">${(f.photos||[]).length >= maxFotos
            ? "Chegou no limite. Remova uma foto para trocar."
            : "Direto da galeria ou da câmera."}</span>
          <input type="file" accept="image/*" multiple id="f-photo-file" ${(f.photos||[]).length >= maxFotos ? "disabled" : ""} />
        </label>
        ${(f.photos||[]).length ? `
          <div class="photo-thumb-row">
            ${f.photos.map((p, i) => `
              <div class="photo-thumb">
                <img src="${esc(p)}" />
                <button type="button" class="photo-thumb-remove" data-photo-idx="${i}">✕</button>
              </div>
            `).join("")}
          </div>
        ` : ""}
        <p class="footnote" style="margin-top:8px">Só o espaço em si: quadras, recepção, vestiário, fachada. Nada de promoção, tabela de preço ou material de divulgação.</p>`;

  if (id === "horario") return `
        <div class="chip-row" style="margin-bottom:12px">
          <button type="button" class="chip small hr-modo ${horarioForm(f).modo === "igual" ? "active" : ""}" data-hr-modo="igual">Mesmo horário de segunda a sexta</button>
          <button type="button" class="chip small hr-modo ${horarioForm(f).modo === "dia" ? "active" : ""}" data-hr-modo="dia">Horário diferente por dia</button>
        </div>
        <div class="hr-form">
          ${(horarioForm(f).modo === "dia" ? HORARIO_POR_DIA : HORARIO_SIMPLES)
            .map(d => linhaHorarioForm(horarioForm(f), d.key, d.label)).join("")}
        </div>
        <input class="form-field" id="f-horario-nota" placeholder="Observação sobre o horário (opcional)" value="${esc(horarioForm(f).nota)}" />`;

  if (id === "cancelamento") return `
        <fieldset class="reg-trava">
        <p class="footnote" style="margin-top:0;margin-bottom:8px">Com quantas horas de antecedência a pessoa precisa avisar para ter direito à reposição. Toque de novo na opção escolhida para desmarcar.</p>
        ${f.modalidades.length === 1 ? `
          ${blocoPoliticaForm(politicaForm2(f), politicaForm2(f).modo === "separado" ? (f.modalidades[0] === "locacao" ? "locacao" : "aula") : "", "")}
        ` : `
          <div class="chip-row" style="margin-bottom:10px">
            <button type="button" class="chip small pol-modo ${politicaForm2(f).modo === "igual" ? "active" : ""}" data-pol-modo="igual">Mesma regra para tudo</button>
            <button type="button" class="chip small pol-modo ${politicaForm2(f).modo === "separado" ? "active" : ""}" data-pol-modo="separado">Aula e locação diferentes</button>
          </div>
          ${politicaForm2(f).modo === "separado"
            ? blocoPoliticaForm(politicaForm2(f), "aula", "Aula") + blocoPoliticaForm(politicaForm2(f), "locacao", "Locação")
            : blocoPoliticaForm(politicaForm2(f), "", "")}
        `}
        </fieldset>`;

  const travaChegada = "";
  if (id === "chegada") return `
        <p class="field-label" style="margin-top:0">Como é a fachada</p>
        <p class="footnote" style="margin:0 0 6px">O que a pessoa vê da rua.</p>
        <textarea class="form-field" id="f-acesso-fachada" rows="2" ${travaChegada} style="resize:none;margin-top:0" placeholder="Ex.: portão preto sem placa, do lado do hotel — a quadra fica nos fundos.">${esc(acessoForm(f).fachada)}</textarea>

        <p class="field-label">O que fazer ao chegar</p>
        <textarea class="form-field" id="f-acesso-entrada" rows="2" ${travaChegada} style="resize:none;margin-top:0" placeholder="Ex.: avise na portaria que vai jogar tênis e siga até a recepção da quadra.">${esc(acessoForm(f).entrada)}</textarea>

        ${!temEstacionamentoProprio(f) ? `
        <p class="field-label">Onde estacionar</p>
        <p class="footnote" style="margin:0 0 6px">Escreva como funciona de verdade: se dá para parar na rua, se é zona azul e até que horas, se tem estacionamento pago por perto. Vira uma pergunta frequente na ficha.</p>
        <textarea class="form-field" id="f-acesso-estacionar" rows="3" ${travaChegada} style="resize:none;margin-top:0" placeholder="Ex.: dá para parar na rua de trás. Na frente é zona azul até as 19h; depois fica livre. Tem um estacionamento pago na esquina, R$ 15 a hora.">${esc(acessoForm(f).estacionar)}</textarea>
        ` : ""}
        ${!temEstacionamentoProprio(f) && acessoForm(f).estacionar.trim() ? `
          <div class="est-previa">
            <p class="est-previa-t">Estacionamento na ficha</p>
            ${htEstacionarLinhas(estacionarLinhas(f))}
          </div>` : ""}`;

  // Revisar: cada parte com ✓, "Falta" (obrigatória vazia) ou "Opcional",
  // e um toque leva até ela — o "Quase lá" do Booking.
  return `
        <div class="reg-revisao">
          ${REG_PASSOS.filter(x => x.id !== "revisar").map((x, i) => {
            const falta = regFaltas(f, x.id);
            const feito = regPreenchido(f, x.id) && !falta.length;
            return `
            <button type="button" class="reg-rev-linha" data-reg-passo="${i}">
              <span class="reg-rev-sinal ${feito ? "ok" : falta.length ? "falta" : ""}">${feito ? "✓" : falta.length ? "!" : "–"}</span>
              <span class="reg-rev-t"><strong>${x.t}</strong><span>${feito ? "Preenchido" : falta.length ? `Falta: ${falta.join(", ")}` : "Opcional — dá para completar depois"}</span></span>
              ${icon('chevron', 16, 'var(--muted)')}
            </button>`;
          }).join("")}
        </div>
        <p class="footnote">${isEditing ? "O que você não mexeu continua como estava." : (isAdmin ? "Só o nome é obrigatório. O resto você completa quando quiser, em Editar academia." : "* campos obrigatórios")}</p>
        ${isAdmin ? `
          <label class="consent-row">
            <input type="checkbox" id="f-confirmada" ${f.confirmada ? "checked" : ""} />
            <span>Informações confirmadas pela academia. Sem isso, a ficha mostra que os dados são públicos e ainda não foram confirmados.</span>
          </label>
        ` : ""}
        ${parceiro ? `
          <label class="consent-row">
            <input type="checkbox" id="f-declaro" ${f.declaro ? "checked" : ""} />
            <span>${TEXTO_DECLARACAO_CADASTRO}</span>
          </label>
        ` : ""}
        ${!isEditing && !isAdmin && !parceiro ? `
          <label class="consent-row">
            <input type="checkbox" id="f-consent" ${f.consent ? "checked" : ""} />
            <span>Li e concordo com os <button type="button" class="inline-link" id="open-terms-from-form">Termos de Uso</button> e a <button type="button" class="inline-link" id="open-privacy-from-form">Política de Privacidade</button>.</span>
          </label>
        ` : ""}`;
}

// ---- ao finalizar o cadastro: o que o plano esconde e a escolha do plano ----
// Pedido do Breno (03/10/2026): a academia preenche do jeito dela, sem
// trava; ao finalizar, vê o que o plano esconde da ficha, o que falta para
// a ficha vender mais e escolhe o plano — como o "Quase lá" do Booking e o
// upgrade do Google Business Profile. Nada é cobrado sozinho: o pedido fica
// anotado (pedir_plano) e o GuiaTennis combina o valor pelo WhatsApp.

// O que a academia preencheu e o plano não mostra na ficha.
function oQueOPlanoEsconde(f, plano) {
  const l = limitesDoPlano(plano);
  const tem = v => !!String(v || "").trim();
  const itens = [];
  const comodidades = f.amenities || [];
  if (comodidades.length > l.comodidades) {
    const fora = comodidades.slice(l.comodidades).map(k => (AMENITY_OPTS.find(a => a.key === k) || {}).label || k);
    itens.push({ passo: "quadras", t: `${fora.length} das ${comodidades.length} comodidades`, d: `A ficha mostra só ${l.comodidades}. Ficam de fora: ${fora.join(", ")}.` });
  }
  const fotos = (f.photos || []).length;
  if (fotos > l.fotos) itens.push({ passo: "fotos", t: `${fotos - l.fotos} das ${fotos} fotos`, d: `A ficha mostra só as ${l.fotos} primeiras.` });
  const redes = [tem(f.instagram) && !l.contatos.includes("instagram") ? "Instagram" : "", tem(f.site) && !l.contatos.includes("site") ? "site" : ""].filter(Boolean);
  if (redes.length) itens.push({ passo: "contato", t: redes.join(" e "), d: "O jogador só vê o botão do WhatsApp." });
  if (!l.cancelamento && regPreenchido(f, "cancelamento")) itens.push({ passo: "cancelamento", t: "A regra de cancelamento e reposição", d: "É a dúvida que mais trava a primeira aula." });
  if (!l.chegada && regPreenchido(f, "chegada")) itens.push({ passo: "chegada", t: "Como chegar", d: "Fachada, entrada e onde estacionar ficam escondidos." });
  return itens;
}

// O que ainda falta para a ficha vender mais (partes opcionais vazias).
function oQueMelhorar(f) {
  const tem = v => !!String(v || "").trim();
  const itens = [];
  if (!(f.photos || []).length) itens.push({ passo: "fotos", t: "Adicionar fotos", d: "Ficha com foto recebe muito mais contato." });
  if (!tem(f.priceAula) && !tem(f.priceLocacao)) itens.push({ passo: "precos", t: "Dizer o preço", d: "É o que o jogador compara primeiro." });
  if (!regPreenchido(f, "horario")) itens.push({ passo: "horario", t: "Informar o horário", d: "A ficha mostra se a academia está aberta agora." });
  if (!(f.amenities || []).length) itens.push({ passo: "quadras", t: "Marcar as comodidades", d: "Viram filtro na busca: quem procura estacionamento acha vocês." });
  if (!regPreenchido(f, "cancelamento")) itens.push({ passo: "cancelamento", t: "Explicar o cancelamento", d: "Tira a dúvida antes da primeira aula." });
  if (!regPreenchido(f, "chegada")) itens.push({ passo: "chegada", t: "Explicar como chegar", d: "É o que mais evita o jogador passar direto." });
  return itens;
}

// A tela aparece para quem não é admin, se o plano ainda não é o Premium:
// sempre na academia nova; na edição, só se o plano esconder alguma coisa.
function precisaEscolherPlano(f) {
  if (isAdmin) return false;
  const plano = f.__plano || "basico";
  if (plano === "premium") return false;
  return !f.__editingId || oQueOPlanoEsconde(f, plano).length > 0;
}

function regPlanoHtml(f) {
  const plano = f.__plano || "basico";
  const esconde = oQueOPlanoEsconde(f, plano);
  const melhorar = oQueMelhorar(f).slice(0, 3);
  const passoDe = (id) => REG_PASSOS.findIndex(x => x.id === id);
  const opcoes = [
    { key: "premium", tag: "Recomendado", t: "Tudo o que você preencheu aparece, e você vê os números", d: "Quantas pessoas abriram a ficha, quantas chamaram no WhatsApp, de onde vieram e de quais bairros, comparado com as academias da cidade. Até 10 pessoas da equipe.", botao: "Quero o Premium" },
    { key: "completo", t: "Tudo o que você preencheu aparece", d: "Todas as comodidades, 5 fotos, Instagram, site, cancelamento e como chegar. Até 5 pessoas da equipe.", botao: "Quero o Completo" },
  ].filter(o => ordemDoPlano(o.key) > ordemDoPlano(plano));
  return `
    <div class="reg-plano">
      ${esconde.length ? `
        <div class="reg-plano-bloco reg-plano-perde">
          <p class="reg-plano-t">${icon('warning', 16, 'var(--gold)')} No plano ${esc(nomeDoPlano(plano))}, a ficha esconde o que você preencheu:</p>
          <ul>
            ${esconde.map(x => `<li><strong>${esc(x.t)}</strong><span>${esc(x.d)}</span></li>`).join("")}
          </ul>
          <p class="footnote" style="margin:8px 0 0">Nada se perde: fica tudo guardado e aparece assim que a academia mudar de plano.</p>
        </div>` : `
        <div class="reg-plano-bloco">
          <p class="reg-plano-t">${icon('check', 16, 'var(--green)')} Tudo o que você preencheu cabe no plano ${esc(nomeDoPlano(plano))}.</p>
          <p class="footnote" style="margin:4px 0 0">Mas só o Premium mostra quantas pessoas abriram a ficha e chamaram vocês.</p>
        </div>`}
      ${melhorar.length ? `
        <div class="reg-plano-bloco">
          <p class="reg-plano-t">Para a ficha receber mais jogadores</p>
          ${melhorar.map(x => `
            <button type="button" class="reg-rev-linha" data-reg-plano-passo="${passoDe(x.passo)}">
              <span class="reg-rev-sinal">+</span>
              <span class="reg-rev-t"><strong>${esc(x.t)}</strong><span>${esc(x.d)}</span></span>
              ${icon('chevron', 16, 'var(--muted)')}
            </button>`).join("")}
        </div>` : ""}
      <p class="reg-plano-t" style="margin-top:18px">Escolha o plano da ficha</p>
      <div class="reg-plano-opcoes">
        ${opcoes.map(o => `
          <div class="reg-plano-op ${o.key === "premium" ? "destaque" : ""}">
            ${o.tag ? `<span class="pc-plano-tag">${esc(o.tag)}</span>` : ""}
            <p class="pc-plano-n">${esc(nomeDoPlano(o.key))}</p>
            <p class="reg-plano-op-t">${esc(o.t)}</p>
            <p class="pc-card-s">${esc(o.d)}</p>
            <button type="button" class="cta-btn ${o.key === "premium" ? "cta-primary" : "cta-secondary"}" data-reg-plano="${o.key}">${esc(o.botao)}</button>
          </div>`).join("")}
      </div>
      <p class="footnote">O valor é combinado com o GuiaTennis pelo WhatsApp, e nada é cobrado sem você confirmar. Cada academia tem o próprio plano.</p>
      <button type="button" class="reg-plano-basico" data-reg-plano="${plano}">${plano === "basico"
        ? `Continuar no Básico, grátis${esconde.length ? ` (a ficha esconde ${esconde.length === 1 ? "1 item" : esconde.length + " itens"})` : ""}`
        : `Continuar no ${esc(nomeDoPlano(plano))}${esconde.length ? ` (a ficha esconde ${esconde.length === 1 ? "1 item" : esconde.length + " itens"})` : ""}`}</button>
    </div>`;
}
function ordemDoPlano(key) {
  return Math.max(0, PC_PLANOS.findIndex(p => p.key === key));
}
// Mensagem pronta para combinar o plano pelo WhatsApp.
function linkPlanoDaFicha(f, plano) {
  const nome = (f && f.name) || ((minhaAcademia() || {}).name) || "minha academia";
  return whatsappGuia(`Olá! Quero o plano ${nomeDoPlano(plano)} do GuiaTennis Parceiros para a ${nome}.`);
}

function renderRegisterSheet() {
  const f = window.__form || { name:"", cep:"", address:"", numero:"", complemento:"", bairro:"", cidade:"", quadras:{}, amenities:[], modalidades:[], priceAula:"", priceLocacao:"", phone:"", instagram:"", site:"", photos:[], politica:{}, acesso:{}, horario:{} };
  window.__form = f;
  // Formulário novo (abriu agora ou é outra academia): começa na primeira parte.
  if (state.regForm !== f) { state.regForm = f; state.regPasso = 0; state.regPassoErro = ""; state.regPlanoTela = false; }
  const isEditing = !!f.__editingId;
  const parceiro = !isAdmin && !isEditing && !!contaAcademia;
  // Asterisco só para quem pede cadastro pelo site; o admin publica com o que tiver.
  const obrigatorio = isEditing || isAdmin ? "" : " *";
  if (state.registerStatus === "done") {
    return `
      <div class="overlay open" id="register-overlay">
        <div class="sheet"><div class="sheet-content">
          <button class="sheet-close" id="register-close">✕</button>
          <div class="form-success">
            <div style="font-size:36px;color:var(--green)">✓</div>
            <p style="font-weight:600">${isEditing ? "Alterações salvas!" : (isAdmin ? "Quadra publicada com sucesso!" : f.__noAr ? "Pronto: a academia já está no GuiaTennis!" : "Cadastro enviado para análise!")}</p>
            ${isEditing && !isAdmin ? `<p class="subtitle">Já estão na ficha.</p>` : ""}
            ${(!isAdmin && !isEditing) ? `<p class="subtitle">${f.__noAr ? "Ela já aparece na busca, no plano Básico, e você administra a ficha pelo GuiaTennis Parceiros. O GuiaTennis confere os dados depois e pode fazer ajustes." : parceiro ? "Assim que o GuiaTennis aprovar, a academia aparece no site e você já administra a ficha pelo GuiaTennis Parceiros. Com o e-mail confirmado, a próxima academia nova entra no ar na hora." : "Assim que for aprovado, aparece pra todo mundo no app."}</p>` : ""}
            ${["completo", "premium"].includes(f.__planoEscolhido) ? `
              <div class="reg-plano-ok">
                <p><strong>Você escolheu o plano ${esc(nomeDoPlano(f.__planoEscolhido))}.</strong> ${contaAcademia ? "O pedido ficou anotado: o GuiaTennis fala com você no WhatsApp para combinar o valor." : "Fale com o GuiaTennis no WhatsApp para combinar o valor."} Até lá, a ficha aparece no plano ${esc(nomeDoPlano(f.__plano || "basico"))}.</p>
                <a class="cta-btn cta-primary" href="${linkPlanoDaFicha(f, f.__planoEscolhido)}" target="_blank" rel="noreferrer">${icon('whatsapp', 15, '#fff')} Combinar o ${esc(nomeDoPlano(f.__planoEscolhido))} agora</a>
              </div>` : ""}
            <button class="cta-btn cta-primary" id="register-close-2" style="padding:8px 20px;width:auto">Fechar</button>
          </div>
        </div></div>
      </div>`;
  }
  if (state.regPlanoTela) {
    return `
    <div class="overlay open" id="register-overlay">
      <div class="sheet"><div class="sheet-content reg-passos-tela">
        <button class="sheet-close" id="register-close" aria-label="Fechar">✕</button>
        <p class="reg-cabeca">${isEditing ? "Editar " + esc(f.name || "academia") : parceiro ? "Cadastrar academia nova" : "Publicar academia/quadra"}</p>
        <p class="reg-progresso-t">Último passo · Plano da ficha</p>
        <div class="reg-progresso"><i style="width:100%"></i></div>
        <h2 class="sheet-title display reg-titulo">Quase lá: escolha o plano</h2>
        <p class="subtitle reg-porque">Veja como a ficha ${esc(f.name || "da academia")} vai aparecer para os jogadores.</p>
        ${regPlanoHtml(f)}
        <div class="reg-rodape">
          <button type="button" class="reg-voltar" id="reg-plano-voltar">Voltar e revisar</button>
          <span></span>
        </div>
      </div></div>
    </div>`;
  }
  const { i, passo } = regPassoAtual();
  const ultimo = i === REG_PASSOS.length - 1;
  // Admin e edição salvam de qualquer parte; quem pede cadastro vai até o fim.
  const salvaEmQualquerParte = isAdmin || isEditing;

// Anda entre as partes. Para a frente, a parte obrigatória precisa estar
// completa (só para quem pede cadastro); para trás e pelas abas, livre.
function irParaPasso(k, conferir) {
  const f = window.__form || {};
  const { i, passo } = regPassoAtual();
  if (conferir && k > i) {
    const falta = regFaltas(f, passo.id);
    if (falta.length) { state.regPassoErro = `Preencha: ${falta.join(", ")}.`; render(); return; }
  }
  state.regPasso = Math.max(0, Math.min(REG_PASSOS.length - 1, k));
  state.regPassoErro = "";
  if (state.registerStatus === "error") state.registerStatus = "idle";
  render();
  const folha = document.querySelector("#register-overlay .sheet");
  if (folha) folha.scrollTop = 0;
}

// O erro do envio leva para a primeira parte que tem o que falta.
function irParaFalta(f) {
  const k = REG_PASSOS.findIndex(x => regFaltas(f, x.id).length);

}

function statsAgregado(periodo) {
  const raw = state.clicksRaw || [];
  let lista = raw;
  if (periodo !== "all") {
    const corte = Date.now() - parseInt(periodo, 10) * 86400000;
    lista = raw.filter(c => new Date(c.created_at).getTime() >= corte);
  }
  const porAcademia = {};
  const porRegiao = {};
  const porCep = {};
  const porOrigem = {};
  const porAparelho = {};
  const pontos = [];
  let acessos = 0;
  let buscas = 0;
  // Tempo até agir: só a primeira busca e o primeiro contato de cada visita
  // levam os segundos (ver trackClick).
  const tempo = { busca: [], contato: [], ficha: [], inicio: null, visitas: 0 };
  lista.forEach(c => {
    if (c.segundos !== null && c.segundos !== undefined) {
      if (c.tipo === "acesso_site") tempo.visitas++;
      if (c.tipo === "busca") tempo.busca.push(Number(c.segundos));
      if (TIPOS_DE_CONTATO.includes(c.tipo)) tempo.contato.push(Number(c.segundos));
      if (!tempo.inicio || c.created_at < tempo.inicio) tempo.inicio = c.created_at;
    }
    if (TIPOS_DE_CONTATO.includes(c.tipo) && c.segundos_ficha !== null && c.segundos_ficha !== undefined) tempo.ficha.push(Number(c.segundos_ficha));
  });
  lista.forEach(c => {
    if (c.tipo === "acesso_site") {
      acessos++;
      const o = c.origem || "Não registrado";
      porOrigem[o] = (porOrigem[o] || 0) + 1;
      const d = c.dispositivo || "Não registrado";
      porAparelho[d] = (porAparelho[d] || 0) + 1;
      return;
    }
    if (c.tipo === "busca") {
      buscas++;
      const onde = (c.detalhe || "").trim() || "Região não identificada";
      porRegiao[onde] = (porRegiao[onde] || 0) + 1;
      if (c.cep) porCep[c.cep] = (porCep[c.cep] || 0) + 1;
      const la = numeroOuNulo(c.lat), ln = numeroOuNulo(c.lng);
      if (la !== null && ln !== null) pontos.push({ lat: la, lng: ln, onde, cep: c.cep || "", quando: c.created_at });
      return;
    }
    if (!c.academia_id) return;
    if (!porAcademia[c.academia_id]) porAcademia[c.academia_id] = { whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0, origens: {}, regioes: {}, aparelhos: {} };
    const pa = porAcademia[c.academia_id];
    pa[c.tipo] = (pa[c.tipo] || 0) + 1;
    // Público de quem abriu a ficha: cada ficha aberta conta uma vez.
    if (c.tipo === "visualizacao") {
      if (c.origem) pa.origens[c.origem] = (pa.origens[c.origem] || 0) + 1;
      if (c.dispositivo) pa.aparelhos[c.dispositivo] = (pa.aparelhos[c.dispositivo] || 0) + 1;
      if (c.detalhe) pa.regioes[c.detalhe] = (pa.regioes[c.detalhe] || 0) + 1;
    }
  });
  const regioes = Object.keys(porRegiao)
    .map(nome => ({ nome, n: porRegiao[nome] }))
    .sort((a, b) => b.n - a.n);
  const ceps = Object.keys(porCep)
    .map(nome => ({ nome, n: porCep[nome] }))
    .sort((a, b) => b.n - a.n);
  const lista2 = (obj) => Object.keys(obj).map(nome => ({ nome, n: obj[nome] })).sort((a, b) => b.n - a.n);
  return { porAcademia, acessos, buscas, regioes, ceps, origens: lista2(porOrigem), aparelhos: lista2(porAparelho), pontos, tempo, totalEventos: lista.length };
}

// "Instagram 60% · Google 30%": as três primeiras, em porcentagem do total.
function topPublico(mapa, qtd = 3) {
  const total = Object.values(mapa || {}).reduce((a, b) => a + b, 0);
  if (!total) return "";
  return Object.entries(mapa).sort((a, b) => b[1] - a[1]).slice(0, qtd)
    .map(([nome, n]) => `${nome} ${Math.round(n / total * 100)}%`).join(" · ");
}

// "18 s", "2 min 10 s", "1 h 5 min".
function tempoBonito(seg) {
  seg = Math.round(seg || 0);
  if (seg < 60) return `${seg} s`;
  if (seg < 3600) { const m = Math.floor(seg / 60), s = seg % 60; return s ? `${m} min ${s} s` : `${m} min`; }
  const h = Math.floor(seg / 3600), m = Math.round((seg % 3600) / 60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
function mediana(valores) {
  if (!valores.length) return null;
  const v = [...valores].sort((a, b) => a - b), meio = Math.floor(v.length / 2);
  return v.length % 2 ? v[meio] : (v[meio - 1] + v[meio]) / 2;
}
const FAIXAS_DE_TEMPO = [
  { ate: 10, t: "Até 10 s" }, { ate: 30, t: "10 a 30 s" }, { ate: 60, t: "30 s a 1 min" },
  { ate: 180, t: "1 a 3 min" }, { ate: 600, t: "3 a 10 min" }, { ate: Infinity, t: "Mais de 10 min" },

// Tempo até agir no painel do admin: a mediana (metade fez mais rápido,

function blocoTempoAteAgir(tempo) {

    const contagem = FAIXAS_DE_TEMPO.map((f, i) => ({ nome: f.t, n: valores.filter(v => v <= f.ate && (i === 0 || v > FAIXAS_DE_TEMPO[i - 1].ate)).length }));
    const max = Math.max(1, ...contagem.map(c => c.n));

  const cartao = (rotulo, valores, detalhe) => `

  const pBusca = pct(tempo.busca.length), pContato = pct(tempo.contato.length);
  return `
    <p class="field-label" style="margin-top:18px">Tempo até agir</p>

    <div class="stats-grid">
      ${cartao("Até a primeira busca", tempo.busca, pBusca !== null ? `${tempo.busca.length} ${plural(tempo.busca.length, "visita", "visitas")} · ${pBusca}% buscaram` : `${tempo.busca.length} ${plural(tempo.busca.length, "visita", "visitas")}`)}
      ${cartao("Até chamar uma academia", tempo.contato, pContato !== null ? `${tempo.contato.length} ${plural(tempo.contato.length, "visita", "visitas")} · ${pContato}% chamaram` : `${tempo.contato.length} ${plural(tempo.contato.length, "visita", "visitas")}`)}

// ---------- relatório do percurso (admin, 05/10/2026) ----------
// Como o "funil" e a "exploração de caminho" do Google Analytics e a linha

const PERCURSO_PERIODOS = [{ key: "1", label: "Hoje" }, { key: "7", label: "7 dias" }, { key: "30", label: "30 dias" }];
async function carregarPercursos() {
  const dias = parseInt(state.percursosPeriodo || "7", 10);
  const desde = new Date();
  desde.setHours(0, 0, 0, 0);
  desde.setDate(desde.getDate() - (dias - 1));
  state.percursos = { carregando: true, linhas: (state.percursos || {}).linhas || [] };
  render();
  try {
    const r = await sb.from('passos_das_visitas')
      .select('visita, site, ordem, tipo, tela, detalhe, academia_id, origem, meio, dispositivo, segundos, created_at')
      .gte('created_at', desde.toISOString()).order('created_at', { ascending: false }).limit(5000);
    state.percursos = r.error
      ? { linhas: [], erro: /does not exist|schema cache|could not find/i.test(r.error.message || "")
          ? "O banco ainda não tem a tabela do percurso (SQL 20261005140000): ela entra sozinha com o PR." : "Não consegui carregar os percursos agora." }
      : { linhas: r.data || [] };
  } catch { state.percursos = { linhas: [], erro: "Não consegui carregar os percursos agora." }; }
  render();
}
function duracaoTexto(seg) {
  seg = Math.max(0, Math.round(seg || 0));
  if (seg < 60) return `${seg} s`;
  if (seg < 3600) { const m = Math.floor(seg / 60), r = seg % 60; return r ? `${m} min ${r} s` : `${m} min`; }
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
function relogioDoPercurso(seg) {
  seg = Math.max(0, Math.round(seg || 0));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), r = seg % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + ":" + String(r).padStart(2, "0");
}
function textoDoPasso(p) {
  const d = p.detalhe || p.tela || "";
  if (p.tipo === "busca") return `Buscou ${d}`;
  if (p.tipo === "ficha") return `Abriu a ficha: ${d}`;
  if (p.tipo === "contato") return `Chamou no ${d}`;
  if (p.tipo === "saida") return "Saiu (fechou ou trocou de aba)";
  return d;
}
// Para os caminhos mais comuns: cada passo vira uma palavra.
function etapaDoPasso(p) {
  const d = p.detalhe || "";
  if (p.tipo === "busca") return "Busca";
  if (p.tipo === "ficha") return "Ficha";
  if (p.tipo === "contato") return "Contato";
  if (p.tipo === "saida") return "";
  if (p.site === "parceiros") return d.replace(/^Parceiros · /, "");
  if (d === "Página inicial") return "Início";
  if (/^Lista da busca/.test(d)) return "Lista";
  if (/^Comparação/.test(d)) return "Comparação";
  if (/^Favoritou/.test(d)) return "Favorita";
  if (/^Pôs na comparação/.test(d)) return "Comparar";
  if (/^Avaliou/.test(d)) return "Avaliou";
  return d.split(" · ")[0];
}
function visitasDoPercurso(linhas, site) {
  const mapa = new Map();
  linhas.forEach(l => { if (!mapa.has(l.visita)) mapa.set(l.visita, []); mapa.get(l.visita).push(l); });
  const visitas = [];
  mapa.forEach((passos, id) => {
    if (!passos.some(p => p.site === site)) return;
    passos.sort((a, b) => (a.segundos - b.segundos) || (a.ordem - b.ordem) || String(a.created_at).localeCompare(String(b.created_at)));
    const primeiro = passos[0], ultimo = passos[passos.length - 1];
    const doSite = passos.filter(p => p.site === site);
    visitas.push({
      id, passos, primeiro, inicio: new Date(primeiro.created_at), duracao: Math.max(0, ultimo.segundos - primeiro.segundos),
      origem: primeiro.origem || "Direto", meio: primeiro.meio || "", dispositivo: primeiro.dispositivo || "",
      buscou: doSite.some(p => p.tipo === "busca"), abriuFicha: doSite.some(p => p.tipo === "ficha"),
      chamou: doSite.filter(p => p.tipo === "contato").length,
      cadastro: doSite.some(p => /Cadastro/.test(p.detalhe || "")),
      criouConta: doSite.some(p => /Criou a conta no GuiaTennis Parceiros/.test(p.detalhe || "")),
      pediu: doSite.some(p => /Pediu para administrar|Cadastro da academia enviado/.test(p.detalhe || "")),
      caminho: doSite.map(etapaDoPasso).filter(Boolean).filter((e, i, a) => i === 0 || e !== a[i - 1]).slice(0, 4).join(" → "),
    });
  });
  visitas.sort((a, b) => b.inicio - a.inicio);
  return visitas;
}

            <div class="perc-funil-i"><span>${esc(t)}</span><strong>${n}</strong><small>${i ? pct(n) : ""}</small><i style="width:${total ? Math.max(4, Math.round(n / total * 100)) : 0}%"></i></div>`).join("")}</div>

          <p class="field-label" style="margin-top:18px">Visita por visita</p>

function conteudoDasEstatisticas() {
  const periodo = state.statsPeriodo || "30";
  const { porAcademia, acessos, buscas, regioes, ceps, origens, aparelhos, pontos, tempo } = statsAgregado(periodo);
  state.statsPontos = pontos;
  const listaStat = (titulo, itens) => itens.length ? `
    <p class="field-label" style="margin-top:18px">${titulo}</p>
    <div class="stat-regioes">${itens.map(r => `
      <div class="stat-regiao"><span>${esc(r.nome)}</span><strong>${r.n}${acessos ? ` <small>${Math.round(r.n / acessos * 100)}%</small>` : ""}</strong></div>`).join("")}</div>` : "";

  const linhas = state.allCourts.map(c => {
    const d = Object.assign({ whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 }, porAcademia[c.id] || {});
    const contatos = d.whatsapp + d.site + d.instagram + d.compartilhar;
    const taxa = d.visualizacao ? (contatos / d.visualizacao) * 100 : 0;
    return { court: c, d, contatos, taxa };
  });

  const ativas = linhas.filter(r => r.d.visualizacao > 0 || r.contatos > 0);
  const paradas = linhas.filter(r => r.d.visualizacao === 0 && r.contatos === 0);

  const ordem = state.statsOrdem || "views";
  ativas.sort((a, b) => {
    if (ordem === "contatos") return b.contatos - a.contatos;
    if (ordem === "taxa") return b.taxa - a.taxa;
    return b.d.visualizacao - a.d.visualizacao;
  });

  const totViews = ativas.reduce((s, r) => s + r.d.visualizacao, 0);
  const totContatos = ativas.reduce((s, r) => s + r.contatos, 0);
  const taxaGeral = totViews ? (totContatos / totViews) * 100 : 0;

  return `
        <div class="chip-row" style="margin-top:12px">
          ${STATS_PERIODOS.map(p => `<button class="chip small ${periodo===p.key?"active":""}" data-stats-per="${p.key}">${p.label}</button>`).join("")}
        </div>

        <div class="stats-grid">
          <div class="stat-card"><p class="stat-num">${acessos}</p><p class="stat-lbl">Acessos ao site</p></div>
          <div class="stat-card"><p class="stat-num">${buscas}</p><p class="stat-lbl">Buscas feitas</p></div>
          <div class="stat-card"><p class="stat-num">${totViews}</p><p class="stat-lbl">Fichas abertas</p></div>
          <div class="stat-card"><p class="stat-num">${totContatos}</p><p class="stat-lbl">Contatos gerados</p></div>
          <div class="stat-card"><p class="stat-num">${acessos ? (buscas / acessos).toFixed(1).replace(".", ",") : "0"}</p><p class="stat-lbl">Buscas por acesso</p></div>
          <div class="stat-card"><p class="stat-num">${taxaGeral.toFixed(0)}%</p><p class="stat-lbl">Ficha → contato</p></div>
        </div>

        ${blocoTempoAteAgir(tempo)}

        ${listaStat("De onde vieram os acessos", origens)}
        ${listaStat("Aparelho", aparelhos)}

        ${pontos.length ? `
          <p class="field-label" style="margin-top:18px">Mapa das buscas (${pontos.length})</p>
          <p class="pending-detail" style="margin:0 0 6px">Cada ponto é uma busca, arredondada para o quarteirão.</p>
          <div id="stats-mapa" class="stats-mapa"></div>` : ""}

        <p class="field-label" style="margin-top:18px">De onde buscaram (${regioes.length})</p>
        ${regioes.length
          ? `<div class="stat-regioes">${regioes.map(r => `
              <div class="stat-regiao"><span>${esc(r.nome)}</span><strong>${r.n}</strong></div>`).join("")}</div>`
          : `<p class="pending-detail">Nenhuma busca registrada nesse período. Se as buscas antigas não aparecem aqui, é porque a coluna "detalhe" ainda não existia quando foram feitas.</p>`}

        ${ceps.length ? `
          <p class="field-label" style="margin-top:18px">CEPs buscados (${ceps.length})</p>
          <div class="stat-regioes">${ceps.map(r => `
            <div class="stat-regiao"><span>${esc(r.nome)}</span><strong>${r.n}</strong></div>`).join("")}</div>` : ""}

        <div class="chip-row" style="margin-top:16px">
          <span class="stats-ord-lbl">Ordenar:</span>
          <button class="chip small ${ordem==="views"?"active":""}" data-stats-ord="views">Mais vistas</button>
          <button class="chip small ${ordem==="contatos"?"active":""}" data-stats-ord="contatos">Mais contatos</button>
          <button class="chip small ${ordem==="taxa"?"active":""}" data-stats-ord="taxa">Melhor taxa</button>
        </div>

        <p class="field-label" style="margin-top:16px">Com movimento (${ativas.length})</p>
        ${ativas.length === 0 ? `<p class="empty">Nenhum registro nesse período.</p>` : ""}
        ${ativas.map(r => `
          <div class="pending-item">
            <div class="stat-row-top">
              <p class="pending-name display" style="margin:0">${esc(r.court.name)}</p>
              ${r.d.visualizacao ? `<span class="stat-taxa ${r.taxa >= 15 ? 'boa' : (r.taxa > 0 ? 'media' : 'zero')}">${r.taxa.toFixed(0)}%</span>` : ""}
            </div>
            <p class="pending-detail">${icon('eye',12)} ${r.d.visualizacao} ficha${r.d.visualizacao===1?"":"s"} aberta${r.d.visualizacao===1?"":"s"} &nbsp;·&nbsp; ${r.contatos} contato${r.contatos===1?"":"s"}</p>
            <p class="pending-detail">${icon('phone',12)} ${r.d.whatsapp} &nbsp; ${icon('instagram',12)} ${r.d.instagram} &nbsp; ${icon('globe',12)} ${r.d.site} &nbsp; ${icon('share',12)} ${r.d.compartilhar}</p>
            ${topPublico(r.d.origens) ? `<p class="pending-detail"><strong>Vieram de:</strong> ${esc(topPublico(r.d.origens))}</p>` : ""}
            ${topPublico(r.d.regioes) ? `<p class="pending-detail"><strong>Regiões:</strong> ${esc(topPublico(r.d.regioes))}</p>` : ""}
            ${topPublico(r.d.aparelhos) ? `<p class="pending-detail"><strong>Aparelho:</strong> ${esc(topPublico(r.d.aparelhos))}</p>` : ""}
            <button type="button" class="stat-copy" data-copy-stats="${r.court.id}">Copiar resumo pra mandar</button>
          </div>
        `).join("")}

        ${paradas.length ? `
          <p class="field-label" style="margin-top:20px">Sem movimento no período (${paradas.length})</p>
          <p class="pending-detail" style="margin-bottom:8px">${paradas.map(r => esc(r.court.name)).join(" · ")}</p>
        ` : ""}
  `;
}

const TERMS_HTML = `
<p class="footnote">Última atualização: 7 de outubro de 2026</p>
<p class="field-label" style="margin-top:16px">1. Sobre o GuiaTennis</p>
<p style="font-size:14px">O GuiaTennis é um guia online que reúne informações sobre quadras e academias de tênis, permitindo buscar por localização, comparar comodidades e preços, e entrar em contato diretamente com os estabelecimentos. O GuiaTennis não é dono, operador ou representante de nenhuma academia ou quadra listada, e não realiza reservas, cobranças ou intermediação de pagamentos. Toda negociação é feita diretamente entre o usuário e o estabelecimento. O GuiaTennis publica na página inicial os totais somados de uso do site desde o começo, arredondados para baixo e sem identificar ninguém.</p>
<p class="field-label" style="margin-top:16px">2. Precisão das informações</p>
<p style="font-size:14px">As informações exibidas são fornecidas pelas próprias academias, ou coletadas de fontes públicas quando o estabelecimento ainda não confirmou os dados — nesse caso a página mostra que é uma <strong>ficha básica</strong>. Das fontes públicas vêm só dados de identificação e localização (nome, endereço, telefone comercial, site e redes sociais), do OpenStreetMap (© colaboradores do OpenStreetMap, licença ODbL) ou do site e perfil público da própria academia; fotos, textos e avaliações de outros sites não são copiados. O GuiaTennis não garante que preços, disponibilidade, comodidades ou regras de cancelamento e reposição estejam sempre exatos — confirme diretamente com a academia antes de fechar um horário. A política de cancelamento e reposição mostrada é da academia, que pode mudá-la a qualquer momento; o GuiaTennis apenas reproduz o que ela informou e não participa dessa combinação.</p>
<p class="field-label" style="margin-top:16px">3. Cadastro de academias e quadras</p>
<p style="font-size:14px">Qualquer pessoa pode enviar uma solicitação de cadastro. Toda solicitação passa por análise antes de ser publicada. O GuiaTennis pode recusar, editar ou remover qualquer cadastro a qualquer momento. O responsável pelo estabelecimento pode pedir a correção ou a remoção da página da academia a qualquer momento, pelo link "É o responsável por esta academia?" na própria página, pelo WhatsApp (11) 92745-6457 ou pelo e-mail guiatennis1@gmail.com.</p>
<p class="field-label" style="margin-top:16px">4. GuiaTennis Parceiros (área da academia)</p>
<p style="font-size:14px">O GuiaTennis Parceiros (guiatennis.com.br/parceiros) é a parte do site para academias e quadras. Quem responde por uma academia cria a própria conta com e-mail, tratamento, nome e sobrenome, cargo, WhatsApp e senha, declara que representa a academia e pede para administrar a ficha dela ou cadastra uma academia nova. Com o e-mail confirmado, a conta passa a administrar na hora uma ficha que já está no guia e não tem responsável, e a academia nova que ela cadastrar entra no ar na hora, no plano Básico; o GuiaTennis confere depois e pode corrigir, pausar ou remover a ficha e tirar o acesso. Sem o e-mail confirmado, o pedido espera a confirmação do e-mail ou a conferência do GuiaTennis. Se a academia já tem responsável, o pedido vai para ele. Em caso de disputa — quem pediu contesta quem administra a academia —, o GuiaTennis manda um código ao WhatsApp da academia (o que estava na ficha quando o responsável atual passou a administrá-la): quem digita o código passa a ser o responsável e quem administrava perde o acesso; sem como usar o código, o GuiaTennis pode pedir documentos que mostrem quem responde pela academia e decide. Pedir para administrar ou cadastrar uma academia exige marcar a declaração de que a pessoa está autorizada pela academia e responde pelas informações que publicar; o GuiaTennis guarda a data dessa declaração. Pedir acesso a uma academia que não representa é proibido e leva à exclusão da conta. O GuiaTennis também pode criar para cada academia um acesso — usuário e senha provisória, enviados ao responsável pelo WhatsApp; no primeiro acesso, o responsável informa nome, cargo, e-mail e WhatsApp, cria uma senha nova e declara que representa a academia; a partir daí, a conta entra também por esse e-mail, que recebe o código do "Esqueci a senha". O responsável principal pode dar acesso a outras pessoas da academia pelo e-mail delas, até o número de pessoas do plano, e responde pelo que elas fazem. Quem pede para administrar uma academia que já tem responsável tem o pedido enviado a ele, com o nome e o e-mail de quem pediu; o responsável aceita ou recusa, e o GuiaTennis só decide em casos excepcionais. A mesma conta pode administrar mais de uma academia, em qualquer plano, e pedir uma academia enquanto outro pedido ainda está em análise: cada academia é pedida e confirmada separadamente, do mesmo jeito, e o plano, as pessoas com acesso e os números são de cada academia. Cada academia tem o próprio plano e paga o próprio valor: a academia que entra na conta começa no Básico, e o plano de uma não vale para as outras. <strong>Quem administra uma academia não avalia essa academia</strong>, nem com o e-mail ou o WhatsApp de quem a administra; nas outras academias, a mesma conta é usada como a de qualquer jogador. Na área da academia é possível editar a ficha da própria academia e responder às avaliações dela. A academia não pode apagar avaliações, avaliar a si mesma, mudar a situação, a exibição ou o plano da ficha, nem mexer em outra academia. Quem administra a academia pode pausar a ficha dela (tirar da busca por um tempo, ou até voltar) e trazer de volta, uma academia por vez; a pausa feita pelo GuiaTennis só o GuiaTennis desfaz, e remover a academia do guia continua sendo pedido ao GuiaTennis. O que a academia salva passa a aparecer como informação confirmada por ela, e ela responde pelo que publica. As respostas são públicas, aparecem embaixo da avaliação como "Resposta da academia" e devem ser respeitosas, sem expor dados de quem avaliou. O GuiaTennis pode remover respostas que desrespeitem estes termos e suspender o acesso em caso de uso indevido. A senha é da academia: não a compartilhe com quem não responde por ela. Os planos (Básico, gratuito; Completo e Premium, combinados diretamente com o GuiaTennis) definem o que a ficha mostra e quantas pessoas têm acesso: no Básico, até 3 comodidades, até 3 fotos, só o WhatsApp, sem a regra de cancelamento, sem "como chegar" e 1 pessoa; no Completo, a ficha inteira (todas as comodidades, até 5 fotos, WhatsApp, Instagram, site, cancelamento e como chegar — fachada, entrada e onde estacionar) e até 5 pessoas; no Premium, o mesmo, até 10 pessoas e os números da própria ficha — visitas, contatos, o dia a dia, de onde vieram, o aparelho, os bairros de quem procurou, a média das academias da cidade e o relatório do mês por e-mail. O que a academia guardou além do que o plano mostra continua guardado e volta a aparecer se ela aprimorar o plano. No cadastro e na edição, a academia preenche tudo o que quiser; ao finalizar, o site mostra o que o plano esconde e deixa escolher outro plano. Escolher o Completo ou o Premium ali (ou em "Quero o…", no painel) é um pedido: o GuiaTennis combina o valor pelo WhatsApp e nada é cobrado sem a academia confirmar. Hoje, a ordem da busca não depende do plano. Se no futuro houver destaque pago na busca, ele aparecerá identificado como patrocinado.</p>
<p class="field-label" style="margin-top:16px">5. Conta, identificação para avaliar ou cadastrar</p>
<p style="font-size:14px">Buscar, comparar e chamar academias não exige conta. <strong>Para avaliar, é preciso ter uma conta do GuiaTennis</strong> (nome, e-mail e senha; a cidade é opcional), e cada conta faz uma avaliação por academia. O nome da conta aparece junto das suas avaliações. Na conta, você escolhe se quer receber por e-mail avisos de academias novas na sua cidade e de mudanças nas suas favoritas, promoções das academias e novidades do GuiaTennis — todos começam desligados e podem ser mudados ou desligados a qualquer momento em "Minha conta". Você também pode excluir a conta por lá; as avaliações continuam publicadas, com o nome, sem a ligação com a conta. A senha é sua: não a compartilhe.</p>
<p style="font-size:14px">Antes de enviar uma solicitação de cadastro de academia, pedimos seu nome e WhatsApp — só uma vez; da próxima vez o site já reconhece você automaticamente. <strong>Seu nome fica visível publicamente</strong> junto de qualquer avaliação que você publicar. Seu WhatsApp não é exibido a outros usuários — fica visível apenas para a administração do GuiaTennis, para verificar que a avaliação ou o cadastro são legítimos.</p>
<p class="field-label" style="margin-top:16px">6. Avaliações e comentários</p>
<p style="font-size:14px">Ao avaliar uma quadra, você concorda em escrever apenas sobre experiências reais, sem conteúdo ofensivo, discriminatório, difamatório ou falso, usando seu nome verdadeiro (já que ele fica público junto da avaliação). O GuiaTennis pode remover avaliações que violem essas regras, mas não se responsabiliza pelo conteúdo publicado por usuários. A academia avaliada pode responder publicamente e pedir a análise de uma avaliação que pareça falsa ou ofensiva; quem decide se ela fica é o GuiaTennis.</p>
<p class="field-label" style="margin-top:16px">7. Uso de fotos</p>
<p style="font-size:14px">Fotos enviadas devem pertencer a quem envia, ou ter autorização de uso. Não é permitido enviar fotos de terceiros sem permissão. As fotos devem mostrar apenas o espaço físico da academia/quadra (quadras, recepção, secretaria, vestiário, fachada) — não são permitidas fotos de promoções, tabelas de preço ou materiais informativos/publicitários.</p>
<p class="field-label" style="margin-top:16px">8. Links e contatos externos</p>
<p style="font-size:14px">O GuiaTennis direciona usuários para WhatsApp, Instagram e sites das academias. Não temos controle sobre esses canais externos e não nos responsabilizamos por eles.</p>
<p class="field-label" style="margin-top:16px">9. Uso aceitável</p>
<p style="font-size:14px">Não é permitido acessar áreas administrativas sem autorização, cadastrar informações falsas propositalmente, usar o site para fins ilegais, ou extrair dados em massa (scraping) sem autorização. O GuiaTennis pode excluir, a qualquer momento, a conta (de jogador ou do GuiaTennis Parceiros) de quem descumprir estes Termos ou a lei, e remover as avaliações dessa conta; o e-mail da conta excluída não pode criar outra conta.</p>
<p class="field-label" style="margin-top:16px">10. Propriedade intelectual</p>
<p style="font-size:14px">A marca GuiaTennis, o logotipo e a identidade visual pertencem ao GuiaTennis. As informações de cada academia pertencem aos respectivos estabelecimentos.</p>
<p class="field-label" style="margin-top:16px">11. Alterações e lei aplicável</p>

            <p class="pending-detail">${(p.photos||[]).length ? `${p.photos.length} foto${p.photos.length>1?'s':''} enviada${p.photos.length>1?'s':''}` : "sem fotos"}</p>

function irAdmin(aba = "inicio", opcoes = {}) {
  if (!isAdmin) return;
  state.admAviso = "";
  state.page = "admin";
  state.adminAba = abaDoAdmin(aba);
  state.selected = null;
  state.showMenu = false;
  state.admMenu = false;
  state.showAdminPanel = false;
  state.showStatsPanel = false;
  state.showPercursos = false;
  syncUrl(!opcoes.substituir);
  render();
  window.scrollTo(0, 0);
  carregarAbaDoAdmin();
}

// Cada seção busca o que é só dela; o resto (academias, cliques, avaliações,
// acessos e pedidos) já vem com o site.
function carregarAbaDoAdmin() {
  const aba = state.adminAba;
  if (aba === "inicio" || aba === "emails") carregarSituacaoDosEmails();
  if (aba === "inicio" || aba === "jogadores") carregarNumerosDasContas();
  if (aba === "jogadores") { carregarJogadoresDoAdmin(); carregarContasExcluidas(); }
  if (aba === "emails") carregarEmailsRecentes();
  if (aba === "percursos" && !(state.percursos && state.percursos.linhas && state.percursos.linhas.length)) { state.percursosMostrar = 20; carregarPercursos(); }
}

async function carregarNumerosDasContas() {
  try {
    const r = await sb.rpc('numeros_das_contas_admin');
    state.admContas = r.error ? { erro: true } : (r.data || {});
  } catch { state.admContas = { erro: true }; }
  if (state.page === "admin") render();
}

async function carregarJogadoresDoAdmin() {
  try {
    const r = await sb.from('jogadores')
      .select('user_id, nome, email, cidade, avisos_academias, avisos_viagem, promocoes, novidades, email_confirmado_em, created_at')
      .order('created_at', { ascending: false }).limit(2000);
    state.admJogadores = r.error ? { lista: [], erro: "Não consegui carregar as contas agora." } : { lista: r.data || [] };
  } catch { state.admJogadores = { lista: [], erro: "Não consegui carregar as contas agora." }; }
  if (state.page === "admin") render();
}

async function carregarEmailsRecentes() {
  state.admEmails = { ...(state.admEmails || { lista: [] }), carregando: true };
  if (state.page === "admin") render();
  try {
    const r = await sb.rpc('emails_recentes_admin', { p_limite: 100 });
    state.admEmails = r.error
      ? { lista: [], erro: /could not find|does not exist|schema cache/i.test(r.error.message || "")
          ? "O banco ainda não tem a lista dos e-mails (SQL 20261006120000): ela entra sozinha com o PR." : "Não consegui carregar os e-mails agora." }
      : { lista: r.data || [] };
  } catch { state.admEmails = { lista: [], erro: "Não consegui carregar os e-mails agora." }; }
  if (state.page === "admin") render();
}

// ---- números ----

// Quantos eventos de um tipo entre "de" e "até" dias atrás.
function admContagem(tipos, de, ate) {
  const agora = Date.now(), ini = agora - de * 86400000, fim = agora - ate * 86400000;
  return (state.clicksRaw || []).filter(c => {
    if (!tipos.includes(c.tipo)) return false;
    const t = new Date(c.created_at).getTime();
    return t >= ini && t < fim;
  }).length;
}
// As últimas 12 semanas, da mais antiga para esta.
function admSemanas(tipos) {
  return Array.from({ length: 12 }, (_, i) => admContagem(tipos, (12 - i) * 7, (11 - i) * 7));
}
function numeroCurto(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(".", ",").replace(",0", "") + " mi";
  if (n >= 10000) return Math.round(n / 1000) + " mil";
  return n.toLocaleString("pt-BR");
}
// "▲ 12% vs 30 dias antes": subir é bom em todos os números do painel.
function admVariacao(atual, antes) {
  if (!antes && !atual) return `<span class="adm-delta">sem movimento</span>`;
  if (!antes) return `<span class="adm-delta bom">novo nos últimos 30 dias</span>`;
  const p = Math.round((atual - antes) / antes * 100);
  if (!p) return `<span class="adm-delta">igual aos 30 dias antes</span>`;
  return `<span class="adm-delta ${p > 0 ? "bom" : "ruim"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}% <small>vs 30 dias antes</small></span>`;
}
// Linha das 12 semanas, com a semana de agora em destaque.
function admMiniLinha(valores, rotulo) {
  const max = Math.max(1, ...valores), w = 120, h = 32, passo = w / (valores.length - 1);
  const pts = valores.map((v, i) => [Math.round(i * passo * 10) / 10, Math.round((h - 3 - (v / max) * (h - 6)) * 10) / 10]);
  const ult = pts[pts.length - 1];
  return `<svg class="adm-linha" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(rotulo)}: ${valores.join(", ")} por semana, nas últimas 12 semanas">
    <polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--muted-dark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ult[0]}" cy="${ult[1]}" r="4" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}
function admCartaoNumero(rotulo, tipos) {
  const atual = admContagem(tipos, 30, 0), antes = admContagem(tipos, 60, 30);
  return `
    <div class="adm-kpi">
      <p class="adm-kpi-l">${esc(rotulo)}</p>
      <p class="adm-kpi-v">${numeroCurto(atual)}</p>
      ${admVariacao(atual, antes)}
      ${admMiniLinha(admSemanas(tipos), rotulo)}
    </div>`;
}

// O que pede uma ação do admin agora, como a lista de tarefas da Shopify.
function admParaFazer() {
  const itens = [];
  const n = (x) => x || 0;
  const pend = n((state.pending || []).length);
  if (pend) itens.push({ n: pend, t: plural(pend, "academia nova esperando aprovação", "academias novas esperando aprovação"), aba: "pendencias" });
  const revisar = n((state.paraRevisar || []).length);
  if (revisar) itens.push({ n: revisar, t: plural(revisar, "academia nova foi ao ar sozinha: revise", "academias novas foram ao ar sozinhas: revise"), aba: "pendencias" });
  const ped = n(pedidosDoAdmin().length);
  if (ped) itens.push({ n: ped, t: plural(ped, "pedido para administrar uma academia", "pedidos para administrar academias"), aba: "pendencias" });
  const planos = n((state.pedidosDePlano || []).length);
  if (planos) itens.push({ n: planos, t: plural(planos, "academia quer mudar de plano", "academias querem mudar de plano"), aba: "pendencias" });
  const fora = semCoordenada().length;
  if (fora) itens.push({ n: fora, t: plural(fora, "academia fora do mapa, sem coordenada", "academias fora do mapa, sem coordenada"), aba: "ferramentas" });
  const e = state.situacaoEmails;
  if (e && (!e.chave || !e.envio || !e.relogio)) itens.push({ n: "!", t: "Os avisos por e-mail estão parados", aba: "emails" });
  else if (e && e.falharam) itens.push({ n: e.falharam, t: plural(e.falharam, "e-mail não saiu", "e-mails não saíram"), aba: "emails" });
  if (state.faltaSqlCliques) itens.push({ n: "!", t: `O banco não tem a coluna ${state.faltaSqlCliques} nos cliques: as estatísticas ficam incompletas`, aba: "estatisticas" });
  return itens;
}

function todasAsAvaliacoes() {
  const nomes = {};
  todasAsFichas().forEach(c => { nomes[c.id] = c.name; });
  const lista = [];
  Object.entries(state.reviewsCache || {}).forEach(([academiaId, avs]) => avs.forEach(r => lista.push({ ...r, academiaId, academia: nomes[academiaId] || "Academia que saiu do guia" })));
  return lista.sort((a, b) => String(b.ts || "").localeCompare(String(a.ts || "")));
}

async function excluirContaAgora() {
  const x = state.admExcluindo;

  x.salvando = true; x.erro = ""; render();
  const r = await sb.rpc('excluir_conta_admin', { p_user: x.userId, p_motivo: motivo, p_apagar_avaliacoes: !!x.apagar });

  carregarJogadoresDoAdmin();
  carregarNumerosDasContas();
  carregarContasExcluidas();
  render();

// ---------- events ----------

function attachEvents() {
  ligarCamposDeSenha();
  // ---- ordenação estilo Trivago (botão + menu suspenso) ----
  // Garante que o menu de ordenação caiba na tela, seja qual for a largura.
  const sortMenu = document.getElementById("sort-menu");
  if (sortMenu) {
    sortMenu.style.transform = "";
    const caixa = sortMenu.getBoundingClientRect();
    const folga = 12;
    if (caixa.left < folga) {
      sortMenu.style.transform = `translateX(${Math.ceil(folga - caixa.left)}px)`;
    } else if (caixa.right > window.innerWidth - folga) {
      sortMenu.style.transform = `translateX(-${Math.ceil(caixa.right - window.innerWidth + folga)}px)`;
    }
  }

  const sortToggle = document.getElementById("sort-toggle");
  if (sortToggle) sortToggle.onclick = () => { state.showSort = !state.showSort; render(); };
  const sortBackdrop = document.getElementById("sort-backdrop");
  if (sortBackdrop) sortBackdrop.onclick = () => { state.showSort = false; render(); };

  const brandHome = document.getElementById("brand-home");
  if (brandHome) brandHome.onclick = goHome;

  const irConfirmacao = document.getElementById("ir-confirmacao");
  if (irConfirmacao) irConfirmacao.onclick = () => {
    document.getElementById("ficha-confirmacao")?.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const irAvaliacoes = document.getElementById("ir-avaliacoes");
  if (irAvaliacoes) irAvaliacoes.onclick = () => {
    state.secaoFicha = "avaliacoes";
    syncUrl(false);
    irParaSecao("avaliacoes", true);
  };

  const shareBtn2 = document.getElementById("share-btn-2");
  if (shareBtn2) shareBtn2.onclick = () => shareCourt(shareBtn2.dataset.court);

  const courtBack = document.getElementById("court-back");
  if (courtBack) courtBack.onclick = voltarDaFicha;

  // ---- ficha: caminho, barra de seções e perguntas frequentes ----
  document.querySelectorAll("[data-crumb], [data-regiao-link]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return; // abrir em outra aba
      e.preventDefault();
      if (el.dataset.crumb === "home") { goHome(); return; }
      abrirRegiao({ cidade: el.dataset.cidade || "", bairro: el.dataset.bairro || "" });
    };
  });

  document.querySelectorAll("[data-poi-retry]").forEach(el => {
    el.onclick = () => {
      const c = state.selected;
      if (!c || c.id !== el.dataset.poiRetry) return;
      delete state.perto[c.id];
      atualizarPerto(c);
      carregarPerto(c);

async function autoFillFromCep(rawCep) {
  const digits = (rawCep || "").replace(/\D/g, "");
  if (digits.length !== 8) return;
  state.cepStatus = "loading";
  render();
  try {
    const data = await fetchViaCep(digits);
    const f = window.__form;
    f.address = data.logradouro || f.address;
    f.bairro = data.bairro || f.bairro;
    f.cidade = data.localidade || f.cidade;
    state.cepStatus = "idle";
  } catch (e) {
    state.cepStatus = "error";
  }
  render();
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round(height * (maxDimension / width));
            width = maxDimension;
          } else {
            width = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function useMyLocation() {
  if (!navigator.geolocation) {
    state.errorMsg = "Seu navegador não suporta localização automática.";
    state.searchStatus = "error";
    render();
    return;
  }
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const geo = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
        state.origin = geo;
        state.cep = "";
        // Busca pelo GPS não vai para o link (nunca a localização exata).
        state.termoBuscado = "";
        state.sortBy = "distance";
        state.searchStatus = "done";
        registrarBusca(geo);
      } catch (e) {
        state.errorMsg = e.message || "Não consegui identificar sua região.";
        state.searchStatus = "error";
      }
      render();
    },
    () => {
      state.errorMsg = "Não consegui acessar sua localização. Permita o acesso ou digite um CEP.";
      state.searchStatus = "error";
      render();
    },
    { timeout: 10000 }
  );
}

function shareCourt(courtId) {
  const c = todasAsFichas().find(x => x.id === courtId);
  if (!c) return;
  trackClick(courtId, "compartilhar");
  // A etiqueta faz a visita de quem recebe o link aparecer como
  // "Compartilhado" em "De onde vieram", em vez de "Direto".
  const url = `${location.origin}${caminhoDaFicha(c)}?utm_source=Compartilhado`;
  const text = `Olha essa quadra/academia que eu achei, no GuiaTennis:\n${c.name}${c.endereco ? " - " + c.endereco : (c.bairro ? " - " + c.bairro : "")}`;
  const fullText = `${text} ${url}`;

  function lastResort() {
    window.prompt("Copie o link abaixo pra compartilhar:", fullText);
  }

  try {
    if (navigator.share) {
      navigator.share({ title: c.name, text, url }).catch((err) => {
        if (err && err.name === "AbortError") return; // usuário só fechou o menu de compartilhar
        lastResort();
      });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Link copiado! Cole onde quiser compartilhar.");
      }).catch(lastResort);
    } else {
      lastResort();
    }
  } catch (e) {
    lastResort();
  }
}

// `opcoes.ordem`: a ordem que veio no link (senão, a mais perto).
// `opcoes.registrar: false`: a busca refeita pelo "voltar" não conta de novo.
async function doSearch(opcoes = {}) {
  diag(`buscando: "${state.cep}"`);
  state.errorMsg = "";
  const termo = state.cep.trim();
  state.termoBuscado = termo;
  const registrar = (geo, cep) => { if (opcoes.registrar !== false) registrarBusca(geo, cep); };
  // Página da cidade (/quadras/sao-paulo, "Ver as academias de São Paulo"):
  // todas as academias da cidade, sem procurar um endereço (pedido do Breno
  // em 05/10/2026), como as páginas de destino do Booking e do TripAdvisor.
  const r = state.regiaoLink;
  if (r && r.cidade && !r.bairro && termo === termoDaRegiao(r)) {
    state.cidadeDaPagina = r.cidade;
    state.origin = null;
    state.sortBy = opcoes.ordem || "recomendados";
    state.searchStatus = "done";
    contarNavegacao();
    guardarUltimaBusca({ bairro: "", cidade: r.cidade }, termo);
    registrar({ bairro: "", cidade: r.cidade }, null);
    render();
    return;
  }
  state.cidadeDaPagina = null;
  state.searchStatus = "loading";
  render();
  const digitsOnly = termo.replace(/\D/g, "");
  try {
    let geo;
    if (digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0) {
      geo = await geocodeCep(termo);
    } else {
      // Aceita endereço OU ponto de referência ("Escola Adventista", "Shopping Morumbi").
      const tentativas = [
        `${termo}, Brasil`,
        termo,
        state.origin && state.origin.cidade ? `${termo}, ${state.origin.cidade}, Brasil` : null,
      ].filter(Boolean);

      let result = null;
      for (const q of tentativas) {
        try { result = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
      }
      if (!result) throw new Error("Não achei esse endereço ou local. Tente incluir o bairro e a cidade.");

      // Descobre bairro/cidade reais pela coordenada, em vez de adivinhar pelo texto digitado
      let bairro = "", cidade = "", cepAchado = "";
      try {
        const rev = await reverseGeocode(result.lat, result.lng);
        bairro = rev.bairro || "";
        cidade = rev.cidade || "";
        cepAchado = rev.cep || "";
      } catch (e) {
        const parts = termo.split(",").map(s => s.trim()).filter(Boolean);
        bairro = parts.length > 1 ? parts[parts.length - 2] : parts[0];
        cidade = parts[parts.length - 1] || "";
      }
      geo = { ...result, bairro: bairro || termo, cidade, cep: cepAchado, approximate: false };
    }
    state.origin = geo;
    state.sortBy = opcoes.ordem || "distance";
    state.searchStatus = "done";
    contarNavegacao();
    guardarUltimaBusca(geo, termo);
    registrar(geo, digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0 ? digitsOnly : null);
  } catch (e) {
    diag(`a busca não achou o lugar: ${e.message}`);
    // Quem buscou e não achou também é procura: conta, sem região.
    registrar({ bairro: "", cidade: "" }, digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0 ? digitsOnly : null);
    state.errorMsg = e.message || "Não consegui buscar esse endereço ou CEP.";
    state.searchStatus = "error";
  }
  render();
}
