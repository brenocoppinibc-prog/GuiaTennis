  /* por que o GuiaTennis */
  .dif-grade { display: grid; gap: 12px; }
  @media (min-width: 720px) { .dif-grade { grid-template-columns: 1fr 1fr; gap: 14px; } }
  .dif-item { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 16px; }
  .dif-ic { display: flex; margin-bottom: 10px; }
  .dif-t { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.3; }
  .dif-d { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }

  /* por que estar no guia (academias) */
  .bloco-academias { margin: 16px 20px 28px; background: var(--green); border-radius: 18px; padding: 24px 20px; color: #fff; }
  @media (min-width: 720px) { .bloco-academias { padding: 30px 28px; } }
  .ba-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-light); margin: 0; font-weight: 700; }
  .bloco-academias h3 { font-size: 23px; font-weight: 700; margin: 8px 0 0; color: #fff; }
  @media (min-width: 720px) { .bloco-academias h3 { font-size: 27px; } }
  .ba-lista { display: grid; gap: 14px; margin-top: 18px; }
  @media (min-width: 720px) { .ba-lista { grid-template-columns: 1fr 1fr; gap: 16px 24px; } }
  .ba-item { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; }
  .ba-ic { flex-shrink: 0; margin-top: 3px; display: flex; }
  .ba-d { font-size: 14px; color: rgba(255,255,255,0.78); }
  .ba-btn { width: 100%; margin-top: 22px; background: var(--gold); color: var(--green-dark); border: none; border-radius: 12px; padding: 15px; font-family: var(--fonte-texto); font-size: 16px; font-weight: 700; cursor: pointer; }
  .ba-nota { font-size: 12px; color: rgba(255,255,255,0.7); margin: 10px 0 0; text-align: center; }


  /* ---- rodapé em colunas ---- */
  .sitefooter { background: var(--bg-alt); border-top: 1px solid var(--border); padding: 26px 20px 30px; }
  .sf-cols { display: grid; gap: 22px; }
  @media (min-width: 720px) { .sf-cols { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 30px; } }
  .sf-col h4 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .sf-col button, .sf-col a { display: block; background: none; border: none; padding: 5px 0; font-size: 14px; color: var(--muted); cursor: pointer; text-align: left; text-decoration: none; }
  .sf-col button:hover, .sf-col a:hover { color: var(--green); }
  .sf-base { border-top: 1px solid var(--border); margin-top: 22px; padding-top: 16px; font-size: 12px; color: var(--muted-dark); }
  .sf-base p { margin: 3px 0; }

  /* ---- página da academia ---- */
  .courtbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .courtbar button { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--green); padding: 4px; }
  .courtbar-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .courtpage { padding-bottom: 60px; }
  @media (min-width: 720px) { .courtpage-inner { max-width: 1140px; margin: 0 auto; } }
  .search-header { padding: 16px 20px 18px; border-bottom: 1px solid var(--border); background: var(--card); }

  /* ---- página da academia: preços como opções que se escolhe ---- */
  .court-name { font-size: 27px; font-weight: 700; line-height: 1.12; margin: 4px 0 0; }
  @media (min-width: 720px) { .court-name { font-size: 34px; } }
  .court-stars { color: var(--gold); font-size: 15px; letter-spacing: 1px; margin-top: 6px; }
  .court-addr { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; color: var(--muted); margin: 12px 0 0; line-height: 1.4; }
  .court-addr button { background: none; border: none; padding: 0; color: var(--green); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: underline; font-family: inherit; }

  .opt-nota { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

  /* barra de contato que acompanha a rolagem, como a de reservar do hotel */
  .court-cta { position: sticky; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--border); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; box-shadow: 0 -4px 16px rgba(33,31,26,0.08); }
  .court-cta .cta-btn { margin: 0; }
  .court-cta .cta-primary { flex: 1; }
  .court-cta .cta-secondary { flex: 0 0 auto; padding: 11px 15px; }
  .court-cta.up { bottom: 64px; }

  /* o preço do card da busca também passa a mostrar a faixa inteira */
  .offer-price { font-size: 23px; }
  .offer-body { flex-wrap: wrap; }

  /* ---- comodidades afastadas da modalidade, na caixa de oferta ---- */
  .offer-head { align-items: baseline; gap: 8px 16px; }
  .offer-mod { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .offer-perks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-left: auto; }
  .offer-from { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

  /* ---- vídeo de como funciona a busca ---- */
  .sec-sub { font-size: 14px; color: var(--muted); margin: -6px 0 12px; }
  .video-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--bg-alt); border: 1px solid var(--border); aspect-ratio: 16 / 9; }
  .video-player { width: 100%; height: 100%; display: block; border: 0; }
  .video-holder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }

  /* ---- selo de recomendada nos cards da página inicial ---- */
  .mini { position: relative; }
  .mini-badge { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; }

  /* ---- contato único, que serve para aula e para locação ---- */
  .offer-contact { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none; }
  .offer-contact:hover { text-decoration: underline; }
  .offer-contact .mod { font-weight: 500; color: var(--muted); }
  .contato-card { border: 1px solid var(--green-line); background: var(--green-soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .contato-card p { margin: 0; font-size: 14px; }
  .contato-card .contato-mod { font-weight: 700; font-size: 15px; }
  .contato-card .contato-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .contato-card .cta-btn { margin-top: 12px; }

  /* ---- animação "como funciona a busca" ---- */
  .demo { width: 100%; height: 100%; display: block; }
  .demo text { font-family: var(--fonte-texto); }
  .demo .cena { opacity: 0; }
  .demo .cena1 { animation: demoCena1 9s infinite; }
  .demo .cena2 { animation: demoCena2 9s infinite; }
  .demo .cena3 { animation: demoCena3 9s infinite; }
  @keyframes demoCena1 { 0% { opacity: 0 } 3%, 29% { opacity: 1 } 33%, 100% { opacity: 0 } }
  @keyframes demoCena2 { 0%, 33% { opacity: 0 } 36%, 62% { opacity: 1 } 66%, 100% { opacity: 0 } }
  @keyframes demoCena3 { 0%, 66% { opacity: 0 } 69%, 96% { opacity: 1 } 99%, 100% { opacity: 0 } }

  .demo .digita { animation: demoDigita 9s infinite; }
  @keyframes demoDigita { 0%, 5% { width: 0 } 22%, 100% { width: 104px } }
  .demo .cursor { animation: demoCursor 0.9s steps(1) infinite; }
  @keyframes demoCursor { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

  .demo .sobe1 { animation: demoSobe 9s infinite; }
  .demo .sobe2 { animation: demoSobe2 9s infinite; }
  .demo .sobe3 { animation: demoSobe3 9s infinite; }
  @keyframes demoSobe  { 0%, 34% { transform: translateY(16px) } 41%, 100% { transform: translateY(0) } }
  @keyframes demoSobe2 { 0%, 37% { transform: translateY(16px) } 44%, 100% { transform: translateY(0) } }
  @keyframes demoSobe3 { 0%, 40% { transform: translateY(16px) } 47%, 100% { transform: translateY(0) } }

  .demo .toque { animation: demoToque 9s infinite; }
  @keyframes demoToque { 0%, 74% { r: 4; opacity: 0.55 } 88%, 100% { r: 54; opacity: 0 } }
  .demo .aperta { animation: demoAperta 9s infinite; transform-origin: 320px 224px; transform-box: view-box; }
  @keyframes demoAperta { 0%, 73% { transform: scale(1) } 76% { transform: scale(0.96) } 80%, 100% { transform: scale(1) } }

  .demo .passo1 { animation: demoCena1 9s infinite; }
  .demo .passo2 { animation: demoCena2 9s infinite; }
  .demo .passo3 { animation: demoCena3 9s infinite; }

  /* quem pediu menos movimento vê a cena do meio, parada */
  @media (prefers-reduced-motion: reduce) {
    .demo .cena, .demo .digita, .demo .cursor, .demo [class*="sobe"], .demo .toque, .demo .aperta,
    .demo .passo1, .demo .passo2, .demo .passo3 { animation: none; }
    .demo .cena2, .demo .passo2 { opacity: 1; }
  }

  /* ================= ficha da academia no formato das páginas de hotel ================= */

  /* caminho: Início › Quadras em São Paulo › Bairro › Academia */
  .ht-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 10px 20px 8px; }
  .ht-crumbs button, .ht-crumbs a { background: none; border: none; padding: 0; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--green); cursor: pointer; text-decoration: underline; }
  /* Página de uma região (/quadras/sao-paulo/moema) e aviso de link antigo */
  .regiao-titulo { font-size: 22px; line-height: 1.2; margin: 14px 20px 0; }
  .aviso-link { margin: 12px 20px 0; padding: 10px 12px; background: var(--bg-alt); border-radius: 10px; font-size: 13px; color: var(--muted); }
  .cidade-link { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--green); }
  .ht-crumbs .sep { color: var(--muted-dark); }
  .ht-crumbs .cur { color: var(--muted); }

  /* galeria em mosaico: uma foto grande e até quatro menores */
  .ht-gal { position: relative; display: grid; gap: 3px; background: var(--border); height: 240px; grid-template-columns: 1fr; }
  .ht-gal .g { position: relative; overflow: hidden; background: var(--bg-alt); cursor: pointer; }
  .ht-gal .g img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ht-gal .g:not(:first-child) { display: none; }
  .ht-gal-all { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; background: rgba(20,51,42,0.82); color: #fff; border: none; border-radius: 9px; padding: 8px 13px; font-size: 12px; font-weight: 700; font-family: var(--fonte-texto); cursor: pointer; }
  @media (min-width: 720px) {
    .ht-gal { height: 400px; grid-template-rows: 1fr 1fr; }
    .ht-gal .g:not(:first-child) { display: block; }
    .ht-gal.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .ht-gal.duo { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr; }
    .ht-gal.trio { grid-template-columns: 2fr 1fr; }
    .ht-gal.trio .g:first-child { grid-row: span 2; }
    .ht-gal.quad { grid-template-columns: 2fr 1fr 1fr; }
    .ht-gal.quad .g:first-child { grid-row: span 2; }
    .ht-gal.quad .g:nth-child(4) { grid-column: span 2; }
    .ht-gal.penta { grid-template-columns: 2fr 1fr 1fr; }
    .ht-gal.penta .g:first-child { grid-row: span 2; }
  }
  @media (min-width: 1000px) { .ht-gal { border-radius: 16px; overflow: hidden; margin: 0 20px; } }

  /* duas colunas: conteúdo à esquerda, cartão de contato fixo à direita */
  .ht-body { display: block; }
  .ht-main { min-width: 0; }
  .ht-aside { display: none; }
  @media (min-width: 1000px) {
    .ht-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 30px; align-items: start; padding: 0 20px; }
    .ht-aside { display: block; position: sticky; top: 74px; padding-top: 22px; }
  }

  .ht-head { padding: 18px 20px 0; }
  @media (min-width: 1000px) { .ht-head { padding: 22px 0 0; } }
  .ht-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ht-tag { font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 999px; padding: 4px 10px; }
  .ht-score { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; text-align: left; }
  .ht-score-num { background: var(--green); color: #fff; border-radius: 10px 10px 10px 3px; font-size: 20px; font-weight: 700; padding: 8px 11px; line-height: 1; flex-shrink: 0; }
  .ht-score-num.empty { background: var(--bg-alt); color: var(--muted); }
  .ht-score-txt strong { font-size: 15px; display: block; }
  .ht-score-txt span { font-size: 13px; color: var(--muted); text-decoration: underline; }

  /* barra de seções que acompanha a rolagem */
  .ht-tabs { position: sticky; top: 54px; z-index: 15; display: flex; gap: 2px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; margin-top: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .ht-tabs::-webkit-scrollbar { display: none; }
  .ht-tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 13px 11px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .ht-tabs button.on { color: var(--green); border-bottom-color: var(--green); }
  @media (min-width: 1000px) { .ht-tabs { padding: 0; margin-top: 18px; } }

  .ht-sections { padding: 0 20px 20px; }
  @media (min-width: 1000px) { .ht-sections { padding: 0 0 24px; } }
  .ht-sec { padding-top: 26px; margin-top: 26px; border-top: 1px solid var(--border); scroll-margin-top: 110px; }
  .ht-sec:first-child { border-top: none; margin-top: 0; padding-top: 22px; }
  .ht-sec .sec-title { font-size: 21px; margin-bottom: 8px; }
  .ht-sec-sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .ht-sec .cta-btn { width: 100%; }
  .ht-about { font-size: 15px; line-height: 1.55; margin: 0; color: var(--text); }

  /* destaques do topo, no lugar das "informações populares" dos hotéis */
  .ht-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (min-width: 720px) { .ht-tiles { grid-template-columns: repeat(4, 1fr); } }
  .ht-tile { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 13px; }
  .ht-tile-ic { display: block; margin-bottom: 7px; }
  .ht-tile-t { font-size: 14px; font-weight: 700; margin: 0; line-height: 1.25; }
  .ht-tile-s { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.35; }

  /* opções de preço, no formato da lista de quartos */
  .ht-room { display: grid; grid-template-columns: 1fr; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; margin-top: 12px; }
  @media (min-width: 720px) { .ht-room { grid-template-columns: minmax(0, 1fr) 210px; } }
  .ht-room-info { padding: 15px 16px; }
  .ht-room-name { font-size: 19px; font-weight: 700; margin: 0; }
  .ht-room-desc { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
  .ht-room-price { background: var(--green-soft); border-top: 1px solid var(--green-line); padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; }
  @media (min-width: 720px) { .ht-room-price { border-top: none; border-left: 1px solid var(--green-line); align-items: flex-end; text-align: right; } }
  .ht-room-val { font-size: 24px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .sem-valor { font-size: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .court-cta-val.sem-valor { font-size: 15px; }
  .ht-room-unit { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* comodidades em grade de ícones */
  .ht-amen { display: grid; grid-template-columns: 1fr; gap: 9px; margin-top: 8px; }
  @media (min-width: 560px) { .ht-amen { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1000px) { .ht-amen { grid-template-columns: 1fr 1fr 1fr; } }
  .ht-amen-i { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--text); }

  /* localização: mapa, endereço e academias vizinhas */
  .ht-map { position: relative; z-index: 0; isolation: isolate; height: 230px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg-alt); margin-bottom: 12px; }
  .ht-map-empty { display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 24px; text-align: center; font-size: 13px; color: var(--muted); }
  .ht-addr-line { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; margin: 0; line-height: 1.45; }
  .ht-addr-line > span:first-child { flex-shrink: 0; margin-top: 2px; }
  .pin-court { display: inline-block; width: 18px; height: 18px; border-radius: 999px; background: var(--gold); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .ht-poi { display: grid; gap: 16px; margin: 8px 0 0; }
  @media (min-width: 720px) { .ht-poi { grid-template-columns: 1fr 1fr; gap: 16px 28px; } }
  .ht-poi-t { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  .ht-poi-i { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .ht-poi-n { min-width: 0; }
  .ht-poi-d { flex-shrink: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* horário na ficha */
  .hr-agora { margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: none; border-radius: 999px; padding: 2px 9px; }
  .hr-agora.sim { background: rgba(31,77,58,0.12); color: var(--green); }
  .hr-agora.nao { background: var(--bg-alt); color: var(--muted); }
  .hr-lista { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .hr-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 13px; font-size: 14px; border-bottom: 1px solid var(--border); }
  .hr-linha:last-child { border-bottom: none; }
  .hr-linha strong { font-weight: 700; }
  .hr-linha.fechado strong { color: var(--muted); font-weight: 400; }

  /* horário no cadastro */
  .pol-horas { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .pol-horas-campo { width: 80px; margin-top: 0; text-align: center; }
  .pol-form-t { font-size: 14px; font-weight: 700; color: var(--text); margin: 16px 0 6px; }
  .pol-titulo { font-size: 15px; font-weight: 700; color: var(--text); margin: 18px 0 8px; }
  .pol-titulo:first-child { margin-top: 0; }
  .hr-form { display: grid; gap: 14px; }
  .hr-form-linha { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
  .hr-form-dia { font-size: 14px; font-weight: 700; }
  .hr-fechado { justify-self: end; }
  .hr-form-campos { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .hr-form-campos.off { opacity: 0.4; }
  .hr-form-ate { font-size: 13px; color: var(--muted); }
  .hr-time { margin-top: 0; flex: 1 1 0; min-width: 0; }
  @media (min-width: 560px) {
    .hr-form-linha { grid-template-columns: 150px 1fr auto; }
    .hr-form-campos { grid-column: 2; grid-row: 1; }
    .hr-fechado { grid-column: 3; grid-row: 1; }
  }

  .ht-poi-nota { font-size: 12px; color: var(--muted-dark); margin: 12px 0 0; line-height: 1.45; }
  .ht-poi-carregando { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); margin-top: 8px; text-align: center; }
  .ht-poi-carregando p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; max-width: 320px; }
  .ht-poi-motivo { font-size: 11px; color: var(--red); margin: 10px 0 0; word-break: break-word; }
  .ht-poi-tentar { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--green); text-decoration: none; cursor: pointer; }

  /* bola de tênis girando — serve para qualquer espera do site */
  .tela-carregando { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 70vh; padding: 40px 20px; text-align: center; }
  .tela-carregando p { margin: 0; font-size: 14px; color: var(--muted); }
  .bola { display: inline-flex; flex-shrink: 0; animation: bolaGira 0.9s linear infinite; }
  @keyframes bolaGira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bola { animation-duration: 3.5s; } }

  .ht-viz { display: grid; gap: 12px; }
  @media (min-width: 1000px) { .ht-viz { grid-template-columns: 1fr 1fr; } }
  .ht-viz-c { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
  .ht-viz-foto { width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }

  .ht-viz-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ht-viz-n { font-size: 15px; font-weight: 700; line-height: 1.2; color: var(--text); }
  .ht-viz-nota { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ht-viz-nota .sbadge { font-size: 12px; padding: 2px 6px; }
  .ht-viz-l { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .ht-viz-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ht-viz-p { font-size: 16px; font-weight: 700; margin-top: 3px; color: var(--text); }
  .ht-viz-p small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .ht-viz-seta { display: flex; }

  /* avaliações em cartões */
  .ht-revs { display: grid; gap: 12px; margin-top: 8px; }
  @media (min-width: 720px) { .ht-revs { grid-template-columns: 1fr 1fr; } }
  .ht-rev { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 14px; display: flex; flex-direction: column; }
  .ht-rev-top { display: flex; align-items: center; gap: 8px; }
  .ht-rev-badge { background: var(--green); color: #fff; border-radius: 8px 8px 8px 2px; font-size: 13px; font-weight: 700; padding: 4px 8px; line-height: 1; }

  .ht-rev-text { font-size: 14px; line-height: 1.5; margin: 10px 0 0; flex: 1; }
  .ht-rev-foot { display: flex; align-items: center; gap: 9px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); }
  .ht-rev-foot .rev-avatar { width: 32px; height: 32px; font-size: 13px; }

  /* "bom saber", no lugar do "você precisa saber" dos hotéis */
  /* cancelamento e reposição */
  .pol-faixa { display: flex; align-items: center; gap: 14px; background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 14px; padding: 15px 17px; font-size: 15px; line-height: 1.45; }
  .pol-faixa.sem { background: var(--bg-alt); border-color: var(--border); }
  .pol-faixa-h { flex-shrink: 0; font-size: 32px; font-weight: 700; color: var(--green); line-height: 1; }
  .pol-faixa-ic { flex-shrink: 0; display: flex; }
  .pol-lados { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 560px) { .pol-lados { grid-template-columns: 1fr 1fr; } }
  .pol-lado { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 15px; }
  .pol-lado.ok { border-color: var(--green-line); }
  .pol-lado-ic { display: flex; margin-bottom: 9px; }
  .pol-lado-t { font-size: 15px; font-weight: 700; margin: 0; }
  .pol-lado-d { font-size: 14px; color: var(--muted); margin: 5px 0 0; line-height: 1.5; }
  .pol-texto { font-size: 15px; line-height: 1.55; border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 15px 17px; }

  .ht-know { display: grid; gap: 10px; margin-top: 6px; }
  @media (min-width: 720px) { .ht-know { grid-template-columns: 1fr 1fr; } }
  .ht-know-i { display: flex; gap: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 12px 13px; font-size: 14px; line-height: 1.45; }
  .ht-know-ic { flex-shrink: 0; margin-top: 2px; display: flex; }
  .ht-know-d { font-size: 13px; color: var(--muted); }
  .est-linha { display: block; }
  .est-linha + .est-linha { margin-top: 3px; }
  .est-linha b { color: var(--text); font-weight: 600; }
  .est-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 999px; padding: 1px 8px; }

  /* perguntas frequentes em sanfona */
  .ht-faq { border-top: 1px solid var(--border); margin-top: 6px; }
  .ht-faq details { border-bottom: 1px solid var(--border); }
  .ht-faq details:last-child { border-bottom: none; }
  .ht-faq summary { list-style: none; cursor: pointer; padding: 14px 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .ht-faq summary::-webkit-details-marker { display: none; }
  .ht-faq-ic { flex-shrink: 0; display: flex; transition: transform 0.15s ease; }
  .ht-faq details[open] .ht-faq-ic { transform: rotate(90deg); }
  .ht-faq p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 14px; }

  /* cartão fixo de contato (a coluna da direita) */
  .ht-book { border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: var(--shadow-lg); padding: 16px; }
  .ht-book-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .ht-book-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .ht-book-opt { font-size: 14px; color: var(--muted); }
  .ht-book-val { font-size: 19px; font-weight: 700; white-space: nowrap; }
  .ht-book-div { border-top: 1px solid var(--border); margin: 12px 0; }
  .ht-book-score { display: flex; align-items: center; gap: 9px; font-size: 14px; }
  .ht-book-sub { font-size: 12px; color: var(--muted); }
  .ht-book .cta-btn { width: 100%; }
  .ht-book-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; text-align: center; line-height: 1.4; }

  /* barra fixa do rodapé, só no celular (no desktop o cartão da direita resolve) */
  .court-cta-price { display: flex; flex-direction: column; margin-right: 4px; min-width: 0; }
  .court-cta-val { font-size: 17px; font-weight: 700; white-space: nowrap; line-height: 1.1; }
  .court-cta-unit { font-size: 11px; color: var(--muted); white-space: nowrap; }
  @media (min-width: 1000px) { .court-cta { display: none; } }

  /* ================= Acabamento limpo (30/09/2026) =================
     Pedido do Breno: o site estava aglomerado. Como Airbnb e Booking:
     letra sem serifa no texto (Inter), a Playfair só nos títulos e na
     marca, texto de 15–16px, mais ar entre os blocos, bordas mais leves e
     botões e campos maiores para o dedo. Fica no fim para valer sobre o
     resto. */
  :root {
    --fonte-texto: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --fonte-titulo: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --border: #E9E3D7;
    --muted: #6B6557;
    --muted-dark: #9A937F;
    --shadow: 0 1px 2px rgba(33,31,26,0.04), 0 6px 18px rgba(33,31,26,0.05);
  }
  strong, b { font-weight: 600; }

  /* textos pequenos: nada abaixo de 12px, o comum em 13–14px */
  .footnote { font-size: 13px; line-height: 1.5; margin-top: 18px; }
  .subtitle { font-size: 15px; line-height: 1.5; }
  .pending-detail { font-size: 13px; line-height: 1.45; }
  .status-line { font-size: 13px; }
  .inline-link { font-size: inherit; }
  .consent-row { font-size: 13px; line-height: 1.5; gap: 10px; }
  .consent-row input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 1px; }

  /* botões e campos maiores, com texto de 16px (o iPhone não dá zoom) */
  .cta-btn { padding: 13px 16px; font-size: 15px; border-radius: 12px; min-height: 48px; }
  .cta-col { gap: 10px; }
  .btn-primary { font-size: 15px; border-radius: 12px; min-height: 48px; }
  .form-field { font-size: 16px; padding: 13px 14px; border-radius: 12px; margin-top: 12px; background: var(--card); }
  .form-field:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,77,61,0.12); }
  .field-label { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--text); margin: 22px 0 8px; }
  .chip { font-weight: 500; font-size: 14px; padding: 8px 14px; }
  .chip.small { font-size: 13px; padding: 7px 12px; }
  .chip-row { gap: 8px 8px; }
  .sheet-content { padding: 26px 22px 30px; }
  .sheet-title { font-size: 28px; line-height: 1.15; }
  .sheet-close { top: 18px; right: 18px; width: 36px; height: 36px; background: var(--bg-alt); }

  /* cabeçalho e página inicial com mais ar */
  .home-head { padding: 14px 20px; border-bottom-color: transparent; box-shadow: 0 1px 0 var(--border); }
  .home-brand h1 { font-size: 24px; }
  .home-hero { padding: 34px 20px 30px; }
  .home-hero h2 { font-size: 32px; line-height: 1.15; }
  @media (min-width: 720px) { .home-hero { padding: 56px 20px 40px; } .home-hero h2 { font-size: 46px; } }
  .home-hero .home-hero-sub { margin-top: 16px; font-size: 15px; line-height: 1.55; }
  .searchcard { margin-top: 24px; border-radius: 16px; box-shadow: 0 2px 4px rgba(33,31,26,0.04), 0 10px 30px rgba(33,31,26,0.07); }
  .sc-row { padding: 12px 16px; }
  .sc-label { font-size: 12px; font-weight: 500; }
  .sc-input { font-size: 16px; font-weight: 600; }
  .sc-foot { padding: 14px 16px 16px; }
  .sc-go { font-size: 16px; font-weight: 600; border-radius: 12px; }
  .home-sec { padding: 26px 20px 30px; }
  .home-sec h3 { font-size: 23px; margin: 0 0 16px; }
  @media (min-width: 720px) { .home-sec { padding: 34px 20px 38px; } .home-sec h3 { font-size: 28px; } }
  .home-strip { gap: 14px; padding-bottom: 10px; }
  .mini { flex-basis: 220px; border-radius: 14px; }
  .mini-body { padding: 14px 16px 16px; }
  .mini-name { font-size: 16px; font-weight: 600; }
  .mini-score, .mini-stars { margin-top: 6px; }
  .dif-grade { gap: 14px; }
  /* ícone ao lado do texto, como os destaques do Airbnb: mais curto */
  .dif-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 14px; padding: 20px; border-radius: 16px; }
  .dif-ic { grid-row: span 2; margin: 2px 0 0; }
  .dif-t { font-size: 16px; font-weight: 600; }
  .dif-d { font-size: 15px; line-height: 1.55; margin-top: 4px; }
  .city-tabs { gap: 22px; margin-bottom: 16px; }
  .city-note { font-size: 14px; margin-bottom: 16px; }
  .bloco-academias { margin: 24px 20px 36px; padding: 30px 22px; border-radius: 20px; }
  .ba-lista { gap: 18px; margin-top: 22px; }
  .ba-item { font-size: 16px; line-height: 1.5; }
  .ba-d { font-size: 15px; line-height: 1.55; margin-top: 2px; }
  .ba-btn { font-weight: 600; border-radius: 14px; padding: 16px; }
  .ba-nota { font-size: 13px; margin-top: 14px; }
  .ban-item strong { font-weight: 700; }
  .ban-item span { font-size: 13px; }

  /* busca: lista com respiro, cartão mais limpo */
  .search-header { padding: 20px 20px 22px; border-bottom-color: transparent; }
  .regiao-titulo { font-size: 26px; margin: 22px 20px 0; }
  .toolbar { padding: 14px 20px; background: rgba(247,244,236,0.96); backdrop-filter: saturate(1.4) blur(8px); }
  .toolbar-count { font-size: 15px; font-weight: 600; }
  .toolbar-sub { font-size: 13px; }
  .tbtn { font-size: 14px; font-weight: 500; padding: 9px 14px; border-radius: 999px; }
  .results { gap: 18px; padding: 20px 20px 112px; }
  .rcard { border-radius: 16px; border-color: var(--border); }
  .rcard-top { padding: 16px; gap: 14px; }
  .rcard-name { font-size: 18px; font-weight: 600; line-height: 1.25; }
  @media (min-width: 720px) { .rcard-name { font-size: 21px; } }
  .rcard-score { margin-top: 8px; }
  .rcard-line { font-size: 14px; margin-top: 8px; }
  .sbadge { font-weight: 600; }
  .sword { font-weight: 600; }
  .offer { margin: 0 16px 16px; padding: 14px 16px; border-radius: 12px; background: #F4F8F6; border-color: #DCE9E2; }
  .offer-head { font-size: 14px; }
  .offer-mod { font-weight: 600; }
  .offer-um-val, .offer-price { font-weight: 700; }
  .offer-btn { font-weight: 600; border-radius: 10px; }
  .offer-contact { font-weight: 600; margin-top: 12px; }
  /* comodidades do cartão, em verde, como o "✓ Wi-Fi grátis" do Trivago */
  .rcard-selos { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: 14px; font-weight: 500; color: var(--green); }
  .rcard-selos span { display: inline-flex; align-items: center; gap: 5px; }
  .offer-body { margin-top: 0; align-items: center; }
  .offer-dois { gap: 24px; }
  .offer-um-lbl { font-size: 13px; }
  .offer-um-val { font-size: 22px; }
  .offer-um-val.sem-valor { font-size: 16px; color: var(--muted); }
  /* "/h" do lado do valor, menor, como o "/noite" do Airbnb e do Booking. */
  .offer-por-hora { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .offer-sub { font-size: 13px; margin-top: 2px; }
  .rail-btn { font-weight: 600; }
  .rcard-tag, .mini-badge, .card-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 9px; }

  /* gaveta de filtros */
  .drawer-head { padding: 18px 20px; }
  .drawer-head strong { font-size: 18px; font-weight: 600; }
  .drawer-body { padding: 4px 20px 20px; }
  .drawer-foot { padding: 14px 20px; }
  .fgroup { padding: 20px 0; }
  .fgroup-title { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 10px; }
  .opt { font-size: 15px; padding: 10px 0; gap: 12px; }
  .opt-count { font-size: 13px; font-weight: 500; }
  .sort-opt { font-size: 14px; font-weight: 500; padding: 12px 14px; }
  .sort-opt small { font-size: 13px; font-weight: 400; }
  .active-chips { padding: 14px 20px 0; }
  .achip { font-weight: 500; font-size: 13px; padding: 6px 12px; }

  /* ficha da academia: seções separadas por espaço, não por caixas */
  .courtbar { padding: 10px 16px; }
  .courtbar-name { font-weight: 600; }
  .ht-crumbs { font-size: 13px; padding: 14px 20px 10px; }
  .ht-crumbs button, .ht-crumbs a { font-size: 13px; font-weight: 500; }
  .ht-head { padding: 22px 20px 0; }
  .court-name { font-size: 30px; line-height: 1.15; }
  @media (min-width: 720px) { .court-name { font-size: 38px; } }
  .ht-tags { gap: 8px; margin-top: 14px; }
  .ht-tag { font-size: 13px; font-weight: 500; padding: 5px 12px; }
  .ht-score { margin-top: 16px; }
  .ht-score-num { font-weight: 700; }
  .ht-score-txt strong { font-weight: 600; }
  .court-addr { font-size: 15px; margin-top: 14px; }
  .ficha-basica { font-size: 13.5px; padding: 11px 13px; margin-top: 16px; border-radius: 12px; line-height: 1.5; }
  .ht-tabs { margin-top: 22px; }
  .ht-tabs button { padding: 15px 12px; font-weight: 500; }
  .ht-tabs button.on { font-weight: 600; }
  .ht-sec { padding-top: 34px; margin-top: 34px; }
  .ht-sec:first-child { padding-top: 28px; }
  .ht-sec .sec-title { font-size: 24px; margin-bottom: 14px; }
  .ht-sec-sub { font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .ht-about { font-size: 16px; line-height: 1.7; }
  .ht-tiles { gap: 12px; margin-top: 22px; }
  .ht-tile { padding: 16px; border-radius: 14px; }
  .ht-tile-t { font-weight: 600; font-size: 15px; }
  .ht-tile-s { font-size: 13px; margin-top: 4px; }
  .ht-room { border-radius: 16px; margin-top: 14px; }
  .ht-room-info { padding: 18px 18px; }
  .ht-room-name { font-size: 20px; font-weight: 600; }
  .ht-room-desc { font-size: 14px; margin-top: 4px; }
  .ht-room-price { padding: 16px 18px; background: #F4F8F6; }
  .ht-room-val { font-weight: 700; }
  .ht-amen { gap: 12px; margin-top: 12px; }
  .ht-amen-i { font-size: 15px; gap: 11px; }
  .hr-linha { padding: 13px 16px; font-size: 15px; }
  .hr-linha strong { font-weight: 600; }
  .ht-poi-t { font-weight: 600; }
  .ht-poi-i { padding: 9px 0; }
  .contato-card { padding: 18px; border-radius: 14px; margin-top: 16px; background: #F4F8F6; border-color: #DCE9E2; }
  .rating-panel { padding: 18px 20px; border-radius: 16px; gap: 22px; }
  .rp-num { font-weight: 700; }
  .rate-box { padding: 20px; border-radius: 14px; margin-top: 22px; }
  .rate-box p { font-size: 14px; }
  .ht-revs { gap: 14px; margin-top: 12px; }
  .ht-rev { padding: 18px; border-radius: 16px; }
  .ht-rev-text { font-size: 15px; line-height: 1.6; margin-top: 12px; }
  .ht-rev-foot { margin-top: 14px; padding-top: 14px; }
  .rev-name { font-size: 14px; font-weight: 600; }
  .rev-date { font-size: 13px; }
  .court-cta { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(33,31,26,0.06); border-top-color: transparent; }
  .court-cta-price { min-width: 0; }

  /* menu e rodapé */
  .menu-drawer { padding: 18px 20px calc(28px + env(safe-area-inset-bottom)); }
  .menu-grupo { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; margin: 24px 0 6px; }
  .menu-item { font-size: 15px; font-weight: 500; padding: 12px 10px; }

  /* ================= GuiaTennis Parceiros (/parceiros) =================
     O site da academia, no padrão do trivago Business Studio e do Booking
     para Parceiros: cabeçalho próprio, página de apresentação, planos,
     painel com os números e barra de atalhos embaixo no celular. */
  /* Conta do GuiaTennis Parceiros: etapas do cadastro, pedido, pessoas e
     a oferta do próximo plano. */
  .pc-botao-cheio { width: 100%; justify-content: center; margin-top: 16px; padding: 12px 0; text-decoration: none; display: flex; }
  a.pc-botao-cheio { color: #fff !important; }
  .pc-achou { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 15px; font-weight: 600; color: var(--green); }
  .pc-oferta { margin-top: 20px; border-color: #E6D3A5; background: linear-gradient(180deg, #FFFBF1, var(--card)); }
  .pc-oferta-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8E6D25; margin: 0 0 8px; }
  .pc-oferta-lista { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }

// riscos de movimento saindo pela esquerda e o cabo reto com a ponta. O
// cabeçalho, o menu, o rodapé, o GuiaTennis Parceiros e o QR code usam esta

// LOGO-FIM para fazer os ícones, a imagem de compartilhar e a 404.
// LOGO-INICIO
function logoDesenho(opcoes) {
  opcoes = opcoes || {};

  // o GUIATENNIS caber embaixo.
  const [x, y, escala] = opcoes.comNome ? [507, 349, 1] : [500, 425, 1.285];
  const cordas = [-55, 0, 55].map(c => `<line x1="${c}" y1="-200" x2="${c}" y2="200"/><line x1="-150" y1="${c}" x2="150" y2="${c}"/>`).join("");
  return `<defs>
<linearGradient id="${id}-fundo" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2A5C4B"/><stop offset="1" stop-color="#153229"/></linearGradient>
<clipPath id="${id}-cabeca"><ellipse rx="146" ry="197"/></clipPath>
</defs>
<rect width="1080" height="1080" rx="${opcoes.quadrado ? 0 : 220}" fill="url(#${id}-fundo)"/>
<g transform="translate(${x} ${y}) scale(${escala})">
<path d="M-242 8L-192 -29M-252 59L-192 16M-257 113L-192 64" fill="none" stroke="${ouro}" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
<g transform="rotate(-15)">
<g clip-path="url(#${id}-cabeca)" stroke="${ouro}" stroke-width="5" opacity="0.6">${cordas}</g>
<ellipse rx="163" ry="214" fill="none" stroke="${creme}" stroke-width="38"/>
<rect x="-30" y="224" width="60" height="232" rx="30" fill="${creme}"/>
<ellipse cy="466" rx="34" ry="16" fill="${creme}"/>
<circle r="100" fill="${ouro}" stroke="${creme}" stroke-width="8"/>
</g>
</g>${opcoes.comNome ? `
<text x="540" y="945" text-anchor="middle" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="700" font-size="90" letter-spacing="1"><tspan fill="${creme}">GUIA</tspan><tspan fill="${ouro}">TENNIS</tspan></text>` : ""}`;
}

// O banco guarda as escolhas na ordem em que foram clicadas. Esta função põe
// tudo de volta na ordem das listas acima, para que piso, cobertura,
// modalidade e comodidades apareçam sempre na mesma sequência — na busca, no
// cadastro, na ficha e na comparação.
function naOrdem(opcoes, escolhidas) {
  const tem = new Set(escolhidas || []);
  return opcoes.filter(o => tem.has(o.key));
}

function rotulosNaOrdem(opcoes, escolhidas) {
  return naOrdem(opcoes, escolhidas).map(o => o.label);
}

function matchesAmenityFilter(court, filterKey) {
  if (filterKey === "estacionamento") {
    return court.amenities?.includes("estacionamento_gratuito") || court.amenities?.includes("estacionamento_pago");

// O que cada plano libera na ficha (pedido do Breno em 02/10/2026). Nome,
// endereço, quadras e os tipos, modalidade, preço e horário são de todos.
// O Básico mostra até 3 comodidades, até 3 fotos e só o WhatsApp, sem
// cancelamento e sem "como chegar" (fachada, entrada e onde estacionar); o
// Completo e o Premium mostram tudo. Números (Desempenho)
// só no Premium — o banco confere (SQL 20261002120000).
const LIMITES_DO_PLANO = {
  basico: { fotos: 3, comodidades: 3, contatos: ["whatsapp"], cancelamento: false, chegada: false, numeros: false },
  completo: { fotos: 5, comodidades: Infinity, contatos: ["whatsapp", "instagram", "site"], cancelamento: true, chegada: true, numeros: false },
  premium: { fotos: 5, comodidades: Infinity, contatos: ["whatsapp", "instagram", "site"], cancelamento: true, chegada: true, numeros: true },
};
// O máximo de fotos de qualquer plano: o cadastro aceita até aqui, e a ficha
// mostra o que o plano da academia libera.
const FOTOS_MAXIMO = 5;
function limitesDoPlano(plano) {
  return LIMITES_DO_PLANO[plano] || LIMITES_DO_PLANO.basico;
}
// A ficha como aparece no site: cortada pelo plano. O que a academia
// guardou além disso continua no banco (c.integral) e volta se ela
// aprimorar o plano; o formulário de edição usa o integral.
function aplicarPlano(c) {
  const l = limitesDoPlano(c.plano);
  const integral = { photos: c.photos || [], amenities: c.amenities || [], instagram: c.instagram, site: c.site, acesso: c.acesso || {}, politica: c.politica || {} };
  return {
    ...c,
    integral,
    photos: integral.photos.slice(0, l.fotos),
    amenities: integral.amenities.slice(0, l.comodidades),
    instagram: l.contatos.includes("instagram") ? c.instagram : "",
    site: l.contatos.includes("site") ? c.site : "",
    acesso: l.chegada ? integral.acesso : {},
    politica: l.cancelamento ? integral.politica : {},
  };
}

// Política de cancelamento e reposição. Fica na coluna "politica" (jsonb) da
// tabela academias, no formato { reposicao, foraDoPrazo }.
// Uma escolha só: com quantas horas de antecedência a academia gera a
// reposição da aula desmarcada. "nao" é para quem não faz reposição.
const REPOSICAO_OPTS = [
  { key: "12", label: "12h", horas: 12 },
  { key: "24", label: "24h", horas: 24 },
  { key: "48", label: "48h", horas: 48 },
  { key: "nao", label: "Não tem reposição", horas: null },
];

// Além das três opções, a academia pode escrever o prazo que usa de verdade
// (6h, 36h, 72h...). Fica guardado só com o número de horas.
const REPOSICAO_MAX_HORAS = 720;

function horasDaReposicao(key) {
  const opcao = REPOSICAO_OPTS.find(x => x.key === key);
  if (opcao) return opcao.horas;
  const n = /^\d+$/.test(String(key || "")) ? parseInt(key, 10) : 0;
  return n >= 1 && n <= REPOSICAO_MAX_HORAS ? n : null;
}

function reposicaoValida(key) {
  return key === "nao" || horasDaReposicao(key) !== null;
}

// Duas dicas curtas que a academia escreve: como achar o lugar e o que fazer
// ao chegar. Ficam na coluna "acesso" (jsonb) da tabela academias.
// Onde dá para deixar o carro quando a academia não tem vaga própria.
function acessoDe(c) {
  const a = (c && c.acesso) || {};
  return {
    fachada: (a.fachada || "").trim(),
    entrada: (a.entrada || "").trim(),
    // Estacionamento é texto da academia, não lista de opção: cada lugar tem
    // uma regra própria, e o que resolve é a frase de quem conhece a rua.
    estacionar: (a.estacionar || a.estacionamentoNota || "").trim(),
  };
}

function temAcesso(c) {
  const a = acessoFicha(c);
  return !!(a.fachada || a.entrada || estacionarLinhas(c).length);
}

// ---------- entendimento dos textos da academia ----------
// Cada academia escreve de um jeito. Antes de mostrar, o site arruma a
// forma (maiúscula, ponto final, horas e valores num formato só) e entende
// do que cada frase fala, como a comparação faz com as anotações: por
// palavras-chave. Nada é inventado; só muda a forma e o lugar.

const PALAVRAS_ACENTO = [
  [/\bate\b/g, "até"], [/\bnao\b/g, "não"], [/\bvoce\b/g, "você"], [/\btambem\b/g, "também"],
  [/\bproximo\b/g, "próximo"], [/\bproxima\b/g, "próxima"], [/\bgratis\b/g, "grátis"],
  [/\bportao\b/g, "portão"], [/\brecepcao\b/g, "recepção"],
  [/\btenis\b/g, "tênis"], [/\bpra\b/g, "para"], [/\bas (?=\d{1,2}h)/g, "às "],
  [/\bfacil\b/g, "fácil"], [/\bdificil\b/g, "difícil"], [/\bsabado\b/g, "sábado"], [/\bferiado\b/g, "feriado"],
];

function arrumarTexto(texto) {
  let t = String(texto || "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
  if (!t) return "";
  // Texto todo em maiúsculas vira texto normal.
  const letras = t.replace(/[^A-Za-zÀ-ÿ]/g, "");
  if (letras.length > 6 && letras === letras.toUpperCase()) t = t.toLowerCase();
  t = t
    .replace(/([!?])\1+/g, ".")
    .replace(/!/g, ".")
    .replace(/\b(\d{1,2})\s*(?::|h)\s*00\b/gi, "$1h")
    .replace(/\b(\d{1,2})\s*(?::|h)\s*(\d{2})\b/gi, "$1h$2")
    .replace(/\b(\d{1,2})\s*(?:hs|hrs|horas)\b/gi, "$1h")
    .replace(/r\$\s*(\d+)(?:,00)?/gi, "R$ $1")
    .replace(/\b(\d+)(?:,00)?\s*reais\b/gi, "R$ $1")
    .replace(/\s+([.,;:])/g, "$1")
    .replace(/([.,;:])(?=[^\s\d])/g, "$1 ");
  PALAVRAS_ACENTO.forEach(([re, certo]) => { t = t.replace(re, certo); });
  // Maiúscula no começo de cada frase e ponto no fim.
  t = t.replace(/(^|[.;]\s+)([a-zà-ÿ])/g, (m, antes, l) => antes + l.toUpperCase());
  if (!/[.:]$/.test(t)) t += ".";
  return t;
}

// Do que cada trecho fala, na ordem em que é testado.
const TERMOS_ESTACIONAR = [
  { tipo: "manobrista", termos: ["manobrista", "valet", "vallet"] },
  { tipo: "convenio", termos: ["convenio", "conveniado", "desconto", "parceria", "parceiro"] },
  { tipo: "zona_azul", termos: ["zona azul", "area azul", "rotativo", "parquimetro", "zona verde"] },
  { tipo: "restrita", termos: ["proibido", "dificil", "nao da para parar", "nao tem vaga", "sem vaga", "complicado", "lotado"] },
  { tipo: "pago", termos: ["estacionamento", "garagem", "r$", "reais", "pago", "cobra"] },
  { tipo: "livre", termos: ["rua", "na frente", "na porta", "calcada", "livre", "gratis", "de graca", "tranquilo", "facil", "sobra vaga", "tem vaga", "vaga"] },
];

// Só o que é claramente sobre estacionar. "Garagem" e "vaga" ficam de fora:
// também servem de referência para achar o portão.
const TERMOS_E_ESTACIONAR = ["estacion", "zona azul", "manobrista", "valet", "parar o carro", "deixar o carro", "vaga na rua", "vagas na rua"];

function falaDeEstacionar(frase) {
  const t = semAcento(frase);
  return TERMOS_E_ESTACIONAR.some(x => t.includes(x));
}

function frases(texto) {
  return String(texto || "")
    .replace(/r\$\s*(\d+),(\d{2})/gi, "R$ $1") // a vírgula do valor não separa frase
    .split(/[.;\n]+|,\s+|\s+e\s+(?=depois|na |no |tem |dá |da |zona|estacion|manobr)/i)
    .map(x => x.trim())
    .filter(Boolean);
}

// O texto de estacionamento vira o modelo único: rua, pago perto,
// manobrista, convênio. Trecho sem palavra-chave segue o anterior
// ("zona azul até as 19h, depois libera").
function entenderEstacionar(texto) {
  const grupos = { rua: [], pago: [], manobrista: [], convenio: [], outros: [] };
  let rua = "";
  let ultimo = "outros";
  const forca = { zona_azul: 3, restrita: 2, livre: 1 };
  frases(texto).forEach(f => {
    const t = semAcento(f);
    const achado = TERMOS_ESTACIONAR.find(k => k.termos.some(x => t.includes(x)));
    let grupo = ultimo;
    if (achado) {
      if (achado.tipo in forca) {
        grupo = "rua";
        if (!rua || forca[achado.tipo] > forca[rua]) rua = achado.tipo;
      } else {
        grupo = achado.tipo;
      }
    }
    grupos[grupo].push(f);
    ultimo = grupo;
  });
  const junta = (lista) => lista.map(arrumarTexto).join(" ");
  return {
    rua,
    ruaDetalhe: junta(grupos.rua),
    pagoPerto: junta(grupos.pago),
    manobrista: junta(grupos.manobrista),
    convenio: junta(grupos.convenio),
    outros: junta(grupos.outros),
  };
}

// Fachada e chegada arrumadas. Frase sobre estacionamento escrita ali muda
// para o bloco de estacionamento, onde é o lugar dela — mas só quando a
// academia não tem vaga própria (senão o bloco mostra só "No local" e a frase
// sumiria) e nunca a ponto de deixar a fachada ou a chegada vazia.
function acessoFicha(c) {
  const a = acessoDe(c);
  const podeMover = !temEstacionamentoProprio(c);
  const separa = (texto) => {
    const fica = [], sai = [];
    String(texto || "").split(/(?<=[.!?;])\s+|\n+/).map(x => x.trim()).filter(Boolean)
      .forEach(f => (podeMover && falaDeEstacionar(f) ? sai : fica).push(f));
    if (!fica.length) return { fica: sai.join(" "), sai: "" };
    return { fica: fica.join(" "), sai: sai.join(". ") };
  };
  const fac = separa(a.fachada), ent = separa(a.entrada);
  return {
    fachada: arrumarTexto(fac.fica),
    entrada: arrumarTexto(ent.fica),
    estacionar: [a.estacionar, fac.sai, ent.sai].filter(Boolean).join(". "),
  };
}

const RUA_OPTS = [
  { key: "livre", label: "Livre" },
  { key: "zona_azul", label: "Zona azul" },
  { key: "restrita", label: "Difícil parar" },
];

// As linhas do estacionamento, sempre na mesma ordem: no local, na rua,
// pago perto, manobrista, convênio. Com vaga própria, a comodidade responde
// sozinha.
function estacionarLinhas(c) {
  const am = (c && c.amenities) || [];
  if (am.includes("estacionamento_gratuito")) return [{ rot: "No local", txt: "Estacionamento grátis." }];
  if (am.includes("estacionamento_pago")) return [{ rot: "No local", txt: "Estacionamento pago." }];
  const p = entenderEstacionar(acessoFicha(c).estacionar);
  const linhas = [];
  if (p.rua || p.ruaDetalhe) {
    const tag = (RUA_OPTS.find(o => o.key === p.rua) || {}).label;
    linhas.push({ rot: "Na rua", tag, txt: p.ruaDetalhe });
  }
  if (p.pagoPerto) linhas.push({ rot: "Pago perto", txt: p.pagoPerto });
  if (p.manobrista) linhas.push({ rot: "Manobrista", txt: p.manobrista });
  if (p.convenio) linhas.push({ rot: "Convênio", txt: p.convenio });
  if (p.outros) linhas.push({ rot: "", txt: p.outros });
  return linhas;
}

function estacionarTexto(c) {
  return estacionarLinhas(c)
    .map(l => [l.rot ? l.rot + ":" : "", l.tag ? l.tag + "." : "", l.txt].filter(Boolean).join(" "))
    .join(" ");
}

// ---------- horário de funcionamento ----------

// Dois jeitos de preencher: o mesmo horário de segunda a sexta, ou um
// horário para cada dia. Sábado e domingo são sempre à parte.
const HORARIO_SIMPLES = [
  { key: "semana", label: "Segunda a sexta" },
  { key: "sabado", label: "Sábado" },
  { key: "domingo", label: "Domingo" },
];

const HORARIO_POR_DIA = [
  { key: "seg", label: "Segunda", curto: "Seg" },
  { key: "ter", label: "Terça", curto: "Ter" },
  { key: "qua", label: "Quarta", curto: "Qua" },
  { key: "qui", label: "Quinta", curto: "Qui" },
  { key: "sex", label: "Sexta", curto: "Sex" },
  { key: "sabado", label: "Sábado", curto: "Sáb" },
  { key: "domingo", label: "Domingo", curto: "Dom" },
];

const HORARIO_CHAVES = ["semana", "seg", "ter", "qua", "qui", "sex", "sabado", "domingo"];

function horarioDe(c) {
  const h = (c && c.horario) || {};
  const out = { modo: h.modo === "dia" ? "dia" : "igual", nota: (h.nota || "").trim() };
  HORARIO_CHAVES.forEach(k => {
    const f = h[k] || {};
    out[k] = { de: (f.de || "").trim(), ate: (f.ate || "").trim(), fechado: !!f.fechado };
  });
  return out;
}

// Dias seguidos com o mesmo horário viram uma linha só: "Seg a qua 6h às 22h".
function agruparDias(h) {
  const grupos = [];
  HORARIO_POR_DIA.forEach((d, i) => {
    const f = h[d.key];
    if (!faixaVale(f)) return;
    const txt = faixaTexto(f);
    const ult = grupos[grupos.length - 1];
    if (ult && ult.texto === txt && ult.fimIdx === i - 1) { ult.fim = d; ult.fimIdx = i; }
    else grupos.push({ ini: d, fim: d, fimIdx: i, texto: txt, fechado: f.fechado });
  });
  return grupos.map(g => ({
    label: g.ini.key === g.fim.key ? g.ini.label : `${g.ini.curto} a ${g.fim.curto.toLowerCase()}`,
    texto: g.texto,
    fechado: g.fechado,
  }));
}

function horarioLinhas(c) {
  const h = horarioDe(c);
  if (h.modo === "dia") return agruparDias(h);
  return HORARIO_SIMPLES.filter(d => faixaVale(h[d.key]))
    .map(d => ({ label: d.label, texto: faixaTexto(h[d.key]), fechado: h[d.key].fechado }));
}

// Qual faixa vale hoje, seja qual for o modo de preenchimento.
function faixaDeHoje(c, quando) {
  const h = horarioDe(c);
  const d = quando.getDay();
  if (h.modo === "dia") return h[["domingo", "seg", "ter", "qua", "qui", "sex", "sabado"][d]];
  return d === 0 ? h.domingo : d === 6 ? h.sabado : h.semana;
}

function faixaVale(f) {
  return !!(f && (f.fechado || (f.de && f.ate)));
}

function temHorario(c) {
  return horarioLinhas(c).length > 0;
}

// "06:00" vira "6h"; "06:30" vira "6h30".
function horaTexto(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
  if (!m) return hhmm || "";
  const h = parseInt(m[1], 10);
  return m[2] === "00" ? `${h}h` : `${h}h${m[2]}`;
}

function faixaTexto(f) {
  if (!faixaVale(f)) return "";
  return f.fechado ? "Fechado" : `${horaTexto(f.de)} às ${horaTexto(f.ate)}`;
}

// Usa a hora do próprio aparelho, que para quem está no Brasil é a certa.
// Devolve null quando não dá para saber.
function abertoAgora(c) {
  const agora = new Date();
  const f = faixaDeHoje(c, agora);
  if (!faixaVale(f) || f.fechado) return faixaVale(f) ? false : null;
  const minutos = (t) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(t || "");
    return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
  };
  const ini = minutos(f.de), fim = minutos(f.ate);
  if (ini === null || fim === null) return null;
  const q = agora.getHours() * 60 + agora.getMinutes();
  return fim > ini ? (q >= ini && q < fim) : (q >= ini || q < fim);
}

// Uma regra de cancelamento: o prazo e o que acontece fora dele.
function parteDaPolitica(o) {
  o = o || {};
  let reposicao = String(o.reposicao || "");
  // Formatos antigos: "sim"/"consultar" não diziam o prazo, e o prazo vinha
  // em outro campo. Aproveita o que dá e descarta o resto.
  if (!reposicaoValida(reposicao)) {
    const antigo = numeroOuNulo(o.cancelamentoHoras);
    reposicao = (antigo && reposicaoValida(String(antigo))) ? String(antigo) : "";
  }
  return {
    reposicao,
    horas: horasDaReposicao(reposicao),
    foraDoPrazo: (o.foraDoPrazo || o.obs || "").trim(),
  };
}

function parteVale(p) {
  return !!(p.reposicao || p.foraDoPrazo);
}

// Sem modalidade marcada, não dá para excluir nenhuma das duas.
function ofereceModalidade(c, key) {
  const m = (c && c.modalidades) || [];
  return !m.length || m.includes(key);
}

// A academia escolhe: a mesma regra para aula e locação, ou uma para cada.
// Quem só dá aula (ou só aluga a quadra) fica só com a regra do que oferece.
function politicaDe(c) {
  const pol = (c && c.politica) || {};
  const aula = parteDaPolitica(pol.aula);
  const locacao = parteDaPolitica(pol.locacao);
  const temAula = ofereceModalidade(c, "aulas_proprias");
  const temLocacao = ofereceModalidade(c, "locacao");
  let modo = pol.modo === "separado" ? "separado" : "igual";
  let geral = parteDaPolitica(pol);
  if (modo === "separado" && !(temAula && temLocacao)) {
    modo = "igual";
    geral = temAula ? aula : locacao;
  }
  return { modo, geral, aula, locacao, oque: temAula ? "aula" : "reserva" };
}

function temPolitica(c) {
  const pol = politicaDe(c);
  return pol.modo === "separado"
    ? (parteVale(pol.aula) || parteVale(pol.locacao))
    : parteVale(pol.geral);
}

// As academias agora vivem no banco de dados (Supabase), não mais fixas aqui no código.

const FAVORITES_KEY = "guiatennis_favorites_v1"; // favoritos continuam só no navegador (preferência pessoal, não precisa ser compartilhada)
const VISITOR_KEY = "guiatennis_visitor_v1";

function loadVisitor() {
  try { return JSON.parse(localStorage.getItem(VISITOR_KEY) || "null"); } catch { return null; }
}
function saveVisitor(data) {
  localStorage.setItem(VISITOR_KEY, JSON.stringify(data));
}
function ensureVisitorThen(action) {
  const v = loadVisitor();
  if (v && v.nome && v.contato) {
    action();
  } else {
    state.pendingVisitorAction = action;
    state.showVisitorSetup = true;
    state.visitorError = "";
    render();
  }
}

// O Supabase devolve colunas "numeric" como texto. Sem converter, todo teste
// de `typeof lat === "number"` falha e o mapa, a distância e o "o que tem por
// perto" somem sem dizer por quê.
function numeroOuNulo(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

function mapRow(row) {
  return aplicarPlano({
    id: row.id,
    name: row.name,
    address: row.address,
    numero: row.numero,
    complemento: row.complemento,
    bairro: row.bairro,
    cidade: row.cidade,
    endereco: row.endereco,
    lat: numeroOuNulo(row.lat),
    lng: numeroOuNulo(row.lng),
    phone: row.phone,
    instagram: row.instagram,
    site: row.site,
    priceRange: row.price_range,
    priceAula: row.price_aula,
    priceLocacao: row.price_locacao,
    amenities: row.amenities || [],
    modalidades: row.modalidades || [],
    pisos: row.pisos || [],
    cobertura: row.cobertura || [],
    quadras: row.quadras || {},
    photos: row.photos || [],
    source: row.source,
    status: row.status,
    pago: !!row.pago,
    plano: row.plano || "basico",
    politica: row.politica || {},
    acesso: row.acesso || {},
    horario: row.horario || {},
    pausada: !!row.pausada,
    pausadaAte: row.pausada_ate,
    // Ficha básica: listada com dados públicos, ainda não confirmada pela
    // academia. Banco sem a coluna conta como confirmada.
    confirmada: row.confirmada !== false,
    nomeSolicitante: row.nome_solicitante,
    contatoSolicitante: row.contato_solicitante,
  });
}

function toRow(f) {
  const acesso = { ...(f.acesso || {}) };
  delete acesso.estacionamentoNota;
  delete acesso.estacionamento;
  delete acesso.padronizadoEm;
  if (temEstacionamentoProprio(f)) delete acesso.estacionar;
  return {
    name: f.name, address: f.address, numero: f.numero, complemento: f.complemento,
    bairro: f.bairro, cidade: f.cidade, endereco: f.endereco,
    phone: f.phone, instagram: f.instagram, site: f.site,
    price_range: f.priceRange,
    price_aula: f.priceAula,
    price_locacao: f.priceLocacao,
    amenities: f.amenities || [], modalidades: f.modalidades || [],
    pisos: f.pisos || [], cobertura: f.cobertura || [],
    quadras: f.quadras || {}, photos: f.photos || [],
    politica: f.politica ? politicaParaSalvar(f) : {},
    acesso,
    horario: f.horario || {},
  };
}

// fechada: quem responde é a visão "estatisticas_publicas", que devolve três

// isto falha em silêncio e o bloco de números some da página.
// Tenta primeiro a função, que é o jeito que o Supabase considera seguro
// para somar uma tabela fechada. Se ela ainda não existir no banco, cai na
// visão antiga — assim o site funciona antes e depois de rodar o SQL.
async function lerEstatisticas() {
  try {
    const r = await sb.rpc('estatisticas_publicas').single();
    if (!r.error && r.data) return r.data;
  } catch { /* função ainda não existe */ }
  try {
    const r = await sb.from('estatisticas_publicas').select('*').limit(1).single();
    if (!r.error && r.data) return r.data;
  } catch { /* visão também não existe */ }
  return null;
}

async function carregarEstatisticasPublicas() {

      // que dependia dele simplesmente não aparece.

// O visitante só lê as colunas públicas. Quem pediu o cadastro e o WhatsApp
// de quem avaliou ficam fechados no banco (SQL-SEGURANCA.sql) e só o admin vê.
const COLUNAS_ACADEMIA_PUBLICAS = "id, name, address, numero, complemento, bairro, cidade, endereco, lat, lng, phone, instagram, site, price_range, price_aula, price_locacao, amenities, modalidades, pisos, cobertura, quadras, photos, source, status, pago, plano, politica, acesso, horario, pausada, pausada_ate, confirmada, created_at";
// Colunas que chegam ao banco pelo SQL automático. Na publicação, o site
// pode ir para o ar um pouco antes do SQL: aí lê sem elas, em vez de cair
// no "*", que o visitante não pode ler.
const COLUNAS_ACADEMIA_NOVAS = ["confirmada"];
const COLUNAS_AVALIACAO_PUBLICAS = "id, academia_id, stars, comment, nome_autor, created_at";

// Enquanto o banco não tiver alguma dessas colunas, a lista falha; aí lê
// tudo, como antes, em vez de deixar o site vazio. O admin e a academia
// logada leem pela mesma lista: desde o acesso das academias, quem está
// logado também não lê as colunas de contato (o admin vê pela função
// contatos_privados).
async function lerPublico(tabela, colunas, montar, novas = []) {
  const listas = [colunas];
  if (novas.length) listas.push(colunas.split(", ").filter(c => !novas.includes(c)).join(", "));
  for (const lista of listas) {
    const r = await montar(sb.from(tabela).select(lista));
    if (!r.error) return r;
    diag(`o banco recusou a leitura de ${tabela}: ${r.error.message}${r.error.code ? " (" + r.error.code + ")" : ""}`);
  }
  return montar(sb.from(tabela).select('*'));
}

// Quem pediu o cadastro e o WhatsApp de quem avaliou: só o admin vê. Com o
// banco antes do SQL do acesso das academias, a função não existe e o admin
// ainda lê as colunas direto.
async function lerContatosPrivados() {
  try {
    const r = await sb.rpc('contatos_privados');
    if (!r.error && Array.isArray(r.data)) return r.data;
  } catch { /* função ainda não existe */ }
  const [a, v] = await Promise.all([
    sb.from('academias').select('id, nome_solicitante, contato_solicitante'),
    sb.from('avaliacoes').select('id, contato_autor'),
  ]);
  return [
    ...(a.data || []).map(x => ({ tabela: "academias", id: x.id, nome: x.nome_solicitante, contato: x.contato_solicitante })),
    ...(v.data || []).map(x => ({ tabela: "avaliacoes", id: x.id, nome: null, contato: x.contato_autor })),
  ];
}

// Respostas das academias às avaliações. Sem a tabela no banco, a ficha só
// não mostra resposta nenhuma.
async function lerRespostas() {
  try {
    const r = await sb.from('respostas').select('avaliacao_id, texto, created_at, updated_at');
    if (r.error) return {};
    const porAvaliacao = {};
    (r.data || []).forEach(x => { porAvaliacao[x.avaliacao_id] = { texto: x.texto, ts: x.created_at, editadaEm: x.updated_at }; });
    return porAvaliacao;
  } catch { return {}; }
}

async function loadEverything() {
  const { data: published, error: erroAcademias } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('status', 'published').order('created_at'), COLUNAS_ACADEMIA_NOVAS);
  state.allCourts = (published || []).map(mapRow);
  diag(`academias lidas: ${state.allCourts.length}${erroAcademias ? ` · o banco recusou: ${erroAcademias.message}` : ""}`);

  // A academia logada lê a própria ficha mesmo pausada ou em análise.
  state.minhaAcademia = null;
  if (temAcademia()) {
    const { data: minha } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('id', contaAcademia.academiaId), COLUNAS_ACADEMIA_NOVAS);
    state.minhaAcademia = minha && minha[0] ? mapRow(minha[0]) : null;
  }

  if (isAdmin) {
    const { data: pend } = await lerPublico('academias', COLUNAS_ACADEMIA_PUBLICAS, q => q.eq('status', 'pending').order('created_at'), COLUNAS_ACADEMIA_NOVAS);
    state.pending = (pend || []).map(mapRow);

    const { data: clicks } = await sb.from('cliques').select('*').order('created_at', { ascending: false }).limit(20000);
    state.clicksRaw = clicks || [];
    // Sem as colunas da busca, a gravação cai para uma versão sem elas e o
    // admin fica sem saber. Aqui ele fica sabendo, com o SQL.
    state.faltaSqlCliques = "";
    for (const coluna of ["detalhe", "cep", "lat", "origem"]) {
      const { error: semColuna } = await sb.from('cliques').select(coluna).limit(1);
      if (semColuna) { state.faltaSqlCliques = coluna; break; }
    }
    const clicksCache = {};
    (clicks || []).forEach(c => {
      if (!clicksCache[c.academia_id]) clicksCache[c.academia_id] = { whatsapp: 0, site: 0, instagram: 0 };
      clicksCache[c.academia_id][c.tipo] = (clicksCache[c.academia_id][c.tipo] || 0) + 1;
    });
    state.clicksCache = clicksCache;
  } else {
    state.pending = [];
  }

  await carregarEstatisticasPublicas();

  const { data: reviews } = await lerPublico('avaliacoes', COLUNAS_AVALIACAO_PUBLICAS, q => q.order('created_at', { ascending: false }));
  const respostas = await lerRespostas();
  const reviewsCache = {};
  (reviews || []).forEach(r => {
    if (!reviewsCache[r.academia_id]) reviewsCache[r.academia_id] = [];
    reviewsCache[r.academia_id].push({ id: r.id, stars: r.stars, comment: r.comment, nome_autor: r.nome_autor, contato_autor: r.contato_autor, ts: r.created_at, resposta: respostas[r.id] || null });
  });
  state.reviewsCache = reviewsCache;

  if (isAdmin) {
    const contatos = await lerContatosPrivados();
    const porId = {};
    contatos.forEach(x => { porId[x.tabela + ":" + x.id] = x; });
    [...state.allCourts, ...state.pending].forEach(c => {
      const x = porId["academias:" + c.id];
      if (x) { c.nomeSolicitante = x.nome; c.contatoSolicitante = x.contato; }
    });
    Object.values(reviewsCache).forEach(lista => lista.forEach(r => {
      const x = porId["avaliacoes:" + r.id];
      if (x) r.contato_autor = x.contato;
    }));
    await carregarAcessos();
  }
}

function getPlano(courtId) {
  const c = state.allCourts.find(x => x.id === courtId) || state.pending.find(x => x.id === courtId);
  return (c && c.plano) || "basico";
}

// O "pago" continua existindo e anda junto com o plano, para as telas e os
// relatórios antigos não quebrarem: básico é grátis, os outros dois são pagos.
async function setPlano(courtId, plano) {
  const { error } = await sb.from('academias')
    .update({ plano, pago: plano !== "basico" })
    .eq('id', courtId);
  if (error) {
    alert(
      "Não consegui salvar o plano.\n\n" +
      "Se a tabela ainda não tem a coluna, rode isto no SQL Editor do Supabase:\n\n" +
      "alter table academias add column if not exists plano text not null default 'basico';\n\n" +
      "Erro: " + error.message
    );
    return false;
  }
  await loadEverything();
  return true;
}

const COMPARE_MAX = 5;
const COMPARE_MIN = 2;
const COMPARE_KEY = "guiatennis_compare_v1";

function loadCompare() {
  try {
    const v = JSON.parse(localStorage.getItem(COMPARE_KEY) || "[]");
    return Array.isArray(v) ? v.slice(0, COMPARE_MAX) : [];
  } catch { return []; }
}
function setCompareList(arr) {
  state.compareList = arr;
  try { localStorage.setItem(COMPARE_KEY, JSON.stringify(arr)); } catch {}
}

function isComparing(courtId) {
  return state.compareList.includes(courtId);
}
function toggleCompare(courtId) {
  if (isComparing(courtId)) {
    setCompareList(state.compareList.filter(id => id !== courtId));
    return { ok: true };
  }
  if (state.compareList.length >= COMPARE_MAX) {
    return { ok: false, msg: `Você pode comparar até ${COMPARE_MAX} academias por vez.` };
  }
  setCompareList([...state.compareList, courtId]);
  return { ok: true };
}
function compareCourts() {
  return state.compareList
    .map(id => state.allCourts.find(c => c.id === id))
    .filter(Boolean)
    .map(c => {
      const r = getAppRating(c.id);
      return {
        ...c,
        appAvg: r.avg,
        appCount: r.count,
        distanceKm: state.origin ? haversineKm(state.origin.lat, state.origin.lng, c.lat, c.lng) : undefined,
      };
    });
}

function listaPt(arr) {
  const items = arr.filter(Boolean);
  if (!items.length) return "—";
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(", ") + " e " + items[items.length - 1];
}

function isFavorite(courtId) {

}
function toggleFavorite(courtId) {
  const favs = loadFavorites();
  const next = favs.includes(courtId) ? favs.filter(id => id !== courtId) : [...favs, courtId];
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(next));

// Modo diagnóstico: abrir o site com ?diagnostico mostra na tela cada passo
// da busca e a resposta do banco a cada gravação. Vale até fechar a aba.
const DIAGNOSTICO = (() => {
  try {
    if (new URLSearchParams(location.search).has("diagnostico")) sessionStorage.setItem("guiatennis_diag", "1");
    return sessionStorage.getItem("guiatennis_diag") === "1";
  } catch { return false; }
})();

function diag(texto) {
  if (!DIAGNOSTICO) return;
  let caixa = document.getElementById("diag-caixa");
  if (!caixa) {
    caixa = document.createElement("div");
    caixa.id = "diag-caixa";
    caixa.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:40vh;overflow:auto;background:#111;color:#9f9;font:12px/1.4 monospace;padding:8px 10px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:pre-wrap";
    document.body.appendChild(caixa);
  }
  const hora = new Date().toLocaleTimeString("pt-BR");
  caixa.textContent += `${hora}  ${texto}\n`;
  caixa.scrollTop = caixa.scrollHeight;
}

// `extras` são as colunas que o banco pode ainda não ter (cep, lat, lng,
// origem, dispositivo). Se a gravação falhar por causa delas, tenta de novo
// com menos, em vez de perder o evento.
// Tempo até agir, como o "tempo até a conversão" dos painéis grandes: em
// cada visita, a chegada leva 0, e a primeira busca e o primeiro contato
// com uma academia levam quantos segundos se passaram desde a chegada (e,
// no contato, quanto tempo a pessoa olhou a ficha). SQL 20261001130000.
const CHEGADA_AO_SITE = Date.now();
const TIPOS_DE_CONTATO = ["whatsapp", "instagram", "site"];
function segundosDesde(momento) {
  return Math.max(0, Math.min(86400, Math.round((Date.now() - momento) / 1000)));
}
function tempoAteAgir(courtId, type) {
  const t = {};
  // A chegada leva 0: marca a visita como medida, para a porcentagem de
  // quem buscou ou chamou contar só as visitas desde que o tempo existe.
  if (type === "acesso_site") t.segundos = 0;
  if (type === "visualizacao") window.__fichaAbertaEm = { id: courtId, em: Date.now() };
  if (type === "busca" && !window.__jaBuscou) {
    window.__jaBuscou = true;
    t.segundos = segundosDesde(CHEGADA_AO_SITE);
  }
  if (TIPOS_DE_CONTATO.includes(type) && !window.__jaChamou) {
    window.__jaChamou = true;
    t.segundos = segundosDesde(CHEGADA_AO_SITE);
    const ficha = window.__fichaAbertaEm;
    if (ficha && ficha.id === courtId) t.segundos_ficha = segundosDesde(ficha.em);
  }
  return t;
}

function trackClick(courtId, type, detalhe, extras) {
  // A academia chamada fica na lista do próprio aparelho ("Academias que você
  // chamou"), mesmo com o admin conectado: isso não vai para o banco.
  if (courtId && TIPOS_DE_CONTATO.includes(type)) lembrarChamada(courtId, type);
  // Quem está logado não entra na conta: nem acesso, nem busca, nem clique
  // na ficha — o admin testando e a academia olhando a própria ficha.
  if (naoConta()) return;
  const tempo = tempoAteAgir(courtId, type);
  // Clique de academia (ficha aberta, WhatsApp, Instagram, site,
  // compartilhar) leva junto de onde a pessoa veio, o aparelho e a região
  // da busca que ela fez antes — é o que permite ver isso por academia.
  if (courtId) {
    const b = state.ultimaBusca || {};
    detalhe = detalhe || b.detalhe || null;
    extras = { origem: origemDoAcesso(), dispositivo: dispositivoDoAcesso(), cep: b.cep, lat: b.lat, lng: b.lng, ...(extras || {}) };
  }
  const base = { academia_id: courtId, tipo: type };
  const comDetalhe = detalhe ? { ...base, detalhe: String(detalhe).slice(0, 120) } : base;
  const limpos = {};
  Object.entries(extras || {}).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== "") limpos[k] = v; });
  const tentativas = [];
  // Banco ainda sem as colunas do tempo: a mesma linha vai sem elas.
  if (Object.keys(tempo).length) tentativas.push({ ...comDetalhe, ...limpos, ...tempo });
  if (Object.keys(limpos).length) tentativas.push({ ...comDetalhe, ...limpos });
  if (limpos.cep && Object.keys(limpos).length > 1) tentativas.push({ ...comDetalhe, cep: limpos.cep });
  if (detalhe) tentativas.push(comDetalhe);
  tentativas.push(base);
  const enviar = (i) => sb.from('cliques').insert(tentativas[i]).then(({ error }) => {
    if (!error) { diag(`gravado no banco: ${JSON.stringify(tentativas[i])}`); return; }
    diag(`o banco recusou ${JSON.stringify(tentativas[i])}\n   motivo: ${error.message}${error.code ? " (" + error.code + ")" : ""}`);
    if (i + 1 < tentativas.length) enviar(i + 1);
    else console.warn("GuiaTennis: não consegui gravar o clique.", error.message);
  }, (erro) => diag(`sem resposta do banco: ${erro && erro.message}`));
  enviar(0);
}

// De onde a pessoa veio: link com ?utm_source, ou o site anterior, ou o
// navegador de dentro do app (Instagram e Facebook abrem o site por dentro).
function origemDoAcesso() {
  if (window.__origemAcesso !== undefined) return window.__origemAcesso;
  window.__origemAcesso = calcularOrigem();
  return window.__origemAcesso;
}

function calcularOrigem() {
  try {
    const utm = new URLSearchParams(location.search).get("utm_source");
    if (utm) return utm.slice(0, 40);
    const ua = navigator.userAgent || "";
    if (/Instagram/i.test(ua)) return "Instagram";
    if (/FBAN|FBAV/i.test(ua)) return "Facebook";
    const ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : "";
    if (!ref || ref === location.hostname) return "Direto";
    if (/instagram/.test(ref)) return "Instagram";
    if (/google\./.test(ref)) return "Google";
    if (/facebook|fb\./.test(ref)) return "Facebook";
    if (/whatsapp|wa\.me/.test(ref)) return "WhatsApp";
    if (/bing\./.test(ref)) return "Bing";
    return ref.slice(0, 40);
  } catch { return ""; }
}

function dispositivoDoAcesso() {
  const ua = navigator.userAgent || "";
  if (/iPad|Tablet/i.test(ua)) return "Tablet";
  if (/Mobi|Android|iPhone/i.test(ua)) return "Celular";
  return "Computador";
}

// Ponto da busca arredondado para ~100 m: mostra o quarteirão onde há
// procura, não a casa de ninguém.
function pontoAproximado(v) {
  return typeof v === "number" && isFinite(v) ? Math.round(v * 1000) / 1000 : null;
}

// Guarda a região que a busca alcançou — bairro, cidade, CEP (o digitado ou o
// da região achada) e o ponto arredondado para ~100 m. Nunca o endereço
// digitado nem a coordenada exata: serve para saber onde tem procura por
// quadra, não para seguir ninguém.
function registrarBusca(geo, cep) {
  if (!geo) return;
  diag(`busca pronta — região: ${[geo.bairro, geo.cidade].filter(Boolean).join(", ") || "não identificada"} · CEP: ${cep || "nenhum"} · admin: ${isAdmin ? "sim (não grava)" : "não"}`);
  if (isAdmin) { state.avisoBuscaAdmin = true; return; }
  if (contaAcademia) return;
  const regiao = [geo.bairro, geo.cidade].filter(Boolean).join(", ");
  const digitos = String(cep || geo.cep || "").replace(/\D/g, "");
  state.ultimaBusca = {
    detalhe: regiao || null,
    cep: digitos.length === 8 ? digitos.slice(0, 5) + "-" + digitos.slice(5) : null,
    lat: pontoAproximado(geo.lat),
    lng: pontoAproximado(geo.lng),
  };
  trackClick(null, "busca", regiao || "região não identificada", {
    ...state.ultimaBusca,
    dispositivo: dispositivoDoAcesso(),
  });
}
