// "Rua, número - complemento - bairro, cidade - CEP", só com o que existe:
// o admin pode publicar sem endereço completo.
function montarEndereco(f) {
  const tem = v => String(v || "").trim();
  const rua = [f.address, f.numero].filter(tem).join(", ");
  const partes = [[rua, f.complemento].filter(tem).join(" - "), [f.bairro, f.cidade].filter(tem).join(", "), f.cep].filter(tem);
  return partes.length ? partes.join(" - ") : null;
}

// "Enviar"/"Salvar" do formulário. Antes, quem não é admin vê a tela do
// plano (precisaEscolherPlano) — uma vez; a escolha fica em __planoEscolhido.
function enviarFormulario() {
  const f = window.__form;
  // Faltando o obrigatório, o envio segue e cobra o que falta, como antes;
  // a tela do plano vem quando o cadastro está pronto para sair.
  const faltaObrigatorio = regPedeTudo(f) && REG_PASSOS.some(x => regFaltas(f, x.id).length);
  if (precisaEscolherPlano(f) && !f.__planoEscolhido && !faltaObrigatorio) {
    state.regPlanoTela = true;
    render();
    const folha = document.querySelector("#register-overlay .sheet");
    if (folha) folha.scrollTop = 0;
    return;
  }
  // Conta do GuiaTennis Parceiros já tem nome e WhatsApp: não pergunta de novo.
  if (isAdmin || f.__editingId || contaAcademia) doRegisterSubmit();
  else ensureVisitorThen(doRegisterSubmit);
}

// Plano pago escolhido ao finalizar: fica anotado para o GuiaTennis (só
// para quem tem conta; sem conta, o WhatsApp da tela de sucesso resolve).
async function anotarPedidoDePlano(f, academiaId, onde) {
  if (!contaAcademia || isAdmin || !academiaId || !["completo", "premium"].includes(f.__planoEscolhido)) return;
  try { await sb.rpc('pedir_plano', { p_academia: academiaId, p_plano: f.__planoEscolhido, p_onde: onde }); }
  catch { /* banco sem a função: o WhatsApp da tela de sucesso resolve */ }
  registrarPasso("acao", { academia: academiaId, detalhe: `Escolheu o plano ${nomeDoPlano(f.__planoEscolhido)}` });
}

async function doRegisterSubmit() {
  const f = window.__form;
  const quadras = f.quadras || {};
  const hasQuadra = QUADRA_COMBOS.some(q => quadras[q.key] > 0);
  const pisos = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.piso))];
  const cobertura = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.cobertura))];

  if (f.__editingId) {
    if (!f.name.trim()) {
      state.registerError = "O nome não pode ficar em branco.";
      state.registerStatus = "error";
      state.regPasso = 0;
      render();
      return;
    }
    state.registerStatus = "saving";
    render();
    const endereco = (f.address || f.numero || f.bairro || f.cidade)
      ? `${f.address}${f.numero ? ", " + f.numero : ""}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}`
      : undefined;
    const payload = toRow({ ...f, pisos, cobertura });
    if (isAdmin) payload.confirmada = !!f.confirmada;
    if (endereco) payload.endereco = endereco; else delete payload.endereco;
    const antes = [...state.allCourts, ...(state.pending || [])].find(c => c.id === f.__editingId) || {};
    const mudouEndereco = ["address", "numero", "bairro", "cidade"].some(k => (antes[k] || "") !== (f[k] || ""));
    if (mudouEndereco || typeof antes.lat !== "number" || typeof antes.lng !== "number") {
      try {
        const geo = await localizarAcademia({ ...antes, address: f.address, numero: f.numero, bairro: f.bairro, cidade: f.cidade, endereco: endereco || antes.endereco });
        payload.lat = geo.lat; payload.lng = geo.lng;
        state.naoLocalizadas = (state.naoLocalizadas || []).filter(n => n !== antes.name);
      } catch (e) { /* salva o resto; o aviso do admin mostra quem ficou fora do mapa */ }
    }
    try {
      let { error } = await sb.from('academias').update(payload).eq('id', f.__editingId);
      if (error && faltaColunaNova(error)) {
        const semNovas = { ...payload };
        delete semNovas.politica;
        delete semNovas.acesso;
        delete semNovas.horario;
        delete semNovas.confirmada;
        ({ error } = await sb.from('academias').update(semNovas).eq('id', f.__editingId));
        if (!error) avisarSqlColunas();
      }
      if (error) throw error;
      await anotarPedidoDePlano(f, f.__editingId, "edicao");
      await loadEverything();
      if (state.selected && state.selected.id === f.__editingId) {
        const achada = state.allCourts.find(c => c.id === f.__editingId) || state.pending.find(c => c.id === f.__editingId)
          || (state.minhaAcademia && state.minhaAcademia.id === f.__editingId ? state.minhaAcademia : null);
        state.selected = achada ? decorate(achada) : state.selected;
      }
      // A academia acabou de atualizar: o "No ar, com as informações
      // confirmadas por vocês" aparece de novo em Atualizações.
      if (!isAdmin) state.fichaSalvaEm = new Date().toISOString();
      state.registerStatus = "done";
    } catch (e) {
      state.registerError = e.message || "Não consegui salvar as alterações.";
      state.registerStatus = "error";
    }
    render();
    return;
  }

  // O admin publica com o que tiver e completa depois; só o nome é preciso,
  // porque o banco não aceita academia sem nome. Quem pede cadastro pelo
  // site continua mandando o essencial.
  const missing = [];
  if (!f.name.trim()) missing.push("nome");
  if (!isAdmin) {
    if (!f.address.trim() || !f.numero.trim() || !f.bairro.trim() || !f.cidade.trim()) missing.push("endereço completo");
    if (!f.phone.trim()) missing.push("WhatsApp");
    if (!hasQuadra) missing.push("quantidade de quadras");
    if (!f.modalidades.length) missing.push("modalidade");
    if (!f.consent && !contaAcademia) missing.push("aceite dos Termos de Uso e Política de Privacidade");
    if (contaAcademia && !f.declaro) missing.push("a declaração de que você está autorizado(a) pela academia");
  }

  if (missing.length) {
    state.registerError = `Preencha: ${missing.join(", ")}.`;
    state.registerStatus = "error";
    irParaFalta(f);
    render();
    return;
  }

  state.registerStatus = "saving";
  render();
  try {
    // Sem achar no mapa, o cadastro entra assim mesmo: a coordenada é
    // buscada de novo na aprovação e quando o admin abre o site.
    let geo = { lat: null, lng: null };
    try {
      const achado = await geocodeFormAddress(f);
      if (!achado.grosso) geo = achado;
    } catch (e) { /* segue sem coordenada */ }
    const endereco = montarEndereco(f);
    const visitor = loadVisitor() || {};
    const payload = {
      ...toRow({ ...f, pisos, cobertura }),
      endereco, lat: geo.lat, lng: geo.lng,
      source: 'custom', status: 'pending',
      ...(isAdmin && f.confirmada ? { confirmada: true } : {}),
      nome_solicitante: isAdmin ? null : (contaAcademia ? contaAcademia.nome : visitor.nome),
      contato_solicitante: isAdmin ? null : (contaAcademia ? (contaAcademia.whatsapp || contaAcademia.email) : visitor.contato),
    };
    const enviar = (corpo) => {
      let q = sb.from('academias').insert(corpo);
      // Só o id: quem está logado não lê as colunas de contato.
      if (isAdmin) q = q.select('id').single();
      return q;
    };
    let { data, error } = await enviar(payload);
    if (error && faltaColunaNova(error)) {
      const semNovas = { ...payload };
      delete semNovas.politica;
      delete semNovas.acesso;
      delete semNovas.horario;
      delete semNovas.confirmada;
      ({ data, error } = await enviar(semNovas));
      if (!error) avisarSqlColunas();
    }
    if (error) throw error;
    if (isAdmin) {
      const { error: pubError } = await sb.from('academias').update({ status: 'published' }).eq('id', data.id);
      if (pubError) throw pubError;
    }
    // Academia nova da conta: com o e-mail confirmado, vai ao ar na hora e a
    // conta já administra (pedido do Breno em 06/10/2026, SQL
    // 20261006140000); sem, vira um pedido para o GuiaTennis conferir.
    if (contaAcademia && !isAdmin) {
      await recarregarConta();
      const noAr = minhasAcademias().filter(a => a.nome === f.name.trim() && a.status === "published").slice(-1)[0];
      f.__noAr = noAr ? noAr.id : null;
      await anotarPedidoDePlano(f, (data && data.id) || f.__noAr || (meusPedidos().slice(-1)[0] || {}).academiaId, "cadastro");
      if (f.__noAr) registrarPasso("acao", { site: "parceiros", academia: f.__noAr, detalhe: "Academia nova no ar na hora" });
    }
    await loadEverything();
    state.registerStatus = "done";
  } catch (e) {
    state.registerError = e.message || "Não consegui localizar esse endereço.";
    state.registerStatus = "error";
  }
  render();
}

async function init() {
  if (PARCEIROS_NO_ENDERECO_PROPRIO && noSiteDeVerdade() && /^\/parceiros(\/|$)/.test(location.pathname)) {
    location.replace(SITE_PARCEIROS + location.pathname.replace(/^\/parceiros/, "") + location.search + location.hash);
    return;
  }
  if (USANDO_BANCO_DE_TESTE) document.body.insertAdjacentHTML("afterbegin", `<div class="faixa-banco-teste">Banco de teste — nada daqui aparece no guiatennis.com.br</div>`);
  app_showLoading();
  const { data: { session } } = await sb.auth.getSession();
  await carregarConta(session);
  // Login que não é do admin nem de academia (acesso removido): sai.
  if (session && !naoConta() && !jogador) { try { await sb.auth.signOut(); } catch {} }
  diag(`site aberto · admin: ${isAdmin ? "sim" : "não"}${contaAcademia ? " · academia: " + contaAcademia.usuario : ""} · banco: ${USANDO_BANCO_DE_TESTE ? "de teste" : "de verdade"}`);
  trackClick(null, "acesso_site", null, { origem: origemDoAcesso(), dispositivo: dispositivoDoAcesso() });
  await loadEverything();

  const q = new URLSearchParams(location.search);
  // O link manda na tela: ficha, região, busca com filtros, comparação.
  lerPararAvisosDoLink();
  const linkInicial = lerLink();
  const doLink = aplicarLink(linkInicial);
  aplicarCamadas(linkInicial.q);
  // /perfil sem estar logado: abre o Entrar e, depois, o perfil.
  if (doLink.entrarParaPerfil) irPerfil();
  if (state.page === "home") aplicarPreferenciaNaBusca();
  if (doLink.ficha) {
    state.backTo = "home";
    pushRecent(doLink.ficha.id);
    trackClick(doLink.ficha.id, "visualizacao");
  }
  // Link com a busca no endereço (recarregar a página, link salvo ou
  // compartilhado, aba reaberta pelo celular): refaz a busca, e ela conta.
  const termoBusca = doLink.termo || "";
  const buscarAoAbrir = state.page === "search" && !!termoBusca;
  if (buscarAoAbrir) state.cep = termoBusca;

  // Remove da comparação academias que não existem mais (excluídas ou pausadas)
  if (state.compareList.length) {
    const validos = state.compareList.filter(id => state.allCourts.some(c => c.id === id));
    if (validos.length !== state.compareList.length) setCompareList(validos);
  }

  // Aberto direto no painel ou no desempenho: busca os números da academia.
  if (state.page === "parceiros" && ["painel", "desempenho"].includes(state.parceirosAba) && temAcademia() && acessoCompleto()) carregarNumeros();
  if (state.page === "parceiros" && ["painel", "pessoas"].includes(state.parceirosAba) && temAcademia() && acessoCompleto()) carregarPedidosDeAcesso();
  if (state.page === "parceiros" && state.parceirosAba === "pessoas" && temAcademia() && acessoCompleto()) carregarPessoas();

  state.loaded = true;
  syncUrl(false);
  render();
  if (state.page === "court" && state.secaoFicha) irParaSecao(state.secaoFicha, false);
  if (state.page === "admin") carregarAbaDoAdmin();
  if (buscarAoAbrir) doSearch({ ordem: doLink.ordem });
  completarCoordenadas();
  ligarTempoNoSite();
  ligarPushesDaConta();
  ligarPedidoDeAvaliacao();
  trazerViagemDaConta();
  // Já logado ao abrir: o balão da viagem só se o "Jogou aqui?" não tiver
  // nada para perguntar (um balão por visita).
  if (jogador && !academiasParaAvaliar().length) ligarPushViagem(PUSH_VIAGEM_ESPERA_S + 3);
  ligarSaidaDoPercurso();
}

function app_showLoading() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="tela-carregando">
      ${bolaGirando(56)}
      <p>Carregando as quadras...</p>
    </div>`;
}

init();
</script>
