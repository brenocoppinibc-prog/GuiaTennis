function renderAdminPanel(pending) {
  return `
    <div class="overlay open" id="admin-overlay">
      <div class="sheet"><div class="sheet-content">
        <button class="sheet-close" id="admin-close">✕</button>
        <p class="sheet-title display">Solicitações pendentes</p>
        <p class="subtitle" style="margin-top:4px">${pending.length} aguardando sua revisão</p>
        ${pending.length === 0 ? `<p class="empty">Nenhuma solicitação no momento.</p>` : ""}
        ${pending.map(p => `
          <div class="pending-item">
            <button type="button" class="pending-preview-btn" data-preview="${p.id}">
              <p class="pending-name display">${esc(p.name)} ${icon('edit',13,'var(--muted)')}</p>
            </button>
            <p class="pending-detail">${esc(p.address)}, ${esc(p.bairro)} - ${esc(p.cidade)}</p>
            <p class="pending-detail">${(p.pisos||[]).map(x=>PISO_OPTS.find(o=>o.key===x)?.label).join(", ") || "—"} ${p.priceAula ? "· Aula: R$ " + esc(p.priceAula) + "/hora" : ""} ${p.priceLocacao ? "· Locação: R$ " + esc(p.priceLocacao) + "/hora" : ""}</p>
            <p class="pending-detail">${totalQuadras(p) ? QUADRA_COMBOS.filter(q => p.quadras[q.key] > 0).map(q => `${p.quadras[q.key]}x ${PISO_OPTS.find(o=>o.key===q.piso)?.label} ${COBERTURA_OPTS.find(o=>o.key===q.cobertura)?.label.toLowerCase()}`).join(", ") : "sem detalhamento de quadras"}</p>
            <p class="pending-detail">${esc(p.phone || "sem telefone")}${p.instagram ? " · " + esc(p.instagram) : ""}</p>
            ${p.nomeSolicitante ? `<p class="pending-detail" style="color:var(--muted-dark)">Enviado por: ${esc(p.nomeSolicitante)} · ${esc(p.contatoSolicitante || "")}</p>` : ""}
            <p class="pending-detail">${(p.photos||[]).length ? `${p.photos.length} foto${p.photos.length>1?'s':''} enviada${p.photos.length>1?'s':''}` : "sem fotos"}</p>
            <div class="pending-actions">
              <button class="cta-btn cta-primary" data-approve="${p.id}">Aprovar</button>
              <button class="cta-btn cta-danger" data-reject="${p.id}">Rejeitar</button>
            </div>
          </div>
        `).join("")}
      </div></div>
    </div>
  `;
}

// ---------- events ----------

function attachEvents() {
  // ---- ordenação estilo Trivago (botão + menu suspenso) ----
  const sortToggle = document.getElementById("sort-toggle");
  if (sortToggle) sortToggle.onclick = () => { state.showSort = !state.showSort; render(); };
  const sortBackdrop = document.getElementById("sort-backdrop");
  if (sortBackdrop) sortBackdrop.onclick = () => { state.showSort = false; render(); };

  const viewToggle = document.getElementById("view-toggle");
  if (viewToggle) viewToggle.onclick = () => {
    state.view = state.view === "map" ? "list" : "map";
    state.mapSelected = null;
    render();
  };

  const scModalidade = document.getElementById("sc-modalidade");
  if (scModalidade) scModalidade.onchange = (e) => {
    state.modalidadeFilters = e.target.value ? [e.target.value] : [];
    render();
  };

  // ---- gaveta de filtros ----
  const drawerClose = document.getElementById("drawer-close");
  if (drawerClose) drawerClose.onclick = () => { state.showFilters = false; render(); };
  const drawerApply = document.getElementById("drawer-apply");
  if (drawerApply) drawerApply.onclick = () => { state.showFilters = false; render(); };
  const drawerOverlay = document.getElementById("drawer-overlay");
  if (drawerOverlay) drawerOverlay.onclick = (e) => { if (e.target === drawerOverlay) { state.showFilters = false; render(); } };

  document.querySelectorAll(".clear-filters").forEach(el => {
    el.onclick = () => { clearAllFilters(); render(); };
  });

  document.querySelectorAll(".f-rating").forEach(el => {
    el.onclick = () => { state.minRating = parseFloat(el.dataset.rating) || 0; render(); };
  });

  document.querySelectorAll(".f-distance").forEach(el => {
    el.onclick = () => { state.maxDistance = el.dataset.distance === "" ? null : parseFloat(el.dataset.distance); render(); };
  });

  // O slider só re-renderiza quando a pessoa solta — assim o arraste não trava.
  document.querySelectorAll(".f-price").forEach(el => {
    el.oninput = () => {
      const pb = priceBounds();
      const v = parseInt(el.value, 10);
      state.priceMax = (pb && v >= pb.max) ? null : v;
      document.querySelectorAll(".f-price-now").forEach(n => {
        n.textContent = state.priceMax === null ? "Qualquer preço" : `Até R$ ${state.priceMax}/hora`;
      });
    };
    el.onchange = () => render();
  });

  document.querySelectorAll(".f-favorites").forEach(el => {
    el.onclick = () => { state.favoritesOnly = !state.favoritesOnly; render(); };
  });
  document.querySelectorAll(".f-compareonly").forEach(el => {
    el.onclick = () => { state.compareOnly = !state.compareOnly; render(); };
  });

  // ---- chips de filtro ativo: o × tira só aquele filtro ----
  document.querySelectorAll("[data-clear]").forEach(el => {
    el.onclick = () => {
      const kind = el.dataset.clear;
      const key = el.dataset.key;
      if (kind === "price") state.priceMax = null;
      else if (kind === "rating") state.minRating = 0;
      else if (kind === "distance") state.maxDistance = null;
      else if (kind === "piso") state.pisoFilters = state.pisoFilters.filter(x => x !== key);
      else if (kind === "cobertura") state.coberturaFilters = state.coberturaFilters.filter(x => x !== key);
      else if (kind === "modalidade") state.modalidadeFilters = state.modalidadeFilters.filter(x => x !== key);
      else if (kind === "amenity") state.amenityFilters = state.amenityFilters.filter(x => x !== key);
      else if (kind === "favorites") state.favoritesOnly = false;
      else if (kind === "compareonly") state.compareOnly = false;
      render();
    };
  });

  // ---- galeria dentro do card da lista ----
  document.querySelectorAll("[data-photo-prev]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.photoPrev;
      const c = state.allCourts.find(x => x.id === id);
      if (!c) return;
      const total = courtPhotos(c).length;
      state.cardPhoto[id] = ((state.cardPhoto[id] || 0) - 1 + total) % total;
      render();
    };
  });
  document.querySelectorAll("[data-photo-next]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.photoNext;
      const c = state.allCourts.find(x => x.id === id);
      if (!c) return;
      const total = courtPhotos(c).length;
      state.cardPhoto[id] = ((state.cardPhoto[id] || 0) + 1) % total;
      render();
    };
  });

  const reviewsMore = document.getElementById("reviews-more");
  if (reviewsMore) reviewsMore.onclick = () => { state.reviewsExpanded = !state.reviewsExpanded; render(); };

  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) logoutBtn.onclick = async () => {
    await sb.auth.signOut();
    isAdmin = false;
    await loadEverything();
    render();
  };

  const adminLoginLink = document.getElementById("admin-login-link");
  if (adminLoginLink) adminLoginLink.onclick = () => { state.showLogin = true; state.loginError = ""; render(); };

  const loginClose = document.getElementById("login-close");
  const loginOverlay = document.getElementById("login-overlay");
  if (loginClose) loginClose.onclick = () => { state.showLogin = false; render(); };
  if (loginOverlay) loginOverlay.onclick = (e) => { if (e.target === loginOverlay) { state.showLogin = false; render(); } };

  const visitorClose = document.getElementById("visitor-close");
  const visitorOverlay = document.getElementById("visitor-overlay");
  if (visitorClose) visitorClose.onclick = () => { state.showVisitorSetup = false; state.pendingVisitorAction = null; render(); };
  if (visitorOverlay) visitorOverlay.onclick = (e) => { if (e.target === visitorOverlay) { state.showVisitorSetup = false; state.pendingVisitorAction = null; render(); } };

  const visitorSubmit = document.getElementById("visitor-submit");
  if (visitorSubmit) visitorSubmit.onclick = () => {
    const nome = document.getElementById("visitor-nome").value.trim();
    const contato = document.getElementById("visitor-contato").value.trim();
    if (!nome || !contato) {
      state.visitorError = "Preencha nome e WhatsApp.";
      render();
      return;
    }
    saveVisitor({ nome, contato });
    state.showVisitorSetup = false;
    const action = state.pendingVisitorAction;
    state.pendingVisitorAction = null;
    if (action) action();
    else render();
  };

  const loginSubmit = document.getElementById("login-submit");
  if (loginSubmit) loginSubmit.onclick = async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    if (!email || !password) {
      state.loginError = "Preencha e-mail e senha.";
      render();
      return;
    }
    state.loginLoading = true;
    state.loginError = "";
    render();
    const { error } = await sb.auth.signInWithPassword({ email, password });
    state.loginLoading = false;
    if (error) {
      state.loginError = "E-mail ou senha incorretos.";
      render();
      return;
    }
    isAdmin = true;
    state.showLogin = false;
    await loadEverything();
    render();
  };

  const cepInput = document.getElementById("cep-input");
  if (cepInput) {
    cepInput.oninput = (e) => { state.cep = e.target.value; };
    cepInput.onkeydown = (e) => { if (e.key === "Enter") doSearch(); };
  }
  const searchBtn = document.getElementById("search-btn");
  if (searchBtn) searchBtn.onclick = doSearch;

  const locateBtn = document.getElementById("locate-btn");
  if (locateBtn) locateBtn.onclick = useMyLocation;

  document.querySelectorAll(".sort-chip").forEach(el => { el.onclick = () => { state.sortBy = el.dataset.sort; state.showSort = false; render(); }; });
  const filtersToggle = document.getElementById("filters-toggle");
  if (filtersToggle) filtersToggle.onclick = () => { state.showFilters = !state.showFilters; render(); };

  document.querySelectorAll(".piso-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.piso;
      state.pisoFilters = state.pisoFilters.includes(k) ? state.pisoFilters.filter(x=>x!==k) : [...state.pisoFilters, k];
      render();
    };
  });
  document.querySelectorAll(".cobertura-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.cobertura;
      state.coberturaFilters = state.coberturaFilters.includes(k) ? state.coberturaFilters.filter(x=>x!==k) : [...state.coberturaFilters, k];
      render();
    };
  });
  document.querySelectorAll(".amenity-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.amenity;
      state.amenityFilters = state.amenityFilters.includes(k) ? state.amenityFilters.filter(x=>x!==k) : [...state.amenityFilters, k];
      render();
    };
  });

  document.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openCourt(el.dataset.open);
  });

  document.querySelectorAll("[data-fav]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(el.dataset.fav);
      if (state.selected && state.selected.id === el.dataset.fav) {
        state.selected = { ...state.selected };
      }
      render();
    };
  });

  const togglePago = document.getElementById("toggle-pago");
  if (togglePago) togglePago.onclick = async () => {
    const current = getPagoStatus(togglePago.dataset.court);
    await setPagoStatus(togglePago.dataset.court, !current.pago);
    if (state.selected && state.selected.id === togglePago.dataset.court) {
      state.selected = state.allCourts.find(c => c.id === togglePago.dataset.court) || state.pending.find(c => c.id === togglePago.dataset.court);
    }
    render();
  };

  async function refreshAfterPauseChange() {
    await loadEverything();
    if (state.selected) {
      state.selected = state.allCourts.find(c => c.id === state.selected.id) || state.pending.find(c => c.id === state.selected.id) || state.selected;
    }
    render();
  }

  document.querySelectorAll(".pause-preset-btn").forEach(el => {
    el.onclick = async () => {
      const days = parseInt(el.dataset.days, 10);
      const until = new Date(Date.now() + days * 86400000).toISOString();
      const { error } = await sb.from('academias').update({ pausada: true, pausada_ate: until }).eq('id', el.dataset.court);
      if (error) { alert("Não consegui pausar: " + error.message); return; }
      await refreshAfterPauseChange();
    };
  });

  const pauseCustomToggle = document.getElementById("pause-custom-toggle");
  if (pauseCustomToggle) pauseCustomToggle.onclick = () => {
    const row = document.getElementById("pause-custom-row");
    if (row) row.style.display = row.style.display === "none" ? "flex" : "none";
  };

  const pauseCustomConfirm = document.getElementById("pause-custom-confirm");
  if (pauseCustomConfirm) pauseCustomConfirm.onclick = async () => {
    const dateVal = document.getElementById("pause-custom-date").value;
    if (!dateVal) { alert("Escolha uma data."); return; }
    const until = new Date(dateVal + "T23:59:59").toISOString();
    const { error } = await sb.from('academias').update({ pausada: true, pausada_ate: until }).eq('id', pauseCustomConfirm.dataset.court);
    if (error) { alert("Não consegui pausar: " + error.message); return; }
    await refreshAfterPauseChange();
  };

  const resumeCourtBtn = document.getElementById("resume-court-btn");
  if (resumeCourtBtn) resumeCourtBtn.onclick = async () => {
    const { error } = await sb.from('academias').update({ pausada: false, pausada_ate: null }).eq('id', resumeCourtBtn.dataset.court);
    if (error) { alert("Não consegui reativar: " + error.message); return; }
    await refreshAfterPauseChange();
  };

  const editCourtBtn = document.getElementById("edit-court-btn");
  if (editCourtBtn) editCourtBtn.onclick = () => {
    const c = state.allCourts.find(x => x.id === editCourtBtn.dataset.court) || state.pending.find(x => x.id === editCourtBtn.dataset.court);
    if (!c) return;
    const quadras = {};
    QUADRA_COMBOS.forEach(q => { quadras[q.key] = (c.quadras && c.quadras[q.key]) || 0; });
    window.__form = {
      __editingId: c.id,
      name: c.name || "",
      address: c.address || c.endereco || "",
      numero: c.numero || "",
      complemento: c.complemento || "",
      bairro: c.bairro || "",
      cidade: c.cidade || "",
      quadras,
      amenities: [...(c.amenities || [])],
      modalidades: [...(c.modalidades || [])],
      priceAula: c.priceAula || "",
      priceLocacao: c.priceLocacao || "",
      phone: c.phone || "",
      instagram: c.instagram || "",
      site: c.site || "",
      photos: [...(c.photos || (c.photoUrl ? [c.photoUrl] : []))],
    };
    state.showRegister = true;
    state.registerStatus = "idle";
    render();
  };

  const deleteCourtBtn = document.getElementById("delete-court-btn");
  if (deleteCourtBtn) deleteCourtBtn.onclick = async () => {
    const c = state.allCourts.find(x => x.id === deleteCourtBtn.dataset.court);
    if (!c) return;
    if (!confirm(`Excluir "${c.name}" do GuiaTennis? Isso não pode ser desfeito.`)) return;
    const { error } = await sb.from('academias').delete().eq('id', c.id);
    if (error) {
      alert("Não consegui excluir: " + error.message);
      return;
    }
    state.selected = null;
    await loadEverything();
    render();
  };

  document.querySelectorAll(".delete-review-btn").forEach(el => {
    el.onclick = async () => {
      if (!confirm("Excluir essa avaliação? Isso não pode ser desfeito.")) return;
      const { error } = await sb.from('avaliacoes').delete().eq('id', el.dataset.review);
      if (error) { alert("Não consegui excluir: " + error.message); return; }
      await loadEverything();
      if (state.selected) {
        state.selected = state.allCourts.find(c => c.id === state.selected.id) || state.pending.find(c => c.id === state.selected.id) || state.selected;
      }
      render();
    };
  });

  const shareBtn = document.getElementById("share-btn");
  if (shareBtn) shareBtn.onclick = () => shareCourt(shareBtn.dataset.court);

  document.querySelectorAll("[data-lightbox-open]").forEach(el => {
    el.style.cursor = "pointer";
    el.onclick = () => {
      const c = state.selected;
      if (!c) return;
      const photos = (c.photos && c.photos.length) ? c.photos : (c.photoUrl ? [c.photoUrl] : []);
      if (!photos.length) return;
      state.lightbox = { photos, index: parseInt(el.dataset.lightboxOpen, 10) || 0 };
      render();
    };
  });

  const lightboxOverlay = document.getElementById("lightbox-overlay");
  const lightboxClose = document.getElementById("lightbox-close");
  if (lightboxClose) lightboxClose.onclick = () => { state.lightbox = null; render(); };
  if (lightboxOverlay) lightboxOverlay.onclick = (e) => { if (e.target === lightboxOverlay) { state.lightbox = null; render(); } };

  const lightboxPrev = document.getElementById("lightbox-prev");
  const lightboxNext = document.getElementById("lightbox-next");
  if (lightboxPrev) lightboxPrev.onclick = () => {
    state.lightbox.index = Math.max(0, state.lightbox.index - 1);
    render();
  };
  if (lightboxNext) lightboxNext.onclick = () => {
    state.lightbox.index = Math.min(state.lightbox.photos.length - 1, state.lightbox.index + 1);
    render();
  };
  const lightboxStrip = document.getElementById("lightbox-strip");
  if (lightboxStrip) lightboxStrip.onscroll = () => {
    const i = Math.round(lightboxStrip.scrollLeft / lightboxStrip.clientWidth);
    if (state.lightbox) state.lightbox.index = i;
  };

  document.querySelectorAll("[data-compare]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const r = toggleCompare(el.dataset.compare);
      if (!r.ok) { alert(r.msg); return; }
      render();
    };
  });

  document.querySelectorAll(".decide-prio").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.prio;
      state.decidePrios = state.decidePrios.includes(k)
        ? state.decidePrios.filter(x => x !== k)
        : [...state.decidePrios, k];
      render();
    };
  });

  const decideNotes = document.getElementById("decide-notes");
  if (decideNotes) decideNotes.oninput = (e) => { state.decideNotes = e.target.value; };

  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); state.navCourt = el.dataset.nav; render(); };
  });

  const navClose = document.getElementById("nav-close");
  const navOverlay = document.getElementById("nav-overlay");
  if (navClose) navClose.onclick = () => { state.navCourt = null; render(); };
  if (navOverlay) navOverlay.onclick = (e) => { if (e.target === navOverlay) { state.navCourt = null; render(); } };

  document.querySelectorAll("[data-decidir]").forEach(el => {
    el.onclick = () => { state.decidida = el.dataset.decidir; render(); };
  });

  const decidiaVoltar = document.getElementById("decidida-voltar");
  if (decidiaVoltar) decidiaVoltar.onclick = () => { state.decidida = null; render(); };

  document.querySelectorAll("[data-track-wa]").forEach(el => { el.onclick = () => trackClick(el.dataset.trackWa, "whatsapp"); });
  document.querySelectorAll("[data-track-ig]").forEach(el => { el.onclick = () => trackClick(el.dataset.trackIg, "instagram"); });
  document.querySelectorAll("[data-track-site]").forEach(el => { el.onclick = () => trackClick(el.dataset.trackSite, "site"); });

  const decideGo = document.getElementById("decide-go");
  if (decideGo) decideGo.onclick = () => { state.showDecideResult = true; render(); };

  const compareGo = document.getElementById("compare-go");
  if (compareGo) compareGo.onclick = () => { state.showCompare = true; render(); };

  const compareClear = document.getElementById("compare-clear");
  if (compareClear) compareClear.onclick = () => { setCompareList([]); state.showCompare = false; state.compareOnly = false; state.decidida = null; state.showDecideResult = false; render(); };

  const compareClear2 = document.getElementById("compare-clear-2");
  if (compareClear2) compareClear2.onclick = () => { setCompareList([]); state.showCompare = false; state.compareOnly = false; state.decidida = null; state.showDecideResult = false; render(); };

  const compareClose = document.getElementById("compare-close");
  const compareOverlay = document.getElementById("compare-overlay");
  if (compareClose) compareClose.onclick = () => { state.showCompare = false; render(); };
  if (compareOverlay) compareOverlay.onclick = (e) => { if (e.target === compareOverlay) { state.showCompare = false; render(); } };

  document.querySelectorAll("[data-cmp-remove]").forEach(el => {
    el.onclick = () => {
      setCompareList(state.compareList.filter(id => id !== el.dataset.cmpRemove));
      if (state.compareList.length < COMPARE_MIN) state.showCompare = false;
      if (!state.compareList.length) state.compareOnly = false;
      render();
    };
  });

  const detailClose = document.getElementById("detail-close");
  const detailOverlay = document.getElementById("detail-overlay");
  if (detailClose) detailClose.onclick = () => { state.selected = null; render(); };
  if (detailOverlay) detailOverlay.onclick = (e) => { if (e.target === detailOverlay) { state.selected = null; render(); } };

  document.querySelectorAll("#star-picker span").forEach(el => {
    el.onclick = () => { state.pendingStar = parseInt(el.dataset.star, 10); render(); };
  });
  const rateComment = document.getElementById("rate-comment");
  if (rateComment) rateComment.oninput = (e) => { window.__rateComment = e.target.value; };
  const rateConsent = document.getElementById("rate-consent");
  if (rateConsent) rateConsent.onchange = (e) => { window.__rateConsent = e.target.checked; render(); };
  const openTermsFromRating = document.getElementById("open-terms-from-rating");
  if (openTermsFromRating) openTermsFromRating.onclick = () => { state.showTerms = true; render(); };
  const rateSubmit = document.getElementById("rate-submit");
  if (rateSubmit) rateSubmit.onclick = () => {
    const courtId = state.selected.id;
    const stars = state.pendingStar;
    const comment = window.__rateComment || "";
    ensureVisitorThen(async () => {
      await submitRating(courtId, stars, comment);
      window.__rateComment = "";
      window.__rateConsent = false;
      state.justRated = true;
      const r = getAppRating(courtId);
      state.selected = { ...state.selected, appAvg: r.avg, appCount: r.count };
      render();
    });
  };

  document.querySelectorAll(".modalidade-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.modalidade;
      state.modalidadeFilters = state.modalidadeFilters.includes(k) ? state.modalidadeFilters.filter(x=>x!==k) : [...state.modalidadeFilters, k];
      render();
    };
  });

  const fab = document.getElementById("fab-add");
  if (fab) fab.onclick = () => { window.__form = { name:"", cep:"", address:"", numero:"", complemento:"", bairro:"", cidade:"", quadras:{}, amenities:[], modalidades:[], priceAula:"", priceLocacao:"", phone:"", instagram:"", site:"", photos:[] }; state.showRegister = true; state.registerStatus = "idle"; render(); };

  const fabAdmin = document.getElementById("fab-admin");
  if (fabAdmin) fabAdmin.onclick = () => { state.showAdminPanel = true; render(); };

  const fabStats = document.getElementById("fab-stats");
  if (fabStats) fabStats.onclick = () => { state.showStatsPanel = true; render(); };

  const termsLink = document.getElementById("terms-link");
  if (termsLink) termsLink.onclick = () => { state.showTerms = true; render(); };
  const privacyLink = document.getElementById("privacy-link");
  if (privacyLink) privacyLink.onclick = () => { state.showPrivacy = true; render(); };

  const termsClose = document.getElementById("terms-close");
  const termsOverlay = document.getElementById("terms-close-overlay");
  if (termsClose) termsClose.onclick = () => { state.showTerms = false; render(); };
  if (termsOverlay) termsOverlay.onclick = (e) => { if (e.target === termsOverlay) { state.showTerms = false; render(); } };

  const privacyClose = document.getElementById("privacy-close");
  const privacyOverlay = document.getElementById("privacy-close-overlay");
  if (privacyClose) privacyClose.onclick = () => { state.showPrivacy = false; render(); };
  if (privacyOverlay) privacyOverlay.onclick = (e) => { if (e.target === privacyOverlay) { state.showPrivacy = false; render(); } };

  document.querySelectorAll("[data-stats-per]").forEach(el => {
    el.onclick = () => { state.statsPeriodo = el.dataset.statsPer; render(); };
  });
  document.querySelectorAll("[data-stats-ord]").forEach(el => {
    el.onclick = () => { state.statsOrdem = el.dataset.statsOrd; render(); };
  });
  document.querySelectorAll("[data-copy-stats]").forEach(el => {
    el.onclick = () => {
      const c = state.allCourts.find(x => x.id === el.dataset.copyStats);
      if (!c) return;
      const { porAcademia } = statsAgregado(state.statsPeriodo || "30");
      const d = Object.assign({ whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 }, porAcademia[c.id] || {});
      const txt = resumoTexto(c, d);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => { el.textContent = "Copiado!"; setTimeout(() => { el.textContent = "Copiar resumo pra mandar"; }, 1800); })
          .catch(() => window.prompt("Copie o resumo:", txt));
      } else {
        window.prompt("Copie o resumo:", txt);
      }
    };
  });

  const statsClose = document.getElementById("stats-close");
  const statsOverlay = document.getElementById("stats-overlay");
  if (statsClose) statsClose.onclick = () => { state.showStatsPanel = false; render(); };
  if (statsOverlay) statsOverlay.onclick = (e) => { if (e.target === statsOverlay) { state.showStatsPanel = false; render(); } };

  const regClose = document.getElementById("register-close");
  const regClose2 = document.getElementById("register-close-2");
  const regOverlay = document.getElementById("register-overlay");
  if (regClose) regClose.onclick = () => { state.showRegister = false; render(); };
  if (regClose2) regClose2.onclick = () => { state.showRegister = false; render(); };
  if (regOverlay) regOverlay.onclick = (e) => { if (e.target === regOverlay) { state.showRegister = false; render(); } };

  const adminClose = document.getElementById("admin-close");
  const adminOverlay = document.getElementById("admin-overlay");
  if (adminClose) adminClose.onclick = () => { state.showAdminPanel = false; render(); };
  if (adminOverlay) adminOverlay.onclick = (e) => { if (e.target === adminOverlay) { state.showAdminPanel = false; render(); } };

  document.querySelectorAll("[data-preview]").forEach(el => {
    el.onclick = () => {
      const p = state.pending.find(x => x.id === el.dataset.preview);
      if (!p) return;
      state.selected = p;
      state.pendingStar = 0;
      state.justRated = false;
      render();
    };
  });

  document.querySelectorAll("[data-approve]").forEach(el => {
    el.onclick = async () => {
      await sb.from('academias').update({ status: 'published' }).eq('id', el.dataset.approve);
      await loadEverything();
      render();
    };
  });
  document.querySelectorAll("[data-reject]").forEach(el => {
    el.onclick = async () => {
      await sb.from('academias').delete().eq('id', el.dataset.reject);
      await loadEverything();
      render();
    };
  });

  bindFormField("f-name", "name"); bindFormField("f-address", "address"); bindFormField("f-bairro", "bairro");
  bindFormField("f-cidade", "cidade"); bindFormField("f-numero", "numero"); bindFormField("f-complemento", "complemento");
  bindPriceField("f-price-aula", "priceAula"); bindPriceField("f-price-locacao", "priceLocacao");
  bindFormField("f-phone", "phone"); bindFormField("f-instagram", "instagram");
  bindFormField("f-site", "site");

  document.querySelectorAll("[data-track]").forEach(el => {
    el.addEventListener("click", () => trackClick(el.dataset.court, el.dataset.track));
  });

  document.querySelectorAll(".reg-quadra-count").forEach(el => {
    el.oninput = (e) => {
      const f = window.__form;
      if (!f.quadras) f.quadras = {};
      f.quadras[el.dataset.combo] = Math.max(0, parseInt(e.target.value, 10) || 0);
    };
  });
  document.querySelectorAll(".reg-amenity").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.amenity;
      const f = window.__form;
      f.amenities = f.amenities.includes(k) ? f.amenities.filter(x=>x!==k) : [...f.amenities, k];
      render();
    };
  });
  document.querySelectorAll(".reg-modalidade").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.modalidade;
      const f = window.__form;
      f.modalidades = f.modalidades.includes(k) ? f.modalidades.filter(x=>x!==k) : [...f.modalidades, k];
      render();
    };
  });

  const regSubmit = document.getElementById("register-submit");
  if (regSubmit) regSubmit.onclick = () => {
    const f = window.__form;
    if (isAdmin || f.__editingId) {
      doRegisterSubmit();
    } else {
      ensureVisitorThen(doRegisterSubmit);
    }
  };

  const consentBox = document.getElementById("f-consent");
  if (consentBox) consentBox.onchange = (e) => { window.__form.consent = e.target.checked; };

  const openTermsFromForm = document.getElementById("open-terms-from-form");
  if (openTermsFromForm) openTermsFromForm.onclick = () => { state.showTerms = true; render(); };
  const openPrivacyFromForm = document.getElementById("open-privacy-from-form");
  if (openPrivacyFromForm) openPrivacyFromForm.onclick = () => { state.showPrivacy = true; render(); };

  const cepField = document.getElementById("f-cep");
  if (cepField) {
    cepField.oninput = (e) => { window.__form.cep = e.target.value; };
    cepField.onblur = () => autoFillFromCep(window.__form.cep);
  }

  const photoFile = document.getElementById("f-photo-file");
  if (photoFile) {
    photoFile.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const f = window.__form;
      if (!f.photos) f.photos = [];
      const room = Math.max(0, 5 - f.photos.length);
      const toAdd = files.slice(0, room);
      let pending = toAdd.length;
      toAdd.forEach((file) => {
        compressImage(file, 1280, 0.72).then((dataUrl) => {
          f.photos.push(dataUrl);
          pending--;
          if (pending === 0) render();
        }).catch(() => {
          pending--;
          if (pending === 0) render();
        });
      });
    };
  }

  document.querySelectorAll("[data-photo-idx]").forEach(el => {
    el.onclick = () => {
      window.__form.photos.splice(parseInt(el.dataset.photoIdx, 10), 1);
      render();
    };
  });
}

async function autoFillFromCep(rawCep) {
  const digits = (rawCep || "").replace(/\D/g, "");
  if (digits.length !== 8) return;
  state.cepStatus = "loading";
  render();
  try {
    const data = await fetchViaCep(digits);
    const f = window.__form;
    f.address = data.logradouro || f.address;
    f.bairro = data.bairro || f.bairro;
    f.cidade = data.localidade || f.cidade;
    state.cepStatus = "idle";
  } catch (e) {
    state.cepStatus = "error";
  }
  render();
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round(height * (maxDimension / width));
            width = maxDimension;
          } else {
            width = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindFormField(id, key) {
  const el = document.getElementById(id);
  if (el) el.oninput = (e) => { window.__form[key] = e.target.value; };
}

function bindPriceField(id, key) {
  const el = document.getElementById(id);
  if (el) el.oninput = (e) => {
    const cleaned = e.target.value.replace(/[^0-9-]/g, "");
    e.target.value = cleaned;
    window.__form[key] = cleaned;
  };
}

function useMyLocation() {
  if (!navigator.geolocation) {
    state.errorMsg = "Seu navegador não suporta localização automática.";
    state.searchStatus = "error";
    render();
    return;
  }
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const geo = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
        state.origin = geo;
        state.cep = "";
        state.sortBy = "distance";
        state.searchStatus = "done";
      } catch (e) {
        state.errorMsg = e.message || "Não consegui identificar sua região.";
        state.searchStatus = "error";
      }
      render();
    },
    () => {
      state.errorMsg = "Não consegui acessar sua localização. Permita o acesso ou digite um CEP.";
      state.searchStatus = "error";
      render();
    },
    { timeout: 10000 }
  );
}

function shareCourt(courtId) {
  const c = (state.allCourts.find(x => x.id === courtId)) || (state.pending && state.pending.find(x => x.id === courtId));
  if (!c) return;
  trackClick(courtId, "compartilhar");
  const url = `${location.origin}${location.pathname}?court=${c.id}`;
  const text = `Olha essa quadra/academia que eu achei, no GuiaTennis:\n${c.name}${c.endereco ? " - " + c.endereco : (c.bairro ? " - " + c.bairro : "")}`;
  const fullText = `${text} ${url}`;

  function lastResort() {
    window.prompt("Copie o link abaixo pra compartilhar:", fullText);
  }

  try {
    if (navigator.share) {
      navigator.share({ title: c.name, text, url }).catch((err) => {
        if (err && err.name === "AbortError") return; // usuário só fechou o menu de compartilhar
        lastResort();
      });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Link copiado! Cole onde quiser compartilhar.");
      }).catch(lastResort);
    } else {
      lastResort();
    }
  } catch (e) {
    lastResort();
  }
}

async function doSearch() {
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  const termo = state.cep.trim();
  const digitsOnly = termo.replace(/\D/g, "");
  try {
    let geo;
    if (digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0) {
      geo = await geocodeCep(termo);
    } else {
      // Aceita endereço OU ponto de referência ("Escola Adventista", "Shopping Morumbi").
      const tentativas = [
        `${termo}, Brasil`,
        termo,
        state.origin && state.origin.cidade ? `${termo}, ${state.origin.cidade}, Brasil` : null,
      ].filter(Boolean);

      let result = null;
      for (const q of tentativas) {
        try { result = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
      }
      if (!result) throw new Error("Não achei esse endereço ou local. Tente incluir o bairro e a cidade.");

      // Descobre bairro/cidade reais pela coordenada, em vez de adivinhar pelo texto digitado
      let bairro = "", cidade = "";
      try {
        const rev = await reverseGeocode(result.lat, result.lng);
        bairro = rev.bairro || "";
        cidade = rev.cidade || "";
      } catch (e) {
        const parts = termo.split(",").map(s => s.trim()).filter(Boolean);
        bairro = parts.length > 1 ? parts[parts.length - 2] : parts[0];
        cidade = parts[parts.length - 1] || "";
      }
      geo = { ...result, bairro: bairro || termo, cidade, approximate: false };
    }
    state.origin = geo;
    state.sortBy = "distance";
    state.searchStatus = "done";
  } catch (e) {
    state.errorMsg = e.message || "Não consegui buscar esse endereço ou CEP.";
    state.searchStatus = "error";
  }
  render();
}

async function doRegisterSubmit() {
  const f = window.__form;
  const quadras = f.quadras || {};
  const hasQuadra = QUADRA_COMBOS.some(q => quadras[q.key] > 0);
  const pisos = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.piso))];
  const cobertura = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.cobertura))];

  if (f.__editingId) {
    if (!f.name.trim()) {
      state.registerError = "O nome não pode ficar em branco.";
      state.registerStatus = "error";
      render();
      return;
    }
    state.registerStatus = "saving";
    render();
    const endereco = (f.address || f.numero || f.bairro || f.cidade)
      ? `${f.address}${f.numero ? ", " + f.numero : ""}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}`
      : undefined;
    const payload = toRow({ ...f, pisos, cobertura });
    if (endereco) payload.endereco = endereco; else delete payload.endereco;
    try {
      const { error } = await sb.from('academias').update(payload).eq('id', f.__editingId);
      if (error) throw error;
      await loadEverything();
      if (state.selected && state.selected.id === f.__editingId) {
        state.selected = state.allCourts.find(c => c.id === f.__editingId) || state.pending.find(c => c.id === f.__editingId) || state.selected;
      }
      state.registerStatus = "done";
    } catch (e) {
      state.registerError = e.message || "Não consegui salvar as alterações.";
      state.registerStatus = "error";
    }
    render();
    return;
  }

  const missing = [];
  if (!f.name.trim()) missing.push("nome");
  if (!f.address.trim() || !f.numero.trim() || !f.bairro.trim() || !f.cidade.trim()) missing.push("endereço completo");
  if (!f.phone.trim()) missing.push("WhatsApp");
  if (f.modalidades.includes("aulas_proprias") && !/\d/.test(f.priceAula || "")) missing.push("faixa de preço da aula");
  if (f.modalidades.includes("locacao") && !/\d/.test(f.priceLocacao || "")) missing.push("faixa de preço da locação");
  if (!hasQuadra) missing.push("quantidade de quadras");
  if (!f.modalidades.length) missing.push("modalidade");
  if (!f.consent) missing.push("aceite dos Termos de Uso e Política de Privacidade");

  if (missing.length) {
    state.registerError = `Preencha: ${missing.join(", ")}.`;
    state.registerStatus = "error";
    render();
    return;
  }

  state.registerStatus = "saving";
  render();
  try {
    const geo = await geocodeFormAddress(f);
    const endereco = `${f.address}, ${f.numero}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}${f.cep ? " - " + f.cep : ""}`;
    const visitor = loadVisitor() || {};
    const payload = {
      ...toRow({ ...f, pisos, cobertura }),
      endereco, lat: geo.lat, lng: geo.lng,
      source: 'custom', status: 'pending',
      nome_solicitante: isAdmin ? null : visitor.nome,
      contato_solicitante: isAdmin ? null : visitor.contato,
    };
    let insertQuery = sb.from('academias').insert(payload);
    if (isAdmin) insertQuery = insertQuery.select().single();
    const { data, error } = await insertQuery;
    if (error) throw error;
    if (isAdmin) {
      const { error: pubError } = await sb.from('academias').update({ status: 'published' }).eq('id', data.id);
      if (pubError) throw pubError;
    }
    await loadEverything();
    state.registerStatus = "done";
  } catch (e) {
    state.registerError = e.message || "Não consegui localizar esse endereço.";
    state.registerStatus = "error";
  }
  render();
}

async function init() {
  app_showLoading();
  const { data: { session } } = await sb.auth.getSession();
  isAdmin = !!session;
  if (!isAdmin) trackClick(null, "acesso_site");
  await loadEverything();

  const sharedCourtId = new URLSearchParams(location.search).get("court");
  if (sharedCourtId) {
    const shared = state.allCourts.find(c => c.id === sharedCourtId);
    if (shared) {
      state.selected = shared;
      if (!isAdmin) trackClick(shared.id, "visualizacao");
    }
  }

  // Remove da comparação academias que não existem mais (excluídas ou pausadas)
  if (state.compareList.length) {
    const validos = state.compareList.filter(id => state.allCourts.some(c => c.id === id));
    if (validos.length !== state.compareList.length) setCompareList(validos);
  }

  state.loaded = true;
  render();
}

function app_showLoading() {
  const app = document.getElementById("app");
  app.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--muted)">Carregando...</div>`;
}

init();
</script>
