const EMAIL_VALIDO = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

// "Continuar" do cadastro: o banco diz se o e-mail já tem conta.
async function continuarComEmail() {
  const email = (state.pcEmail || "").trim().toLowerCase();
  state.pcEmail = email;
  state.loginError = "";
  // Usuário do GuiaTennis (sem @): vai direto para a senha.
  if (email && !email.includes("@") && /^[a-z0-9._-]{3,}$/.test(email)) {
    // Quem já informou o e-mail no primeiro acesso entra por ele (SQL
    // 20261004120000): assim o "Esqueci a senha" manda o código.
    let login = "";
    try { const r = await sb.rpc('login_do_usuario', { p_usuario: email }); if (!r.error && r.data) login = r.data; } catch {}
    state.pcLogin = login || email;
    state.pcEmailPasso = "existe";
    render();
    document.getElementById("login-password")?.focus();
    return;
  }
  if (!EMAIL_VALIDO.test(email)) { state.pcContaErro = "Escreva um e-mail válido."; render(); return; }
  if (precisaSugerir(email)) { state.pcContaErro = ""; render(); return; }
  state.pcContaErro = "";
  state.pcContaSalvando = true;
  render();
  let r = await sb.rpc('conta_do_email', { p_email: email });
  // Banco sem a função nova: confere como antes.
  if (r.error) {
    const v = await sb.rpc('login_do_email', { p_email: email });
    r = v.error ? v : { data: v.data ? { tipo: "academia", login: v.data } : null, error: null };
  }
  state.pcContaSalvando = false;
  if (r.error) {
    state.pcContaErro = "Não consegui conferir o e-mail agora. Tente de novo em instantes.";
  } else if (r.data && (r.data.tipo === "jogador" || r.data.tipo === "outra")) {
    state.pcContaErro = "Esse e-mail é de uma conta de jogador do GuiaTennis. Para a academia, use outro e-mail.";
  } else {
    state.pcLogin = r.data ? r.data.login : "";
    state.pcEmailPasso = r.data ? "existe" : "criar";
    // Veio do "Administrar" de uma ficha: depois de entrar, volta ao pedido.
    if (r.data && state.pcReivindicar) state.parceirosDepois = "cadastro";
  }
  render();
  const campo = document.getElementById(state.pcEmailPasso === "criar" ? "pc-conta-tratamento" : "login-password");
  if (campo) campo.focus();
}

// "Esqueceu a senha?" do GuiaTennis Parceiros: código no e-mail e senha nova.

  state.pcEmailPasso = "esqueci";

  state.pcCodigoMandando = true;

}
async function pcSalvarSenhaNova() {
  const codigo = document.getElementById("pc-codigo-senha")?.value || "";
  const senha = document.getElementById("pc-senha-nova")?.value || "";
  const errSenha = erroDaSenha(senha, document.getElementById("pc-senha-nova2")?.value || "", state.pcLogin);
  if (errSenha) { state.pcContaErro = errSenha; render(); return; }
  state.pcContaSalvando = true; state.pcContaErro = ""; render();
  const sessao = await conferirCodigo(state.pcLogin, codigo);
  if (!sessao) { state.pcContaSalvando = false; state.pcContaErro = CODIGO_ERRADO; render(); return; }
  const { error } = await sb.auth.updateUser({ password: senha });
  state.pcContaSalvando = false;
  if (error) { state.pcContaErro = "O código deu certo, mas não consegui salvar a senha. Tente de novo."; render(); return; }
  try { await sb.rpc('marcar_senha_trocada'); } catch {}
  await carregarConta(sessao);
  await loadEverything();
  state.pcEmailPasso = "email";
  const destino = !contaAcademia ? "cadastro" : temAcademia() ? (PC_PRIVADAS.includes(state.parceirosDepois) ? state.parceirosDepois : "painel") : "cadastro";
  state.parceirosDepois = null;
  state.contaAviso = "Senha nova salva.";
  irParceiros(destino, { substituir: true });
}

async function criarContaDeParceiro() {
  const f = window.__pcConta || {};
  const email = state.pcEmail;
  const erro = (t) => { state.pcContaErro = t; state.pcContaSalvando = false; render(); };
  const falta = erroDoContato(f);
  if (falta) return erro(falta);
  const errSenha = erroDaSenha(f.senha, f.senha2, email);
  if (errSenha) return erro(errSenha);
  if (!f.aceite) return erro("Falta aceitar os Termos de Uso e a Política de Privacidade.");
  state.pcContaErro = "";
  state.pcContaSalvando = true;
  render();
  const r = await sb.rpc('criar_minha_conta', {
    p_email: email, p_senha: f.senha, p_nome: juntarNome(f), p_whatsapp: f.whatsapp, p_aceite: true,
    p_tratamento: f.tratamento, p_cargo: f.cargo, p_recebe_novidades: !!f.novidades,
  });
  if (r.error) return erro(r.error.message || "Não consegui criar a conta agora.");
  const { data, error } = await sb.auth.signInWithPassword({ email, password: f.senha });
  if (error) return erro("A conta foi criada, mas não consegui entrar. Tente em Entrar.");
  await carregarConta(data && data.session);
  window.__pcConta = null;
  state.pcContaSalvando = false;
  state.pcEmailPasso = "email";
  state.pcSelecionada = undefined;
  await loadEverything();
  render();
  window.scrollTo(0, 0);
}

async function pedirParaAdministrar(academiaId) {
  if (!academiaId) return;
  state.pedidoErro = "";
  const r = await sb.rpc('pedir_para_administrar', { p_academia: academiaId });
  if (r.error) { state.pedidoErro = r.error.message || "Não consegui mandar o pedido agora."; render(); return; }
  state.pcReivindicar = null;
  state.pcSelecionada = undefined;
  await recarregarConta();
  syncUrl(false);
  render();
  window.scrollTo(0, 0);
}

// Código que o GuiaTennis mandou para o WhatsApp da ficha.
async function confirmarCodigo() {
  const codigo = (state.pcCodigo || "").replace(/\D/g, "");
  if (codigo.length !== 6) { state.pedidoErro = "O código tem 6 números."; render(); return; }
  state.pedidoErro = "";
  state.pcContaSalvando = true;
  render();
  const r = await sb.rpc('confirmar_meu_codigo', { p_codigo: codigo });
  state.pcContaSalvando = false;
  const avisos = {
    errado: "Código errado. Confira a mensagem no WhatsApp da academia.",
    tentativas: "Muitas tentativas. Peça outro código ao GuiaTennis.",
    venceu: "O código venceu. Peça outro ao GuiaTennis.",
    sem_codigo: "O código ainda não foi mandado. Aguarde a mensagem no WhatsApp da academia.",
  };
  if (r.error || r.data !== "ok") {
    state.pedidoErro = r.error ? (r.error.message || "Não consegui conferir agora.") : (avisos[r.data] || "Não consegui conferir agora.");
    render();
    return;
  }
  state.pcCodigo = "";
  await recarregarConta();
  await loadEverything();
  const c = minhaAcademia();
  state.contaAviso = `Pronto! Agora você administra a ${c ? c.name : "academia"} no GuiaTennis Parceiros.`;
  irParceiros("painel");
}

async function cancelarPedido() {
  const r = await sb.rpc('cancelar_meu_pedido');
  if (r.error) { state.pedidoErro = "Não consegui cancelar agora."; render(); return; }
  state.pedidoErro = "";
  await recarregarConta();
  render();
}

async function adicionarPessoa() {
  const f = window.__pessoa || {};
  const email = (f.email || "").trim().toLowerCase();
  if (!EMAIL_VALIDO.test(email)) { state.pessoaErro = "Escreva o e-mail da pessoa."; render(); return; }
  state.pessoaErro = "";
  state.pessoaSalvando = true;
  render();
  const senha = senhaProvisoria();
  const r = await sb.rpc('adicionar_pessoa', { p_email: email, p_nome: (f.nome || "").trim(), p_senha: senha });
  state.pessoaSalvando = false;
  if (r.error) { state.pessoaErro = r.error.message || "Não consegui adicionar agora."; render(); return; }
  state.pessoaNova = { email, nome: (f.nome || "").trim(), senha, ligada: r.data === "ligada" };
  window.__pessoa = null;
  await carregarPessoas();
}

async function removerPessoa(userId, nome) {
  const c = minhaAcademia();
  if (!confirm(`Remover ${nome || "essa pessoa"} da ${c ? c.name : "academia"}? Se ela não administrar outra academia, deixa de entrar no GuiaTennis Parceiros.`)) return;
  const r = await sb.rpc('remover_pessoa', { p_user: userId });
  if (r.error) { state.pessoaErro = r.error.message || "Não consegui remover agora."; render(); return; }
  state.pessoaErro = "";
  state.pessoaNova = null;
  await carregarPessoas();
}

function ligarEventosParceiros() {
  document.querySelectorAll("[data-pc]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      irParceiros(el.dataset.pc, { ancora: el.dataset.pcAncora, publico: !!el.dataset.pcAncora || el.dataset.pc === "inicio" && !contaAcademia });
    };
  });
  document.querySelectorAll("[data-pc-sair-do-portal]").forEach(el => {
    el.onclick = (e) => { if (e.metaKey || e.ctrlKey) return; e.preventDefault(); state.pcMenu = false; goHome(); };
  });
  const menuBtn = document.getElementById("pc-menu-btn");
  if (menuBtn) menuBtn.onclick = () => { state.pcMenu = true; render(); };
  const seletorBtn = document.getElementById("pc-seletor-btn");
  if (seletorBtn) seletorBtn.onclick = (e) => { e.stopPropagation(); state.pcSeletor = !state.pcSeletor; render(); };
  // Toque fora da lista (ou Esc) fecha o seletor.
  if (state.pcSeletor) {
    const fora = (e) => { if (!e.target.closest || !e.target.closest(".pc-seletor")) { state.pcSeletor = false; render(); } };
    document.addEventListener("click", fora, { once: true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.pcSeletor) { state.pcSeletor = false; render(); } }, { once: true });
  }
  const menuClose = document.getElementById("pc-menu-close");
  if (menuClose) menuClose.onclick = () => { state.pcMenu = false; render(); };
  const menuOverlay = document.getElementById("pc-menu-overlay");
  if (menuOverlay) menuOverlay.onclick = (e) => { if (e.target === menuOverlay) { state.pcMenu = false; render(); } };

  document.querySelectorAll("[data-pc-dias]").forEach(el => {
    el.onclick = () => carregarNumeros(parseInt(el.dataset.pcDias, 10) || 0);
  });
  // A coluna tocada mostra o dia e o valor na linha de cima do gráfico.
  document.querySelectorAll("[data-graf] .pc-barra").forEach(el => {
    const mostra = () => {
      const fig = el.closest("[data-graf]");
      fig.querySelectorAll(".pc-barra.on").forEach(b => b.classList.remove("on"));
      el.classList.add("on");
      fig.querySelector(".pc-graf-leitura").textContent = el.dataset.tip;
    };
    el.onmouseenter = mostra;
    el.onfocus = mostra;
    el.onclick = mostra;
  });

  const busca = document.getElementById("pc-busca");
  if (busca) busca.oninput = (e) => {
    state.pcBusca = e.target.value;
    const slot = document.getElementById("pc-resultados");
    if (slot) { slot.innerHTML = pcResultadosBusca(); ligarEventosParceiros(); }
  };
  document.querySelectorAll("[data-pc-minha]").forEach(el => {
    el.onclick = () => { state.pcReivindicar = el.dataset.pcMinha ? idCurto(el.dataset.pcMinha) : null; syncUrl(false); render(); window.scrollTo(0, 0); };
  });
  document.querySelectorAll("[data-pc-reivindicar]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      state.pcReivindicar = el.dataset.pcReivindicar;
      irParceiros("cadastro");
    };
  });
  // Cadastro pelo e-mail.
  const pcEmail = document.getElementById("pc-email");
  if (pcEmail && !pcEmail.readOnly) {
    pcEmail.oninput = (e) => { state.pcEmail = e.target.value; };
    pcEmail.onkeydown = (e) => { if (e.key === "Enter") continuarComEmail(); };
  }
  const pcContinuar = document.getElementById("pc-email-continuar");
  if (pcContinuar) pcContinuar.onclick = continuarComEmail;
  const pcEsqueci = document.getElementById("pc-esqueci");
  if (pcEsqueci) pcEsqueci.onclick = () => pcEsqueciSenha();
  const pcReenviar = document.getElementById("pc-reenviar-codigo");
  if (pcReenviar) pcReenviar.onclick = () => pcEsqueciSenha();
  const pcSalvarNova = document.getElementById("pc-salvar-senha-nova");
  if (pcSalvarNova) pcSalvarNova.onclick = () => pcSalvarSenhaNova();
  const pcMandar = document.getElementById("pc-mandar-codigo");
  if (pcMandar) pcMandar.onclick = async () => {
    state.pcConfirmarErro = "";
    state.pcConfirmar = (await enviarCodigo(contaAcademia.login)) ? "enviado" : "falhou";
    render();
    document.getElementById("pc-codigo-email")?.focus();
  };
  const pcConfirmarCod = document.getElementById("pc-confirmar-email");
  if (pcConfirmarCod) pcConfirmarCod.onclick = async () => {
    const sessao = await conferirCodigo(contaAcademia.login, document.getElementById("pc-codigo-email")?.value);
    if (!sessao) { state.pcConfirmarErro = CODIGO_ERRADO; render(); return; }
    await carregarConta(sessao);
    state.pcConfirmar = null;
    state.contaAviso = "E-mail confirmado.";
    render();
  };
  const pcTrocar = document.getElementById("pc-trocar-email");
  if (pcTrocar) pcTrocar.onclick = () => { state.pcEmailPasso = "email"; state.pcContaErro = ""; render(); document.getElementById("pc-email")?.focus(); };
  document.querySelectorAll(".pc-conta-campo").forEach(el => {
    el.oninput = (e) => { (window.__pcConta || (window.__pcConta = {}))[el.dataset.campo] = e.target.value; };
  });
  const pcAceite = document.getElementById("pc-conta-aceite");
  if (pcAceite) pcAceite.onchange = (e) => { (window.__pcConta || (window.__pcConta = {})).aceite = e.target.checked; };

  const pcCriar = document.getElementById("pc-criar-conta");
  if (pcCriar) pcCriar.onclick = criarContaDeParceiro;
  document.querySelectorAll("[data-pc-selecionar]").forEach(el => {
    el.onclick = () => {
      state.pcSelecionada = el.dataset.pcSelecionar;
      state.pcReivindicar = idCurto(el.dataset.pcSelecionar);
      state.pedidoErro = "";
      syncUrl(false);
      render();

  const pcAdministrar = document.getElementById("pc-administrar");

  if (pcCodigo) {
    pcCodigo.oninput = (e) => { state.pcCodigo = e.target.value; };
    pcCodigo.onkeydown = (e) => { if (e.key === "Enter") confirmarCodigo(); };

  const pcConfirmar = document.getElementById("pc-confirmar-codigo");

  const pcCancelar = document.getElementById("pc-cancelar-pedido");

  // Pessoas com acesso.

    el.oninput = (e) => { (window.__pessoa || (window.__pessoa = {}))[el.dataset.campo] = e.target.value; };
  });
  document.querySelectorAll("[data-aceitar-pedido]").forEach(el => { el.onclick = () => responderPedidoDeAcesso(el.dataset.aceitarPedido, true); });
  document.querySelectorAll("[data-recusar-acesso]").forEach(el => {
    el.onclick = () => { if (confirm("Recusar o pedido? A pessoa não entra na academia.")) responderPedidoDeAcesso(el.dataset.recusarAcesso, false); };
  });
  const pcAdicionar = document.getElementById("pc-pessoa-adicionar");
  if (pcAdicionar) pcAdicionar.onclick = adicionarPessoa;
  document.querySelectorAll("[data-pc-remover]").forEach(el => { el.onclick = () => removerPessoa(el.dataset.pcRemover, el.dataset.nome); });
  const pcCopiarPessoa = document.getElementById("pc-copiar-pessoa");
  if (pcCopiarPessoa) pcCopiarPessoa.onclick = () => copiarTexto(mensagemDaPessoa(state.pessoaNova), "da pessoa");

  const nova = document.getElementById("pc-nova");
  if (nova) nova.onclick = () => {
    window.__form = { name:"", cep:"", address:"", numero:"", complemento:"", bairro:"", cidade:"", quadras:{}, amenities:[], modalidades:[], priceAula:"", priceLocacao:"", phone:"", instagram:"", site:"", photos:[], politica:{}, acesso:{}, horario:{} };
    state.showRegister = true;
    state.registerStatus = "idle";
    render();
  };
}

// trivago: só na home, para quem já usou o site (viu academia ou buscou),
// ainda não tem conta e não fechou o convite nos últimos 14 dias. Promete só
// o que a conta faz hoje.
const CONVITE_CONTA_KEY = "guiatennis_convite_conta_v1";
function conviteParaConta(usou) {
  if (isAdmin || contaAcademia || jogador || !usou) return "";
  if (state.showMenu || state.jogadorTela) return "";
  const fechado = lerLocal(CONVITE_CONTA_KEY, 0);
  if (fechado && Date.now() - fechado < 14 * 864e5) return "";
  return `
    <aside class="convite-conta" role="dialog" aria-label="Criar conta no GuiaTennis">
      <button type="button" class="convite-fechar" id="convite-fechar" aria-label="Fechar">✕</button>

        <button type="button" class="cta-btn cta-secondary convite-btn" id="convite-criar">Criar conta</button>
      </div>
    </aside>`;
}

// Preferências de busca, como as "Preferências de pesquisa" do trivago:
// primeiro o estado, depois a cidade (a cidade só abre com o estado
// escolhido), e o que a pessoa costuma procurar. Ficam neste aparelho.
// Municípios de cada estado, da lista oficial do IBGE (pedido do Breno em
// 03/10/2026: escolhido o Ceará, não dá para pôr São Paulo). Como no Booking
// e no trivago, só aparecem cidades que existem no estado. A lista fica
// guardada no aparelho; sem internet para o IBGE, a cidade segue livre.
const CIDADES_DO_UF = {};
const MUNICIPIOS_KEY = "guiatennis_municipios_";
async function carregarCidadesDoUf(uf) {
  if (!uf) return null;
  if (CIDADES_DO_UF[uf]) return CIDADES_DO_UF[uf];
  try {
    const guardada = JSON.parse(localStorage.getItem(MUNICIPIOS_KEY + uf) || "null");
    if (Array.isArray(guardada) && guardada.length) return (CIDADES_DO_UF[uf] = guardada);
  } catch { /* sem armazenamento: busca de novo */ }
  try {
    const r = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${encodeURIComponent(uf)}/municipios?orderBy=nome`);
    if (!r.ok) throw new Error("IBGE " + r.status);
    const nomes = (await r.json()).map(m => m.nome).filter(Boolean);
    if (!nomes.length) throw new Error("lista vazia");
    CIDADES_DO_UF[uf] = nomes;
    try { localStorage.setItem(MUNICIPIOS_KEY + uf, JSON.stringify(nomes)); } catch { /* cheio: fica só na memória */ }
    return nomes;
  } catch (e) {
    diag(`preferências: não li as cidades de ${uf} no IBGE (${e.message})`);
    return null;
  }
}
function nomeDoUf(uf) {
  return (ESTADOS.find(e => e[0] === uf) || [])[1] || uf;
}
// Carrega as cidades do estado escolhido e confere a cidade: se ela não é
// daquele estado, sai e o site diz por quê.
async function conferirCidadeDoUf() {
  const r = window.__pref || {};
  if (!r.uf) return;
  state.prefCidadesCarregando = !CIDADES_DO_UF[r.uf];
  const lista = await carregarCidadesDoUf(r.uf);
  state.prefCidadesCarregando = false;
  const atual = window.__pref || {};
  if (atual.uf !== r.uf) return;
  if (lista && atual.cidade && !lista.some(n => mesmaCidade(n, atual.cidade))) {
    state.prefErro = `${atual.cidade} não fica em ${nomeDoUf(atual.uf)}. Escolha uma cidade de ${nomeDoUf(atual.uf)}.`;
    window.__pref = { ...atual, cidade: "" };
  }
  if (!state.showPrefs) return;
  // A lista chegou com a pessoa digitando: o cursor continua na cidade.
  const focado = document.activeElement && document.activeElement.id;
  render();
  if (focado === "pref-cidade") document.getElementById("pref-cidade")?.focus();
}

// ---------- Vou viajar (pedido do Breno em 04/10/2026) ----------
// Como as "Próximas viagens" do Airbnb e do Booking: a cidade de casa fica
// nas Preferências; a viagem é outra coisa. A pessoa guarda a cidade (lista
// do IBGE) e, se quiser, onde vai ficar (hotel ou endereço) e as datas. Com
// o lugar, "Ver quadras" mede a distância a partir do hotel, como a
// "distância da hospedagem" do Booking. Uns 15 dias antes até a volta, a home
// mostra o cartão da viagem; durante a viagem, "Pesquisar" sem digitar abre
// a cidade dela; depois da volta, tudo volta à cidade de casa sozinho. Fica
// só no aparelho, como as preferências.
const VIAGENS_KEY = "guiatennis_viagens_v1";
const VIAGEM_ANTES_DIAS = 15;
function diaISO(data) {
  const d = data || new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function somarDias(iso, n) {
  const [a, m, d] = iso.split("-").map(Number);
  return diaISO(new Date(a, m - 1, d + n));
}
function diaCurto(iso) {
  const [, m, d] = String(iso || "").split("-");
  return d && m ? `${d}/${m}` : "";
}
// Viagens que ainda não acabaram, da mais próxima para a mais distante.
function lerViagens() {
  const lista = lerLocal(VIAGENS_KEY, []);
  const hoje = diaISO();
  return (Array.isArray(lista) ? lista : [])
    .filter(v => v && v.cidade && (!v.volta || v.volta >= hoje))
    .sort((a, b) => (a.ida || "9999").localeCompare(b.ida || "9999"));
}
function gravarViagens(lista) { gravarLocal(VIAGENS_KEY, lista); }
// Com data: já começou e não acabou. Sem data: não conta como "viajando".
function viajandoAgora() {
  const hoje = diaISO();
  return lerViagens().find(v => v.ida && v.ida <= hoje && (!v.volta || v.volta >= hoje)) || null;
}
// A que a home mostra: em andamento, a que começa nos próximos 15 dias, ou
// a sem data (até a pessoa apagar).
function viagemDaVez() {
  const limite = somarDias(diaISO(), VIAGEM_ANTES_DIAS);
  return viajandoAgora() || lerViagens().find(v => !v.ida || v.ida <= limite) || null;
}
function textoDaViagem(v) {
  if (!v) return "";
  if (v.ida && v.volta) return `${diaCurto(v.ida)} a ${diaCurto(v.volta)}`;
  if (v.ida) return `a partir de ${diaCurto(v.ida)}`;
  return "";
}
function academiasNaCidade(cidade) {
  const c = cidadesComQuadra().find(x => mesmaCidade(x.nome, cidade));
  return c ? c.courts.length : 0;
}
// "Pesquisar" sem digitar: a viagem em andamento vem antes da cidade de casa.
function cidadePadraoDaBusca() {
  const v = viajandoAgora();
  return v ? v.cidade : lerPreferencias().cidade || "";
}

function abrirViagem(prefill) {
  state.showMenu = false;
  state.viagemErro = "";
  window.__viagem = { uf: "", cidade: "", ficar: "", ida: "", volta: "", ...(prefill || {}) };
  state.showViagem = true;
  render();
  conferirCidadeDaViagem();
}
async function conferirCidadeDaViagem() {
  const r = window.__viagem || {};
  if (!r.uf) return;
  await carregarCidadesDoUf(r.uf);
  if (state.showViagem) {
    const focado = document.activeElement && document.activeElement.id;
    render();
    if (focado) document.getElementById(focado)?.focus();
  }
}
async function salvarViagem() {
  const r = window.__viagem || {};
  let cidade = String(r.cidade || "").trim().replace(/\s+/g, " ");
  const erro = (t) => { state.viagemErro = t; render(); };
  if (!r.uf) return erro("Escolha o estado da viagem.");
  if (!cidade) return erro("Digite a cidade da viagem.");
  const doUf = await carregarCidadesDoUf(r.uf);
  if (doUf) {
    const oficial = doUf.find(n => mesmaCidade(n, cidade));
    if (!oficial) return erro(`${cidade} não fica em ${nomeDoUf(r.uf)}. Confira o estado ou escolha uma cidade da lista.`);
    cidade = oficial;
  }
  if (r.ida && r.ida < diaISO()) return erro("A ida já passou. Confira a data.");
  if (r.ida && r.volta && r.volta < r.ida) return erro("A volta precisa ser depois da ida.");
  if (!r.ida && r.volta) return erro("Ponha também a data de ida, ou apague a volta.");
  const ficar = String(r.ficar || "").trim().replace(/\s+/g, " ");
  // Onde vai ficar: o mapa acha o ponto. Se não achar, guarda assim mesmo e
  // as quadras aparecem pela cidade.
  let ponto = null;
  if (ficar) {
    state.viagemSalvando = true; render();
    for (const q of [`${ficar}, ${cidade}, ${nomeDoUf(r.uf)}, Brasil`, `${ficar}, ${cidade}`]) {
      try { ponto = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
    }
    state.viagemSalvando = false;
  }
  const lista = lerViagens().filter(v => String(v.id) !== String(r.id) && !(mesmaCidade(v.cidade, cidade) && (v.ida || "") === (r.ida || "")));
  lista.push({ id: r.id || Date.now(), uf: r.uf, cidade, ida: r.ida || "", volta: r.volta || "",
    ...(ficar ? { ficar } : {}), ...(ponto ? { lat: ponto.lat, lng: ponto.lng } : {}) });
  gravarViagens(lista.slice(-5));
  gravarLocal(VIAGEM_CONVITE_KEY, Date.now());
  state.showViagem = false;
  state.viagemAviso = ficar && !ponto
    ? `Viagem a ${cidade} guardada. Não achei "${ficar}" no mapa: as quadras aparecem pela cidade.`
    : `Viagem a ${cidade} guardada.`;
  if (state.page !== "home") goHome(); else render();
}
// "Ver quadras": com o lugar onde vai ficar, a distância é a partir dele (o
// endereço não vai para o link, como a busca pelo GPS); sem ele, a cidade.
function verQuadrasDaViagem(id) {
  const v = lerViagens().find(x => String(x.id) === String(id));
  state.showViagem = false;
  state.viagemAviso = "";
  if (!v) return;
  if (!(v.ficar && Number.isFinite(v.lat) && Number.isFinite(v.lng))) { abrirRegiao({ cidade: v.cidade }); return; }
  state.regiaoLink = null;
  state.cep = "";
  state.termoBuscado = "";
  state.origin = { lat: v.lat, lng: v.lng, bairro: v.ficar, cidade: v.cidade, uf: v.uf, cep: "", approximate: false, viagem: true };
  state.sortBy = "distance";
  state.searchStatus = "done";
  contarNavegacao();
  goSearch();
}
function apagarViagem(id) {
  gravarViagens(lerViagens().filter(v => String(v.id) !== String(id)));
  render();
}

// "Vai viajar? A gente também te ajuda" (pedido do Breno em 04/10/2026):
// não no cadastro, e sim para quem já está navegando — abriu umas academias
// ou buscou algumas vezes, ou está no site há uns minutos. Como o "Planejando
// uma viagem?" do Booking e do Airbnb. Some com a viagem guardada; fechado,
// volta só depois de 30 dias.
const VIAGEM_CONVITE_KEY = "guiatennis_convite_viagem_v1";
const VIAGEM_CONVITE_PASSOS = 3;
const VIAGEM_CONVITE_SEGUNDOS = 120;
function contarNavegacao() { state.navegou = (state.navegou || 0) + 1; }
function conviteViagem() {
  if (isAdmin || contaAcademia) return "";
  if (state.showMenu || state.jogadorTela || state.showViagem || state.showPrefs || state.showRegister || state.showLogin) return "";
  if ((state.navegou || 0) < VIAGEM_CONVITE_PASSOS && !state.tempoNoSite) return "";
  if (lerViagens().length) return "";
  const fechado = lerLocal(VIAGEM_CONVITE_KEY, 0);
  if (fechado && Date.now() - fechado < 30 * 864e5) return "";
  return `
    <aside class="convite-conta convite-viagem" id="convite-viagem" role="dialog" aria-label="Vai viajar?">
      <button type="button" class="convite-fechar" id="convite-viagem-fechar" aria-label="Fechar">✕</button>
      <span class="convite-ic">${icon('map', 26, '#fff')}</span>
      <div class="convite-txt">
        <p class="convite-t">Vai viajar? A gente também te ajuda.</p>
        <p class="convite-s">Diga a cidade e o hotel: o GuiaTennis mostra as quadras para jogar perto de onde você vai ficar.</p>
        <button type="button" class="cta-btn cta-secondary convite-btn" id="convite-viagem-sim">Contar a viagem</button>
      </div>
    </aside>`;
}
function ligarTempoNoSite() {
  setTimeout(() => {
    state.tempoNoSite = true;
    const digitando = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (!digitando && conviteViagem() && (state.page === "home" || state.page === "court")) render();
  }, VIAGEM_CONVITE_SEGUNDOS * 1000);
}

// Na busca: buscou uma cidade que não é a de casa nem de uma viagem guardada.
function perguntaViagem() {
  const o = state.origin;
  const pref = lerPreferencias();
  if (!o || state.searchStatus !== "done" || !o.cidade || !pref.cidade) return "";
  if (mesmaCidade(o.cidade, pref.cidade)) return "";
  if (lerViagens().some(v => mesmaCidade(v.cidade, o.cidade))) return "";
  if ((state.viagemPerguntaFechada || []).some(c => mesmaCidade(c, o.cidade))) return "";
  return `
    <div class="viagem-pergunta" id="viagem-pergunta">
      ${icon('map', 18, 'var(--green)')}
      <span>Vai viajar para <strong>${esc(o.cidade)}</strong>? Guarde a viagem e o GuiaTennis mostra as quadras de lá na hora certa.</span>
      <button type="button" class="pc-link-btn" id="viagem-pergunta-sim">Guardar viagem</button>
      <button type="button" class="viagem-pergunta-x" id="viagem-pergunta-nao" aria-label="Não vou viajar">✕</button>
    </div>`;
}

function abrirPreferencias() {
  const p = lerPreferencias();
  window.__pref = { uf: p.uf || "", cidade: p.cidade || "", modalidade: p.modalidade || "" };
  state.prefErro = "";
  state.prefSalvando = false;
  state.showPrefs = true;
  render();
  conferirCidadeDoUf();
}

async function salvarPreferencias() {
  const r = window.__pref || {};
  const uf = r.uf || "";
  let cidade = String(r.cidade || "").trim().replace(/\s+/g, " ");
  if (!uf || !cidade) { state.prefErro = !uf ? "Escolha o estado." : "Digite a cidade."; render(); return; }
  // A cidade precisa ser do estado (lista do IBGE); vale o nome oficial.
  const doUf = await carregarCidadesDoUf(uf);
  if (doUf) {
    const oficial = doUf.find(n => mesmaCidade(n, cidade));
    if (!oficial) { state.prefErro = `${cidade} não fica em ${nomeDoUf(uf)}. Confira o estado ou escolha uma cidade da lista.`; render(); return; }
    cidade = oficial;
  }
  // Com academia no guia, usa o nome do jeito que está no guia.
  const doGuia = cidadesComQuadra().find(c => mesmaCidade(c.nome, cidade));
  if (doGuia) cidade = doGuia.nome;
  const p = { uf, cidade, modalidade: r.modalidade || "" };
  // Cidade ainda sem academia: o mapa diz onde ela fica, para sugerir as
  // academias mais perto. Se o mapa não responder, salva assim mesmo.
  if (!doGuia) {
    state.prefSalvando = true;
    render();
    try {
      const nomeUf = nomeDoUf(uf);
      const g = await geocodeAddress(`${cidade}, ${nomeUf}, Brasil`);
      p.lat = pontoAproximado(g.lat);
      p.lng = pontoAproximado(g.lng);
    } catch (e) { diag(`preferências: não achei ${cidade}/${uf} no mapa (${e.message})`); }
  }
  gravarLocal(PREFERENCIAS_KEY, p);
  state.homeCity = null;
  if (!state.origin && !state.modalidadeFilters.length && p.modalidade) state.modalidadeFilters = [p.modalidade];
  state.prefSalvando = false;
  state.showPrefs = false;
  render();
}

// O "O que você costuma procurar" já vem escolhido na busca da home.
function aplicarPreferenciaNaBusca() {
  const p = lerPreferencias();
  if (p.modalidade && !state.modalidadeFilters.length && MODALIDADE_OPTS.some(m => m.key === p.modalidade)) {
    state.modalidadeFilters = [p.modalidade];
  }
}

// ---------- conta do jogador (02/10/2026) ----------
// Como "Minha trivago" e a conta do Booking: buscar e chamar continuam sem
// conta; com ela, a pessoa avalia e escolhe os avisos por e-mail. Os avisos
// começam desligados (LGPD) e mudam quando ela quiser.
const AVISOS_JOGADOR = [
  { campo: "avisos_academias", t: "Academias novas na minha cidade e mudanças nas minhas favoritas" },
  { campo: "promocoes", t: "Promoções das academias" },
  { campo: "novidades", t: "Novidades e dicas do GuiaTennis" },
];
function avisosLigados(j) {
  return !!(j && j.avisos_viagem) || AVISOS_JOGADOR.some(a => j && j[a.campo]);
}

// Um lugar só para o e-mail (02/10/2026): "entrar" e "criar" começam pelo
// e-mail; o banco diz se já tem conta (vai para a senha) ou não (completa o
// cadastro), como no Booking e no Airbnb.
function abrirContaJogador(tela, motivo) {
  state.showMenu = false;
  state.jogadorTela = tela === "conta" ? "conta" : "email";
  state.jogadorMotivo = motivo || "";
  state.jogadorErro = "";
  state.jogadorAviso = "";
  state.jogadorSalvando = false;
  const pref = lerPreferencias();
  window.__jog = tela === "conta" && jogador
    ? { nome: jogador.nome || "", cidade: jogador.cidade || "", ...Object.fromEntries(AVISOS_JOGADOR.map(a => [a.campo, !!jogador[a.campo]])),
        avisos_viagem: !!jogador.avisos_viagem, ...(jogador.avisos_viagem ? { viagem_uf: jogador.viagem_uf || "", viagem_cidade: jogador.viagem_cidade || "", viagem_ida: jogador.viagem_ida || "", viagem_volta: jogador.viagem_volta || "" } : {}) }
    : { ...(window.__jog || {}), cidade: (window.__jog && window.__jog.cidade) || pref.cidade || "" };
  render();
}

// Faz a ação (avaliar) já logado; sem conta, abre o Entrar e faz depois.
function jogadorEntaoFaz(acao) {
  if (jogador) { acao(); return; }
  state.depoisDeEntrar = acao;
  abrirContaJogador("entrar", "Para avaliar, entre com o seu e-mail. Se ainda não tiver conta, o cadastro leva um minuto.");
}

// Confere a viagem do aviso. Devolve o erro, ou "" e os dados arrumados em f.
async function conferirAvisoViagem(f) {
  if (!f.avisos_viagem) return "";
  if (!f.viagem_uf) return "Escolha o estado da viagem.";
  const cidade = String(f.viagem_cidade || "").trim().replace(/\s+/g, " ");
  if (!cidade) return "Digite a cidade da viagem.";
  if (f.viagem_ida && f.viagem_ida < diaISO()) return "A ida já passou. Confira a data.";
  if (!f.viagem_ida && f.viagem_volta) return "Ponha também a data de ida, ou apague a volta.";
  if (f.viagem_volta && f.viagem_volta < f.viagem_ida) return "A volta precisa ser depois da ida.";
  const doUf = await carregarCidadesDoUf(f.viagem_uf);
  if (doUf) {
    const oficial = doUf.find(n => mesmaCidade(n, cidade));
    if (!oficial) return `${cidade} não fica em ${nomeDoUf(f.viagem_uf)}. Confira o estado ou escolha uma cidade da lista.`;
    f.viagem_cidade = oficial;
  } else f.viagem_cidade = cidade;
  return "";
}
function dadosDoAvisoViagem(f) {
  const ligado = !!f.avisos_viagem;
  return {
    avisos_viagem: ligado,
    viagem_uf: ligado ? f.viagem_uf : null,
    viagem_cidade: ligado ? f.viagem_cidade : null,
    viagem_ida: ligado ? (f.viagem_ida || null) : null,
    viagem_volta: ligado ? (f.viagem_volta || null) : null,
  };
}
// A viagem do aviso também vira a viagem do aparelho (cartão na home).
function guardarViagemDoAviso(f) {
  if (!f.avisos_viagem || !f.viagem_cidade) return;
  const igual = (v) => mesmaCidade(v.cidade, f.viagem_cidade);
  const antes = lerViagens().find(igual) || {};
  const lista = lerViagens().filter(v => !igual(v));
  const lugar = antes.ficar ? { ficar: antes.ficar, lat: antes.lat, lng: antes.lng } : {};
  lista.push({ id: antes.id || Date.now(), uf: f.viagem_uf, cidade: f.viagem_cidade, ida: f.viagem_ida || "", volta: f.viagem_volta || "", ...lugar });
  gravarViagens(lista.slice(-5));
}

// E-mail digitado errado: "fulano@gmial.com" → "Você quis dizer
// fulano@gmail.com?", como o Booking e o Airbnb. Compara o domínio com os
// mais usados no Brasil; não precisa de serviço de fora.
const DOMINIOS_COMUNS = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.com.br", "yahoo.com", "icloud.com",
  "live.com", "msn.com", "uol.com.br", "bol.com.br", "terra.com.br", "hotmail.com.br", "outlook.com.br", "me.com"];
function distanciaDeTexto(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : Infinity);
  return d[a.length][b.length];
}
function sugestaoDeEmail(email) {
  const m = String(email || "").trim().toLowerCase().match(/^([^@\s]+)@([^@\s]+)$/);
  if (!m) return null;
  const dominio = m[2];
  if (DOMINIOS_COMUNS.includes(dominio)) return null;
  let melhor = null, menor = 3;
  DOMINIOS_COMUNS.forEach(d => { const x = distanciaDeTexto(dominio, d); if (x < menor) { menor = x; melhor = d; } });
  // "gmail" sem o ".com" também é erro comum.
  if (!melhor && !dominio.includes(".")) melhor = DOMINIOS_COMUNS.find(d => d.startsWith(dominio + ".")) || null;
  return melhor ? `${m[1]}@${melhor}` : null;
}
// Mostra a sugestão uma vez por e-mail; "Não, está certo" segue com o digitado.
function precisaSugerir(email) {
  const para = sugestaoDeEmail(email);
  if (!para || state.emailSugestaoVista === email) { state.emailSugestao = null; return false; }
  state.emailSugestao = { de: email, para };
  return true;
}
function blocoSugestaoEmail(email) {
  const sug = state.emailSugestao;
  if (!sug || sug.de !== String(email || "").trim().toLowerCase()) return "";
  return `
    <div class="email-sugestao" role="alert">
      <span>Você quis dizer <strong>${esc(sug.para)}</strong>?</span>
      <div class="email-sugestao-acoes">
        <button type="button" class="cta-btn cta-primary" data-email-sugestao="usar">Sim, usar esse</button>
        <button type="button" class="cta-btn cta-secondary" data-email-sugestao="manter">Não, está certo</button>
      </div>
    </div>`;
}

// ---------- código por e-mail (02/10/2026) ----------
// Prova que o e-mail existe e é da pessoa: o login do Supabase manda um
// código (6 a 10 números, conforme o painel do Supabase) e o site
// confere. Serve para confirmar o e-mail e para o "Esqueci a senha". Login
// com o domínio interno das academias (usuário@acesso…) não recebe e-mail:
// para esses, o "esqueci" continua pelo WhatsApp.
function recebeEmail(login) {
  return !!login && login.includes("@") && !login.endsWith("@" + DOMINIO_ACESSO);
}
async function enviarCodigo(email) {
  window.__codigo = {};
  try {
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
    if (error) diag(`código por e-mail: ${error.message}`);
    return !error;
  } catch (e) { diag(`código por e-mail: ${e.message}`); return false; }
}
// Confere o código; certo, a pessoa fica logada por ele (e o banco aceita a
// confirmação do e-mail).
async function conferirCodigo(email, codigo) {
  const limpo = String(codigo || "").replace(/\D/g, "");
  // O tamanho vem do painel do Supabase (6 a 10 números; este projeto usa 8).
  if (limpo.length < 6 || limpo.length > 10) return null;
  try {
    const { data, error } = await sb.auth.verifyOtp({ email, token: limpo, type: "email" });
    if (error || !data || !data.session) return null;
    try { await sb.rpc('confirmar_meu_email'); } catch {}
    window.__codigo = { senha: (window.__codigo || {}).senha };
    return data.session;
  } catch { return null; }
}
const CODIGO_ERRADO = "Código errado ou vencido. Confira o número ou peça outro.";

// ---------- senha (04/10/2026) ----------
// Como Google, Microsoft e as recomendações atuais de segurança: o que
// protege é o tamanho e não ser uma senha óbvia, e não regra de símbolo
// obrigatório. O site recusa as senhas mais usadas, a que repete o e-mail e
// a sequência; mostra a força enquanto a pessoa digita; o olhinho mostra o
// que foi digitado; e a senha nova é digitada duas vezes.
const SENHAS_COMUNS = ["12345678", "123456789", "1234567890", "87654321", "11111111", "00000000",
  "12341234", "11223344", "senha123", "senha1234", "senhasenha", "password", "password1", "qwertyui",
  "qwerty123", "abc12345", "abcd1234", "iloveyou", "brasil123", "mudar123", "teste123", "admin123",
  "guiatennis", "guiatenis", "tenis123", "tennis123", "flamengo", "corinthians", "palmeiras", "saopaulo"];
function senhaObvia(senha, email) {
  const s = String(senha || "").toLowerCase();
  const nomeDoEmail = String(email || "").toLowerCase().split("@")[0];
  if (SENHAS_COMUNS.some(c => s === c || (c.length >= 8 && s.startsWith(c) && s.length <= c.length + 2))) return true;
  if (/^(.)\1+$/.test(s)) return true;                                   // aaaaaaaa
  if ("0123456789012345678909876543210".includes(s) || "abcdefghijklmnopqrstuvwxyz".includes(s)) return true;
  if (nomeDoEmail.length >= 4 && s.includes(nomeDoEmail)) return true;
  if (s.includes("guiatenn")) return true;
  return false;
}
// "" se a senha serve; senão, o que corrigir. confirmacao undefined = sem campo.
function erroDaSenha(senha, confirmacao, email) {
  const s = String(senha || "");
  if (s.length < 8) return "A senha precisa ter pelo menos 8 caracteres.";
  if (senhaObvia(s, email)) return "Essa senha é fácil de adivinhar. Use uma frase ou junte palavras e números, como \"saibro coberto 2026\".";
  if (confirmacao !== undefined && s !== String(confirmacao || "")) return "As duas senhas não estão iguais.";
  return "";
}
function forcaDaSenha(senha, email) {
  const s = String(senha || "");
  if (!s) return null;
  if (s.length < 8 || senhaObvia(s, email)) return { nivel: 0, t: "Fraca" };
  let pontos = 0;
  if (s.length >= 12) pontos++;
  if (s.length >= 16) pontos++;
  if (/[a-zA-Z]/.test(s) && /\d/.test(s)) pontos++;
  if (/[^a-zA-Z0-9]/.test(s) || (/[a-z]/.test(s) && /[A-Z]/.test(s))) pontos++;
  return pontos >= 3 ? { nivel: 2, t: "Forte" } : pontos >= 1 ? { nivel: 1, t: "Boa" } : { nivel: 0, t: "Fraca" };
}

// Olhinho em todo campo de senha e a força embaixo da senha nova. Roda
// depois de cada render; o que estava visível continua visível.
function ligarCamposDeSenha() {
  state.senhasVisiveis = state.senhasVisiveis || {};
  document.querySelectorAll('input[type="password"], input[data-era-senha]').forEach(el => {
    if (el.closest(".senha-caixa")) return;
    el.setAttribute("data-era-senha", "");
    const caixa = document.createElement("span");
    caixa.className = "senha-caixa";
    const margem = getComputedStyle(el).marginTop;
    el.parentNode.insertBefore(caixa, el);
    caixa.appendChild(el);
    caixa.style.marginTop = margem;
    el.style.marginTop = "0";
    const olho = document.createElement("button");
    olho.type = "button";
    olho.className = "senha-olho";
    const desenhar = () => {
      const ver = !!state.senhasVisiveis[el.id];
      el.type = ver ? "text" : "password";
      olho.innerHTML = icon(ver ? "olhoFechado" : "eye", 20, "var(--muted)");
      olho.setAttribute("aria-label", ver ? "Esconder a senha" : "Mostrar a senha");
      olho.setAttribute("aria-pressed", ver ? "true" : "false");
    };
    olho.onclick = () => { state.senhasVisiveis[el.id] = !state.senhasVisiveis[el.id]; desenhar(); el.focus(); };
    caixa.appendChild(olho);
    desenhar();
    // Força: só na senha nova (não na confirmação nem na senha de entrar).
    if (el.getAttribute("autocomplete") === "new-password" && !/2$/.test(el.id)) {
      const forca = document.createElement("p");
      forca.className = "senha-forca";
      forca.setAttribute("aria-live", "polite");
      caixa.insertAdjacentElement("afterend", forca);
      const mostrar = () => {
        const email = (window.__jog && window.__jog.email) || state.pcEmail || state.pcLogin || (contaAcademia && contaAcademia.email) || "";
        const f = forcaDaSenha(el.value, email);
        forca.innerHTML = f ? `<span class="senha-barra n${f.nivel}"><i></i><i></i><i></i></span><span>Senha ${f.t.toLowerCase()}${f.nivel === 0 && el.value.length >= 8 ? ": fácil de adivinhar" : f.nivel === 0 ? ": use pelo menos 8 caracteres" : ""}</span>` : "";
      };
      el.addEventListener("input", mostrar);
      mostrar();
    }
  });
}

async function criarContaJogador() {
  const f = window.__jog || {};
  f.senha = document.getElementById("jog-senha")?.value || f.senha || "";
  f.senha2 = document.getElementById("jog-senha2")?.value || f.senha2 || "";
  const email = String(f.email || "").trim().toLowerCase();
  const falta = [];
  if (String(f.nome || "").trim().length < 3) falta.push("o nome");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) falta.push("um e-mail válido");
  if (!f.aceite) falta.push("o aceite dos Termos");
  if (falta.length) { state.jogadorErro = `Falta ${listaPt(falta)}.`; render(); return; }
  const errSenha = erroDaSenha(f.senha, f.senha2, email);
  if (errSenha) { state.jogadorErro = errSenha; render(); return; }
  state.jogadorSalvando = true; state.jogadorErro = ""; render();
  const r = await sb.rpc('criar_conta_jogador', {
    p_email: email, p_senha: f.senha, p_nome: String(f.nome).trim(), p_aceite: true,
    p_cidade: String(f.cidade || "").trim() || null,
    p_avisos_academias: !!f.avisos_academias, p_promocoes: !!f.promocoes, p_novidades: !!f.novidades,
  });
  if (r.error) {
    state.jogadorSalvando = false;
    state.jogadorErro = /já tem conta/.test(r.error.message || "") ? "Esse e-mail já tem conta. Entre com a sua senha."
      : /Muitos cadastros/.test(r.error.message || "") ? r.error.message
      : "Não consegui criar a conta agora. Tente de novo em instantes.";
    if (/já tem conta/.test(r.error.message || "")) { state.jogadorTela = "entrar"; state.jogadorLogin = email; }
    render();
    return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: f.senha });
  if (!error) await carregarConta(data && data.session);
  window.__jog = { email };
  if (error || !jogador) {
    state.jogadorSalvando = false;
    state.jogadorTela = "entrar";
    state.jogadorErro = "Conta criada. Entre com o seu e-mail e a senha.";
    render();
    return;
  }
  // Conta criada e logada: agora confirma o e-mail pelo código.
  state.jogadorLogin = email;
  await irParaCodigoJogador("codigo");
}

async function salvarContaJogador() {
  const f = window.__jog || {};
  if (String(f.nome || "").trim().length < 3) { state.jogadorErro = "Escreva o seu nome."; render(); return; }
  const errViagem = await conferirAvisoViagem(f);
  if (errViagem) { state.jogadorErro = errViagem; render(); return; }
  const mudou = AVISOS_JOGADOR.some(a => !!f[a.campo] !== !!jogador[a.campo]) || !!f.avisos_viagem !== !!jogador.avisos_viagem;
  const dados = { nome: String(f.nome).trim(), cidade: String(f.cidade || "").trim() || null,
    ...Object.fromEntries(AVISOS_JOGADOR.map(a => [a.campo, !!f[a.campo]])), ...dadosDoAvisoViagem(f) };
  if (mudou) dados.avisos_mudados_em = new Date().toISOString();
  state.jogadorSalvando = true; state.jogadorErro = ""; render();
  const { error } = await sb.from('jogadores').update(dados).eq('user_id', jogador.user_id);
  state.jogadorSalvando = false;
  if (error) { state.jogadorErro = "Não consegui salvar agora. Tente de novo em instantes."; render(); return; }
  Object.assign(jogador, dados);
  guardarViagemDoAviso(f);
  state.jogadorAviso = "Salvo.";
  render();
}

function ligarEventosJogador() {
  document.querySelectorAll("[data-jogador]").forEach(el => {
    el.onclick = () => {
      window.__jog = { ...(window.__jog || {}), email: document.getElementById("jog-email")?.value || (window.__jog || {}).email || "" };
      const motivo = state.jogadorTela ? state.jogadorMotivo : (state.page === "court" ? "Para avaliar, entre com o seu e-mail. Se ainda não tiver conta, o cadastro leva um minuto." : "");
      abrirContaJogador(el.dataset.jogador, motivo);
    };
  });
  const fechar = () => { state.jogadorTela = null; state.depoisDeEntrar = null; render(); };
  document.querySelectorAll(".campo-codigo").forEach(el => {
    el.oninput = (e) => { window.__codigo = { ...(window.__codigo || {}), [el.dataset.rascunho]: e.target.value }; };
  });
  document.querySelectorAll("[data-email-sugestao]").forEach(el => {
    el.onclick = () => {
      const sug = state.emailSugestao;
      if (!sug) return;
      const email = el.dataset.emailSugestao === "usar" ? sug.para : sug.de;
      state.emailSugestaoVista = email;
      state.emailSugestao = null;
      if (state.page === "parceiros" && !state.jogadorTela) { state.pcEmail = email; continuarComEmail(); return; }
      window.__jog = { ...(window.__jog || {}), email };
      const campo = document.getElementById("jog-email");
      if (campo) campo.value = email;
      continuarJogadorComEmail();
    };
  });
  const esqueci = document.getElementById("jog-esqueci");
  if (esqueci) esqueci.onclick = () => irParaCodigoJogador("esqueci");
  const reenviar = document.getElementById("jog-reenviar");
  if (reenviar) reenviar.onclick = async () => { state.codigoFalhou = !(await enviarCodigo(state.jogadorLogin || (window.__jog || {}).email)); state.jogadorAviso = ""; state.jogadorErro = state.codigoFalhou ? "" : "Mandamos outro código."; render(); };
  const confirmarCod = document.getElementById("jog-confirmar");
  if (confirmarCod) confirmarCod.onclick = () => confirmarCodigoJogador();
  const campoCod = document.getElementById("jog-codigo");
  if (campoCod && confirmarCod) campoCod.onkeydown = (e) => { if (e.key === "Enter") confirmarCod.click(); };
  const depois = document.getElementById("jog-depois");
  if (depois) depois.onclick = () => { state.codigoDeMinhaConta ? abrirContaJogador("conta") : depoisDeEntrarJogador(); };
  const salvarSenha = document.getElementById("jog-salvar-senha");
  if (salvarSenha) salvarSenha.onclick = () => salvarSenhaNovaJogador();
  const confirmarAgora = document.getElementById("jog-confirmar-agora");
  if (confirmarAgora) confirmarAgora.onclick = () => { state.codigoDeMinhaConta = true; state.jogadorLogin = jogador.email; irParaCodigoJogador("codigo"); };
  const continuar = document.getElementById("jog-continuar");
  if (continuar) continuar.onclick = () => continuarJogadorComEmail();
  const emailCampo = document.getElementById("jog-email");
  if (emailCampo && continuar) emailCampo.onkeydown = (e) => { if (e.key === "Enter") continuar.click(); };
  const trocar = document.getElementById("jog-trocar-email");
  if (trocar) trocar.onclick = () => { state.jogadorTela = "email"; state.jogadorErro = ""; render(); document.getElementById("jog-email")?.focus(); };
  const close = document.getElementById("jogador-close");
  if (close) close.onclick = fechar;
  const overlay = document.getElementById("jogador-overlay");
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) fechar(); };
  document.querySelectorAll(".jog-campo").forEach(el => {
    el.oninput = (e) => { window.__jog = { ...(window.__jog || {}), [el.dataset.campo]: e.target.value }; };
  });
  document.querySelectorAll(".jog-aviso").forEach(el => {
    el.onchange = (e) => {
      window.__jog = { ...(window.__jog || {}), [el.dataset.campo]: e.target.checked };
      if (el.dataset.campo === "avisos_viagem") {
        const bloco = document.getElementById("jog-viagem");
        if (bloco) bloco.hidden = !e.target.checked;
        if (e.target.checked && window.__jog.viagem_uf) carregarCidadesDoUf(window.__jog.viagem_uf).then(encherCidadesDaViagem);
      }
    };
  });
  const encherCidadesDaViagem = (lista) => {
    const dl = document.getElementById("jog-viagem-cidades");
    if (dl && lista) dl.innerHTML = lista.map(n => `<option value="${esc(n)}"></option>`).join("");
  };
  document.querySelectorAll(".jog-viagem-campo").forEach(el => {
    const guardar = (e) => { window.__jog = { ...(window.__jog || {}), [el.dataset.campo]: e.target.value }; };
    el.oninput = guardar;
    el.onchange = (e) => {
      guardar(e);
      if (el.dataset.campo === "viagem_uf") {
        const cidade = document.getElementById("jog-viagem-cidade");
        carregarCidadesDoUf(e.target.value).then(lista => {
          encherCidadesDaViagem(lista);
          // Cidade de outro estado sai, como nas preferências.
          if (lista && cidade && cidade.value && !lista.some(n => mesmaCidade(n, cidade.value))) {
            cidade.value = ""; window.__jog = { ...(window.__jog || {}), viagem_cidade: "" };
          }
        });
      }
      if (el.dataset.campo === "viagem_ida") { const volta = document.getElementById("jog-viagem-volta"); if (volta) volta.min = e.target.value || diaISO(); }
    };
  });
  const aceite = document.getElementById("jog-aceite");
  if (aceite) aceite.onchange = (e) => { window.__jog = { ...(window.__jog || {}), aceite: e.target.checked }; };
  const termos = document.getElementById("jog-termos");
  if (termos) termos.onclick = () => { state.showTerms = true; render(); };
  const priv = document.getElementById("jog-privacidade");
  if (priv) priv.onclick = () => { state.showPrivacy = true; render(); };
  const senha = document.getElementById("jog-senha");
  const entrar = document.getElementById("jog-entrar");
  if (entrar) entrar.onclick = () => entrarJogador();
  if (senha && entrar) senha.onkeydown = (e) => { if (e.key === "Enter") entrar.click(); };
  const criar = document.getElementById("jog-criar");
  if (criar) criar.onclick = () => criarContaJogador();
  const salvar = document.getElementById("jog-salvar");
  if (salvar) salvar.onclick = () => salvarContaJogador();
  const sair = document.getElementById("jog-sair");
  if (sair) sair.onclick = () => { sb.auth.signOut().then(() => location.reload()); };
  const excluir = document.getElementById("jog-excluir");
  if (excluir) excluir.onclick = async () => {
    if (!confirm("Excluir a sua conta do GuiaTennis? Os seus dados e os avisos saem; as avaliações continuam, com o seu nome. Isso não pode ser desfeito.")) return;
    const r = await sb.rpc('excluir_minha_conta_jogador');
    if (r.error) { state.jogadorErro = "Não consegui excluir agora. Fale com o GuiaTennis no WhatsApp."; render(); return; }
    try { await sb.auth.signOut(); } catch {}
    location.reload();
  };
}

// Os números que a academia vê antes de se cadastrar são o total do site
// desde o começo, e se atualizam sozinhos. Abaixo desse mínimo o bloco nem
// aparece: com pouca gente, o número diz mais contra do que a favor.

// Sempre arredondado para baixo, numa casa redonda, e mostrado com "+". Assim
// o número fica fácil de ler e nunca promete mais do que de fato aconteceu.
function numeroRedondo(n) {
  const v = Math.floor(n || 0);
  if (v < 10) return String(v);
  const passo = v < 50 ? 5 : v < 100 ? 10 : v < 500 ? 20 : v < 2000 ? 100 : 500;
  return "+" + (Math.floor(v / passo) * passo).toLocaleString("pt-BR");
}

// "1 em 5", que é mais fácil de entender do que "20,4%".
function umEmCada(parte, todo) {
  if (!parte || !todo) return null;
  const n = Math.round(todo / parte);
  return n <= 1 ? "quase todo mundo" : `1 em ${n}`;
}

function porcentoRedondo(parte, todo) {
  if (!parte || !todo) return null;
  const pct = Math.round(((parte / todo) * 100) / 5) * 5;
  return `${Math.max(5, pct)}%`;
}

}
function pushRecent(id) {

// ---------- o que fica só no aparelho da pessoa ----------
// Como o trivago e o Booking: a última busca, as academias que a pessoa já
// chamou e as preferências de busca ficam no navegador dela e voltam na
// página inicial e no menu. Nada disso vai para o banco (Política de
// Privacidade, "Favoritos, buscas e preferências").
function lerLocal(chave, padrao) {
  try { const v = JSON.parse(localStorage.getItem(chave) || "null"); return v === null ? padrao : v; }
  catch { return padrao; }
}
function gravarLocal(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {}
}

// A última busca, para refazer com um toque ("Vistas recentemente") e para
// sugerir academias parecidas. Guarda o que a pessoa digitou, a região achada,
// o ponto arredondado e os filtros de modalidade, piso e cobertura.
const ULTIMA_BUSCA_KEY = "guiatennis_ultima_busca_v1";
function lerUltimaBusca() {
  const b = lerLocal(ULTIMA_BUSCA_KEY, null);
  return b && typeof b === "object" && (b.termo || b.cidade || b.bairro) ? b : null;
}
function guardarUltimaBusca(geo, termo) {
  if (!geo) return;
  gravarLocal(ULTIMA_BUSCA_KEY, {
    termo: String(termo || "").slice(0, 80),
    bairro: geo.bairro || "",
    cidade: geo.cidade || "",
    lat: pontoAproximado(geo.lat),
    lng: pontoAproximado(geo.lng),
    modalidades: state.modalidadeFilters.slice(),
    pisos: state.pisoFilters.slice(),
    cobertura: state.coberturaFilters.slice(),
    em: Date.now(),
  });
}
function textoDaBusca(b) {
  const lugar = [b.bairro, b.cidade].filter(Boolean).join(", ") || b.termo;
  const oQue = b.modalidades && b.modalidades.length === 1
    ? (MODALIDADE_OPTS.find(m => m.key === b.modalidades[0]) || {}).label
    : "Aulas e locação";
  const detalhes = [...rotulosNaOrdem(PISO_OPTS, b.pisos || []), ...rotulosNaOrdem(COBERTURA_OPTS, b.cobertura || [])];
  return { lugar, oQue, detalhes: detalhes.join(" · ") };
}

// recente primeiro — como as "Reservas" do trivago.
const CHAMADAS_KEY = "guiatennis_chamadas_v1";
function lerChamadas() {
  const v = lerLocal(CHAMADAS_KEY, []);

}
function lembrarChamada(id, tipo) {

// Preferências de busca: estado, depois cidade, e o que a pessoa costuma
// procurar. A cidade preferida abre a lista de cidades da home, vira a busca
// quando a pessoa toca em "Pesquisar" sem digitar e ordena as sugestões.
const PREFERENCIAS_KEY = "guiatennis_preferencias_v1";
const ESTADOS = [
  ["AC", "Acre"], ["AL", "Alagoas"], ["AP", "Amapá"], ["AM", "Amazonas"], ["BA", "Bahia"],
  ["CE", "Ceará"], ["DF", "Distrito Federal"], ["ES", "Espírito Santo"], ["GO", "Goiás"],
  ["MA", "Maranhão"], ["MT", "Mato Grosso"], ["MS", "Mato Grosso do Sul"], ["MG", "Minas Gerais"],
  ["PA", "Pará"], ["PB", "Paraíba"], ["PR", "Paraná"], ["PE", "Pernambuco"], ["PI", "Piauí"],
  ["RJ", "Rio de Janeiro"], ["RN", "Rio Grande do Norte"], ["RS", "Rio Grande do Sul"],
  ["RO", "Rondônia"], ["RR", "Roraima"], ["SC", "Santa Catarina"], ["SP", "São Paulo"],
  ["SE", "Sergipe"], ["TO", "Tocantins"],
];
function lerPreferencias() {
  const p = lerLocal(PREFERENCIAS_KEY, {});
  return p && typeof p === "object" ? p : {};
}
function textoDaPreferencia(p) {
  p = p || lerPreferencias();
  return [p.cidade, p.uf].filter(Boolean).join(", ");
}
// O ponto da cidade preferida: o meio das academias dela, ou o que o mapa
// achou quando a pessoa salvou (cidade ainda sem academia).
function pontoDaPreferencia(p) {
  p = p || lerPreferencias();
  if (!p.cidade) return null;
  const daCidade = state.allCourts.filter(c => mesmaCidade(c.cidade, p.cidade) && typeof c.lat === "number" && typeof c.lng === "number");
  if (daCidade.length) {
    return {
      lat: daCidade.reduce((s, c) => s + c.lat, 0) / daCidade.length,
      lng: daCidade.reduce((s, c) => s + c.lng, 0) / daCidade.length,
    };
  }
  return typeof p.lat === "number" && typeof p.lng === "number" ? { lat: p.lat, lng: p.lng } : null;
}
function mesmaCidade(a, b) {
  return slugTexto(a || "") === slugTexto(b || "") && !!slugTexto(a || "");
}

function cidadesComQuadra() {
  const map = {};
  state.allCourts.forEach(c => {
    const nome = (c.cidade || "").trim();
    if (!nome) return;
    if (!map[nome]) map[nome] = [];
    map[nome].push(c);
  });
  return Object.keys(map).sort((a, b) => map[b].length - map[a].length).map(nome => ({ nome, courts: map[nome] }));
}

function faixaCidade(courts) {
  const vals = courts.map(parsePriceValue).filter(v => isFinite(v));
  if (!vals.length) return "";
  const min = Math.min(...vals), max = Math.max(...vals);
  return min === max ? `a partir de R$ ${min}/hora` : `de R$ ${min} a R$ ${max} a hora`;
}

// O link da última busca, com os filtros dela: /busca?q=Moema&piso=saibro.
function linkDaUltimaBusca(b) {
  const p = new URLSearchParams();
  p.set("q", b.termo || [b.bairro, b.cidade].filter(Boolean).join(", "));
  [["piso", PISO_OPTS, b.pisos], ["cobertura", COBERTURA_OPTS, b.cobertura], ["modalidade", MODALIDADE_OPTS, b.modalidades]].forEach(([nome, opcoes, v]) => {
    const k = naOrdem(opcoes, v || []).map(o => o.key);
    if (k.length) p.set(nome, k.join(","));
  });
  return "/busca?" + p.toString();
}

function refazerUltimaBusca() {
  const b = lerUltimaBusca();
  if (!b) return;
  clearAllFilters();
  state.modalidadeFilters = naOrdem(MODALIDADE_OPTS, b.modalidades || []).map(o => o.key);

// "Com base na sua última busca", como as "Ofertas com base nas suas pesquisas
// recentes" do trivago: as academias mais perto de onde a pessoa buscou, com
// os mesmos filtros. Sem busca, as mais perto da cidade das preferências.
// Mostra primeiro as que a pessoa ainda não viu.
const PARECIDAS_RAIO_KM = 50;
function academiasParecidas(todas, b, recentes) {
  const pref = lerPreferencias();
  const temPonto = b && typeof b.lat === "number" && typeof b.lng === "number";
  const ponto = temPonto ? b : pontoDaPreferencia(pref);
  if (!ponto) return null;
  const comPonto = todas.filter(c => typeof c.lat === "number" && typeof c.lng === "number");
  let lista = comPonto;
  if (temPonto) {
    const filtra = (l, campo, quer) => quer && quer.length ? l.filter(c => quer.some(v => (c[campo] || []).includes(v))) : l;
    const filtrada = filtra(filtra(filtra(lista, "modalidades", b.modalidades), "pisos", b.pisos), "cobertura", b.cobertura);
    if (filtrada.length) lista = filtrada;
  }
  lista = lista
    .map(c => ({ c, d: haversineKm(ponto.lat, ponto.lng, c.lat, c.lng) }))
    .filter(x => x.d <= PARECIDAS_RAIO_KM)
    .sort((x, y) => x.d - y.d);
  const vistas = new Set((recentes || []).map(c => c.id));
  const novas = lista.filter(x => !vistas.has(x.c.id));
  lista = (novas.length ? novas : lista).slice(0, 8);
  if (!lista.length) return null;
  return {
    lista,
    titulo: temPonto ? "Com base na sua última busca" : `Perto de ${textoDaPreferencia(pref)}`,
    sub: temPonto ? `Academias perto de ${textoDaBusca(b).lugar}` : "A cidade das suas preferências de busca",
    deOnde: temPonto ? "da sua busca" : "",
  };
}

// "hoje", "ontem", "há 3 dias" ou a data.
function quandoFoi(ms) {
  const dia = 24 * 3600 * 1000;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dias = Math.floor((hoje.getTime() + dia - ms) / dia);
  if (dias <= 0) return "hoje";
  if (dias === 1) return "ontem";
  if (dias < 7) return `há ${dias} dias`;
  const d = new Date(ms);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}

// ---------- navegação entre as três telas ----------

// O endereço acompanha a tela, então voltar pelo navegador funciona e o link
// de uma academia continua abrindo direto nela (formato: seção "links de
// cada tela", junto de linkDaFicha).

// O que a tela escreve no link. O resto (utm_source, diagnostico) fica.
const PARAMETROS_DA_TELA = ["court", "busca", "comparar", "entrar", "q", "academias", "academia", "piso", "cobertura",
  "modalidade", "comodidades", "nota", "preco", "distancia", "favoritas", "comparando", "ordem", "ver",
  ...["passo", "menu", "lista", "preferencias", "conta", "parte", "termos", "privacidade"]];

// ---------- cada passo com o próprio link (pedido do Breno em 02/10/2026) ----------
// "Voltar" tem de desfazer só o último passo, nunca pular para uma tela
// antiga. Como no Airbnb e no Booking, cada janela aberta e cada passo de
// um formulário entra no link e no histórico do navegador:
//   ?menu=1                       menu aberto
//   ?lista=favoritas|vistas|chamadas   Minhas quadras
//   ?preferencias=1               Preferências de busca
//   ?conta=email|senha|cadastro|minha  Entrar / conta do jogador
//   ?parte=dados|precos|…|pronto  cadastro da academia, parte a parte
//   ?termos=1  ?privacidade=1     textos legais
//   /parceiros/cadastro?passo=senha|dados   e-mail → senha ou cadastro
// O que a pessoa digitou fica na memória: voltar um passo mostra o campo
// como estava. Recarregar num passo sem os dados volta ao começo dele.
const CONTA_NO_LINK = { email: "email", entrar: "senha", criar: "cadastro", conta: "minha", codigo: "codigo", esqueci: "nova-senha" };
function camadasDoEstado() {
  const c = [];
  if (state.page === "parceiros" && !contaAcademia && ["cadastro", "entrar"].includes(state.parceirosAba) && state.pcEmailPasso !== "email")
    c.push(["passo", { existe: "senha", criar: "dados", esqueci: "nova-senha" }[state.pcEmailPasso] || "senha"]);
  if (state.showMenu || state.pcMenu) c.push(["menu", "1"]);
  if (state.lista) c.push(["lista", state.lista]);
  if (state.showPrefs) c.push(["preferencias", "1"]);
  if (state.jogadorTela && CONTA_NO_LINK[state.jogadorTela]) c.push(["conta", CONTA_NO_LINK[state.jogadorTela]]);
  if (state.showRegister && window.__form) c.push(["parte", state.registerStatus === "done" ? "pronto" : (REG_PASSOS[state.regPasso || 0] || REG_PASSOS[0]).id]);
  if (state.showTerms) c.push(["termos", "1"]);
  if (state.showPrivacy) c.push(["privacidade", "1"]);
  return c;
}

// O contrário: o link abre (ou fecha) as janelas e os passos.
function aplicarCamadas(q) {
  const menu = q.get("menu") === "1";
  state.showMenu = menu && state.page !== "parceiros";
  state.pcMenu = menu && state.page === "parceiros";
  state.lista = LISTAS[q.get("lista")] ? q.get("lista") : null;
  const prefs = q.get("preferencias") === "1";
  if (prefs && !state.showPrefs) { const p = lerPreferencias(); window.__pref = window.__pref || { uf: p.uf || "", cidade: p.cidade || "", modalidade: p.modalidade || "" }; }
  state.showPrefs = prefs;
  const conta = Object.keys(CONTA_NO_LINK).find(k => CONTA_NO_LINK[k] === q.get("conta")) || null;
  const temEmail = !!(window.__jog && window.__jog.email);
  state.jogadorTela = !conta ? null
    : conta === "conta" ? (jogador ? "conta" : "email")
    : conta === "codigo" ? (jogador ? "codigo" : "email")
    : (conta === "entrar" || conta === "criar" || conta === "esqueci") && !temEmail ? "email" : conta;
  if (state.jogadorTela === "conta" && !(window.__jog && window.__jog.nome !== undefined)) {
    window.__jog = { nome: jogador.nome || "", cidade: jogador.cidade || "", ...Object.fromEntries(AVISOS_JOGADOR.map(a => [a.campo, !!jogador[a.campo]])) };
  }
  if (!state.jogadorTela) { state.jogadorErro = ""; state.jogadorSalvando = false; }
  const parte = q.get("parte");
  if (parte && window.__form) {
    state.showRegister = true;
    if (parte === "pronto") state.registerStatus = "done";
    else {
      if (state.registerStatus === "done" || state.registerStatus === "error") state.registerStatus = "idle";
      const k = REG_PASSOS.findIndex(x => x.id === parte);
      state.regPasso = k >= 0 ? k : 0;
      state.regPassoErro = "";
    }
  } else {
    state.showRegister = false;
  }
  state.showTerms = q.get("termos") === "1";
  state.showPrivacy = q.get("privacidade") === "1";
  if (state.page === "parceiros" && ["cadastro", "entrar"].includes(state.parceirosAba)) {
    const passo = q.get("passo");
    state.pcEmailPasso = !state.pcEmail ? "email" : passo === "senha" ? "existe" : passo === "dados" ? "criar" : passo === "nova-senha" ? "esqueci" : "email";
    state.loginError = "";
    state.pcContaErro = "";
  }
}
const ORDEM_NO_LINK = { recomendados: "recomendadas", distance: "distancia", rating: "nota", price: "preco", reviews: "avaliacoes", courts: "quadras" };
// Seções da ficha no link (#avaliacoes), com os nomes que a pessoa lê.
const SECOES_FICHA = { visao: "ht-visao", precos: "ht-opcoes", cancelamento: "ht-politica", estrutura: "ht-comodidades",
  localizacao: "ht-local", avaliacoes: "avaliacoes", duvidas: "ht-duvidas", contato: "ht-contato" };

// Sem busca feita, a lista começa nas recomendadas; com busca, na mais perto.
function ordemPadrao() {
  return state.origin ? "distance" : "recomendados";
}

// Filtros, ordem e mapa no link, sempre na ordem das listas (naOrdem):
// o mesmo filtro dá sempre o mesmo link.
function filtrosNoLink(p) {
  const lista = (nome, opcoes, escolhidas) => {
    const v = naOrdem(opcoes, escolhidas).map(o => o.key);
    if (v.length) p.set(nome, v.join(","));
  };
  lista("piso", PISO_OPTS, state.pisoFilters);
  lista("cobertura", COBERTURA_OPTS, state.coberturaFilters);
  lista("modalidade", MODALIDADE_OPTS, state.modalidadeFilters);
  lista("comodidades", FILTER_AMENITY_OPTS, state.amenityFilters);
  if (state.minRating > 0) p.set("nota", String(state.minRating));
  if (state.priceMax !== null) p.set("preco", String(state.priceMax));
  if (state.maxDistance !== null) p.set("distancia", String(state.maxDistance));
  if (state.favoritesOnly) p.set("favoritas", "1");
  if (state.compareOnly) p.set("comparando", "1");
  if (effectiveSort() !== ordemPadrao() && ORDEM_NO_LINK[state.sortBy]) p.set("ordem", ORDEM_NO_LINK[state.sortBy]);
  if (state.view === "map") p.set("ver", "mapa");
}

// O contrário: o link manda nos filtros. Valor desconhecido é ignorado.
// Devolve a ordem pedida no link (ou null), aplicada depois da busca.
function filtrosDoLink(q) {
  const lista = (nome, opcoes) => naOrdem(opcoes, (q.get(nome) || "").split(",")).map(o => o.key);
  state.pisoFilters = lista("piso", PISO_OPTS);
  state.coberturaFilters = lista("cobertura", COBERTURA_OPTS);
  state.modalidadeFilters = lista("modalidade", MODALIDADE_OPTS);
  state.amenityFilters = lista("comodidades", FILTER_AMENITY_OPTS);
  const nota = parseFloat(q.get("nota"));
  state.minRating = RATING_OPTS.some(o => o.value === nota) ? nota : 0;
  const preco = parseInt(q.get("preco"), 10);
  state.priceMax = preco > 0 ? preco : null;
  const distancia = parseFloat(q.get("distancia"));
  state.maxDistance = DISTANCE_OPTS.some(o => o.value === distancia) ? distancia : null;
  state.favoritesOnly = q.get("favoritas") === "1";
  state.compareOnly = q.get("comparando") === "1";
  state.view = q.get("ver") === "mapa" ? "map" : "list";
  const ordem = Object.keys(ORDEM_NO_LINK).find(k => ORDEM_NO_LINK[k] === q.get("ordem")) || null;
  state.sortBy = ordem || ordemPadrao();
  return ordem;
}

function urlDoEstado() {
  const p = new URLSearchParams();
  new URLSearchParams(location.search).forEach((v, k) => { if (!PARAMETROS_DA_TELA.includes(k)) p.set(k, v); });
  let caminho = "/", secao = "";
  if (state.page === "court" && state.selected) {
    caminho = caminhoDaFicha(state.selected);
    if (state.secaoFicha) secao = "#" + state.secaoFicha;
  } else if (state.page === "search") {
    const r = state.regiaoLink;
    if (r && (state.cep || "").trim() === termoDaRegiao(r)) caminho = caminhoDaRegiao(r);
    else {
      caminho = "/busca";
      if ((state.cep || "").trim()) p.set("q", state.cep.trim());
    }
    filtrosNoLink(p);
  } else if (state.page === "comparar") {
    caminho = "/comparar";
    if (state.compareList.length) p.set("academias", state.compareList.map(idCurto).join(","));
  } else if (state.page === "parceiros") {
    const aba = state.parceirosAba || "inicio";
    caminho = "/parceiros" + (aba === "inicio" ? "" : "/" + aba);
    if (aba === "cadastro" && state.pcReivindicar) p.set("academia", state.pcReivindicar);
  }
  camadasDoEstado().forEach(([k, v]) => p.set(k, v));
  const busca = p.toString().replace(/%2C/gi, ",");
  return caminho + (busca ? "?" + busca : "") + secao;
}

// O link sem as janelas e os passos: a tela de baixo.
function semCamadas(url) {
  const [antes, hash = ""] = url.split("#");
  const [caminho, busca = ""] = antes.split("?");
  const p = new URLSearchParams(busca);
  CAMADAS_DO_LINK.forEach(k => p.delete(k));
  const b = p.toString().replace(/%2C/gi, ",");
  return caminho + (b ? "?" + b : "") + (hash ? "#" + hash : "");
}
const CAMADAS_DO_LINK = ["passo", "menu", "lista", "preferencias", "conta", "parte", "termos", "privacidade"];

function syncUrl(push) {
  try {
    const alvo = urlDoEstado();
    if (alvo === location.pathname + location.search + location.hash) return;
    const dados = { page: state.page, prof: camadasDoEstado().length ? 1 : 0 };
    // Tela nova aberta de dentro de uma janela (o menu, por exemplo): toma o
    // lugar da janela no histórico, para o "voltar" não reabrir o menu.
    const deUmaJanela = (history.state && history.state.prof > 0);
    if (push && !deUmaJanela) history.pushState(dados, "", alvo);
    else history.replaceState(dados, "", alvo);
  } catch {}
}

// Chamada no fim de cada render: o link acompanha filtro, ordem, mapa e
// seção. Mudou só isso na mesma busca, entra no histórico (o "voltar"
// desfaz, como no Airbnb). Com a gaveta de filtros aberta, espera fechar
// para virar um passo só.
function sincronizarLink() {
  if (!state.loaded || state.showFilters || state.__voltando) return;
  try {
    const atual = location.pathname + location.search + location.hash;
    const alvo = urlDoEstado();
    if (alvo === atual) return;
    const h = history.state || {};
    const prof = h.prof || 0;
    // Abriu, trocou ou fechou uma janela/passo na mesma tela.
    if (!state.__doHistorico && semCamadas(alvo) === semCamadas(atual)) {
      if (!camadasDoEstado().length && prof > 0) {
        // Fechou (✕, Salvar, Entrar): volta as entradas das janelas, e o
        // "voltar" seguinte vai para a tela de antes, não para a janela.
        state.__voltando = true;
        history.go(-prof);
        return;
      }
      if (!camadasDoEstado().length) { history.replaceState({ page: state.page, prof: 0 }, "", alvo); return; }
      if (h.pai === alvo) {
        // Voltou um passo pelo botão do próprio site ("Voltar", "Trocar o e-mail").
        state.__voltando = true;
        history.back();
        return;
      }
      history.pushState({ page: state.page, prof: prof + 1, pai: atual }, "", alvo);
      return;
    }
    const mesmaTela = alvo.split(/[?#]/)[0] === location.pathname && state.page === "search";
    syncUrl(mesmaTela && !state.__doHistorico);
  } catch {}
}

// O que o link pede: tela, academia, região, termo, filtros e seção.
function lerLink() {
  const q = new URLSearchParams(location.search);
  const partes = location.pathname.split("/").filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch { return x; } });
  const secao = location.hash.slice(1);
  const r = { q, secao: SECOES_FICHA[secao] ? secao : null, page: "home" };
  if (partes[0] === "parceiros") { r.page = "parceiros"; r.aba = abaDoParceiro(partes[1] || "inicio"); r.reivindicar = q.get("academia") || null; }
  else if (q.has("entrar")) { r.page = "parceiros"; r.aba = "entrar"; }
  else if (partes[0] === "academia" && partes[1]) { r.page = "court"; r.slug = partes[1]; }
  else if (q.get("court")) { r.page = "court"; r.courtId = q.get("court"); }
  else if (partes[0] === "quadras") { r.page = "search"; r.regiao = { cidade: partes[1] || "", bairro: partes[2] || "" }; }
  else if (partes[0] === "busca" || q.has("busca")) {
    r.page = "search";
    r.termo = (q.get("q") ?? q.get("busca") ?? "").trim();
    if (r.termo === "quadras") r.termo = "";
  } else if (partes[0] === "comparar" || q.has("comparar")) {
    r.page = "comparar";
    r.academias = (q.get("academias") || "").split(",").filter(Boolean);
  }
  return r;
}

function todasAsFichas() {
  return [...state.allCourts, ...(state.pending || []), ...[minhaAcademia()].filter(Boolean)];
}
// Pelo fim do id; o nome só desempata (e pode ter mudado desde o link).
function academiaDoSlug(slug) {
  const fim = String(slug || "").split("-").pop();
  const achadas = todasAsFichas().filter(c => idCurto(c.id) === fim);
  return achadas.find(c => slugDaAcademia(c) === slug) || achadas[0] || null;
}

// "/quadras/sao-paulo/moema" → Moema, São Paulo, com os nomes de verdade
// das academias cadastradas; região sem academia vira texto simples.
function regiaoDoLink(r) {
  const desfaz = (t) => t.split("-").filter(Boolean).map(p => p[0].toUpperCase() + p.slice(1)).join(" ");
  const naCidade = state.allCourts.filter(c => slugTexto(c.cidade) === r.cidade);
  const noBairro = r.bairro ? naCidade.find(c => slugTexto(c.bairro) === r.bairro) : null;
  return {
    cidade: naCidade[0] ? naCidade[0].cidade : desfaz(r.cidade),
    bairro: r.bairro ? (noBairro ? noBairro.bairro : desfaz(r.bairro)) : "",
  };
}

// Monta a tela a partir do link — ao abrir o site, recarregar, voltar e
// avançar. Devolve o que falta fazer: buscar um termo ou avisar que a
// academia do link não existe mais.
function aplicarLink(r) {
  state.secaoFicha = null;
  state.regiaoLink = null;
  state.avisoLink = "";
  if (r.page === "court") {
    const c = r.slug ? academiaDoSlug(r.slug) : todasAsFichas().find(x => x.id === r.courtId);
    if (c) {
      state.selected = decorate(c);
      state.page = "court";
      state.secaoFicha = r.secao;
      return { ficha: c };
    }
    state.page = "home";
    state.selected = null;
    state.avisoLink = "Essa academia não está mais no GuiaTennis. Veja outras perto de você.";
    return {};
  }
  state.selected = null;
  if (r.page === "parceiros") {
    let aba = r.aba;
    if (aba === "inicio" && contaAcademia) aba = "painel";
    if (PC_PRIVADAS.includes(aba) && !contaAcademia) { state.parceirosDepois = aba; aba = "entrar"; }
    state.page = "parceiros";
    state.parceirosAba = aba;
    state.pcReivindicar = r.reivindicar;
    return { parceiros: aba };
  }
  if (r.page === "comparar") {
    const ids = r.academias.map(fim => (state.allCourts.find(c => idCurto(c.id) === fim) || {}).id).filter(Boolean);
    if (ids.length) setCompareList(ids.slice(0, COMPARE_MAX));
    state.page = "comparar";
    return {};
  }
  if (r.page === "search") {
    state.page = "search";
    const ordem = filtrosDoLink(r.q);
    let termo = r.termo || "";
    if (r.regiao) {
      state.regiaoLink = regiaoDoLink(r.regiao);
      termo = termoDaRegiao(state.regiaoLink);
    }
    return { termo, ordem };
  }
  state.page = "home";
  return {};
}

// Rola até a seção do link (#avaliacoes) depois de desenhar a ficha.
function irParaSecao(nome, suave) {
  const alvo = document.getElementById(SECOES_FICHA[nome] || "");
  const barra = document.getElementById("ht-tabs");
  if (!alvo) return;
  const topo = alvo.getBoundingClientRect().top + window.scrollY - ((barra ? barra.offsetHeight : 0) + 56);
  window.scrollTo({ top: Math.max(0, topo), behavior: suave ? "smooth" : "auto" });
}

function openCourt(id) {
  const c = getResults().find(r => r.id === id)
    || state.allCourts.filter(x => x.id === id).map(decorate)[0]
    || (state.pending || []).filter(x => x.id === id).map(decorate)[0]
    || [minhaAcademia()].filter(x => x && x.id === id).map(decorate)[0];
  if (!c) return;
  state.backTo = state.page === "court" ? (state.backTo || "search") : state.page;
  state.selected = c;
  state.page = "court";
  state.secaoFicha = null;
  state.avisoLink = "";

  state.justRated = false;
  state.rateErro = "";
  if (state.perto[id] && state.perto[id].status === "erro") delete state.perto[id];
  state.reviewsExpanded = false;
  state.showAdminPanel = false;
  state.lista = null;
  window.__rateConsent = false;
  pushRecent(c.id);
  contarNavegacao();
  trackClick(c.id, "visualizacao");
  syncUrl(true);
  render();
  window.scrollTo(0, 0);
}

function voltarDaFicha() {
  state.page = state.backTo === "home" ? "home" : "search";

}

window.addEventListener("popstate", () => {
  if (!state.loaded) return;
  // Quem voltou foi o próprio site (fechou uma janela, "Voltar" de um
  // passo): a tela já está certa. Só confere se, no meio tempo, abriu
  // outra janela — aí ela entra no histórico.
  if (state.__voltando) {
    state.__voltando = false;
    sincronizarLink();
    return;
  }
  state.showFilters = false;
  state.showSort = false;
  const antes = state.page;
  const link = lerLink();
  const feito = aplicarLink(link);
  aplicarCamadas(link.q);
  // Só fechou ou trocou uma janela: a tela de baixo fica onde estava.
  if (antes === state.page && semCamadas(location.pathname + location.search + location.hash) === semCamadas(urlDoEstado())
      && !(feito.termo && feito.termo !== state.termoBuscado)) {
    state.__doHistorico = true;
    render();
    state.__doHistorico = false;
    return;
  }
  state.__doHistorico = true;
  render();
  state.__doHistorico = false;
  if (feito.termo !== undefined && feito.termo && feito.termo !== state.termoBuscado) {
    state.cep = feito.termo;
    doSearch({ ordem: feito.ordem, registrar: false });
  } else if (state.page === "court" && state.secaoFicha) {
    irParaSecao(state.secaoFicha, false);
  } else {
    window.scrollTo(0, 0);
  }
});
