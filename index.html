const STATS_PERIODOS = [
  { key: "7", label: "7 dias" },
  { key: "30", label: "30 dias" },
  { key: "90", label: "90 dias" },
  { key: "all", label: "Tudo" },
];

function statsAgregado(periodo) {
  const raw = state.clicksRaw || [];
  let lista = raw;
  if (periodo !== "all") {
    const corte = Date.now() - parseInt(periodo, 10) * 86400000;
    lista = raw.filter(c => new Date(c.created_at).getTime() >= corte);
  }
  const porAcademia = {};
  let acessos = 0;
  lista.forEach(c => {
    if (c.tipo === "acesso_site") { acessos++; return; }
    if (!c.academia_id) return;
    if (!porAcademia[c.academia_id]) porAcademia[c.academia_id] = { whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 };
    porAcademia[c.academia_id][c.tipo] = (porAcademia[c.academia_id][c.tipo] || 0) + 1;
  });
  return { porAcademia, acessos, totalEventos: lista.length };
}

function resumoTexto(court, d) {
  const contatos = d.whatsapp + d.site + d.instagram + d.compartilhar;
  const per = STATS_PERIODOS.find(p => p.key === state.statsPeriodo);
  return `GuiaTennis — ${court.name}\nPeríodo: ${per ? per.label.toLowerCase() : ""}\n\n`
    + `Visualizações da ficha: ${d.visualizacao}\n`
    + `Cliques no WhatsApp: ${d.whatsapp}\n`
    + `Cliques no Instagram: ${d.instagram}\n`
    + `Cliques no site: ${d.site}\n`
    + `Compartilhamentos: ${d.compartilhar}\n\n`
    + `Total de contatos: ${contatos}\n`
    + `guiatennis.com.br`;
}

function renderStatsPanel() {
  const periodo = state.statsPeriodo || "30";
  const { porAcademia, acessos } = statsAgregado(periodo);

  const linhas = state.allCourts.map(c => {
    const d = Object.assign({ whatsapp:0, site:0, instagram:0, compartilhar:0, visualizacao:0 }, porAcademia[c.id] || {});
    const contatos = d.whatsapp + d.site + d.instagram + d.compartilhar;
    const taxa = d.visualizacao ? (contatos / d.visualizacao) * 100 : 0;
    return { court: c, d, contatos, taxa };
  });

  const ativas = linhas.filter(r => r.d.visualizacao > 0 || r.contatos > 0);
  const paradas = linhas.filter(r => r.d.visualizacao === 0 && r.contatos === 0);

  const ordem = state.statsOrdem || "views";
  ativas.sort((a, b) => {
    if (ordem === "contatos") return b.contatos - a.contatos;
    if (ordem === "taxa") return b.taxa - a.taxa;
    return b.d.visualizacao - a.d.visualizacao;
  });

  const totViews = ativas.reduce((s, r) => s + r.d.visualizacao, 0);
  const totContatos = ativas.reduce((s, r) => s + r.contatos, 0);
  const taxaGeral = totViews ? (totContatos / totViews) * 100 : 0;

  return `
    <div class="overlay open" id="stats-overlay">
      <div class="sheet"><div class="sheet-content">
        <button class="sheet-close" id="stats-close">✕</button>
        <p class="sheet-title display">Estatísticas</p>
        <p class="subtitle" style="margin-top:4px">Registrado por todos os visitantes</p>

        <div class="chip-row" style="margin-top:12px">
          ${STATS_PERIODOS.map(p => `<button class="chip small ${periodo===p.key?"active":""}" data-stats-per="${p.key}">${p.label}</button>`).join("")}
        </div>

        <div class="stats-grid">
          <div class="stat-card"><p class="stat-num">${acessos}</p><p class="stat-lbl">Acessos ao site</p></div>
          <div class="stat-card"><p class="stat-num">${totViews}</p><p class="stat-lbl">Fichas abertas</p></div>
          <div class="stat-card"><p class="stat-num">${totContatos}</p><p class="stat-lbl">Contatos gerados</p></div>
          <div class="stat-card"><p class="stat-num">${taxaGeral.toFixed(0)}%</p><p class="stat-lbl">Ficha → contato</p></div>
        </div>

        <div class="chip-row" style="margin-top:16px">
          <span class="stats-ord-lbl">Ordenar:</span>
          <button class="chip small ${ordem==="views"?"active":""}" data-stats-ord="views">Mais vistas</button>
          <button class="chip small ${ordem==="contatos"?"active":""}" data-stats-ord="contatos">Mais contatos</button>
          <button class="chip small ${ordem==="taxa"?"active":""}" data-stats-ord="taxa">Melhor taxa</button>
        </div>

        <p class="field-label" style="margin-top:16px">Com movimento (${ativas.length})</p>
        ${ativas.length === 0 ? `<p class="empty">Nenhum registro nesse período.</p>` : ""}
        ${ativas.map(r => `
          <div class="pending-item">
            <div class="stat-row-top">
              <p class="pending-name display" style="margin:0">${esc(r.court.name)}</p>
              ${r.d.visualizacao ? `<span class="stat-taxa ${r.taxa >= 15 ? 'boa' : (r.taxa > 0 ? 'media' : 'zero')}">${r.taxa.toFixed(0)}%</span>` : ""}
            </div>
            <p class="pending-detail">${icon('eye',12)} ${r.d.visualizacao} ficha${r.d.visualizacao===1?"":"s"} aberta${r.d.visualizacao===1?"":"s"} &nbsp;·&nbsp; ${r.contatos} contato${r.contatos===1?"":"s"}</p>
            <p class="pending-detail">${icon('phone',12)} ${r.d.whatsapp} &nbsp; ${icon('instagram',12)} ${r.d.instagram} &nbsp; ${icon('globe',12)} ${r.d.site} &nbsp; ${icon('share',12)} ${r.d.compartilhar}</p>
            <button type="button" class="stat-copy" data-copy-stats="${r.court.id}">Copiar resumo pra mandar</button>
          </div>
        `).join("")}

        ${paradas.length ? `
          <p class="field-label" style="margin-top:20px">Sem movimento no período (${paradas.length})</p>
          <p class="pending-detail" style="margin-bottom:8px">${paradas.map(r => esc(r.court.name)).join(" · ")}</p>
        ` : ""}
      </div></div>
    </div>
  `;
}

            <p class="pending-detail">${totalQuadras(p) ? QUADRA_COMBOS.filter(q => p.quadras[q.key] > 0).map(q => `${p.quadras[q.key]}x ${PISO_OPTS.find(o=>o.key===q.piso)?.label} ${COBERTURA_OPTS.find(o=>o.key===q.cobertura)?.label.toLowerCase()}`).join(", ") : "sem detalhamento de quadras"}</p>
            <p class="pending-detail">${esc(p.phone || "sem telefone")}${p.instagram ? " · " + esc(p.instagram) : ""}</p>
            ${p.nomeSolicitante ? `<p class="pending-detail" style="color:var(--muted-dark)">Enviado por: ${esc(p.nomeSolicitante)} · ${esc(p.contatoSolicitante || "")}</p>` : ""}
            <p class="pending-detail">${(p.photos||[]).length ? `${p.photos.length} foto${p.photos.length>1?'s':''} enviada${p.photos.length>1?'s':''}` : "sem fotos"}</p>
            <div class="pending-actions">

              <button class="cta-btn cta-danger" data-reject="${p.id}">Rejeitar</button>

          </div>
        `).join("")}
      </div></div>

  `;
}

// ---------- events ----------

function attachEvents() {
  // ---- ordenação estilo Trivago (botão + menu suspenso) ----
  // Garante que o menu de ordenação caiba na tela, seja qual for a largura.
  const sortMenu = document.getElementById("sort-menu");
  if (sortMenu) {
    sortMenu.style.transform = "";
    const caixa = sortMenu.getBoundingClientRect();
    const folga = 12;
    if (caixa.left < folga) {
      sortMenu.style.transform = `translateX(${Math.ceil(folga - caixa.left)}px)`;
    } else if (caixa.right > window.innerWidth - folga) {
      sortMenu.style.transform = `translateX(-${Math.ceil(caixa.right - window.innerWidth + folga)}px)`;
    }
  }

  const sortToggle = document.getElementById("sort-toggle");
  if (sortToggle) sortToggle.onclick = () => { state.showSort = !state.showSort; render(); };
  const sortBackdrop = document.getElementById("sort-backdrop");
  if (sortBackdrop) sortBackdrop.onclick = () => { state.showSort = false; render(); };

  const brandHome = document.getElementById("brand-home");
  if (brandHome) brandHome.onclick = goHome;

  const irAvaliacoes = document.getElementById("ir-avaliacoes");
  if (irAvaliacoes) irAvaliacoes.onclick = () => {
    const alvo = document.getElementById("avaliacoes");
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const shareBtn2 = document.getElementById("share-btn-2");
  if (shareBtn2) shareBtn2.onclick = () => shareCourt(shareBtn2.dataset.court);

  const courtBack = document.getElementById("court-back");
  if (courtBack) courtBack.onclick = voltarDaFicha;

  // ---- ficha: caminho, barra de seções e perguntas frequentes ----
  document.querySelectorAll("[data-crumb]").forEach(el => {
    el.onclick = () => {
      if (el.dataset.crumb === "home") { goHome(); return; }
      state.cep = el.dataset.termo || "";
      goSearch();
      doSearch();
    };
  });

  document.querySelectorAll("[data-poi-retry]").forEach(el => {
    el.onclick = () => {
      const c = state.selected;
      if (!c || c.id !== el.dataset.poiRetry) return;
      delete state.perto[c.id];
      atualizarPerto(c);
      carregarPerto(c);
    };
  });

  const geocodeBtn = document.getElementById("geocode-btn");
  if (geocodeBtn) geocodeBtn.onclick = async () => {
    const c = state.allCourts.find(x => x.id === geocodeBtn.dataset.court)
          || (state.pending || []).find(x => x.id === geocodeBtn.dataset.court);
    if (!c) return;
    geocodeBtn.disabled = true;
    geocodeBtn.textContent = "Procurando o endereço...";
    try {
      const geo = await geocodeFormAddress({
        cep: "", address: c.address || "", numero: c.numero || "",
        bairro: c.bairro || "", cidade: c.cidade || "",
      });
      const { error } = await sb.from('academias').update({ lat: geo.lat, lng: geo.lng }).eq('id', c.id);
      if (error) throw error;
      await loadEverything();
      if (state.selected && state.selected.id === c.id) {
        const atual = state.allCourts.find(x => x.id === c.id) || state.pending.find(x => x.id === c.id);
        if (atual) state.selected = decorate(atual);
      }
      alert(`Coordenada gravada: ${geo.lat.toFixed(6)}, ${geo.lng.toFixed(6)}${geo.approximate ? "\n\nAtenção: veio do bairro/cidade, não do número exato. Confira no mapa." : ""}`);
      render();
    } catch (e) {
      alert("Não consegui localizar: " + (e.message || "erro desconhecido"));
      geocodeBtn.disabled = false;
      render();
    }
  };

  const qrSiteBtn = document.getElementById("qr-site-btn");
  if (qrSiteBtn) qrSiteBtn.onclick = () => { state.showAdminPanel = false; state.qrCourt = "site"; render(); };

  const qrBtn = document.getElementById("qr-btn");
  if (qrBtn) qrBtn.onclick = () => { state.qrCourt = qrBtn.dataset.court; render(); };
  const qrClose = document.getElementById("qr-close");
  if (qrClose) qrClose.onclick = () => { state.qrCourt = null; render(); };
  const qrOverlay = document.getElementById("qr-overlay");
  if (qrOverlay) qrOverlay.onclick = (e) => { if (e.target === qrOverlay) { state.qrCourt = null; render(); } };
  document.querySelectorAll("[data-qr-baixar]").forEach(el => {
    el.onclick = () => {
      const c = el.dataset.court === "site"
        ? { id: "site", name: "GuiaTennis" }
        : (state.allCourts.find(x => x.id === el.dataset.court) || (state.pending || []).find(x => x.id === el.dataset.court));
      if (c) baixarQr(c, el.dataset.qrBaixar);
    };
  });

  const shareBtn3 = document.getElementById("share-btn-3");
  if (shareBtn3) shareBtn3.onclick = () => shareCourt(shareBtn3.dataset.court);

  document.querySelectorAll(".ht-faq details").forEach(el => {
    el.ontoggle = () => { state.faqOpen[el.dataset.faq] = el.open; };
  });

  if (__htSpy) { window.removeEventListener("scroll", __htSpy); __htSpy = null; }
  const htTabs = document.getElementById("ht-tabs");
  if (htTabs) {
    const botoes = Array.from(htTabs.querySelectorAll("button[data-goto]"));
    botoes.forEach(b => {
      b.onclick = () => {
        const alvo = document.getElementById(b.dataset.goto);
        if (!alvo) return;
        const topo = alvo.getBoundingClientRect().top + window.scrollY - (htTabs.offsetHeight + 56);
        window.scrollTo({ top: Math.max(0, topo), behavior: "smooth" });
      };
    });
    __htSpy = () => {
      if (!document.body.contains(htTabs)) {
        window.removeEventListener("scroll", __htSpy);
        __htSpy = null;
        return;
      }
      const limite = htTabs.getBoundingClientRect().bottom + 30;
      let atual = botoes[0];
      botoes.forEach(b => {
        const alvo = document.getElementById(b.dataset.goto);
        if (alvo && alvo.getBoundingClientRect().top <= limite) atual = b;
      });
      botoes.forEach(b => b.classList.toggle("on", b === atual));
    };
    window.addEventListener("scroll", __htSpy, { passive: true });
    __htSpy();
  }

  document.querySelectorAll(".city-tab").forEach(el => {
    el.onclick = () => { state.homeCity = el.dataset.city; render(); };
  });

  const abrirCadastro = () => {
    window.__form = { name:"", cep:"", address:"", numero:"", complemento:"", bairro:"", cidade:"", quadras:{}, amenities:[], modalidades:[], priceAula:"", priceLocacao:"", phone:"", instagram:"", site:"", photos:[], politica:{ reposicao:"", foraDoPrazo:"" }, acesso:{ referencia:"", entrada:"" } };
    state.showRegister = true;
    state.registerStatus = "idle";
    render();
  };
  const homeCadastrar = document.getElementById("home-cadastrar");
  if (homeCadastrar) homeCadastrar.onclick = abrirCadastro;
  const footerCadastrar = document.getElementById("footer-cadastrar");
  if (footerCadastrar) footerCadastrar.onclick = abrirCadastro;
  const footerBuscar = document.getElementById("footer-buscar");
  if (footerBuscar) footerBuscar.onclick = goSearch;

  document.querySelectorAll("[data-stop]").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
  });

  document.querySelectorAll("[data-share-card]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); shareCourt(el.dataset.shareCard); };
  });

  // pontinhos da galeria do card acompanham o deslize, sem redesenhar a tela
  document.querySelectorAll("[data-strip]").forEach(strip => {
    strip.onscroll = () => {
      const dots = document.querySelector(`[data-dots="${strip.dataset.strip}"]`);
      if (!dots || !strip.clientWidth) return;
      const i = Math.round(strip.scrollLeft / strip.clientWidth);
      dots.querySelectorAll("i").forEach((d, n) => d.classList.toggle("on", n === i));
    };
  });

  const viewToggle = document.getElementById("view-toggle");
  if (viewToggle) viewToggle.onclick = () => {
    state.view = state.view === "map" ? "list" : "map";
    state.mapSelected = null;
    render();
  };

  const scModalidade = document.getElementById("sc-modalidade");
  if (scModalidade) scModalidade.onchange = (e) => {
    state.modalidadeFilters = e.target.value ? [e.target.value] : [];
    render();
  };

  // ---- gaveta de filtros ----
  const drawerClose = document.getElementById("drawer-close");
  if (drawerClose) drawerClose.onclick = () => { state.showFilters = false; render(); };
  const drawerApply = document.getElementById("drawer-apply");
  if (drawerApply) drawerApply.onclick = () => { state.showFilters = false; render(); };
  const drawerOverlay = document.getElementById("drawer-overlay");
  if (drawerOverlay) drawerOverlay.onclick = (e) => { if (e.target === drawerOverlay) { state.showFilters = false; render(); } };

  document.querySelectorAll(".clear-filters").forEach(el => {
    el.onclick = () => { clearAllFilters(); render(); };
  });

  document.querySelectorAll(".f-rating").forEach(el => {
    el.onclick = () => { state.minRating = parseFloat(el.dataset.rating) || 0; render(); };
  });

  document.querySelectorAll(".f-distance").forEach(el => {
    el.onclick = () => { state.maxDistance = el.dataset.distance === "" ? null : parseFloat(el.dataset.distance); render(); };
  });

  // O slider só re-renderiza quando a pessoa solta — assim o arraste não trava.
  document.querySelectorAll(".f-price").forEach(el => {
    el.oninput = () => {
      const pb = priceBounds();
      const v = parseInt(el.value, 10);
      state.priceMax = (pb && v >= pb.max) ? null : v;
      document.querySelectorAll(".f-price-now").forEach(n => {
        n.textContent = state.priceMax === null ? "Qualquer preço" : `Até R$ ${state.priceMax}/hora`;
      });
    };
    el.onchange = () => render();
  });

  document.querySelectorAll(".f-favorites").forEach(el => {
    el.onclick = () => { state.favoritesOnly = !state.favoritesOnly; render(); };
  });
  document.querySelectorAll(".f-compareonly").forEach(el => {
    el.onclick = () => { state.compareOnly = !state.compareOnly; render(); };
  });

  // ---- chips de filtro ativo: o × tira só aquele filtro ----
  document.querySelectorAll("[data-clear]").forEach(el => {
    el.onclick = () => {
      const kind = el.dataset.clear;
      const key = el.dataset.key;
      if (kind === "price") state.priceMax = null;
      else if (kind === "rating") state.minRating = 0;
      else if (kind === "distance") state.maxDistance = null;
      else if (kind === "piso") state.pisoFilters = state.pisoFilters.filter(x => x !== key);
      else if (kind === "cobertura") state.coberturaFilters = state.coberturaFilters.filter(x => x !== key);
      else if (kind === "modalidade") state.modalidadeFilters = state.modalidadeFilters.filter(x => x !== key);
      else if (kind === "amenity") state.amenityFilters = state.amenityFilters.filter(x => x !== key);
      else if (kind === "favorites") state.favoritesOnly = false;
      else if (kind === "compareonly") state.compareOnly = false;
      render();
    };
  });

  // ---- galeria dentro do card da lista ----
  document.querySelectorAll("[data-photo-prev]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.photoPrev;
      const c = state.allCourts.find(x => x.id === id);
      if (!c) return;
      const total = courtPhotos(c).length;
      state.cardPhoto[id] = ((state.cardPhoto[id] || 0) - 1 + total) % total;
      render();
    };
  });
  document.querySelectorAll("[data-photo-next]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.photoNext;
      const c = state.allCourts.find(x => x.id === id);
      if (!c) return;
      const total = courtPhotos(c).length;
      state.cardPhoto[id] = ((state.cardPhoto[id] || 0) + 1) % total;
      render();
    };
  });

  const reviewsMore = document.getElementById("reviews-more");
  if (reviewsMore) reviewsMore.onclick = () => { state.reviewsExpanded = !state.reviewsExpanded; render(); };

  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) logoutBtn.onclick = async () => {
    await sb.auth.signOut();
    isAdmin = false;
    await loadEverything();
    render();
  };

  const adminLoginLink = document.getElementById("admin-login-link");
  if (adminLoginLink) adminLoginLink.onclick = () => { state.showLogin = true; state.loginError = ""; render(); };

  const loginClose = document.getElementById("login-close");
  const loginOverlay = document.getElementById("login-overlay");
  if (loginClose) loginClose.onclick = () => { state.showLogin = false; render(); };
  if (loginOverlay) loginOverlay.onclick = (e) => { if (e.target === loginOverlay) { state.showLogin = false; render(); } };

  const visitorClose = document.getElementById("visitor-close");
  const visitorOverlay = document.getElementById("visitor-overlay");
  if (visitorClose) visitorClose.onclick = () => { state.showVisitorSetup = false; state.pendingVisitorAction = null; render(); };
  if (visitorOverlay) visitorOverlay.onclick = (e) => { if (e.target === visitorOverlay) { state.showVisitorSetup = false; state.pendingVisitorAction = null; render(); } };

  const visitorSubmit = document.getElementById("visitor-submit");
  if (visitorSubmit) visitorSubmit.onclick = () => {
    const nome = document.getElementById("visitor-nome").value.trim();
    const contato = document.getElementById("visitor-contato").value.trim();
    if (!nome || !contato) {
      state.visitorError = "Preencha nome e WhatsApp.";
      render();
      return;
    }
    saveVisitor({ nome, contato });
    state.showVisitorSetup = false;
    const action = state.pendingVisitorAction;
    state.pendingVisitorAction = null;
    if (action) action();
    else render();
  };

  const loginSubmit = document.getElementById("login-submit");
  if (loginSubmit) loginSubmit.onclick = async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    if (!email || !password) {
      state.loginError = "Preencha e-mail e senha.";
      render();
      return;
    }
    state.loginLoading = true;
    state.loginError = "";
    render();
    const { error } = await sb.auth.signInWithPassword({ email, password });
    state.loginLoading = false;
    if (error) {
      state.loginError = "E-mail ou senha incorretos.";
      render();
      return;
    }
    isAdmin = true;
    state.showLogin = false;
    await loadEverything();
    render();
  };

  const cepInput = document.getElementById("cep-input");
  if (cepInput) {
    cepInput.oninput = (e) => { state.cep = e.target.value; };
    cepInput.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("search-btn")?.click(); };
  }
  const searchBtn = document.getElementById("search-btn");
  if (searchBtn) searchBtn.onclick = () => {
    if (!(state.cep || "").trim()) { goSearch(); return; }
    state.page = "search";
    syncUrl(true);
    doSearch().then(() => window.scrollTo(0, 0));
  };

  const locateBtn = document.getElementById("locate-btn");
  if (locateBtn) locateBtn.onclick = () => { state.page = "search"; syncUrl(true); useMyLocation(); };

  document.querySelectorAll(".sort-chip").forEach(el => { el.onclick = () => { state.sortBy = el.dataset.sort; state.showSort = false; render(); }; });
  const filtersToggle = document.getElementById("filters-toggle");
  if (filtersToggle) filtersToggle.onclick = () => { state.showFilters = !state.showFilters; render(); };

  document.querySelectorAll(".piso-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.piso;
      state.pisoFilters = state.pisoFilters.includes(k) ? state.pisoFilters.filter(x=>x!==k) : [...state.pisoFilters, k];
      render();
    };
  });
  document.querySelectorAll(".cobertura-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.cobertura;
      state.coberturaFilters = state.coberturaFilters.includes(k) ? state.coberturaFilters.filter(x=>x!==k) : [...state.coberturaFilters, k];
      render();
    };
  });
  document.querySelectorAll(".amenity-chip").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.amenity;
      state.amenityFilters = state.amenityFilters.includes(k) ? state.amenityFilters.filter(x=>x!==k) : [...state.amenityFilters, k];
      render();
    };
  });

  document.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openCourt(el.dataset.open);
  });

  document.querySelectorAll("[data-fav]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(el.dataset.fav);
      if (state.selected && state.selected.id === el.dataset.fav) {
        state.selected = { ...state.selected };
      }
      render();
    };
  });

  document.querySelectorAll(".plano-btn").forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.court;
      if (getPlano(id) === el.dataset.plano) return;
      const ok = await setPlano(id, el.dataset.plano);
      if (!ok) return;
      if (state.selected && state.selected.id === id) {
        const atual = state.allCourts.find(c => c.id === id) || state.pending.find(c => c.id === id);
        if (atual) state.selected = decorate(atual);
      }
      render();
    };
  });

  async function refreshAfterPauseChange() {

async function autoFillFromCep(rawCep) {
  const digits = (rawCep || "").replace(/\D/g, "");
  if (digits.length !== 8) return;
  state.cepStatus = "loading";
  render();
  try {
    const data = await fetchViaCep(digits);
    const f = window.__form;
    f.address = data.logradouro || f.address;
    f.bairro = data.bairro || f.bairro;
    f.cidade = data.localidade || f.cidade;
    state.cepStatus = "idle";
  } catch (e) {
    state.cepStatus = "error";
  }
  render();
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round(height * (maxDimension / width));
            width = maxDimension;
          } else {
            width = Math.round(width * (maxDimension / height));
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function useMyLocation() {
  if (!navigator.geolocation) {
    state.errorMsg = "Seu navegador não suporta localização automática.";
    state.searchStatus = "error";
    render();
    return;
  }
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const geo = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
        state.origin = geo;
        state.cep = "";
        state.sortBy = "distance";
        state.searchStatus = "done";
      } catch (e) {
        state.errorMsg = e.message || "Não consegui identificar sua região.";
        state.searchStatus = "error";
      }
      render();
    },
    () => {
      state.errorMsg = "Não consegui acessar sua localização. Permita o acesso ou digite um CEP.";
      state.searchStatus = "error";
      render();
    },
    { timeout: 10000 }
  );
}

function shareCourt(courtId) {
  const c = (state.allCourts.find(x => x.id === courtId)) || (state.pending && state.pending.find(x => x.id === courtId));
  if (!c) return;
  trackClick(courtId, "compartilhar");
  const url = `${location.origin}${location.pathname}?court=${c.id}`;
  const text = `Olha essa quadra/academia que eu achei, no GuiaTennis:\n${c.name}${c.endereco ? " - " + c.endereco : (c.bairro ? " - " + c.bairro : "")}`;
  const fullText = `${text} ${url}`;

  function lastResort() {
    window.prompt("Copie o link abaixo pra compartilhar:", fullText);
  }

  try {
    if (navigator.share) {
      navigator.share({ title: c.name, text, url }).catch((err) => {
        if (err && err.name === "AbortError") return; // usuário só fechou o menu de compartilhar
        lastResort();
      });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Link copiado! Cole onde quiser compartilhar.");
      }).catch(lastResort);
    } else {
      lastResort();
    }
  } catch (e) {
    lastResort();
  }
}

async function doSearch() {
  state.searchStatus = "loading";
  state.errorMsg = "";
  render();
  const termo = state.cep.trim();
  const digitsOnly = termo.replace(/\D/g, "");
  try {
    let geo;
    if (digitsOnly.length === 8 && termo.replace(/[\d\s-]/g, "").length === 0) {
      geo = await geocodeCep(termo);
    } else {
      // Aceita endereço OU ponto de referência ("Escola Adventista", "Shopping Morumbi").
      const tentativas = [
        `${termo}, Brasil`,
        termo,
        state.origin && state.origin.cidade ? `${termo}, ${state.origin.cidade}, Brasil` : null,
      ].filter(Boolean);

      let result = null;
      for (const q of tentativas) {
        try { result = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
      }
      if (!result) throw new Error("Não achei esse endereço ou local. Tente incluir o bairro e a cidade.");

      // Descobre bairro/cidade reais pela coordenada, em vez de adivinhar pelo texto digitado
      let bairro = "", cidade = "";
      try {
        const rev = await reverseGeocode(result.lat, result.lng);
        bairro = rev.bairro || "";
        cidade = rev.cidade || "";
      } catch (e) {
        const parts = termo.split(",").map(s => s.trim()).filter(Boolean);
        bairro = parts.length > 1 ? parts[parts.length - 2] : parts[0];
        cidade = parts[parts.length - 1] || "";
      }
      geo = { ...result, bairro: bairro || termo, cidade, approximate: false };
    }
    state.origin = geo;
    state.sortBy = "distance";
    state.searchStatus = "done";
  } catch (e) {
    state.errorMsg = e.message || "Não consegui buscar esse endereço ou CEP.";
    state.searchStatus = "error";
  }
  render();
}

// Enquanto a coluna "politica" não existir na tabela, salva sem ela em vez de
// falhar — e avisa o admin com o SQL que resolve. Mesmo caminho do "plano".
function faltaColunaNova(erro) {
  const m = ((erro && erro.message) || "").toLowerCase();
  return m.includes("politica") || m.includes("acesso");
}

function avisarSqlColunas() {
  if (!isAdmin || window.__avisouColunas) return;
  window.__avisouColunas = true;
  alert(
    "Salvei a academia, mas a política de cancelamento e as dicas de acesso ficaram de fora.\n\n" +
    "A tabela ainda não tem essas colunas. Rode isto no SQL Editor do Supabase:\n\n" +
    "alter table academias add column if not exists politica jsonb not null default '{}'::jsonb;\n" +
    "alter table academias add column if not exists acesso jsonb not null default '{}'::jsonb;"
  );
}

async function doRegisterSubmit() {
  const f = window.__form;
  const quadras = f.quadras || {};
  const hasQuadra = QUADRA_COMBOS.some(q => quadras[q.key] > 0);
  const pisos = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.piso))];
  const cobertura = [...new Set(QUADRA_COMBOS.filter(q => quadras[q.key] > 0).map(q => q.cobertura))];

  if (f.__editingId) {
    if (!f.name.trim()) {
      state.registerError = "O nome não pode ficar em branco.";
      state.registerStatus = "error";
      render();
      return;
    }
    state.registerStatus = "saving";
    render();
    const endereco = (f.address || f.numero || f.bairro || f.cidade)
      ? `${f.address}${f.numero ? ", " + f.numero : ""}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}`
      : undefined;
    const payload = toRow({ ...f, pisos, cobertura });
    if (endereco) payload.endereco = endereco; else delete payload.endereco;
    try {
      let { error } = await sb.from('academias').update(payload).eq('id', f.__editingId);
      if (error && faltaColunaNova(error)) {
        const semNovas = { ...payload };
        delete semNovas.politica;
        delete semNovas.acesso;
        ({ error } = await sb.from('academias').update(semNovas).eq('id', f.__editingId));
        if (!error) avisarSqlColunas();
      }
      if (error) throw error;
      await loadEverything();
      if (state.selected && state.selected.id === f.__editingId) {
        state.selected = state.allCourts.find(c => c.id === f.__editingId) || state.pending.find(c => c.id === f.__editingId) || state.selected;
      }
      state.registerStatus = "done";
    } catch (e) {
      state.registerError = e.message || "Não consegui salvar as alterações.";
      state.registerStatus = "error";
    }
    render();
    return;
  }

  const missing = [];
  if (!f.name.trim()) missing.push("nome");
  if (!f.address.trim() || !f.numero.trim() || !f.bairro.trim() || !f.cidade.trim()) missing.push("endereço completo");
  if (!f.phone.trim()) missing.push("WhatsApp");
  if (!hasQuadra) missing.push("quantidade de quadras");
  if (!f.modalidades.length) missing.push("modalidade");
  if (!f.consent) missing.push("aceite dos Termos de Uso e Política de Privacidade");

  if (missing.length) {
    state.registerError = `Preencha: ${missing.join(", ")}.`;
    state.registerStatus = "error";
    render();
    return;
  }

  state.registerStatus = "saving";
  render();
  try {
    const geo = await geocodeFormAddress(f);
    const endereco = `${f.address}, ${f.numero}${f.complemento ? " - " + f.complemento : ""} - ${f.bairro}, ${f.cidade}${f.cep ? " - " + f.cep : ""}`;
    const visitor = loadVisitor() || {};
    const payload = {
      ...toRow({ ...f, pisos, cobertura }),
      endereco, lat: geo.lat, lng: geo.lng,
      source: 'custom', status: 'pending',
      nome_solicitante: isAdmin ? null : visitor.nome,
      contato_solicitante: isAdmin ? null : visitor.contato,
    };
    const enviar = (corpo) => {
      let q = sb.from('academias').insert(corpo);
      if (isAdmin) q = q.select().single();
      return q;
    };
    let { data, error } = await enviar(payload);
    if (error && faltaColunaNova(error)) {
      const semNovas = { ...payload };
      delete semNovas.politica;
      delete semNovas.acesso;
      ({ data, error } = await enviar(semNovas));
      if (!error) avisarSqlColunas();
    }
    if (error) throw error;
    if (isAdmin) {
      const { error: pubError } = await sb.from('academias').update({ status: 'published' }).eq('id', data.id);
      if (pubError) throw pubError;
    }
    await loadEverything();
    state.registerStatus = "done";
  } catch (e) {
    state.registerError = e.message || "Não consegui localizar esse endereço.";
    state.registerStatus = "error";
  }
  render();
}

async function init() {
  app_showLoading();
  const { data: { session } } = await sb.auth.getSession();
  isAdmin = !!session;
  if (!isAdmin) trackClick(null, "acesso_site");
  await loadEverything();

  const q = new URLSearchParams(location.search);
  const sharedCourtId = q.get("court");
  const shared = sharedCourtId ? state.allCourts.find(c => c.id === sharedCourtId) : null;
  if (shared) {
    state.selected = decorate(shared);
    state.page = "court";
    state.backTo = "home";
    pushRecent(shared.id);
    if (!isAdmin) trackClick(shared.id, "visualizacao");
  } else {
    state.page = q.has("comparar") ? "comparar" : (q.has("busca") ? "search" : "home");
  }

  // Remove da comparação academias que não existem mais (excluídas ou pausadas)
  if (state.compareList.length) {
    const validos = state.compareList.filter(id => state.allCourts.some(c => c.id === id));
    if (validos.length !== state.compareList.length) setCompareList(validos);
  }

  state.loaded = true;
  syncUrl(false);
  render();
}

function app_showLoading() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="tela-carregando">
      ${bolaGirando(56)}
      <p>Carregando as quadras...</p>
    </div>`;
}

init();
</script>
