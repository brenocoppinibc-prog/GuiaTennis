const EMAIL_VALIDO = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

// "Continuar" do cadastro: o banco diz se o e-mail já tem conta.
async function continuarComEmail() {
  const email = (state.pcEmail || "").trim().toLowerCase();
  state.pcEmail = email;
  state.loginError = "";
  // Usuário do GuiaTennis (sem @): vai direto para a senha.
  if (email && !email.includes("@") && /^[a-z0-9._-]{3,}$/.test(email)) {
    // Quem já informou o e-mail no primeiro acesso entra por ele (SQL
    // 20261004120000): assim o "Esqueci a senha" manda o código.
    let login = "";
    try { const r = await sb.rpc('login_do_usuario', { p_usuario: email }); if (!r.error && r.data) login = r.data; } catch {}
    state.pcLogin = login || email;
    state.pcEmailPasso = "existe";
    render();
    document.getElementById("login-password")?.focus();
    return;
  }
  if (!EMAIL_VALIDO.test(email)) { state.pcContaErro = "Escreva um e-mail válido."; render(); return; }
  if (precisaSugerir(email)) { state.pcContaErro = ""; render(); return; }
  state.pcContaErro = "";
  state.pcContaSalvando = true;
  render();
  let r = await sb.rpc('conta_do_email', { p_email: email });
  // Banco sem a função nova: confere como antes.
  if (r.error) {
    const v = await sb.rpc('login_do_email', { p_email: email });
    r = v.error ? v : { data: v.data ? { tipo: "academia", login: v.data } : null, error: null };
  }
  state.pcContaSalvando = false;
  if (r.error) {
    state.pcContaErro = "Não consegui conferir o e-mail agora. Tente de novo em instantes.";
  } else if (r.data && r.data.tipo === "outra") {
    state.pcContaErro = "Esse e-mail é de outra conta do GuiaTennis. Para a academia, use outro e-mail.";
  } else {
    // Conta de jogador (06/10/2026): a mesma conta vale no Parceiros —
    // entra com a mesma senha e completa os dados de contato.
    state.pcContaDeJogador = !!(r.data && r.data.tipo === "jogador");
    state.pcLogin = r.data ? r.data.login : "";
    state.pcEmailPasso = r.data ? "existe" : "criar";
    // Veio do "Administrar" de uma ficha: depois de entrar, volta ao pedido.
    if (r.data && state.pcReivindicar) state.parceirosDepois = "cadastro";
  }
  render();
  const campo = document.getElementById(state.pcEmailPasso === "criar" ? "pc-conta-tratamento" : "login-password");
  if (campo) campo.focus();
}

// "Esqueceu a senha?" do GuiaTennis Parceiros: código no e-mail e senha nova.
async function pcEsqueciSenha() {
  state.pcEmailPasso = "esqueci";
  state.pcContaErro = "";
  state.pcCodigoFalhou = false;
  state.pcCodigoMandando = true;
  render();
  state.pcCodigoFalhou = !(await enviarCodigo(state.pcLogin));
  state.pcCodigoMandando = false;
  render();
  document.getElementById("pc-codigo-senha")?.focus();
}
async function pcSalvarSenhaNova() {
  const codigo = document.getElementById("pc-codigo-senha")?.value || "";
  const senha = document.getElementById("pc-senha-nova")?.value || "";
  const errSenha = erroDaSenha(senha, document.getElementById("pc-senha-nova2")?.value || "", state.pcLogin);
  if (errSenha) {
    window.__codigo = { ...(window.__codigo || {}), senha, senha2: "" };
    state.pcContaErro = errSenha; render(); focarDepoisDaSenha("pc-senha-nova", "pc-senha-nova2", errSenha); return;
  }
  state.pcContaSalvando = true; state.pcContaErro = ""; render();
  const r = await senhaNovaPeloCodigo(state.pcLogin, codigo, senha);

async function criarContaDeParceiro() {
  const f = window.__pcConta || {};
  const email = state.pcEmail;
  const erro = (t) => { state.pcContaErro = t; state.pcContaSalvando = false; render(); };
  const falta = erroDoContato(f);
  if (falta) return erro(falta);
  const errSenha = erroDaSenha(f.senha, f.senha2, email);
  if (errSenha) { f.senha2 = ""; erro(errSenha); focarDepoisDaSenha("pc-conta-senha", "pc-conta-senha2", errSenha); return; }
  if (!f.aceite) return erro("Falta aceitar os Termos de Uso e a Política de Privacidade.");
  state.pcContaErro = "";
  state.pcContaSalvando = true;
  render();
  const r = await sb.rpc('criar_minha_conta', {
    p_email: email, p_senha: f.senha, p_nome: juntarNome(f), p_whatsapp: f.whatsapp, p_aceite: true,
    p_tratamento: f.tratamento, p_cargo: f.cargo, p_recebe_novidades: !!f.novidades,
  });
  if (r.error) {
    if (/senha/i.test(r.error.message || "")) f.senha2 = "";
    return erro(r.error.message || "Não consegui criar a conta agora.");
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: f.senha });
  if (error) return erro("A conta foi criada, mas não consegui entrar. Tente em Entrar.");
  await carregarConta(data && data.session);
  registrarPasso("acao", { site: "parceiros", detalhe: "Criou a conta no GuiaTennis Parceiros" });
  window.__pcConta = null;
  state.pcContaSalvando = false;
  state.pcEmailPasso = "email";
  state.pcSelecionada = undefined;
  await loadEverything();
  render();
  window.scrollTo(0, 0);
}

async function pedirParaAdministrar(academiaId) {
  if (!academiaId) return;
  state.pedidoErro = "";
  if (!state.pcDeclaro) {
    state.pcDeclaroErro = true;
    render();
    document.getElementById("pc-declaro")?.focus();
    return;
  }
  state.pcDeclaroErro = false;
  let r = await sb.rpc('pedir_para_administrar', { p_academia: academiaId, p_declaro: true });
  // Banco antes do SQL 20261006130000: pede como antes, sem guardar a hora.
  if (r.error && /could not find|PGRST202/i.test((r.error.message || "") + (r.error.code || ""))) r = await sb.rpc('pedir_para_administrar', { p_academia: academiaId });
  if (r.error) { state.pedidoErro = r.error.message || "Não consegui mandar o pedido agora."; render(); return; }
  state.pcReivindicar = null;
  state.pcSelecionada = undefined;
  state.pcDeclaro = false;
  state.pcAdicionando = false;
  // Sem responsável e sem disputa (SQL 20261007130000): com o e-mail
  // confirmado, a conta passa a administrar na hora, sem código.
  if (r.data === "assumiu") {
    state.pcPedidoFeito = null;
    registrarPasso("acao", { academia: academiaId, detalhe: `Passou a administrar, sem código · ${nomeDaAcademiaDoPasso(academiaId)}` });
    await recarregarConta();
    await loadEverything();
    const c = minhaAcademia();
    state.contaAviso = `Pronto! Agora você administra a ${c ? c.name : "academia"} no GuiaTennis Parceiros.`;
    irParceiros("painel");
    return;
  }
  state.pcPedidoFeito = academiaId;
  registrarPasso("acao", { academia: academiaId, detalhe: `Pediu para administrar · ${nomeDaAcademiaDoPasso(academiaId)}` });
  await recarregarConta();
  syncUrl(false);
  render();
  window.scrollTo(0, 0);
}

// Disputa (07/10/2026): "a academia é minha e não conheço quem administra".
// O pedido sai do responsável e vai para o GuiaTennis, que manda o código
// ao WhatsApp da academia. Como o Google e o Booking, só na disputa.
async function contestarAcademia(academiaId) {
  state.pedidoErroEm = academiaId;
  state.pedidoErro = "";
  const r = await sb.rpc('contestar_academia', { p_academia: academiaId });
  if (r.error) {
    state.pedidoErro = /could not find|PGRST202/i.test((r.error.message || "") + (r.error.code || ""))
      ? "Não consegui contestar agora. Fale com o GuiaTennis no WhatsApp."
      : (r.error.message || "Não consegui contestar agora.");
    render();
    return;
  }
  registrarPasso("acao", { site: "parceiros", academia: academiaId, detalhe: `Contestou quem administra · ${nomeDaAcademiaDoPasso(academiaId)}` });
  await recarregarConta();
  render();
}

// Código que o GuiaTennis mandou para o WhatsApp da ficha.
async function confirmarCodigo(academiaId) {
  academiaId = academiaId || (meusPedidos()[0] || {}).academiaId;
  const codigo = ((state.pcCodigos || {})[academiaId] || "").replace(/\D/g, "");
  state.pedidoErroEm = academiaId;
  if (codigo.length !== 6) { state.pedidoErro = "O código tem 6 números."; render(); return; }
  state.pedidoErro = "";
  state.pcContaSalvando = academiaId || true;
  render();
  const r = await rpcDoPedido('confirmar_meu_codigo', { p_codigo: codigo }, academiaId);
  state.pcContaSalvando = false;
  const avisos = {
    errado: "Código errado. Confira a mensagem no WhatsApp da academia.",
    tentativas: "Muitas tentativas. Peça outro código ao GuiaTennis.",
    venceu: "O código venceu. Peça outro ao GuiaTennis.",
    sem_codigo: "O código ainda não foi mandado. Aguarde a mensagem no WhatsApp da academia.",
  };
  if (r.error || r.data !== "ok") {
    state.pedidoErro = r.error ? (r.error.message || "Não consegui conferir agora.") : (avisos[r.data] || "Não consegui conferir agora.");
    render();
    return;
  }
  registrarPasso("acao", { academia: academiaId, detalhe: `Confirmou o código · ${nomeDaAcademiaDoPasso(academiaId)}` });
  state.pcCodigos = {};
  state.pedidoErroEm = null;
  state.pcPedidoFeito = null;
  await recarregarConta();
  await loadEverything();
  const c = minhaAcademia();
  state.contaAviso = `Pronto! Agora você administra a ${c ? c.name : "academia"} no GuiaTennis Parceiros.`;
  irParceiros("painel");
}

// Pausar no site (dias = 0: até voltar) ou voltar a aparecer.
async function pausarAcademia(academiaId, pausar, dias) {
  state.pausaErro = "";
  state.pausaErroEm = null;
  let ate = null;
  if (pausar && dias > 0) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + dias); ate = d.toISOString(); }
  const r = await sb.rpc('pausar_minha_academia', { p_academia: academiaId, p_pausar: !!pausar, p_ate: ate });
  if (r.error) {
    state.pausaErro = (r.error.code === "42501" || r.error.code === "22023") && r.error.message ? r.error.message : "Não consegui mudar agora. Tente de novo em instantes.";
    state.pausaErroEm = academiaId;
    render();
    return;
  }
  state.pcPausando = null;
  registrarPasso("acao", { academia: academiaId, detalhe: `${pausar ? "Pausou no site" : "Voltou a mostrar no site"} · ${nomeDaAcademiaDoPasso(academiaId)}` });
  await recarregarConta();
  await loadEverything();
  const a = minhasAcademias().find(x => x.id === academiaId);
  const nome = a ? nomeDaMinha(a) : "A academia";
  state.contaAviso = pausar ? `${nome} não aparece na busca${ate ? " até " + dataCurta(ate) : " até vocês voltarem"}.` : `${nome} voltou a aparecer no site.`;
  render();
}

async function cancelarPedido(academiaId) {
  const r = await rpcDoPedido('cancelar_meu_pedido', {}, academiaId);

}

function ligarEventosParceiros() {
  document.querySelectorAll("[data-pc]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      irParceiros(el.dataset.pc, { ancora: el.dataset.pcAncora, publico: !!el.dataset.pcAncora || el.dataset.pc === "inicio" && !contaAcademia });
    };
  });
  document.querySelectorAll("[data-pc-sair-do-portal]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      state.pcMenu = false;
      render();
      abrirNaAba(urlDosJogadores("/"), ABA_JOGADORES);
    };
  });
  const menuBtn = document.getElementById("pc-menu-btn");
  if (menuBtn) menuBtn.onclick = () => { state.pcMenu = true; render(); };
  const seletorBtn = document.getElementById("pc-seletor-btn");
  if (seletorBtn) seletorBtn.onclick = (e) => { e.stopPropagation(); state.pcSeletor = !state.pcSeletor; render(); };
  // Toque fora da lista (ou Esc) fecha o seletor.
  if (state.pcSeletor) {
    const fora = (e) => { if (!e.target.closest || !e.target.closest(".pc-seletor")) { state.pcSeletor = false; render(); } };
    document.addEventListener("click", fora, { once: true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.pcSeletor) { state.pcSeletor = false; render(); } }, { once: true });
  }
  const menuClose = document.getElementById("pc-menu-close");
  if (menuClose) menuClose.onclick = () => { state.pcMenu = false; render(); };
  const menuOverlay = document.getElementById("pc-menu-overlay");
  if (menuOverlay) menuOverlay.onclick = (e) => { if (e.target === menuOverlay) { state.pcMenu = false; render(); } };

  document.querySelectorAll("[data-pc-dias]").forEach(el => {
    el.onclick = () => carregarNumeros(parseInt(el.dataset.pcDias, 10) || 0);
  });
  // A coluna tocada mostra o dia e o valor na linha de cima do gráfico.
  document.querySelectorAll("[data-graf] .pc-barra").forEach(el => {
    const mostra = () => {
      const fig = el.closest("[data-graf]");
      fig.querySelectorAll(".pc-barra.on").forEach(b => b.classList.remove("on"));
      el.classList.add("on");
      fig.querySelector(".pc-graf-leitura").textContent = el.dataset.tip;
    };
    el.onmouseenter = mostra;
    el.onfocus = mostra;
    el.onclick = mostra;

  const busca = document.getElementById("pc-busca");
  if (busca) busca.oninput = (e) => {
    state.pcBusca = e.target.value;
    const slot = document.getElementById("pc-resultados");
    if (slot) { slot.innerHTML = pcResultadosBusca(); ligarEventosParceiros(); }
  };
  document.querySelectorAll("[data-pc-minha]").forEach(el => {
    el.onclick = () => { state.pcReivindicar = el.dataset.pcMinha ? idCurto(el.dataset.pcMinha) : null; syncUrl(false); render(); window.scrollTo(0, 0); };
  });
  document.querySelectorAll("[data-pc-reivindicar]").forEach(el => {
    el.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      state.pcReivindicar = el.dataset.pcReivindicar;
      irParceiros("cadastro");
    };
  });
  // Cadastro pelo e-mail.
  const pcEmail = document.getElementById("pc-email");
  if (pcEmail && !pcEmail.readOnly) {
    pcEmail.oninput = (e) => { state.pcEmail = e.target.value; };
    pcEmail.onkeydown = (e) => { if (e.key === "Enter") continuarComEmail(); };
  }
  const pcContinuar = document.getElementById("pc-email-continuar");
  if (pcContinuar) pcContinuar.onclick = continuarComEmail;
  const pcEsqueci = document.getElementById("pc-esqueci");
  if (pcEsqueci) pcEsqueci.onclick = () => pcEsqueciSenha();
  const pcReenviar = document.getElementById("pc-reenviar-codigo");
  if (pcReenviar) pcReenviar.onclick = () => pcEsqueciSenha();
  const pcSalvarNova = document.getElementById("pc-salvar-senha-nova");

  const pcMandar = document.getElementById("pc-mandar-codigo");

    state.pcConfirmarErro = "";
    state.pcConfirmar = (await enviarCodigo(contaAcademia.login)) ? "enviado" : "falhou";

    document.getElementById("pc-codigo-email")?.focus();

    if (!sessao) { state.pcConfirmarErro = CODIGO_ERRADO; render(); return; }

    if (isAdmin || contaAcademia || jogador || state.page === "parceiros" || state.pushAvaliar) return false;
    const fechado = lerLocal(PUSH_CONTA_KEY, 0);
    if (fechado && Date.now() - fechado < 3 * 864e5) return false;
    if (document.querySelector(".overlay.open, .drawer-overlay.open, .convite-conta")) return false;
    const a = document.activeElement;

// Preferências de busca, como as "Preferências de pesquisa" do trivago:
// primeiro o estado, depois a cidade (a cidade só abre com o estado
// escolhido), e o que a pessoa costuma procurar. Ficam neste aparelho.
// Municípios de cada estado, da lista oficial do IBGE (pedido do Breno em
// 03/10/2026: escolhido o Ceará, não dá para escolher São Paulo). Como no Booking
// e no trivago, só aparecem cidades que existem no estado. A lista fica
// guardada no aparelho; sem internet para o IBGE, a cidade segue livre.
const CIDADES_DO_UF = {};
const MUNICIPIOS_KEY = "guiatennis_municipios_";
async function carregarCidadesDoUf(uf) {
  if (!uf) return null;
  if (CIDADES_DO_UF[uf]) return CIDADES_DO_UF[uf];
  try {
    const guardada = JSON.parse(localStorage.getItem(MUNICIPIOS_KEY + uf) || "null");
    if (Array.isArray(guardada) && guardada.length) return (CIDADES_DO_UF[uf] = guardada);
  } catch { /* sem armazenamento: busca de novo */ }
  try {
    const r = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${encodeURIComponent(uf)}/municipios?orderBy=nome`);
    if (!r.ok) throw new Error("IBGE " + r.status);
    const nomes = (await r.json()).map(m => m.nome).filter(Boolean);
    if (!nomes.length) throw new Error("lista vazia");
    CIDADES_DO_UF[uf] = nomes;
    try { localStorage.setItem(MUNICIPIOS_KEY + uf, JSON.stringify(nomes)); } catch { /* cheio: fica só na memória */ }
    return nomes;
  } catch (e) {
    diag(`preferências: não li as cidades de ${uf} no IBGE (${e.message})`);
    return null;
  }
}
function nomeDoUf(uf) {
  return (ESTADOS.find(e => e[0] === uf) || [])[1] || uf;
}
// Carrega as cidades do estado escolhido e confere a cidade: se ela não é
// daquele estado, sai e o site diz por quê.
async function conferirCidadeDoUf() {
  const r = window.__pref || {};
  if (!r.uf) return;
  state.prefCidadesCarregando = !CIDADES_DO_UF[r.uf];
  const lista = await carregarCidadesDoUf(r.uf);
  state.prefCidadesCarregando = false;
  const atual = window.__pref || {};
  if (atual.uf !== r.uf) return;
  if (lista && atual.cidade && !lista.some(n => mesmaCidade(n, atual.cidade))) {
    state.prefErro = `${atual.cidade} não fica em ${nomeDoUf(atual.uf)}. Escolha uma cidade de ${nomeDoUf(atual.uf)}.`;
    window.__pref = { ...atual, cidade: "" };
  }
  if (!state.showPrefs) return;
  // A lista chegou com a pessoa digitando: o cursor continua na cidade.
  const focado = document.activeElement && document.activeElement.id;
  render();
  if (focado === "pref-cidade") document.getElementById("pref-cidade")?.focus();
}

// ---------- Vou viajar (pedido do Breno em 04/10/2026) ----------
// Como as "Próximas viagens" do Airbnb e do Booking: a cidade de casa fica
// nas Preferências; a viagem é outra coisa. A pessoa guarda a cidade (lista
// do IBGE) e, se quiser, onde vai ficar (hotel ou endereço) e as datas. Com
// o lugar, "Ver quadras" mede a distância a partir do hotel, como a
// "distância da hospedagem" do Booking. Uns 15 dias antes até a volta, a home
// mostra o cartão da viagem; durante a viagem, "Pesquisar" sem digitar abre
// a cidade dela; depois da volta, tudo volta à cidade de casa sozinho. Fica
// só no aparelho, como as preferências.
const VIAGENS_KEY = "guiatennis_viagens_v1";
const VIAGEM_ANTES_DIAS = 15;
function diaISO(data) {
  const d = data || new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function somarDias(iso, n) {
  const [a, m, d] = iso.split("-").map(Number);
  return diaISO(new Date(a, m - 1, d + n));
}
function diaCurto(iso) {
  const [, m, d] = String(iso || "").split("-");
  return d && m ? `${d}/${m}` : "";
}
// Viagens que ainda não acabaram, da mais próxima para a mais distante.
function lerViagens() {
  const lista = lerLocal(VIAGENS_KEY, []);
  const hoje = diaISO();
  return (Array.isArray(lista) ? lista : [])
    .filter(v => v && v.cidade && (!v.volta || v.volta >= hoje))
    .sort((a, b) => (a.ida || "9999").localeCompare(b.ida || "9999"));
}
function gravarViagens(lista) { gravarLocal(VIAGENS_KEY, lista); }
// Com data: já começou e não acabou. Sem data: não conta como "viajando".
function viajandoAgora() {
  const hoje = diaISO();
  return lerViagens().find(v => v.ida && v.ida <= hoje && (!v.volta || v.volta >= hoje)) || null;
}
// A que a home mostra: em andamento, a que começa nos próximos 15 dias, ou
// a sem data (até a pessoa apagar).
function viagemDaVez() {
  const limite = somarDias(diaISO(), VIAGEM_ANTES_DIAS);
  return viajandoAgora() || lerViagens().find(v => !v.ida || v.ida <= limite) || null;
}
function textoDaViagem(v) {
  if (!v) return "";
  if (v.ida && v.volta) return `${diaCurto(v.ida)} a ${diaCurto(v.volta)}`;
  if (v.ida) return `a partir de ${diaCurto(v.ida)}`;
  return "";
}
function academiasNaCidade(cidade) {
  const c = cidadesComQuadra().find(x => mesmaCidade(x.nome, cidade));
  return c ? c.courts.length : 0;
}
// "Pesquisar" sem digitar: a viagem em andamento vem antes da cidade de casa.
function cidadePadraoDaBusca() {
  const v = viajandoAgora();
  return v ? v.cidade : lerPreferencias().cidade || "";
}

// A viagem que tem o aviso por e-mail na conta (uma por vez).
function ehViagemDaConta(v) {
  return !!(v && jogador && jogador.avisos_viagem && mesmaCidade(jogador.viagem_cidade, v.cidade)
    && (jogador.viagem_ida || "") === (v.ida || ""));
}
function abrirViagem(prefill) {
  state.showMenu = false;
  state.viagemErro = "";
  state.pushViagem = false;
  window.__viagem = { uf: "", cidade: "", ficar: "", ida: "", volta: "", ...(prefill || {}) };
  window.__viagem.aviso = prefill && prefill.aviso !== undefined ? !!prefill.aviso : ehViagemDaConta(prefill);
  window.__viagem.eraDaConta = ehViagemDaConta(prefill);
  state.showViagem = true;
  render();
  conferirCidadeDaViagem();
}
async function conferirCidadeDaViagem() {
  const r = window.__viagem || {};
  if (!r.uf) return;
  await carregarCidadesDoUf(r.uf);
  if (state.showViagem) {
    const focado = document.activeElement && document.activeElement.id;
    render();
    if (focado) document.getElementById(focado)?.focus();
  }
}
async function salvarViagem() {
  const r = window.__viagem || {};
  let cidade = String(r.cidade || "").trim().replace(/\s+/g, " ");
  const erro = (t) => { state.viagemErro = t; render(); };
  if (!r.uf) return erro("Escolha o estado da viagem.");
  if (!cidade) return erro("Digite a cidade da viagem.");
  const doUf = await carregarCidadesDoUf(r.uf);
  if (doUf) {
    const oficial = doUf.find(n => mesmaCidade(n, cidade));
    if (!oficial) return erro(`${cidade} não fica em ${nomeDoUf(r.uf)}. Confira o estado ou escolha uma cidade da lista.`);
    cidade = oficial;
  }
  if (r.ida && r.ida < diaISO()) return erro("A ida já passou. Confira a data.");
  if (r.ida && r.volta && r.volta < r.ida) return erro("A volta precisa ser depois da ida.");
  if (!r.ida && r.volta) return erro("Informe também a data de ida ou apague a volta.");
  // Aviso por e-mail perto da data: precisa da conta. Sem ela, entra e
  // guarda depois, com tudo o que já foi digitado.
  if (r.aviso && !jogador && !isAdmin) {
    jogadorEntaoFaz(() => salvarViagem(), "Para receber o aviso da viagem por e-mail, entre com o seu e-mail. Se ainda não tiver conta, o cadastro leva um minuto.");
    return;
  }
  const ficar = String(r.ficar || "").trim().replace(/\s+/g, " ");
  // Onde vai ficar: o mapa acha o ponto. Se não achar, guarda assim mesmo e
  // as quadras aparecem pela cidade.
  let ponto = null;
  if (ficar) {
    state.viagemSalvando = true; render();
    for (const q of [`${ficar}, ${cidade}, ${nomeDoUf(r.uf)}, Brasil`, `${ficar}, ${cidade}`]) {
      try { ponto = await geocodeAddress(q); break; } catch (e) { /* tenta a próxima */ }
    }
    state.viagemSalvando = false;
  }
  const lista = lerViagens().filter(v => String(v.id) !== String(r.id) && !(mesmaCidade(v.cidade, cidade) && (v.ida || "") === (r.ida || "")));
  lista.push({ id: r.id || Date.now(), uf: r.uf, cidade, ida: r.ida || "", volta: r.volta || "",
    ...(ficar ? { ficar } : {}), ...(ponto ? { lat: ponto.lat, lng: ponto.lng } : {}) });
  gravarViagens(lista.slice(-5));
  gravarLocal(VIAGEM_CONVITE_KEY, Date.now());
  const avisoConta = await guardarAvisoDaViagem(r, cidade);
  state.showViagem = false;
  state.viagemAviso = (ficar && !ponto
    ? `Viagem a ${cidade} guardada. Não achei "${ficar}" no mapa: as quadras aparecem pela cidade.`
    : `Viagem a ${cidade} guardada.`) + avisoConta;
  if (state.page !== "home") goHome(); else render();
}
// "Ver quadras": com o lugar onde vai ficar, a distância é a partir dele (o

function verQuadrasDaViagem(id) {
  const v = lerViagens().find(x => String(x.id) === String(id));

  if (!(v.ficar && Number.isFinite(v.lat) && Number.isFinite(v.lng))) { abrirRegiao({ cidade: v.cidade }); return; }
  state.regiaoLink = null;
  state.cep = "";
  state.termoBuscado = "";
  state.origin = { lat: v.lat, lng: v.lng, bairro: v.ficar, cidade: v.cidade, uf: v.uf, cep: "", approximate: false, viagem: true };
  state.sortBy = "distance";

}

// Aviso por e-mail perto da data (pedido do Breno em 05/10/2026): fica na
// aba "Vou viajar", junto da viagem, e não mais em "Avisos por e-mail" do
// perfil. A conta guarda uma viagem com aviso por vez (a última marcada).
// Devolve o complemento da mensagem de "guardada".
async function guardarAvisoDaViagem(r, cidade) {
  if (!jogador || isAdmin) return "";
  if (!r.aviso) {
    if (r.eraDaConta) await desligarAvisoDaViagem();
    return "";
  }
  const dados = { avisos_viagem: true, viagem_uf: r.uf, viagem_cidade: cidade, viagem_ida: r.ida || null,
    viagem_volta: r.volta || null, avisos_mudados_em: new Date().toISOString() };
  const { error } = await sb.from('jogadores').update(dados).eq('user_id', jogador.user_id);
  if (error) return " Não consegui ligar o aviso por e-mail agora: tente de novo em Minhas quadras › Vou viajar.";
  Object.assign(jogador, dados);
  registrarPasso("acao", { detalhe: "Ligou o aviso da viagem por e-mail" });
  return jogador.email_confirmado_em
    ? " Perto da data, você recebe por e-mail as academias de lá."
    : " Perto da data, você recebe por e-mail as academias de lá (depois de confirmar o e-mail).";
}
async function desligarAvisoDaViagem() {
  if (!jogador) return;
  const dados = { avisos_viagem: false, viagem_uf: null, viagem_cidade: null, viagem_ida: null, viagem_volta: null,
    avisos_mudados_em: new Date().toISOString() };
  const { error } = await sb.from('jogadores').update(dados).eq('user_id', jogador.user_id);
  if (!error) Object.assign(jogador, dados);
}
// A viagem com aviso que está na conta aparece também neste aparelho (entrou
// em outro celular, por exemplo).
function trazerViagemDaConta() {
  if (!jogador || !jogador.avisos_viagem || !jogador.viagem_cidade) return;
  if (jogador.viagem_volta && jogador.viagem_volta < diaISO()) return;
  if (lerViagens().some(v => ehViagemDaConta(v))) return;
  const lista = lerLocal(VIAGENS_KEY, []);
  gravarViagens([...(Array.isArray(lista) ? lista : []), { id: Date.now(), uf: jogador.viagem_uf || "", cidade: jogador.viagem_cidade,
    ida: jogador.viagem_ida || "", volta: jogador.viagem_volta || "" }].slice(-5));
}

// Airbnb. Só para quem não tem viagem guardada; uma vez a cada 30 dias, e um
// balão por vez (não junto do "Jogou aqui?").
const PUSH_VIAGEM_KEY = "guiatennis_push_viagem_v1";
const PUSH_VIAGEM_ESPERA_S = 5, PUSH_VIAGEM_INTERVALO_D = 30;
function podePushViagem() {
  if (!jogador || isAdmin || state.page === "parceiros") return false;
  if (lerViagens().length || jogador.avisos_viagem) return false;
  const visto = lerLocal(PUSH_VIAGEM_KEY, 0);
  return !(visto && Date.now() - visto < PUSH_VIAGEM_INTERVALO_D * 864e5);
}
function ligarPushViagem(segundos) {
  if (!podePushViagem()) return;
  const tentar = (vez) => {
    if (state.pushViagem || !podePushViagem()) return;
    const ocupado = state.pushAvaliar || state.pushConta != null || state.showViagem || state.jogadorTela
      || document.querySelector(".overlay.open, .drawer-overlay.open")
      || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if (ocupado) { if (vez < 6) setTimeout(() => tentar(vez + 1), 15000); return; }
    gravarLocal(PUSH_VIAGEM_KEY, Date.now());
    state.pushViagem = true;
    render();
  };
  setTimeout(() => tentar(0), (segundos || PUSH_VIAGEM_ESPERA_S) * 1000);
}

async function salvarPreferencias() {
  const r = window.__pref || {};
  const uf = r.uf || "";
  let cidade = String(r.cidade || "").trim().replace(/\s+/g, " ");
  if (!uf || !cidade) { state.prefErro = !uf ? "Escolha o estado." : "Digite a cidade."; render(); return; }

  const doUf = await carregarCidadesDoUf(uf);
  if (doUf) {
    const oficial = doUf.find(n => mesmaCidade(n, cidade));
    if (!oficial) { state.prefErro = `${cidade} não fica em ${nomeDoUf(uf)}. Confira o estado ou escolha uma cidade da lista.`; render(); return; }
    cidade = oficial;
  }
  // Com academia no guia, usa o nome do jeito que está no guia.
  const doGuia = cidadesComQuadra().find(c => mesmaCidade(c.nome, cidade));
  if (doGuia) cidade = doGuia.nome;
  const p = { uf, cidade, modalidade: r.modalidade || "" };
  // Cidade ainda sem academia: o mapa diz onde ela fica, para sugerir as
  // academias mais perto. Se o mapa não responder, salva assim mesmo.
  if (!doGuia) {
    state.prefSalvando = true;
    render();
    try {
      const nomeUf = nomeDoUf(uf);
      const g = await geocodeAddress(`${cidade}, ${nomeUf}, Brasil`);
      p.lat = pontoAproximado(g.lat);
      p.lng = pontoAproximado(g.lng);
    } catch (e) { diag(`preferências: não achei ${cidade}/${uf} no mapa (${e.message})`); }
  }
  gravarLocal(PREFERENCIAS_KEY, p);
  state.homeCity = null;
  if (!state.origin && !state.modalidadeFilters.length && p.modalidade) state.modalidadeFilters = [p.modalidade];
  state.prefSalvando = false;
  state.showPrefs = false;
  render();
}

function aplicarPreferenciaNaBusca() {
  const p = lerPreferencias();
  if (p.modalidade && !state.modalidadeFilters.length && MODALIDADE_OPTS.some(m => m.key === p.modalidade)) {
    state.modalidadeFilters = [p.modalidade];
  }

// E-mail digitado errado: "fulano@gmial.com" → "Você quis dizer
// fulano@gmail.com?", como o Booking e o Airbnb. Compara o domínio com os
// mais usados no Brasil; não precisa de serviço de fora.
const DOMINIOS_COMUNS = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.com.br", "yahoo.com", "icloud.com",
  "live.com", "msn.com", "uol.com.br", "bol.com.br", "terra.com.br", "hotmail.com.br", "outlook.com.br", "me.com"];
function distanciaDeTexto(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : Infinity);
  return d[a.length][b.length];
}
function sugestaoDeEmail(email) {
  const m = String(email || "").trim().toLowerCase().match(/^([^@\s]+)@([^@\s]+)$/);
  if (!m) return null;
  const dominio = m[2];
  if (DOMINIOS_COMUNS.includes(dominio)) return null;
  let melhor = null, menor = 3;
  DOMINIOS_COMUNS.forEach(d => { const x = distanciaDeTexto(dominio, d); if (x < menor) { menor = x; melhor = d; } });
  // "gmail" sem o ".com" também é erro comum.
  if (!melhor && !dominio.includes(".")) melhor = DOMINIOS_COMUNS.find(d => d.startsWith(dominio + ".")) || null;
  return melhor ? `${m[1]}@${melhor}` : null;
}
// Mostra a sugestão uma vez por e-mail; "Não, está certo" segue com o digitado.
function precisaSugerir(email) {
  const para = sugestaoDeEmail(email);
  if (!para || state.emailSugestaoVista === email) { state.emailSugestao = null; return false; }
  state.emailSugestao = { de: email, para };
  return true;
}
function blocoSugestaoEmail(email) {
  const sug = state.emailSugestao;
  if (!sug || sug.de !== String(email || "").trim().toLowerCase()) return "";
  return `
    <div class="email-sugestao" role="alert">
      <span>Você quis dizer <strong>${esc(sug.para)}</strong>?</span>
      <div class="email-sugestao-acoes">
        <button type="button" class="cta-btn cta-primary" data-email-sugestao="usar">Sim, usar esse</button>
        <button type="button" class="cta-btn cta-secondary" data-email-sugestao="manter">Não, está certo</button>
      </div>
    </div>`;
}

// ---------- código por e-mail (02/10/2026) ----------
// Prova que o e-mail existe e é da pessoa: o login do Supabase manda um
// código (6 a 10 números, conforme o painel do Supabase) e o site
// confere. Serve para confirmar o e-mail e para o "Esqueci a senha". Login
// com o domínio interno das academias (usuário@acesso…) não recebe e-mail:
// para esses, o "esqueci" continua pelo WhatsApp.
function recebeEmail(login) {
  return !!login && login.includes("@") && !login.endsWith("@" + DOMINIO_ACESSO);
}
async function enviarCodigo(email) {
  window.__codigo = {};
  try {
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
    if (error) diag(`código por e-mail: ${error.message}`);
    return !error;
  } catch (e) { diag(`código por e-mail: ${e.message}`); return false; }
}
// Confere o código; certo, a pessoa fica logada por ele (e o banco aceita a
// confirmação do e-mail).
async function conferirCodigo(email, codigo) {
  const limpo = String(codigo || "").replace(/\D/g, "");
  // O tamanho vem do painel do Supabase (6 a 10 números; este projeto usa 8).
  if (limpo.length < 6 || limpo.length > 10) return null;
  try {
    const { data, error } = await sb.auth.verifyOtp({ email, token: limpo, type: "email" });
    if (error || !data || !data.session) return null;
    try { await sb.rpc('confirmar_meu_email'); } catch {}
    window.__codigo = { senha: (window.__codigo || {}).senha, senha2: (window.__codigo || {}).senha2 };
    return data.session;
  } catch { return null; }
}
const CODIGO_ERRADO = "Código errado ou vencido. Confira o número ou peça outro.";

// "Esqueci a senha": confere o código e salva a senha nova. O código só vale
// uma vez: se ele deu certo e a senha não (o Supabase recusou), o "tentar de
// novo" usa a sessão que o código já abriu, em vez de conferir de novo um
// código gasto. A recusa diz o motivo, como o Google faz.
async function senhaNovaPeloCodigo(email, codigo, senha) {
  const guardada = state.sessaoDoCodigo;
  let sessao = guardada && guardada.email === email ? guardada.sessao : null;
  if (sessao) {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) sessao = null;
  }
  if (!sessao) sessao = await conferirCodigo(email, codigo);
  if (!sessao) return { erro: CODIGO_ERRADO };
  state.sessaoDoCodigo = { email, sessao };
  const { error } = await sb.auth.updateUser({ password: senha });
  if (error) {
    diag(`senha nova: ${error.code || error.status || ""} ${error.message}`);
    // A mesma senha de antes: a pessoa já sabe a senha e o código já a
    // deixou entrar. Segue, sem obrigar a inventar outra.
    if (error.code === "same_password" || /different from the old/i.test(error.message || "")) {
      state.sessaoDoCodigo = null;
      return { sessao, mesma: true };
    }
    return { erro: erroDaSenhaNoSupabase(error) };
  }
  state.sessaoDoCodigo = null;
  return { sessao };
}
function erroDaSenhaNoSupabase(error) {
  const msg = String((error && error.message) || "");
  const motivos = (error && error.reasons) || [];
  if (error.code === "weak_password" || /weak|should contain|at least/i.test(msg)) {
    if (motivos.includes("pwned") || /pwned|leak|breach/i.test(msg)) return "Essa senha já apareceu em vazamentos de outros sites. Escolha outra.";
    const tamanho = msg.match(/at least (\d+)/i);
    if (tamanho) return `A senha precisa ter pelo menos ${tamanho[1]} caracteres.`;
    if (/should contain/i.test(msg)) return "A senha precisa ter letra minúscula, maiúscula, número e símbolo (ex.: !, @, #). Escolha outra.";
    return "Essa senha é fraca demais. Escolha uma mais longa, que não seja óbvia.";
  }
  if (error.code === "reauthentication_needed" || /reauthentication/i.test(msg)) return "Por segurança, peça um código novo e tente de novo.";
  if (error.status === 429 || /rate limit|too many/i.test(msg)) return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  return "O código deu certo, mas não consegui salvar a senha. Tente de novo; o código não precisa ser digitado de novo.";
}

// ---------- senha (04/10/2026) ----------
// Como Google, Microsoft e as recomendações atuais de segurança: o que
// protege é o tamanho e não ser uma senha óbvia, e não regra de símbolo
// obrigatório. O site recusa as senhas mais usadas, a que repete o e-mail e
// a sequência; mostra a força enquanto a pessoa digita; o olhinho mostra o
// que foi digitado; e a senha nova é digitada duas vezes.
const SENHAS_COMUNS = ["12345678", "123456789", "1234567890", "87654321", "11111111", "00000000",
  "12341234", "11223344", "senha123", "senha1234", "senhasenha", "password", "password1", "qwertyui",
  "qwerty123", "abc12345", "abcd1234", "iloveyou", "brasil123", "mudar123", "teste123", "admin123",
  "guiatennis", "guiatenis", "tenis123", "tennis123", "flamengo", "corinthians", "palmeiras", "saopaulo"];
function senhaObvia(senha, email) {
  const s = String(senha || "").toLowerCase();
  const nomeDoEmail = String(email || "").toLowerCase().split("@")[0];
  if (SENHAS_COMUNS.some(c => s === c || (c.length >= 8 && s.startsWith(c) && s.length <= c.length + 2))) return true;
  if (/^(.)\1+$/.test(s)) return true;                                   // aaaaaaaa
  if ("0123456789012345678909876543210".includes(s) || "abcdefghijklmnopqrstuvwxyz".includes(s)) return true;
  if (nomeDoEmail.length >= 4 && s.includes(nomeDoEmail)) return true;
  if (s.includes("guiatenn")) return true;
  return false;
}
// "" se a senha serve; senão, o que corrigir. confirmacao undefined = sem campo.
// Senha recusada no cadastro (pedido do Breno em 05/10/2026): a senha
// digitada continua no campo e só "Repita a senha" é apagada, com o cursor
// nela — ou na senha, quando é ela que precisa mudar.
function focarDepoisDaSenha(idSenha, idRepetir, erro) {
  const alvo = /iguais/.test(erro || "") ? idRepetir : idSenha;
  setTimeout(() => { const el = document.getElementById(alvo); if (el) el.focus(); }, 0);
}
function erroDaSenha(senha, confirmacao, email) {
  const s = String(senha || "");
  if (s.length < 8) return "A senha precisa ter pelo menos 8 caracteres.";
  if (senhaObvia(s, email)) return "Essa senha é fácil de adivinhar. Use uma frase ou junte palavras e números, como \"saibro coberto 2026\".";
  if (confirmacao !== undefined && s !== String(confirmacao || "")) return "As duas senhas não estão iguais.";
  return "";
}
function forcaDaSenha(senha, email) {
  const s = String(senha || "");
  if (!s) return null;
  if (s.length < 8 || senhaObvia(s, email)) return { nivel: 0, t: "Fraca" };
  let pontos = 0;
  if (s.length >= 12) pontos++;
  if (s.length >= 16) pontos++;
  if (/[a-zA-Z]/.test(s) && /\d/.test(s)) pontos++;
  if (/[^a-zA-Z0-9]/.test(s) || (/[a-z]/.test(s) && /[A-Z]/.test(s))) pontos++;
  return pontos >= 3 ? { nivel: 2, t: "Forte" } : pontos >= 1 ? { nivel: 1, t: "Boa" } : { nivel: 0, t: "Fraca" };
}

// Olhinho em todo campo de senha e a força embaixo da senha nova. Roda
// depois de cada render; o que estava visível continua visível.
function ligarCamposDeSenha() {
  state.senhasVisiveis = state.senhasVisiveis || {};
  document.querySelectorAll('input[type="password"], input[data-era-senha]').forEach(el => {
    if (el.closest(".senha-caixa")) return;
    el.setAttribute("data-era-senha", "");
    const caixa = document.createElement("span");
    caixa.className = "senha-caixa";
    const margem = getComputedStyle(el).marginTop;
    el.parentNode.insertBefore(caixa, el);
    caixa.appendChild(el);
    caixa.style.marginTop = margem;
    el.style.marginTop = "0";
    const olho = document.createElement("button");
    olho.type = "button";
    olho.className = "senha-olho";
    const desenhar = () => {
      const ver = !!state.senhasVisiveis[el.id];
      el.type = ver ? "text" : "password";
      olho.innerHTML = icon(ver ? "olhoFechado" : "eye", 20, "var(--muted)");
      olho.setAttribute("aria-label", ver ? "Esconder a senha" : "Mostrar a senha");
      olho.setAttribute("aria-pressed", ver ? "true" : "false");
    };
    olho.onclick = () => { state.senhasVisiveis[el.id] = !state.senhasVisiveis[el.id]; desenhar(); el.focus(); };
    caixa.appendChild(olho);
    desenhar();
    // Força: só na senha nova (não na confirmação nem na senha de entrar).
    if (el.getAttribute("autocomplete") === "new-password" && !/2$/.test(el.id)) {
      const forca = document.createElement("p");
      forca.className = "senha-forca";
      forca.setAttribute("aria-live", "polite");
      caixa.insertAdjacentElement("afterend", forca);
      const mostrar = () => {
        const email = (window.__jog && window.__jog.email) || state.pcEmail || state.pcLogin || (contaAcademia && contaAcademia.email) || "";
        const f = forcaDaSenha(el.value, email);
        forca.innerHTML = f ? `<span class="senha-barra n${f.nivel}"><i></i><i></i><i></i></span><span>Senha ${f.t.toLowerCase()}${f.nivel === 0 && el.value.length >= 8 ? ": fácil de adivinhar" : f.nivel === 0 ? ": use pelo menos 8 caracteres" : ""}</span>` : "";
      };
      el.addEventListener("input", mostrar);
      mostrar();
    }
  });
}

async function criarContaJogador() {
  const f = window.__jog || {};
  f.senha = document.getElementById("jog-senha")?.value || f.senha || "";
  f.senha2 = document.getElementById("jog-senha2")?.value || f.senha2 || "";
  const email = String(f.email || "").trim().toLowerCase();
  const falta = [];
  if (String(f.nome || "").trim().length < 3) falta.push("o nome");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) falta.push("um e-mail válido");
  if (!f.aceite) falta.push("o aceite dos Termos");
  if (falta.length) { state.jogadorErro = `Falta ${listaPt(falta)}.`; render(); return; }
  const errSenha = erroDaSenha(f.senha, f.senha2, email);
  if (errSenha) { f.senha2 = ""; state.jogadorErro = errSenha; render(); focarDepoisDaSenha("jog-senha", "jog-senha2", errSenha); return; }
  state.jogadorSalvando = true; state.jogadorErro = ""; render();
  const r = await sb.rpc('criar_conta_jogador', {
    p_email: email, p_senha: f.senha, p_nome: String(f.nome).trim(), p_aceite: true,
    p_cidade: String(f.cidade || "").trim() || null,
    p_avisos_academias: !!f.avisos_academias, p_promocoes: !!f.promocoes, p_novidades: !!f.novidades,
  });
  if (r.error) {
    state.jogadorSalvando = false;
    state.jogadorErro = /já tem conta/.test(r.error.message || "") ? "Esse e-mail já tem conta. Entre com a sua senha."
      : /Muitos cadastros|não pode criar conta/.test(r.error.message || "") ? r.error.message
      : "Não consegui criar a conta agora. Tente de novo em instantes.";
    if (/já tem conta/.test(r.error.message || "")) { state.jogadorTela = "entrar"; state.jogadorLogin = email; }
    render();
    return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: f.senha });
  if (!error) await carregarConta(data && data.session);
  window.__jog = { email };
  if (error || !jogador) {
    state.jogadorSalvando = false;
    state.jogadorTela = "entrar";
    state.jogadorErro = "Conta criada. Entre com o seu e-mail e a senha.";
    render();
    return;
  }
  // Conta criada e logada: agora confirma o e-mail pelo código.
  registrarPasso("acao", { detalhe: "Criou a conta de jogador" });
  state.jogadorLogin = email;
  await irParaCodigoJogador("codigo");
}

// pergunta antes de parar — sem precisar entrar na conta. O número sai do
// link na hora, para não ficar no histórico nem ser compartilhado.
const AVISOS_DO_LINK = {
  viagem: "os avisos de viagem",
  novas: "os avisos de academias novas (da sua cidade e das buscas salvas)",
  todos: "todos os avisos por e-mail do GuiaTennis",
  parceiros: "os avisos de avaliação nova e de pedidos de acesso do GuiaTennis Parceiros",
};
function lerPararAvisosDoLink() {
  try {
    const q = new URLSearchParams(location.search);
    const token = q.get("parar-avisos");
    if (!token) return;
    const aviso = AVISOS_DO_LINK[q.get("aviso")] ? q.get("aviso") : "todos";
    state.pararAvisos = { token, aviso, feito: false, erro: "" };
    q.delete("parar-avisos");
    q.delete("aviso");
    const resto = q.toString();
    history.replaceState(history.state, "", location.pathname + (resto ? "?" + resto : "") + location.hash);
  } catch {}
}
async function confirmarPararAvisos() {
  const p = state.pararAvisos;
  if (!p) return;
  p.salvando = true; p.erro = ""; render();
  const r = await sb.rpc('parar_avisos', { p_token: p.token, p_aviso: p.aviso });
  p.salvando = false;
  // Número que não é da forma certa (link cortado): o banco recusa como
  // texto inválido — é link que não vale, não falha do site.
  const invalido = r.error && (r.error.code === "22P02" || /invalid input syntax/i.test(r.error.message || ""));
  if (r.error && !invalido || !r.data) {
    p.erro = r.error && !invalido ? "Não consegui parar os avisos agora. Tente de novo em instantes." : "Esse link não vale mais. Entre na sua conta para mudar os avisos.";
    render();
    return;
  }
  p.feito = true;
  // A conta aberta neste aparelho acompanha.
  if (jogador && r.data === "viagem") jogador.avisos_viagem = false;
  if (jogador && r.data === "novas") { jogador.avisos_academias = false; buscasSalvas.forEach(b => { b.avisar = false; }); }
  if (jogador && r.data === "todos") { ["avisos_academias", "promocoes", "novidades", "avisos_viagem"].forEach(k => { jogador[k] = false; }); buscasSalvas.forEach(b => { b.avisar = false; }); }
  if (contaAcademia && r.data === "parceiros") contaAcademia.avisosPorEmail = false;
  render();
}

// ---------- "Jogou aqui? Avalie" (pedido do Breno em 05/10/2026) ----------
// Como o Google Maps ("Você esteve em…? Avalie") e o iFood ("Como foi?"):
// um dia depois de a pessoa chamar uma academia, um balão pergunta se ela
// jogou lá, com as estrelas para tocar. Uma academia por visita; ignorado ou
// "Agora não", pergunta de novo em 3 dias (no máximo 3 vezes por academia);
// "Não joguei aqui" não pergunta mais. Tudo fica no aparelho.
const AVALIADAS_KEY = "guiatennis_avaliadas_v1";
const PEDIR_AVALIACAO_KEY = "guiatennis_pedir_avaliacao_v1";
const PEDIR_AVALIACAO_DEPOIS_H = 24, PEDIR_AVALIACAO_ATE_D = 60, PEDIR_AVALIACAO_INTERVALO_D = 3, PEDIR_AVALIACAO_VEZES = 3, PEDIR_AVALIACAO_ESPERA_S = 6;
function lerAvaliadas() { const v = lerLocal(AVALIADAS_KEY, []); return Array.isArray(v) ? v : []; }
function marcarAvaliada(id) { gravarLocal(AVALIADAS_KEY, [id, ...lerAvaliadas().filter(x => x !== id)].slice(0, 50)); }
function lerPedidosDeAvaliacao() { const v = lerLocal(PEDIR_AVALIACAO_KEY, {}); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }
function anotarPedidoDeAvaliacao(id, mudanca) {
  const t = lerPedidosDeAvaliacao();
  t[id] = { ...(t[id] || {}), ...mudanca };
  gravarLocal(PEDIR_AVALIACAO_KEY, t);
}
// As academias chamadas que ainda não foram avaliadas. Para o balão, só as
// chamadas há mais de um dia e não dispensadas; para o perfil, todas.
function academiasParaAvaliar(opcoes = {}) {
  if (isAdmin || (contaAcademia && !jogador)) return [];
  const agora = Date.now();
  const avaliadas = new Set(lerAvaliadas());
  const pedidos = lerPedidosDeAvaliacao();
  return minhasQuadras().chamadas.filter(x => {
    if (avaliadas.has(x.id) || ehDaMinhaConta(x.c)) return false;
    const p = pedidos[x.id] || {};
    if (p.nunca) return false;
    const idade = agora - (x.em || 0);
    if (idade > PEDIR_AVALIACAO_ATE_D * 864e5) return false;
    if (opcoes.todas) return true;
    if (idade < PEDIR_AVALIACAO_DEPOIS_H * 36e5) return false;
    if ((p.vezes || 0) >= PEDIR_AVALIACAO_VEZES) return false;
    return !(p.adiado && agora - p.adiado < PEDIR_AVALIACAO_INTERVALO_D * 864e5);
  });
}
function pushAvaliarHtml() {
  const p = state.pushAvaliar;
  if (!p || isAdmin || (contaAcademia && !jogador) || state.page === "parceiros") return "";
  const x = minhasQuadras().chamadas.find(y => y.id === p.id);
  if (!x) return "";
  return `
    <div class="push-conta push-avaliar" id="push-avaliar" role="dialog" aria-label="Avaliar a ${esc(x.c.name)}">
      <span class="push-conta-ic" aria-hidden="true">★</span>
      <span>
        <p class="push-conta-t">Jogou na ${esc(x.c.name)}?</p>
        <p class="push-conta-s">${esc(textoDaChamada(x))}. Conte como foi e ajude outros jogadores a escolher.</p>
        <span class="push-conta-estrelas" role="group" aria-label="Sua nota">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-push-estrela="${n}" aria-label="${n} ${n === 1 ? "estrela" : "estrelas"}">★</button>`).join("")}</span>
        <span class="push-avaliar-acoes"><button type="button" id="push-avaliar-depois">Agora não</button><button type="button" id="push-avaliar-nunca">Não joguei aqui</button></span>
      </span>
      <button type="button" class="push-conta-x" id="push-avaliar-x" aria-label="Fechar">✕</button>
    </div>`;
}
// Uns segundos depois de abrir o site, se houver academia para avaliar e
// nada na frente (janela aberta, campo sendo digitado, o balão da conta).
function ligarPedidoDeAvaliacao() {
  const podeMostrar = () => !isAdmin && !(contaAcademia && !jogador) && ["home", "search", "court", "perfil", "comparar"].includes(state.page)
    && state.pushConta == null && !state.pushViagem && !document.querySelector(".overlay.open, .drawer-overlay.open")
    && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
  const tentar = (vez) => {
    // Uma academia por visita.
    if (state.pushAvaliarFeito) return;
    const x = academiasParaAvaliar()[0];
    if (!x) return;
    if (!podeMostrar()) { if (vez < 6) setTimeout(() => tentar(vez + 1), 20000); return; }
    // Na ficha da própria academia, o "Já jogou aqui?" já está na tela.
    if (state.page === "court" && state.selected && state.selected.id === x.id) return;
    anotarPedidoDeAvaliacao(x.id, { vezes: ((lerPedidosDeAvaliacao()[x.id] || {}).vezes || 0) + 1, adiado: Date.now() });
    state.pushAvaliar = { id: x.id };
    state.pushAvaliarFeito = true;
    render();
  };
  setTimeout(() => tentar(0), PEDIR_AVALIACAO_ESPERA_S * 1000);
}
// Abre a ficha nas avaliações, com a nota tocada já marcada.
function avaliarAcademiaChamada(id, estrelas) {
  state.pushAvaliar = null;
  openCourt(id);
  if (!state.selected || state.selected.id !== id) return;
  state.pendingStar = estrelas || 0;
  state.secaoFicha = "avaliacoes";
  syncUrl(false);
  render();
  setTimeout(() => irParaSecao("avaliacoes", true), 60);
}

// Os números que a academia vê antes de se cadastrar são o total do site
// desde o começo, e se atualizam sozinhos. Abaixo desse mínimo o bloco nem
// aparece: com pouca gente, o número diz mais contra do que a favor.

// Sempre arredondado para baixo, numa casa redonda, e mostrado com "+". Assim
// o número fica fácil de ler e nunca promete mais do que de fato aconteceu.
function numeroRedondo(n) {
  const v = Math.floor(n || 0);
  if (v < 10) return String(v);
  const passo = v < 50 ? 5 : v < 100 ? 10 : v < 500 ? 20 : v < 2000 ? 100 : 500;
  return "+" + (Math.floor(v / passo) * passo).toLocaleString("pt-BR");
}

// "1 em 5", que é mais fácil de entender do que "20,4%".
function umEmCada(parte, todo) {
  if (!parte || !todo) return null;
  const n = Math.round(todo / parte);
  return n <= 1 ? "quase todo mundo" : `1 em ${n}`;
}

function porcentoRedondo(parte, todo) {
  if (!parte || !todo) return null;
  const pct = Math.round(((parte / todo) * 100) / 5) * 5;
  return `${Math.max(5, pct)}%`;
}

// A linha do topo conta a vida inteira do site, não os 30 dias. Só aparece
// depois de um mínimo de acessos, senão o número fala contra.
const MINIMO_TOTAL = 50;

// Os mesmos números na home e no GuiaTennis Parceiros, ditos do jeito que
// são contados (análise de 07/10/2026: "25% de quantas pessoas?"). Cada
// acesso ao site é uma visita — a mesma pessoa voltando conta de novo —,
// então o número é de visitas, não de pessoas; a porcentagem diz a base.
const NOTA_DOS_NUMEROS = "Desde o lançamento do site, contados pelo próprio GuiaTennis e arredondados. Contato é o toque no WhatsApp, no Instagram ou no site da academia. As visitas de quem administra o GuiaTennis ou uma academia não entram.";
function numerosDoSite() {
  const e = state.estatisticas;
  if (!e || (e.acessos_total || 0) < MINIMO_TOTAL) return [];
  const umEm = e.fichas_total ? umEmCada(e.fichas_total, e.acessos_total) : null;
  const pct = e.contatos_total && e.fichas_total ? porcentoRedondo(e.contatos_total, e.fichas_total) : null;
  return [
    { valor: numeroRedondo(e.acessos_total), rotulo: "visitas ao GuiaTennis" },
    umEm ? { valor: umEm, rotulo: umEm.startsWith("1 em") ? "visitas abre a ficha de uma academia" : "abre a ficha de uma academia" } : null,
    pct ? { valor: pct, rotulo: "das fichas abertas viram contato com a academia" } : null,
  ].filter(Boolean);
}

function blocoMediasAcademias() {
  const itens = numerosDoSite();
  if (!itens.length) return "";
  return `
    <div class="ba-numeros" style="--n:${itens.length}">
      ${itens.map(i => `<div class="ban-item"><strong>${esc(i.valor)}</strong><span>${esc(i.rotulo)}</span></div>`).join("")}
    </div>
    <p class="ban-nota">${esc(NOTA_DOS_NUMEROS)}</p>`;
}

];
function lerPreferencias() {

}
function textoDaPreferencia(p) {

}
// O ponto da cidade preferida: o meio das academias dela, ou o que o mapa
// achou quando a pessoa salvou (cidade ainda sem academia).
function pontoDaPreferencia(p) {
  p = p || lerPreferencias();
  if (!p.cidade) return null;
  const daCidade = state.allCourts.filter(c => mesmaCidade(c.cidade, p.cidade) && typeof c.lat === "number" && typeof c.lng === "number");
  if (daCidade.length) {
    return {
      lat: daCidade.reduce((s, c) => s + c.lat, 0) / daCidade.length,
      lng: daCidade.reduce((s, c) => s + c.lng, 0) / daCidade.length,
    };
  }
  return typeof p.lat === "number" && typeof p.lng === "number" ? { lat: p.lat, lng: p.lng } : null;
}
function mesmaCidade(a, b) {
  return slugTexto(a || "") === slugTexto(b || "") && !!slugTexto(a || "");
}

function cidadesComQuadra() {
  const map = {};
  state.allCourts.forEach(c => {
    const nome = (c.cidade || "").trim();
    if (!nome) return;
    if (!map[nome]) map[nome] = [];
    map[nome].push(c);
  });
  return Object.keys(map).sort((a, b) => map[b].length - map[a].length).map(nome => ({ nome, courts: map[nome] }));
}

function faixaCidade(courts) {
  const vals = courts.map(parsePriceValue).filter(v => isFinite(v));
  if (!vals.length) return "";
  const min = Math.min(...vals), max = Math.max(...vals);
  return min === max ? `a partir de R$ ${min}/hora` : `de R$ ${min} a R$ ${max} a hora`;
}

// O link da última busca, com os filtros dela: /busca?q=Moema&piso=saibro.

function ultimaBuscaDaCidade(b) {
  return !!(b && b.cidade && !b.bairro && typeof b.lat !== "number" && mesmaCidade(b.termo || b.cidade, b.cidade));

function linkDaUltimaBusca(b) {

// ---------- buscas salvas na conta (pedido do Breno em 05/10/2026) ----------
// Como o "Salvar busca" do Booking e o "Save search" do Zillow e do
// Idealista: na busca, "Salvar busca" guarda o lugar e os filtros na conta
// (em qualquer aparelho). Cada busca salva pode avisar por e-mail quando
// entrar academia nova nela — começa desligado (LGPD) e a pessoa liga ali
// mesmo ou no perfil. Banco sem a tabela: o botão some.
let buscasSalvas = [];
let semBuscasSalvas = false;
async function carregarBuscasSalvas() {
  buscasSalvas = [];
  if (!jogador) return;
  try {
    const { data, error } = await sb.from('buscas_salvas').select('*').eq('user_id', jogador.user_id).order('created_at', { ascending: false });
    if (error) { semBuscasSalvas = true; return; }
    buscasSalvas = data || [];
  } catch { semBuscasSalvas = true; }
}
// A busca aberta, como fica salva: o que foi digitado (ou a cidade da
// página), a região achada, o ponto arredondado (~100 m) e os filtros.
function buscaAtualParaSalvar() {
  if (state.page !== "search" || state.searchStatus !== "done") return null;
  const o = state.origin;
  const cidade = state.cidadeDaPagina;
  if (!o && !cidade) return null;
  const termo = cidade ? cidade : ((state.cep || "").trim() || [o.bairro, o.cidade].filter(Boolean).join(", "));
  if (!termo) return null;
  const p = new URLSearchParams();
  if (!cidade) p.set("q", termo);
  filtrosNoLink(p);
  ["favoritas", "comparando", "ordem", "ver"].forEach(k => p.delete(k));
  const filtros = {};
  ["piso", "cobertura", "modalidade", "comodidades"].forEach(k => { if (p.get(k)) filtros[k] = p.get(k).split(","); });
  ["nota", "preco", "distancia"].forEach(k => { if (p.get(k)) filtros[k] = Number(p.get(k)); });
  const busca = p.toString().replace(/%2C/gi, ",");
  const caminho = cidade ? caminhoDaRegiao({ cidade }) : "/busca";
  return {
    termo: termo.slice(0, 120), bairro: (o && o.bairro) || null, cidade: (o && o.cidade) || cidade || null,
    lat: o ? pontoAproximado(o.lat) : null, lng: o ? pontoAproximado(o.lng) : null, filtros,
    link: caminho + (busca ? "?" + busca : ""),
  };
}
function buscaSalvaIgual(b) {
  return (b && buscasSalvas.find(x => x.link === b.link)) || null;
}
function detalhesDaBuscaSalva(b) {
  const f = b.filtros || {};
  const partes = [
    ...rotulosNaOrdem(MODALIDADE_OPTS, f.modalidade || []),
    ...rotulosNaOrdem(PISO_OPTS, f.piso || []),
    ...rotulosNaOrdem(COBERTURA_OPTS, f.cobertura || []),
    ...rotulosNaOrdem(FILTER_AMENITY_OPTS, f.comodidades || []),
  ];
  if (f.distancia) partes.push(`até ${f.distancia} km`);
  if (f.preco) partes.push(`até R$ ${f.preco}/hora`);
  if (f.nota) partes.push(`nota ${String(f.nota).replace(".", ",")}+`);
  return partes.join(" · ") || "Sem filtros";
}
async function salvarBusca() {
  const b = buscaAtualParaSalvar();
  if (!b || isAdmin) return;
  if (!jogador) {
    jogadorEntaoFaz(() => salvarBusca(), "Para salvar a busca, entre com o seu e-mail. Se ainda não tiver conta, o cadastro leva um minuto.");
    return;
  }
  const igual = buscaSalvaIgual(b);
  if (igual) { state.buscaSalvaAviso = igual.id; render(); return; }
  state.salvandoBusca = true; state.buscaSalvaErro = ""; render();
  const { data, error } = await sb.from('buscas_salvas').insert({ user_id: jogador.user_id, ...b }).select('*').single();
  state.salvandoBusca = false;
  if (error || !data) {
    state.buscaSalvaErro = /20 buscas/.test((error && error.message) || "")
      ? "Você já tem 20 buscas salvas. Apague uma no seu perfil para salvar outra."
      : "Não consegui salvar a busca agora. Tente de novo em instantes.";
    render();
    return;
  }
  buscasSalvas = [data, ...buscasSalvas];
  state.buscaSalvaAviso = data.id;
  registrarPasso("acao", { detalhe: "Salvou a busca" });
  render();
}
async function avisarDaBusca(id, avisar) {
  const b = buscasSalvas.find(x => x.id === id);
  if (!b) return;
  const { error } = await sb.from('buscas_salvas').update({ avisar: !!avisar }).eq('id', id);
  if (error) { state.buscaSalvaErro = "Não consegui mudar o aviso agora. Tente de novo em instantes."; render(); return; }
  b.avisar = !!avisar;
  if (avisar) registrarPasso("acao", { detalhe: "Ligou o aviso da busca salva" });
  render();
}
async function apagarBuscaSalva(id) {
  const { error } = await sb.from('buscas_salvas').delete().eq('id', id);
  if (error) { state.buscaSalvaErro = "Não consegui apagar agora. Tente de novo em instantes."; render(); return; }
  buscasSalvas = buscasSalvas.filter(x => x.id !== id);
  if (state.buscaSalvaAviso === id) state.buscaSalvaAviso = null;
  render();
}
// Refaz a busca salva pelo link dela, como quem abre o link.
function abrirBuscaSalva(id) {
  const b = buscasSalvas.find(x => x.id === id);

  state.showMenu = false;
  state.lista = null;
  state.buscaSalvaAviso = null;

  doSearch({ ordem: feito.ordem });
}
// Na busca: "Salvar busca" (ou "Busca salva"), e o aviso depois de salvar.
function linhaSalvarBusca() {
  if (isAdmin || semBuscasSalvas) return "";
  const b = buscaAtualParaSalvar();
  if (!b) return "";
  const salva = buscaSalvaIgual(b);

  return `
    <div class="busca-salvar">
      <button type="button" class="tbtn ${salva ? "on" : ""}" id="salvar-busca" ${state.salvandoBusca ? "disabled" : ""}>
        ${icon(salva ? 'check' : 'sino', 14, 'currentColor')} ${state.salvandoBusca ? "Salvando" : salva ? "Busca salva" : "Salvar busca"}
      </button>
      ${salva ? "" : `<span class="busca-salvar-dica">Guarde o lugar e os filtros na sua conta e receba as academias novas daqui.</span>`}
    </div>
    ${state.buscaSalvaErro ? `<div class="status-line status-error">${icon('warning',13)} ${esc(state.buscaSalvaErro)}</div>` : ""}
    ${aviso ? `
      <div class="busca-salva-aviso" role="status" id="busca-salva-aviso">
        ${icon('check', 16, 'var(--green)')}
        <span><strong>Busca salva na sua conta.</strong> ${salva.avisar
          ? `Quando entrar academia nova aqui, você recebe por e-mail${confirmar ? " (depois de confirmar o e-mail)" : ""}.`
          : `<button type="button" class="inline-link" id="busca-salva-avisar">Avisar por e-mail quando entrar academia nova aqui</button>`}
          <button type="button" class="inline-link" data-menu="buscas">Ver as buscas salvas</button></span>
        <button type="button" class="viagem-pergunta-x" id="busca-salva-fechar" aria-label="Fechar">✕</button>
      </div>` : ""}`;
}
function blocoBuscasSalvasPerfil() {
  if (semBuscasSalvas) return "";
  const lista = buscasSalvas.map(b => `
      <div class="busca-salva-item">
        <button type="button" class="perfil-item" data-abrir-busca="${esc(b.id)}">${icon('search', 20, 'var(--text)')}<span>${esc(b.termo)}<small>${esc(detalhesDaBuscaSalva(b))}</small></span>${icon('chevron', 16, 'var(--muted)')}</button>

// O primeiro cartão de "Vistas recentemente": a última busca, como o
// "São Paulo · 13 out – 16 out · 2 hóspedes" do trivago. Um toque refaz.
function cartaoUltimaBusca(b) {
  const t = textoDaBusca(b);
  return `
    <a class="mini mini-busca" href="${esc(linkDaUltimaBusca(b))}" data-refazer-busca aria-label="Buscar de novo: ${esc(t.lugar)}">

// "Com base na sua última busca", como as "Ofertas com base nas suas pesquisas
// recentes" do trivago: as academias mais perto de onde a pessoa buscou, com
// os mesmos filtros. Sem busca, as mais perto da cidade das preferências.
// Mostra primeiro as que a pessoa ainda não viu.
const PARECIDAS_RAIO_KM = 50;
function academiasParecidas(todas, b, recentes) {
  const pref = lerPreferencias();
  const temPonto = b && typeof b.lat === "number" && typeof b.lng === "number";
  const ponto = temPonto ? b : pontoDaPreferencia(pref);
  if (!ponto) return null;
  const comPonto = todas.filter(c => typeof c.lat === "number" && typeof c.lng === "number");
  let lista = comPonto;
  if (temPonto) {
    const filtra = (l, campo, quer) => quer && quer.length ? l.filter(c => quer.some(v => (c[campo] || []).includes(v))) : l;
    const filtrada = filtra(filtra(filtra(lista, "modalidades", b.modalidades), "pisos", b.pisos), "cobertura", b.cobertura);
    if (filtrada.length) lista = filtrada;
  }
  lista = lista
    .map(c => ({ c, d: haversineKm(ponto.lat, ponto.lng, c.lat, c.lng) }))
    .filter(x => x.d <= PARECIDAS_RAIO_KM)
    .sort((x, y) => x.d - y.d);
  const vistas = new Set((recentes || []).map(c => c.id));
  const novas = lista.filter(x => !vistas.has(x.c.id));
  lista = (novas.length ? novas : lista).slice(0, 8);
  if (!lista.length) return null;
  return {
    lista,
    titulo: temPonto ? "Com base na sua última busca" : `Perto de ${textoDaPreferencia(pref)}`,
    sub: temPonto ? `Academias perto de ${textoDaBusca(b).lugar}` : "A cidade das suas preferências de busca",
    deOnde: temPonto ? "da sua busca" : "",
  };
}

// "hoje", "ontem", "há 3 dias" ou a data.
function quandoFoi(ms) {
  const dia = 24 * 3600 * 1000;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dias = Math.floor((hoje.getTime() + dia - ms) / dia);
  if (dias <= 0) return "hoje";
  if (dias === 1) return "ontem";
  if (dias < 7) return `há ${dias} dias`;
  const d = new Date(ms);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}
