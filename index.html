}
function starsHtml(avg) {
  const rounded = Math.round(avg);
  let out = "";
  for (let i = 1; i <= 5; i++) out += i <= rounded ? "★" : "☆";
  return out;
}

// ---------- derived results ----------

function parsePriceValue(court) {
  const values = [court.priceAula, court.priceLocacao, court.priceRange]
    .filter(Boolean)
    .map(p => { const m = p.match(/\d+/); return m ? parseInt(m[0], 10) : null; })
    .filter(v => v !== null);
  return values.length ? Math.min(...values) : Infinity;
}

// Faixa de preço disponível no acervo — alimenta o slider do painel de filtros.
function priceBounds() {
  const vals = state.allCourts.map(parsePriceValue).filter(v => isFinite(v));
  if (vals.length < 2) return null;
  const min = Math.floor(Math.min(...vals) / 5) * 5;
  const max = Math.ceil(Math.max(...vals) / 5) * 5;
  if (min >= max) return null;
  return { min, max };
}

function courtDistance(c) {
  return state.origin ? haversineKm(state.origin.lat, state.origin.lng, c.lat, c.lng) : undefined;
}

// De onde medir "a mais perto" fora da busca (Minhas quadras, seletor da
// comparação; pedido do Breno em 05/10/2026): a busca aberta, a viagem em
// andamento com hotel, a última busca, a cidade das preferências (o ponto
// dela ou o meio das academias de lá). Sem nada disso, null.
function pontoDeReferencia() {
  if (state.origin && Number.isFinite(state.origin.lat)) return state.origin;
  const v = typeof viajandoAgora === "function" ? viajandoAgora() : null;
  if (v && Number.isFinite(v.lat)) return { lat: v.lat, lng: v.lng };
  const u = lerUltimaBusca();
  if (u && Number.isFinite(u.lat) && Number.isFinite(u.lng)) return { lat: u.lat, lng: u.lng };
  const p = lerPreferencias();
  if (Number.isFinite(p.lat) && Number.isFinite(p.lng)) return { lat: p.lat, lng: p.lng };
  if (p.cidade) {
    const lugar = cidadesComQuadra().find(c => mesmaCidade(c.nome, p.cidade));
    const pts = lugar ? lugar.courts.filter(c => Number.isFinite(c.lat) && Number.isFinite(c.lng)) : [];
    if (pts.length) return { lat: pts.reduce((t, c) => t + c.lat, 0) / pts.length, lng: pts.reduce((t, c) => t + c.lng, 0) / pts.length };
  }
  return null;
}
function distanciaDaReferencia(c, ref) {
  return ref && c && Number.isFinite(c.lat) && Number.isFinite(c.lng) ? haversineKm(ref.lat, ref.lng, c.lat, c.lng) : undefined;
}
// Ordena da mais perto para a mais longe; sem ponto, a ordem fica como está.
function ordenarPorPerto(lista, deQuem) {
  const ref = pontoDeReferencia();
  if (!ref) return lista;
  const d = (x) => { const v = distanciaDaReferencia(deQuem ? deQuem(x) : x, ref); return typeof v === "number" ? v : Infinity; };
  return lista.map((x, i) => ({ x, i, d: d(x) })).sort((a, b) => (a.d - b.d) || (a.i - b.i)).map(o => o.x);
}

// `skip` desliga um grupo de filtro — é assim que contamos quantas academias
// cada opção traria de volta, igual ao contador que o Trivago mostra ao lado
// de cada caixinha.
function applyFilters(list, skip) {
  skip = skip || "";
  if (state.cidadeDaPagina && state.page === "search") list = list.filter(c => mesmaCidade(c.cidade, state.cidadeDaPagina));
  if (skip !== "piso" && state.pisoFilters.length) list = list.filter(c => state.pisoFilters.some(p => c.pisos?.includes(p)));
  if (skip !== "cobertura" && state.coberturaFilters.length) list = list.filter(c => state.coberturaFilters.some(cv => c.cobertura?.includes(cv)));
  if (skip !== "amenity" && state.amenityFilters.length) list = list.filter(c => state.amenityFilters.every(a => matchesAmenityFilter(c, a)));
  if (skip !== "modalidade" && state.modalidadeFilters.length) list = list.filter(c => state.modalidadeFilters.some(m => c.modalidades?.includes(m)));
  if (skip !== "rating" && state.minRating > 0) list = list.filter(c => { const r = getAppRating(c.id); return r.count > 0 && r.avg >= state.minRating; });
  if (skip !== "price" && state.priceMax !== null) list = list.filter(c => parsePriceValue(c) <= state.priceMax);
  if (skip !== "distance" && state.maxDistance !== null && state.origin) list = list.filter(c => courtDistance(c) <= state.maxDistance);
  if (skip !== "outros") {
    if (state.favoritesOnly) list = list.filter(c => isFavorite(c.id));
    if (state.compareOnly) list = list.filter(c => isComparing(c.id));
  }
  return list;
}

function decorate(c) {
  const r = getAppRating(c.id);
  return { ...c, appAvg: r.avg, appCount: r.count, distanceKm: courtDistance(c) };
}

function activeFilterCount() {
  return state.pisoFilters.length + state.coberturaFilters.length
    + state.amenityFilters.length + state.modalidadeFilters.length
    + (state.minRating > 0 ? 1 : 0) + (state.priceMax !== null ? 1 : 0)
    + (state.maxDistance !== null ? 1 : 0)
    + (state.favoritesOnly ? 1 : 0) + (state.compareOnly ? 1 : 0);
}

function clearAllFilters() {
  state.pisoFilters = [];
  state.coberturaFilters = [];
  state.amenityFilters = [];
  state.modalidadeFilters = [];
  state.minRating = 0;
  state.priceMax = null;
  state.maxDistance = null;
  state.favoritesOnly = false;
  state.compareOnly = false;
}

// Nota "Recomendados": mistura distância, avaliação, preço e estrutura.
// Quem não tem o dado fica no meio da tabela em vez de ser punido.
function recoScore(c, ctx) {
  const dist = typeof c.distanceKm === "number" ? norm(ctx.dists, c.distanceKm, true) : 50;
  const rate = c.appCount ? norm(ctx.rates, c.appAvg, false) : 42;
  const pv = parsePriceValue(c);
  const price = isFinite(pv) ? norm(ctx.prices, pv, true) : 45;
  const estrutura = Math.min(100, totalQuadras(c) * 9 + (c.amenities || []).length * 6);
  return dist * 0.34 + rate * 0.30 + price * 0.19 + estrutura * 0.17;
}

function effectiveSort() {
  return (state.sortBy === "distance" && !state.origin) ? "recomendados" : state.sortBy;
}

function getResults() {
  let list = applyFilters(state.allCourts).map(decorate);
  const sort = effectiveSort();

  if (sort === "distance") {
    list = [...list].sort((a, b) => a.distanceKm - b.distanceKm);
  } else if (sort === "price") {
    list = [...list].sort((a, b) => parsePriceValue(a) - parsePriceValue(b));
  } else if (sort === "reviews") {
    list = [...list].sort((a, b) => (b.appCount - a.appCount) || (b.appAvg - a.appAvg));
  } else if (sort === "courts") {
    list = [...list].sort((a, b) => totalQuadras(b) - totalQuadras(a));
  } else if (sort === "rating") {
    list = [...list].sort((a, b) => {
      const aScore = a.appCount ? a.appAvg : -1;
      const bScore = b.appCount ? b.appAvg : -1;
      return bScore - aScore;
    });
  } else {
    const ctx = {
      dists: list.map(c => c.distanceKm),
      rates: list.map(c => c.appCount ? c.appAvg : null),
      prices: list.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; }),
    };
    list = list
      .map(c => ({ c, s: recoScore(c, ctx) }))
      .sort((a, b) => b.s - a.s)
      .map(x => x.c);
  }
  return list;
}

        acceptedAnswer: { "@type": "Answer", text: f.a },
      })),
    });
  }
  return { "@context": "https://schema.org", "@graph": grafo };
}

// Título da aba e dados estruturados da academia. O Google usa esse JSON para
// entender que a página é de um local esportivo, com nota, preço e perguntas.
const TITULO_PADRAO = document.title;
// A URL canônica acompanha a página aberta, sem filtros nem etiquetas: a
// ficha, a página da região ou a home. Busca livre e comparação ficam fora
// do Google (noindex, follow), como o TripAdvisor e o Booking fazem com as
// buscas internas — o que se indexa são as fichas e as regiões.
const DESCRICAO_PADRAO = (document.querySelector('meta[name="description"]') || {}).content || "";
function urlCanonica(c) {
  if (c) return location.origin + caminhoDaFicha(c);
  if (state.page === "search" && state.regiaoLink) return location.origin + caminhoDaRegiao(state.regiaoLink);
  if (state.page === "search") return location.origin + "/busca";
  if (state.page === "comparar") return location.origin + "/comparar";
  if (state.page === "perfil") return location.origin + "/perfil";
  if (state.page === "admin") return location.origin + "/admin";
  if (state.page === "parceiros") return location.origin + caminhoDosParceiros(state.parceirosAba || "inicio");
  return location.origin + "/";
}
function atualizarCanonical(c) {
  const el = document.getElementById("link-canonical");
  if (!el) return;
  const url = urlCanonica(c);
  if (el.getAttribute("href") !== url) el.setAttribute("href", url);
}
function definirMeta(nome, valor) {
  let el = document.querySelector(`meta[name="${nome}"]`);
  if (!valor) { if (el && nome === "robots") el.remove(); return; }
  if (!el) { el = document.createElement("meta"); el.setAttribute("name", nome); document.head.appendChild(el); }
  if (el.getAttribute("content") !== valor) el.setAttribute("content", valor);
}
// Título, descrição e indexação das telas que não são ficha.
function seoDaPagina() {
  if (state.page === "parceiros") {
    const aba = state.parceirosAba || "inicio";
    const titulos = { inicio: "GuiaTennis Parceiros — mais jogadores para a sua academia de tênis", planos: "Planos · GuiaTennis Parceiros", ajuda: "Ajuda · GuiaTennis Parceiros", cadastro: "Cadastrar academia · GuiaTennis Parceiros" };
    // Entram no Google só as páginas públicas; o pedido de uma academia
    // (?academia=) e as páginas de quem está logado ficam de fora.
    const noGoogle = titulos[aba] && !(aba === "cadastro" && state.pcReivindicar);
    return {
      titulo: titulos[aba] || `${(PC_MENU_LOGADO.find(i => i.aba === aba) || {}).t || (aba === "ver" ? "Ver como academia" : "Entrar")} · GuiaTennis Parceiros`,
      descricao: "Cadastre a sua academia de tênis no GuiaTennis: apareça para quem procura aula e quadra na região e receba contato direto no WhatsApp, sem comissão.",
      robots: noGoogle ? "" : "noindex, follow",
    };
  }
  const r = state.page === "search" ? state.regiaoLink : null;
  if (r) {
    const lugar = termoDaRegiao(r);
    const n = state.allCourts.filter(c => slugTexto(c.cidade) === slugTexto(r.cidade) && (!r.bairro || slugTexto(c.bairro) === slugTexto(r.bairro))).length;
    return {
      titulo: `Quadras e academias de tênis em ${lugar} | GuiaTennis`,
      descricao: `${n ? `${n} ${plural(n, "academia", "academias")} de tênis em ${lugar} e mais perto` : `Academias de tênis perto de ${lugar}`}: compare preço por hora, estrutura e avaliações, e fale direto com a academia.`,
      robots: "",
    };
  }
  if (state.page === "perfil") return { titulo: "Minha conta | GuiaTennis", descricao: DESCRICAO_PADRAO, robots: "noindex, nofollow" };
  if (state.page === "admin") return { titulo: `${(ADMIN_ABAS.find(x => x.aba === state.adminAba) || ADMIN_ABAS[0]).t} · Painel do admin | GuiaTennis`, descricao: DESCRICAO_PADRAO, robots: "noindex, nofollow" };
  if (state.page === "search" || state.page === "comparar" || state.avisoLink) return { titulo: TITULO_PADRAO, descricao: DESCRICAO_PADRAO, robots: "noindex, follow" };
  return { titulo: TITULO_PADRAO, descricao: DESCRICAO_PADRAO, robots: "" };
}

function atualizarSeo(c) {
  const ld = document.getElementById("ld-academia");
  atualizarCanonical(c);
  if (!c) {
    const pagina = seoDaPagina();
    if (document.title !== pagina.titulo) document.title = pagina.titulo;
    definirMeta("description", pagina.descricao);
    definirMeta("robots", pagina.robots);
    if (ld) {
      const novo = JSON.stringify(dadosDoSite());
      if (ld.textContent !== novo) ld.textContent = novo;
    }
    return;
  }
  const local = [c.bairro, c.cidade].filter(Boolean).join(", ");
  const titulo = `${c.name}${local ? " — " + local : ""} | GuiaTennis`;
  if (document.title !== titulo) document.title = titulo;
  definirMeta("description", `${descricaoAcademia(c)}`.slice(0, 300));
  // Ficha pausada ou em análise (só o admin e a academia veem) fica fora.
  definirMeta("robots", c.status === "published" && state.allCourts.some(x => x.id === c.id) ? "" : "noindex");
  if (!ld) return;

  const url = urlCanonica(c);
  const lugar = {
    "@type": "SportsActivityLocation",
    "@id": url,
    name: c.name,
    url,
    description: descricaoAcademia(c),
  };
  const fotos = courtPhotos(c).filter(p => /^https?:/.test(p));
  if (fotos.length) lugar.image = fotos;
  if (c.endereco || c.bairro || c.cidade) {
    lugar.address = {
      "@type": "PostalAddress",
      streetAddress: [c.address, c.numero].filter(Boolean).join(", ") || c.endereco || "",
      addressLocality: c.cidade || "",

    };
  }
  if (typeof c.lat === "number" && typeof c.lng === "number") {
    lugar.geo = { "@type": "GeoCoordinates", latitude: c.lat, longitude: c.lng };
  }
  if (c.phone) lugar.telephone = "+55" + c.phone.replace(/\D/g, "").replace(/^55/, "");
  const redes = [c.site, c.instagram ? `https://instagram.com/${c.instagram.replace("@", "")}` : null].filter(Boolean);
  if (redes.length) lugar.sameAs = redes;
  const faixa = faixaGeral(c);
  if (faixa) lugar.priceRange = faixa.texto;
  if (c.appCount) {
    lugar.aggregateRating = {
      "@type": "AggregateRating",
      ratingValue: Number(c.appAvg.toFixed(1)),
      reviewCount: c.appCount,
      bestRating: 5,
      worstRating: 1,
    };
  }

  const faq = perguntasAcademia(c);
  // O caminho "Início › Quadras em São Paulo › Moema › Academia", que o
  // Google mostra no resultado no lugar do endereço.
  const caminho = [{ nome: "Início", url: location.origin + "/" }];
  if (c.cidade) caminho.push({ nome: `Quadras em ${c.cidade}`, url: location.origin + caminhoDaRegiao({ cidade: c.cidade }) });
  if (c.cidade && c.bairro) caminho.push({ nome: c.bairro, url: location.origin + caminhoDaRegiao({ cidade: c.cidade, bairro: c.bairro }) });
  caminho.push({ nome: c.name, url });
  const grafo = [lugar, {
    "@type": "BreadcrumbList",
    itemListElement: caminho.map((x, i) => ({ "@type": "ListItem", position: i + 1, name: x.nome, item: x.url })),
  }];
  if (faq.length) {
    grafo.push({
      "@type": "FAQPage",
      mainEntity: faq.map(f => ({
        "@type": "Question",
        name: f.q,
        acceptedAnswer: { "@type": "Answer", text: f.a },
      })),
    });
  }
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": grafo });
}

const DECIDE_CRITERIA = [
  { key: "preco", label: "Preço" },
  { key: "distancia", label: "Distância" },
  { key: "estrutura", label: "Estrutura" },
  { key: "avaliacoes", label: "Avaliações" },
];

function norm(values, value, lowerIsBetter) {
  const valid = values.filter(v => typeof v === "number" && isFinite(v));
  if (!valid.length || typeof value !== "number" || !isFinite(value)) return 50;
  const min = Math.min(...valid), max = Math.max(...valid);
  if (min === max) return 100;
  const pct = ((value - min) / (max - min)) * 100;
  return lowerIsBetter ? 100 - pct : pct;
}

function decideRanking() {
  const courts = compareCourts();
  const an = analisarAnotacoes(state.decideNotes, courts);

  // Critérios marcados + os que a pessoa citou no texto
  const marcados = [...new Set([...state.decidePrios, ...an.criterios])];
  const prios = marcados.length ? marcados : DECIDE_CRITERIA.map(c => c.key);

  // Itens concretos citados na anotação (estacionamento, água, coberta...)
  const exigencias = an.achados.filter(a => a.atendem.length && a.atendem.length < a.total);

  const precos = courts.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; });
  const ref = pontoDeReferencia();
  const dists = courts.map(c => { const d = typeof c.distanceKm === "number" ? c.distanceKm : distanciaDaReferencia(c, ref); return typeof d === "number" ? d : null; });
  const estrs = courts.map(c => (c.amenities||[]).length * 2 + (totalQuadras(c) || 0));
  const notas = courts.map(c => c.appCount ? c.appAvg : null);

  return courts.map((c, i) => {
    const scores = {
      preco: norm(precos, precos[i], true),
      distancia: norm(dists, dists[i], true),
      estrutura: norm(estrs, estrs[i], false),
      avaliacoes: norm(notas, notas[i], false),
    };
    let total = prios.reduce((sum, k) => sum + scores[k], 0) / prios.length;

    // O que a pessoa escreveu pesa o dobro: se ela se deu ao trabalho de citar,
    // é porque importa mais que um critério genérico marcado.
    let atendidas = [];
    if (exigencias.length) {
      atendidas = exigencias.filter(e => e.atendem.some(x => x.id === c.id));
      const notaAnotacao = (atendidas.length / exigencias.length) * 100;
      total = (total + notaAnotacao * 2) / 3;
    }

    const melhores = Object.entries(scores)
      .filter(([k]) => prios.includes(k))
      .sort((a, b) => b[1] - a[1])
      .slice(0, 2)
      .filter(([, v]) => v >= 60)
      .map(([k]) => DECIDE_CRITERIA.find(x => x.key === k).label.toLowerCase());

    return {
      court: c,
      total,
      melhores,
      atendeAnotacao: atendidas.map(e => e.label),
      faltaAnotacao: exigencias.filter(e => !e.atendem.some(x => x.id === c.id)).map(e => e.label),
    };
  }).sort((a, b) => b.total - a.total);
}

// Dicionário de termos → o que a pessoa está procurando.
// Sem acento e minúsculo; o texto é normalizado antes de comparar.
const NOTE_KEYWORDS = [
  { tipo: "amenity", alvo: ["estacionamento_gratuito", "estacionamento_pago"], termos: ["estacionamento", "estacionar", "vaga", "garagem"], label: "estacionamento" },
  { tipo: "amenity", alvo: ["vestiario"], termos: ["vestiario", "banho", "chuveiro", "trocar de roupa"], label: "vestiário" },
  { tipo: "amenity", alvo: ["loja"], termos: ["loja", "corda", "encordoamento", "material"], label: "loja de material" },
  { tipo: "amenity", alvo: ["wifi"], termos: ["wifi", "wi-fi", "internet"], label: "Wi-Fi" },
  { tipo: "amenity", alvo: ["lanchonete"], termos: ["lanchonete", "lanche", "comer", "comida", "bar"], label: "lanchonete" },
  { tipo: "amenity", alvo: ["agua"], termos: ["agua", "bebedouro"], label: "água grátis" },
  { tipo: "amenity", alvo: ["camera"], termos: ["camera", "gravar", "filmar", "video"], label: "câmera" },
  { tipo: "amenity", alvo: ["assinatura_fitness"], termos: ["gympass", "wellhub", "totalpass", "assinatura", "plano fitness"], label: "app de assinatura fitness" },
  { tipo: "cobertura", alvo: ["coberta"], termos: ["coberta", "cobertura", "chuva", "sol forte", "sombra"], label: "quadra coberta" },
  { tipo: "piso", alvo: ["saibro"], termos: ["saibro"], label: "saibro" },
  { tipo: "piso", alvo: ["rapida"], termos: ["rapida", "dura", "cimento"], label: "quadra rápida" },
  { tipo: "criterio", alvo: ["preco"], termos: ["caro", "barato", "preco", "valor", "custo", "bolso", "gastar"], label: "preço" },
  { tipo: "criterio", alvo: ["distancia"], termos: ["perto", "longe", "distancia", "transito", "deslocamento", "chegar"], label: "distância" },
  { tipo: "criterio", alvo: ["avaliacoes"], termos: ["avaliacao", "nota", "comentario", "reputacao", "recomenda"], label: "avaliações" },
  { tipo: "criterio", alvo: ["estrutura"], termos: ["estrutura", "instalacao", "espaco", "quadras"], label: "estrutura" },
];

function semAcento(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function analisarAnotacoes(texto, courts) {
  const t = semAcento(texto);
  if (!t.trim()) return { achados: [], criterios: [] };

  const achados = [];
  const criterios = [];

  NOTE_KEYWORDS.forEach(k => {
    if (!k.termos.some(termo => t.includes(semAcento(termo)))) return;

    if (k.tipo === "criterio") {
      criterios.push(...k.alvo);
      return;
    }

    const atendem = courts.filter(c => {
      if (k.tipo === "amenity") return k.alvo.some(a => (c.amenities||[]).includes(a));
      if (k.tipo === "cobertura") return k.alvo.some(a => (c.cobertura||[]).includes(a));
      if (k.tipo === "piso") return k.alvo.some(a => (c.pisos||[]).includes(a));
      return false;
    });
    achados.push({ label: k.label, atendem, total: courts.length });
  });

  return { achados, criterios: [...new Set(criterios)] };
}

function renderCmpPicker() {
  if (!state.cmpPicker) return "";
  const aba = state.cmpPicker;
  // Só a aba "Todas" tem campo de busca; nas outras a ordem já é a resposta.

  if (aba === "fav") lista = lista.filter(c => isFavorite(c.id));
  lista = lista.slice().sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

  if (termo) lista = lista.filter(c => semAcento(`${c.name} ${c.bairro || ""} ${c.cidade || ""}`).includes(termo));

// Uma linha da tabela sabe quem ganhou: `melhor` diz se o bom é o maior ou o
// menor número. Quando todo mundo empata, ninguém fica destacado.
function marcarMelhores(linha) {
  if (!linha.melhor) return [];
  const nums = linha.vals.map(v => (typeof v.num === "number" && isFinite(v.num)) ? v.num : null);
  const validos = nums.filter(n => n !== null);
  if (validos.length < 2) return [];
  const alvo = linha.melhor === "menor" ? Math.min(...validos) : Math.max(...validos);
  if (validos.every(n => n === alvo)) return [];
  return nums.map(n => n === alvo);
}

function celPreco(faixa) {
  const min = priceMin(faixa);
  if (!min) return { txt: `<span class="ct-cel-sem">${SEM_PRECO}</span>` };
  return { txt: esc(precoTexto(faixa)), num: parseInt(min, 10) };
}

function celReposicao(c) {
  const pol = politicaDe(c);
  const p = pol.modo === "separado" ? (parteVale(pol.aula) ? pol.aula : pol.locacao) : pol.geral;
  if (p.reposicao === "nao") return { txt: "Não faz reposição" };
  if (p.horas) return { txt: `Avisando ${p.horas}h antes`, num: p.horas };
  return { txt: "Não incluído" };
}

        : { txt: "Sem nota ainda" }) },

    ]},
    { titulo: "Preço por hora", linhas: [
      { rot: "Aula", melhor: "menor", vals: courts.map(c => celPreco(c.priceAula)) },
      { rot: "Locação", melhor: "menor", vals: courts.map(c => celPreco(c.priceLocacao)) },
    ]},
    { titulo: "Estrutura", linhas: [
      { rot: "Quadras", melhor: "maior", vals: courts.map(c => ({ txt: totalQuadras(c) ? String(totalQuadras(c)) : "—", num: totalQuadras(c) || null })) },
      { rot: "Piso", vals: courts.map(c => ({ txt: esc(listaPt(rotulosNaOrdem(PISO_OPTS, c.pisos))) || "—" })) },
      { rot: "Cobertura", vals: courts.map(c => ({ txt: esc(listaPt(rotulosNaOrdem(COBERTURA_OPTS, c.cobertura))) || "—" })) },
      { rot: "Comodidades", melhor: "maior", vals: courts.map(c => {
        const l = rotulosNaOrdem(AMENITY_OPTS, c.amenities);
        return { txt: esc(listaPt(l)) || "—", num: l.length || null };
      }) },
    ]},
    { titulo: "Onde fica", linhas: [
      { rot: "Bairro", vals: courts.map(c => ({ txt: esc([c.bairro, c.cidade].filter(Boolean).join(", ")) || "—" })) },
      { rot: "Distância", melhor: "menor", vals: courts.map((c, i) => ({
        txt: distanceText(dists[i]) || "Busque um endereço",

    ]},

const DECIDE_PUSH_SEGUNDOS = 15;
function caixaDeDecisao(courts) {

                  <p class="decide-why">${

                      ? `Tem ${listaPt(top.atendeAnotacao)}, que você citou${top.melhores.length ? `, e ainda sai na frente em ${listaPt(top.melhores)}` : ""}.`

}
function destaquesDaComparacao(courts) {
  const melhor = (vals, menor) => {
    const ok = vals.map((v, i) => ({ v, i })).filter(o => typeof o.v === "number" && isFinite(o.v));
    if (ok.length < 2) return null;
    const alvo = menor ? Math.min(...ok.map(o => o.v)) : Math.max(...ok.map(o => o.v));
    const ganham = ok.filter(o => o.v === alvo);
    return ganham.length === 1 ? courts[ganham[0].i] : null;
  };
  const preco = (c) => {
    const ns = [c.priceAula, c.priceLocacao].map(priceMin).filter(Boolean).map(Number);
    return ns.length ? Math.min(...ns) : null;
  };
  const ref = pontoDeReferencia();
  const dists = courts.map(c => distanciaDaReferencia(c, ref));
  return [
    { t: "Menor preço", c: melhor(courts.map(preco), true) },
    { t: "Melhor nota", c: melhor(courts.map(c => c.appCount ? c.appAvg : null), false) },
    { t: "Mais perto", c: melhor(dists, true) },
  ].filter(x => x.c);
}
function avisoDeDecisao() {
  if (state.page !== "comparar" || !state.decidePush || state.decidePushFechado || state.showDecide || state.cmpPicker) return "";
  const courts = compareCourts();
  if (courts.length < COMPARE_MIN) return "";
  const dest = destaquesDaComparacao(courts);
  return `
    <aside class="convite-conta decide-push" id="decide-push" role="dialog" aria-label="Ainda em dúvida?">
      <button type="button" class="convite-fechar" id="decide-push-fechar" aria-label="Fechar">✕</button>
      <span class="convite-ic">${icon('sparkle', 24, '#fff')}</span>

        <p class="convite-s">Marque o que mais pesa para você e a gente ajuda a escolher.</p>

}

// Arma o aviso quando a comparação aparece; vale uma vez por visita.
function armarAvisoDeDecisao() {
  if (state.page !== "comparar" || state.decidePush || state.decidePushTimer || state.decidePushFechado) return;
  if (compareCourts().length < COMPARE_MIN) return;
  state.decidePushTimer = setTimeout(() => {
    state.decidePushTimer = null;
    if (state.page !== "comparar" || compareCourts().length < COMPARE_MIN) return;
    state.decidePush = true;
    const digitando = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (!digitando) render();
  }, DECIDE_PUSH_SEGUNDOS * 1000);
}

// As vagas são o cabeçalho da comparação: mostram quem está dentro, deixam
// trocar com um toque e ficam grudadas no topo enquanto a tabela rola.
function vagasComparacao(courts) {
  const total = Math.max(COMPARE_MIN, Math.min(COMPARE_MAX, courts.length + 1));
  const vagas = [];
  for (let i = 0; i < total; i++) {
    const c = courts[i];
    if (!c) {
      vagas.push(`
        <button type="button" class="cmp-vaga" data-cmp-abrir="1" aria-label="Escolher academia">
          <span class="cmp-vaga-mais">+</span>
          <span class="cmp-vaga-add">Escolher</span>
        </button>`);
      continue;
    }
    const foto = courtPhotos(c)[0];
    vagas.push(`
      <div class="cmp-vaga on">
        ${foto ? `<div class="cmp-vaga-foto"><img src="${esc(foto)}" alt="" loading="lazy" /></div>` : ""}
        <span class="cmp-vaga-n">${esc(c.name)}</span>
        <button type="button" class="cmp-vaga-x" data-cmp-remove="${c.id}" aria-label="Tirar ${esc(c.name)} da comparação">✕</button>
      </div>`);
  }
  return `
    <div class="cmp-vagas-barra">
      <div class="cmp-vagas">${vagas.join("")}</div>
      <p class="cmp-vagas-n">${courts.length} de ${COMPARE_MAX} na comparação</p>
    </div>`;
}

function priceMin(priceStr) {
  const m = (priceStr || "").match(/\d+/);
  return m ? m[0] : null;
}

function navLinks(c, opts) {
  const dark = opts && opts.dark;
  const cls = dark ? "cta-btn cta-secondary nav-link-dark" : "cta-btn cta-secondary";
  const cor = dark ? "#fff" : "var(--green)";
  return `<button type="button" class="${cls}" data-nav="${c.id}" style="margin-top:8px">${icon('pin',15,cor)} Ver no mapa e direções</button>`;
}

// Tela do QR code da academia, só no modo admin. O código é gerado aqui no
// navegador e aponta direto para a ficha — não expira nem depende de serviço.
function renderQrSheet() {
  if (!state.qrCourt || !(isAdmin || (contaAcademia && state.qrCourt === contaAcademia.academiaId))) return "";
  const doSite = state.qrCourt === "site";
  const c = doSite
    ? { id: "site", name: "GuiaTennis — site inteiro" }
    : (state.allCourts.find(x => x.id === state.qrCourt) || (state.pending || []).find(x => x.id === state.qrCourt) || [minhaAcademia()].find(x => x && x.id === state.qrCourt));
  if (!c) return "";
  const url = linkDaFicha(c);
  let svg = "";
  try { svg = qrSvg(url, 300); } catch (e) { svg = ""; }
  return `
    <div class="overlay open" id="qr-overlay">
      <div class="sheet"><div class="sheet-content">
        <button class="sheet-close" id="qr-close">✕</button>

        <div class="cta-col" style="margin-top:12px">
          <button type="button" class="cta-btn cta-primary" data-qr-baixar="png" data-court="${c.id}">Baixar PNG (1200px)</button>
          <button type="button" class="cta-btn cta-secondary" data-qr-baixar="svg" data-court="${c.id}">Baixar SVG (para impressão)</button>
        </div>
        <p class="footnote">Aponta direto para guiatennis.com.br, então funciona para sempre — não expira nem depende de outro site.${doSite
          ? " Serve para cartão, adesivo, post e qualquer material de divulgação do guia."
          : " Imprima e deixe na recepção da academia para os jogadores avaliarem."}</p>

}

// ---------- links de cada tela, no padrão dos sites grandes ----------
// Como Booking, TripAdvisor, Airbnb e Trivago: cada tela tem o próprio
// endereço, e tudo o que está nela vai junto — quem recebe o link vê a
// mesma coisa, recarregar não perde nada e o "voltar" do celular desfaz o
// último passo.
//   /academia/quadra-exemplo-moema-00000002   ficha (nome + fim do id)
//   /academia/…#avaliacoes                    ficha aberta numa seção
//   /quadras/sao-paulo/moema                  academias de uma região
//   /busca?q=…&piso=saibro&ordem=preco&ver=mapa   busca, filtros, ordem e mapa
//   /comparar?academias=00000001,00000002     a comparação
// Os links antigos (?court=, ?busca=, ?comparar=1) continuam abrindo e são
// trocados pelo endereço novo. O fim do id faz o link sobreviver à troca de
// nome da academia; o nome é só para quem lê (e para o Google).
const SITE = "https://guiatennis.com.br";

// GuiaTennis Parceiros, um site à parte (pedido do Breno em 05/10/2026): como
// o trivago e o trivago Business Studio, o site dos jogadores e o das
// academias ficam cada um na sua aba. Do site dos jogadores, "GuiaTennis
// Parceiros" abre o das academias na aba dele (e volta para ela, se já
// estiver aberta); de lá, "Ir para o GuiaTennis" volta à aba dos jogadores.
// Endereço próprio, com links curtos (parceiros.guiatennis.com.br/painel):
// o código já entende esse endereço; os links do guiatennis.com.br passam a
// apontar para ele quando PARCEIROS_NO_ENDERECO_PROPRIO for true — depois de
// o Breno criar o endereço no registro.br e no Netlify (GUIATENNIS-CONTEXTO,
// seção 11). Até lá, o Parceiros fica em guiatennis.com.br/parceiros.
const SITE_PARCEIROS = "https://parceiros.guiatennis.com.br";
const PARCEIROS_NO_ENDERECO_PROPRIO = false;
const ABA_PARCEIROS = "guiatennis-parceiros", ABA_JOGADORES = "guiatennis";
function noEnderecoDosParceiros() {
  return /^parceiros\./.test(location.hostname);
}
function noSiteDeVerdade() {

async function carregarConta(session) {
  const visao = contaAcademia && contaAcademia.visaoAdmin ? contaAcademia : null;
  isAdmin = false;
  contaAcademia = null;
  jogador = null;
  const user = session && session.user;
  if (!user) return;
  if ((user.email || "").toLowerCase() === EMAIL_ADMIN) { isAdmin = true; contaAcademia = visao; return; }
  try {
    const { data, error } = await sb.from('academia_acessos').select('*').eq('user_id', user.id);
    if (!error && data && data[0]) contaAcademia = { ...contaDeLinha(data[0]), login: user.email };
  } catch { /* banco sem a tabela: fica como visitante */ }
  if (contaAcademia) {
    contaAcademia.academias = await carregarMinhasAcademias(contaAcademia);
    contaAcademia.pedidos = await carregarMeusPedidos(contaAcademia);
  }
  try {
    const { data, error } = await sb.from('jogadores').select('*').eq('user_id', user.id);
    if (!error && data && data[0]) jogador = data[0];
  } catch { /* banco sem a tabela: fica como visitante */ }
  // Conta do GuiaTennis Parceiros também joga (pedido do Breno em
  // 05/10/2026): no site dos jogadores, é uma conta normal — perfil, buscas
  // salvas, avisos e avaliações (menos da academia que administra). A parte
  // de jogador nasce sozinha, com o nome e o e-mail do Parceiros.
  if (contaAcademia && !jogador) {
    try {
      const r = await sb.rpc('ativar_conta_de_jogador');
      const j = r && !r.error ? (Array.isArray(r.data) ? r.data[0] : r.data) : null;
      if (j && j.user_id) jogador = j;
    } catch { /* banco sem a função: segue só como academia */ }
  }
  if (jogador) await carregarBuscasSalvas();
}

// O que falta para a ficha ficar completa — o "complete seu perfil" do
// Google Business Profile. Na mesma ordem da ficha.
function faltasDaFicha(c) {
  if (!c) return [];
  const faltas = [];
  if (!c.endereco && !c.address) faltas.push("Endereço");
  if (!c.phone) faltas.push("WhatsApp");
  if (!temHorario(c)) faltas.push("Horário");
  if (!opcoesPreco(c).some(o => temPreco(o.faixa))) faltas.push("Preço");
  if (limitesDoPlano(c.plano).cancelamento && !temPolitica(c)) faltas.push("Cancelamento");
  if (!totalQuadras(c)) faltas.push("Quadras");
  if (!(c.amenities || []).length) faltas.push("Comodidades");
  if (limitesDoPlano(c.plano).chegada && !temAcesso(c)) faltas.push("Como chegar");
  if (!(c.photos || []).length) faltas.push("Fotos");
  return faltas;
}

function dataCurta(ts) {
  try { return new Date(ts).toLocaleDateString("pt-BR"); } catch { return ""; }
}
function dataHora(ts) {
  try {
    const d = new Date(ts);
    return `${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
  } catch { return ""; }
}
function telefoneBonito(t) {
  const d = (t || "").replace(/\D/g, "");
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return t || "";
}

// As mensagens escritas no SQL (dados inválidos, usuário repetido) já dizem
// o que fazer; o resto vira uma frase simples.
function mensagemDoBanco(error, padrao) {
  return error && (error.code === "22023" || error.code === "23505") && error.message ? error.message : padrao;
}
function mensagemSenha(error) {
  const t = `${(error && error.code) || ""} ${(error && error.message) || ""}`;
  if (/same_password|different from the old/i.test(t)) return "A senha nova precisa ser diferente da anterior.";
  if (/weak_password|at least|characters/i.test(t)) return "Senha fraca: use pelo menos 8 caracteres, misturando letras e números.";
  if (/reauthentication|current_password|current password/i.test(t)) return "Por segurança, saia, entre de novo e troque a senha logo em seguida.";
  return "Não consegui trocar a senha agora. Tente de novo em instantes.";
}

// No painel do admin: os pedidos para administrar e quem já tem acesso.
function blocoAcessosPainel() {

function nomeDaAcademiaNoAdmin(id) {

// Uma linha por academia de cada conta (a mesma conta pode administrar
// várias): o pedido aparece uma vez por conta.
function umaLinhaPorConta(lista) {
  return lista.filter((a, i) => lista.findIndex(b => b.user_id === a.user_id) === i);
}
function blocoPedidosParaAdministrar() {
  if (state.acessos === null) return "";

  const pedidos = pedidosDoAdmin();

          ${linhaDoCodigo(a)}
          <div class="chip-row">
            ${a.whatsapp ? `<a class="chip small" href="https://wa.me/55${esc(whatsappDe(a.whatsapp) || a.whatsapp)}?text=${encodeURIComponent(`Oi, ${(a.nome_responsavel || "").split(" ")[0]}! Aqui é o Breno, do GuiaTennis. Recebi o seu pedido para administrar a ${a.pedido_nome || "academia"} no GuiaTennis Parceiros.`)}" target="_blank" rel="noreferrer">WhatsApp</a>` : ""}

          </div>
        </div>`).join("")}`;
}
function blocoAcessosDasAcademias() {
  if (state.acessos === null) return "";
  const nomeDe = nomeDaAcademiaNoAdmin;
  const umaPorConta = umaLinhaPorConta;
  const pedidos = pedidosDoAdmin();
  const semAcademia = umaPorConta(state.acessos.filter(a => !a.academia_id && !pedidos.some(p => p.user_id === a.user_id)));
  const comAcademia = state.acessos.filter(a => a.academia_id);
  // Uma academia por cartão, com as pessoas dela juntas (pedido do Breno em
  // 05/10/2026: uma linha por pessoa e academia ficava empilhado demais).
  const porAcademia = [];
  comAcademia.forEach(a => {
    let g = porAcademia.find(x => x.id === a.academia_id);
    if (!g) porAcademia.push(g = { id: a.academia_id, pessoas: [] });
    g.pessoas.push(a);
  });
  porAcademia.forEach(g => g.pessoas.sort((x, y) => (y.papel !== "equipe") - (x.papel !== "equipe")));
  porAcademia.sort((x, y) => nomeDe(x.id).localeCompare(nomeDe(y.id), "pt-BR"));
  return `
    <p class="sheet-title display" style="font-size:18px;margin-top:28px">Acessos das academias</p>
    <p class="subtitle" style="margin-top:4px">${comAcademia.length
      ? `${porAcademia.length} ${plural(porAcademia.length, "academia tem", "academias têm")} acesso, com ${umaPorConta(comAcademia).length} ${plural(umaPorConta(comAcademia).length, "pessoa", "pessoas")}. Para criar outro, abra a ficha da academia e use "Acesso da academia".`
      : `Nenhuma academia tem acesso ainda. Abra a ficha da academia e use "Acesso da academia".`}${semAcademia.length ? ` ${semAcademia.length} ${plural(semAcademia.length, "conta nova ainda não escolheu", "contas novas ainda não escolheram")} a academia.` : ""}</p>
    ${porAcademia.map(g => `
      <button type="button" class="pending-item acesso-item" data-acesso-ficha="${g.id}">
        <span class="pending-name display">${esc(nomeDe(g.id))} <small class="acesso-qtas">· ${g.pessoas.length} ${plural(g.pessoas.length, "pessoa", "pessoas")}</small></span>
        ${g.pessoas.map(a => `
          <span class="pending-detail acesso-pessoa">${esc(a.nome_responsavel || a.usuario)} · ${a.papel === "equipe" ? "equipe" : "responsável"} · ${a.dados_completos_em ? "ativo" : "esperando o primeiro acesso"}${a.ultimo_acesso ? ` · último acesso ${dataCurta(a.ultimo_acesso)}` : ""}<br><small>${esc(a.usuario)}</small></span>`).join("")}
      </button>`).join("")}
  `;
}

function pedidosDoAdmin() {
  if (Array.isArray(state.pedidosAcesso)) {
    return state.pedidosAcesso.map(p => ({ ...p, pedido_academia_id: p.academia_id, pedido_nome: p.nome, pedido_destino: p.destino }));
  }
  const lista = (state.acessos || []).filter(a => a.pedido_academia_id);
  return lista.filter((a, i) => lista.findIndex(b => b.user_id === a.user_id) === i);
}

// Verificação como a do Google pelo telefone da empresa: o código vai para o
// WhatsApp que está na ficha. Quem manda é o Breno, pelo WhatsApp dele.
// Desde 07/10/2026, só na disputa (e quando o admin quiser conferir um
// pedido que espera o e-mail confirmado).
function linhaDoCodigo(a) {
  const ficha = state.allCourts.find(c => c.id === a.pedido_academia_id);
  const dono = (state.acessos || []).find(x => x.academia_id === a.pedido_academia_id && x.papel === "principal" && x.user_id !== a.user_id);
  const disputa = a.pedido_destino === "disputa";
  if (dono && !disputa) return `<span class="pending-detail">Já tem responsável (${esc(dono.nome_responsavel || dono.email || dono.usuario)}): o pedido foi para ele aceitar ou recusar. Se a pessoa contestar, vira disputa e volta para cá.</span>`;
  if (!ficha) return `<span class="pending-detail">Academia nova: publicar libera o acesso. Se a pessoa confirmar o e-mail, ela vai ao ar sozinha.</span>`;
  // Na disputa, o código vai para o WhatsApp que a academia tinha quando o
  // responsável de agora assumiu sem código (pode ter mudado depois).
  const antes = disputa && whatsappDe(a.telefone_antes);
  const tel = antes || whatsappDe(ficha.phone);
  const agora = whatsappDe(ficha.phone);
  const qualTel = antes && antes !== agora
    ? `o WhatsApp que a academia tinha antes de ${esc(dono ? (dono.nome_responsavel || dono.email || dono.usuario) : "o responsável")} assumir, ${esc(telefoneBonito(antes))} (o da ficha agora é ${agora ? esc(telefoneBonito(agora)) : "nenhum"})`
    : `o WhatsApp da ficha, ${tel ? esc(telefoneBonito(tel)) : ""}`;
  const cabeca = disputa ? `<span class="pending-detail adm-disputa"><strong>Em disputa</strong> com ${esc(dono ? (dono.nome_responsavel || dono.email || dono.usuario) : "o responsável")}: quem digitar o código vira o responsável, e quem administrava sai. Sem como mandar o código, peça documento e decida em "Aprovar".</span>` : "";
  if (!tel) return cabeca + `<span class="pending-detail">A ficha não tem WhatsApp: confirme com a academia antes de aprovar.</span>`;
  const codigo = (state.codigosGerados || {})[a.user_id + "|" + a.pedido_academia_id];
  if (codigo) {
    const msg = `Olá! Aqui é o Breno, do GuiaTennis. ${a.nome_responsavel || "Uma pessoa"} pediu para administrar a ficha da ${ficha.name} no GuiaTennis Parceiros. Se for alguém da academia, passe para essa pessoa o código ${codigo}. Se ninguém da academia pediu, é só ignorar esta mensagem.`;
    return cabeca + `
      <span class="pending-detail">Código <strong>${esc(codigo)}</strong> — mande para ${qualTel}. Quando a pessoa digitar, o acesso é liberado sozinho.</span>
      <div class="chip-row"><a class="chip small active" href="https://wa.me/55${tel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noreferrer">Mandar o código ao WhatsApp da academia</a></div>`;
  }
  return cabeca + `
    <span class="pending-detail">${a.codigo_em ? `Código gerado em ${dataCurta(a.codigo_em)}.` : disputa ? `O código vai para ${qualTel}.` : "Esperando a pessoa confirmar o e-mail: confirmado, a ficha passa a ser dela sozinha. Pode aprovar já ou conferir pelo código."}</span>
    <div class="chip-row"><button type="button" class="chip small" data-gerar-codigo="${a.user_id}" data-academia="${a.pedido_academia_id}">${a.codigo_em ? "Gerar outro código" : "Gerar código para o WhatsApp da academia"}</button></div>`;
}

async function gerarCodigoDoPedido(userId, academiaId) {
  const { data, error } = await rpcDoPedido('gerar_codigo_do_pedido', { p_user: userId }, academiaId);
  if (error) { alert("Não consegui: " + error.message); return; }
  state.codigosGerados = { ...(state.codigosGerados || {}), [userId + "|" + academiaId]: data };
  await carregarAcessos();
  render();
}

async function decidirPedido(userId, academiaId, aprovar) {
  const { error } = await rpcDoPedido(aprovar ? 'aprovar_pedido_de_acesso' : 'recusar_pedido_de_acesso', { p_user: userId }, academiaId);
  if (error) { alert("Não consegui: " + error.message); return; }
  await carregarAcessos();
  render();
}

async function salvarDadosConta() {
  const f = dadosContaForm();
  const pedirSenha = !acessoCompleto() && !contaAcademia.senhaTrocada;
  const pedirAceite = !contaAcademia.termosAceitos;
  const whats = (f.whatsapp || "").replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "");
  const cnpj = (f.cnpj || "").replace(/\D/g, "");
  let erro = erroDoContato(f);
  if (!erro && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((f.email || "").trim())) erro = "Confira o e-mail.";
  else if (!erro && cnpj && cnpj.length !== 14) erro = "O CNPJ tem 14 números. Se preferir, deixe em branco.";
  else if (!erro && pedirSenha && erroDaSenha(f.senha, f.senha2, f.email)) { erro = erroDaSenha(f.senha, f.senha2, f.email); f.senha2 = ""; }
  else if (!erro && pedirAceite && !f.aceite) erro = "Falta aceitar os Termos de Uso e a Política de Privacidade.";
  if (erro) { state.contaErro = erro; render(); if (!f.senha2 && pedirSenha) focarDepoisDaSenha("conta-senha", "conta-senha2", erro); return; }
  state.contaErro = "";
  state.contaSalvando = true;
  render();
  try {
    if (pedirSenha) {
      const atributos = { password: f.senha };
      if (window.__senhaDoLogin) atributos.current_password = window.__senhaDoLogin;
      const { error } = await sb.auth.updateUser(atributos);
      if (error) throw new Error(mensagemSenha(error));
      window.__senhaDoLogin = null;
      await sb.rpc('marcar_senha_trocada');
      contaAcademia.senhaTrocada = true;
    }
    const { error } = await sb.rpc('completar_meu_acesso', {
      p_nome: juntarNome(f), p_cargo: f.cargo, p_email: f.email.trim(), p_whatsapp: whats,
      p_cnpj: cnpj, p_recebe_relatorio: false, p_aceite: !!f.aceite, p_tratamento: f.tratamento,
    });
    if (error) throw new Error(mensagemDoBanco(error, "Não consegui salvar agora. Tente de novo em instantes."));
    const primeiraVez = !contaAcademia.dadosCompletos;
    await recarregarConta();
    window.__conta = null;
    state.contaModo = "painel";
    state.contaAviso = primeiraVez ? "Tudo certo! Agora é só manter a ficha em dia." : "Dados salvos.";
    if (primeiraVez && state.page === "parceiros") { state.parceirosAba = "painel"; syncUrl(false); if (temAcademia()) { carregarNumeros(); carregarPedidosDeAcesso(); } }
  } catch (e) {
    state.contaErro = e.message || "Não consegui salvar agora. Tente de novo em instantes.";
  }
  state.contaSalvando = false;
  render();
}

async function trocarSenhaConta() {
  // Vendo como academia, a senha seria a do admin: não troca daqui.
  if (emVisaoAdmin()) { state.contaErro = SO_VER_NO_MODO_ADMIN; render(); return; }
  const f = window.__senha || {};
  let erro = "";
  if (!f.atual) erro = "Digite a senha atual.";
  else if (erroDaSenha(f.nova, f.nova2, contaAcademia && contaAcademia.email)) { erro = erroDaSenha(f.nova, f.nova2, contaAcademia && contaAcademia.email); f.nova2 = ""; }
  if (erro) { state.contaErro = erro; render(); if (!f.nova2 && f.atual) focarDepoisDaSenha("senha-nova", "senha-nova2", erro); return; }
  state.contaErro = "";
  state.contaSalvando = true;
  render();
  try {
    // Entrar de novo confere a senha atual e renova a sessão — o Supabase
    // pode pedir as duas coisas para trocar a senha.
    // O login pode ter virado o e-mail de contato (SQL 20261004120000).
    let login = contaAcademia.login || emailDoLogin(contaAcademia.usuario);
    try { const r = await sb.rpc('login_do_usuario', { p_usuario: contaAcademia.usuario }); if (!r.error && r.data) login = r.data; } catch {}
    const { error: errAtual } = await sb.auth.signInWithPassword({ email: login, password: f.atual });
    if (errAtual) throw new Error("A senha atual não confere.");
    const { error } = await sb.auth.updateUser({ password: f.nova, current_password: f.atual });
    if (error) throw new Error(mensagemSenha(error));
    await sb.rpc('marcar_senha_trocada');
    window.__senha = null;
    state.contaModo = "painel";
    state.contaAviso = "Senha trocada.";
  } catch (e) {
    state.contaErro = e.message || "Não consegui trocar a senha agora.";
  }
  state.contaSalvando = false;
  render();
}

async function publicarResposta(avaliacaoId) {
  if (emVisaoAdmin()) { state.respostaErro = SO_VER_NO_MODO_ADMIN; render(); return; }
  const texto = (window.__respostaTexto || "").trim();
  if (!texto) { state.respostaErro = "Escreva a resposta."; render(); return; }
  const c = minhaAcademia();
  const r = c && getReviews(c.id).find(x => x.id === avaliacaoId);
  if (!r) return;
  const { error } = r.resposta
    ? await sb.from('respostas').update({ texto }).eq('avaliacao_id', avaliacaoId)
    : await sb.from('respostas').insert({ avaliacao_id: avaliacaoId, texto });
  if (error) {
    state.respostaErro = "Não consegui publicar a resposta agora. Tente de novo em instantes.";
    render();
    return;
  }
  state.respondendo = null;
  state.respostaErro = "";
  window.__respostaTexto = "";
  await recarregarTudo();
}

async function apagarResposta(avaliacaoId) {
  if (!confirm("Apagar essa resposta? Ela sai da ficha na hora.")) return;
  const { error } = await sb.from('respostas').delete().eq('avaliacao_id', avaliacaoId);
  if (error) { alert("Não consegui apagar a resposta agora. Tente de novo."); return; }
  await recarregarTudo();
}

async function criarAcesso(courtId) {
  const c = [...state.allCourts, ...(state.pending || [])].find(x => x.id === courtId);
  const campo = document.getElementById("acesso-usuario");
  const usuario = ((campo && campo.value) || "").trim().toLowerCase();
  if (!c) return;
  if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(usuario)) {
    state.acessoErro = "Usuário: de 3 a 40 letras sem acento, números, ponto ou hífen.";
    render();
    return;
  }
  const senha = senhaProvisoria();
  const { error } = await sb.rpc('criar_acesso_academia', { p_academia: courtId, p_usuario: usuario, p_senha: senha });
  if (error) {
    state.acessoErro = mensagemDoBanco(error, "Não consegui criar o acesso: " + error.message);
    render();
    return;
  }
  state.acessoErro = "";
  state.acessoNovo = { academiaId: courtId, usuario, senha, mensagem: mensagemDoAcesso(c, usuario, senha, false) };
  await carregarAcessos();
  render();
}

async function novaSenhaAcesso(userId, courtId) {
  if (!confirm("Gerar uma senha provisória nova? A senha atual da academia deixa de valer, quem estiver conectado sai, e ela cria outra no próximo acesso.")) return;
  const c = [...state.allCourts, ...(state.pending || [])].find(x => x.id === courtId);
  const a = loginDaAcademia(courtId);
  const senha = senhaProvisoria();
  const { error } = await sb.rpc('nova_senha_academia', { p_user: userId, p_senha: senha });
  if (error) { state.acessoErro = "Não consegui trocar a senha: " + error.message; render(); return; }
  state.acessoErro = "";
  state.acessoNovo = { academiaId: courtId, usuario: a ? a.usuario : "", senha, mensagem: mensagemDoAcesso(c || { name: "academia", id: courtId }, a ? a.usuario : "", senha, true) };
  await carregarAcessos();
  render();
}

// Conta com outras academias perde só esta; conta só com esta é apagada.
async function removerAcesso(userId, courtId) {
  const outras = (state.acessos || []).filter(a => a.user_id === userId && a.academia_id && a.academia_id !== courtId).length;
  if (!confirm(outras
    ? `Tirar essa conta desta academia? Ela continua administrando ${outras} ${plural(outras, "outra academia", "outras academias")}. A ficha continua no site.`
    : "Remover o acesso dessa academia? Ela não entra mais na área da academia. A ficha continua no site.")) return;
  const { error } = await sb.rpc('remover_acesso_academia', courtId ? { p_user: userId, p_academia: courtId } : { p_user: userId });
  if (error) { state.acessoErro = "Não consegui remover: " + error.message; render(); return; }
  state.acessoErro = "";
  state.acessoNovo = null;
  await carregarAcessos();
  render();
}

function copiarTexto(texto, para = "da academia") {
  const avisar = () => alert(`Mensagem copiada. É só colar no WhatsApp ${para}.`);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(avisar, () => prompt("Copie a mensagem:", texto));
  } else {
    prompt("Copie a mensagem:", texto);
  }
}

  // Não segura o link: o WhatsApp abre, e o pedido fica anotado.

function nomeArquivoQr(c) {
  if (c.id === "site") return "guiatennis-qr-site";
  const limpo = (c.name || "academia").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return `guiatennis-qr-${limpo || "academia"}`;
}

function baixarQr(c, formato) {
  const svg = qrSvg(linkDaFicha(c), 1200);
  const baixa = (endereco) => {
    const a = document.createElement("a");
    a.href = endereco;
    a.download = `${nomeArquivoQr(c)}.${formato}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  if (formato === "svg") {
    const endereco = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    baixa(endereco);
    setTimeout(() => URL.revokeObjectURL(endereco), 4000);
    return;
  }
  const img = new Image();
  img.onload = () => {
    const tela = document.createElement("canvas");
    tela.width = tela.height = 1200;
    const ctx = tela.getContext("2d");
    ctx.drawImage(img, 0, 0, 1200, 1200);
    tela.toBlob((blob) => {
      const endereco = URL.createObjectURL(blob);
      baixa(endereco);
      setTimeout(() => URL.revokeObjectURL(endereco), 4000);
    }, "image/png");
  };
  img.onerror = () => alert("Não consegui montar o PNG. Baixe o SVG, que abre em qualquer editor.");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function mapCourts(results) {

function mapCardHtml(id) {
  if (!id) return "";
  const c = getResults().find(x => x.id === id);
  if (!c) return "";

  const pv = parsePriceValue(c);

function selectOnMap(id) {
  state.mapSelected = id;
  __markers.forEach(m => {
    if (!m._courtId) return;
    const el = m.getElement();
    const span = el && el.querySelector(".pin");
    if (span) span.classList.toggle("on", m._courtId === id);
  });
  const holder = document.getElementById("map-card");
  if (holder) {
    holder.innerHTML = mapCardHtml(id);
    attachMapCardEvents();
  }
}

function attachMapCardEvents() {
  const holder = document.getElementById("map-card");
  if (!holder) return;
  const close = holder.querySelector("#map-card-close");
  if (close) close.onclick = (e) => { e.stopPropagation(); selectOnMap(null); };
  holder.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openCourt(el.dataset.open);
  });
}

// O render() troca todo o HTML do app, então o mapa é remontado a cada
// desenho — guardamos centro e zoom pra ele voltar onde estava.
function mountMap(results) {
  const el = document.getElementById("map");
  if (!el) {
    if (__map) { __map.remove(); __map = null; __markers = []; }
    return;
  }
  if (!window.L) {
    el.innerHTML = `<div class="map-empty">Não consegui carregar o mapa agora. Confira a conexão e recarregue a página.</div>`;
    return;
  }
  if (__map && __map.getContainer() !== el) { __map.remove(); __map = null; __markers = []; }

  if (!__map) {
    __map = L.map(el, { zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© colaboradores do OpenStreetMap',
    }).addTo(__map);
    __map.on("moveend", () => {
      if (!__map) return;
      const c = __map.getCenter();
      state.mapCenter = [c.lat, c.lng];
      state.mapZoom = __map.getZoom();
    });
  }

  __markers.forEach(m => __map.removeLayer(m));
  __markers = [];

  const comCoord = mapCourts(results);
  // Academias praticamente no mesmo ponto (mesma rua, endereço aproximado)
  // ficam com os pinos empilhados, em vez de um esconder o outro.
  const vizinhos = {};
  const pilha = comCoord.map(c => {
    const chave = `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`;
    vizinhos[chave] = (vizinhos[chave] || 0) + 1;
    return vizinhos[chave] - 1;
  });
  comCoord.forEach((c, i) => {
    const pv = parsePriceValue(c);
    const label = isFinite(pv) ? `R$ ${pv}` : "Consultar";
    const m = L.marker([c.lat, c.lng], {
      zIndexOffset: pilha[i] * 10,
      icon: L.divIcon({
        className: "pin-wrap",
        iconSize: null,
        html: `<span class="pin ${state.mapSelected === c.id ? "on" : ""}"${pilha[i] ? ` style="transform: translate(-50%, calc(-100% - ${pilha[i] * 34}px))"` : ""}>${esc(label)}</span>`,
      }),
    }).addTo(__map);
    m._courtId = c.id;
    m.on("click", () => selectOnMap(c.id));
    __markers.push(m);
  });

  if (state.origin) {
    __markers.push(L.marker([state.origin.lat, state.origin.lng], {
      interactive: false,
      icon: L.divIcon({ className: "pin-wrap", iconSize: null, html: `<span class="pin-me"></span>` }),
    }).addTo(__map));
  }

  const sig = comCoord.map(c => c.id).join(",") + "|" + (state.origin ? `${state.origin.lat},${state.origin.lng}` : "");
  if (sig !== __mapSig || !state.mapCenter) {
    __mapSig = sig;
    const pts = comCoord.map(c => [c.lat, c.lng]);
    if (state.origin) pts.push([state.origin.lat, state.origin.lng]);
    if (pts.length > 1) __map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
    else if (pts.length === 1) __map.setView(pts[0], 14);
    else __map.setView([-23.55, -46.63], 11);
  } else {
    __map.setView(state.mapCenter, state.mapZoom || 12);
  }

  setTimeout(() => { if (__map) __map.invalidateSize(); }, 60);
  attachMapCardEvents();
}

function recomendadasGuia(todas) {
  if (RECOMENDADAS.length) {
    return RECOMENDADAS.map(id => todas.find(c => c.id === id)).filter(Boolean);
  }
  const ctx = {
    dists: todas.map(c => c.distanceKm),
    rates: todas.map(c => c.appCount ? c.appAvg : null),
    prices: todas.map(c => { const v = parsePriceValue(c); return isFinite(v) ? v : null; }),

    .map(c => ({ c, nota: recoScore(c, ctx) + (courtPhotos(c).length ? 10 : 0) + (c.endereco ? 4 : 0) }))
    .sort((a, b) => b.nota - a.nota)
    .slice(0, 4)
    .map(x => x.c);
}

function abaDoParceiro(aba) {
  // "Conta" virou o Perfil (05/10/2026); links antigos continuam abrindo.
  if (aba === "conta") return "perfil";
  if (PC_PUBLICAS.includes(aba) || PC_PRIVADAS.includes(aba) || PC_ADMIN.includes(aba)) return aba;
  return "inicio";
}

// Vai para uma página do GuiaTennis Parceiros. Página de quem está logado
// sem login cai no "Entrar" e volta para ela depois.
function irParceiros(aba, opcoes = {}) {
  aba = abaDoParceiro(aba);
  // Do site dos jogadores, o Parceiros abre na aba dele (05/10/2026).
  if (state.loaded && state.page !== "parceiros" && !opcoes.mesmaAba) {
    abrirNaAba(urlDosParceiros(aba, aba === "cadastro" && state.pcReivindicar ? "academia=" + encodeURIComponent(state.pcReivindicar) : ""), ABA_PARCEIROS);
    return;
  }
  aba = abaDoAdminNoParceiros(aba);
  if (aba === "inicio" && contaAcademia && !opcoes.publico) aba = "painel";
  if (PC_PRIVADAS.includes(aba) && !contaAcademia) {
    state.parceirosDepois = aba;
    aba = "entrar";
  }
  // Entrar/Cadastro aberto de novo começa pelo e-mail.
  if ((aba === "cadastro" || aba === "entrar") && state.parceirosAba !== aba) { state.pcEmailPasso = "email"; state.loginError = ""; state.pcContaErro = ""; }
  state.page = "parceiros";
  state.parceirosAba = aba;
  state.selected = null;
  state.showMenu = false;
  state.pcMenu = false;
  state.showLogin = false;
  state.avisoLink = "";
  if (aba !== "perfil") state.contaModo = "painel";
  if ((aba === "painel" || aba === "desempenho") && temAcademia() && acessoCompleto()) carregarNumeros();
  if ((aba === "painel" || aba === "pessoas") && temAcademia() && acessoCompleto()) { carregarPedidosDeAcesso(); carregarPessoas(); }
  syncUrl(!opcoes.substituir);
  render();
  if (opcoes.ancora) {
    const alvo = document.getElementById(opcoes.ancora);
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    window.scrollTo(0, 0);
  }
}
// Os números da academia, pela função do banco (supabase/migrations/
// 20260930140000_numeros_da_academia.sql). O banco corta o período pelo
// plano: pedir 90 dias no Básico devolve 30.
async function carregarNumeros(dias) {
  const pedido = dias === undefined ? (state.numerosDias ?? 30) : dias;
  state.numeros = { ...(state.numeros || {}), carregando: true, erro: "" };
  try {
    const r = await sb.rpc('numeros_da_academia', { p_dias: pedido });
    if (r.error || !r.data) throw r.error || new Error("sem dados");
    state.numeros = { dados: r.data, carregando: false, erro: "" };
    state.numerosDias = r.data.dias;
  } catch (e) {
    diag(`números da academia: ${e && e.message}`);
    state.numeros = { dados: null, carregando: false, erro: "Não consegui carregar os números agora. Tente de novo em instantes." };
  }
  if (state.page === "parceiros") render();
}

function numeroBonito(n) {
  return Number(n || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
}
function diaCurto(iso) {
  const [a, m, d] = String(iso).slice(0, 10).split("-");
  return `${d}/${m}`;
}
// Variação contra o período anterior, como "+20%" do Google Business.
function variacao(agora, antes) {
  if (antes === undefined || antes === null) return "";
  if (!antes && !agora) return `<span class="pc-var">igual ao período anterior</span>`;
  if (!antes) return `<span class="pc-var sobe">${icon('chevron', 12, 'var(--green)')} novo no período</span>`;
  const pct = Math.round(((agora - antes) / antes) * 100);
  if (pct === 0) return `<span class="pc-var">igual ao período anterior</span>`;
  return `<span class="pc-var ${pct > 0 ? "sobe" : "desce"}">${pct > 0 ? "+" : ""}${pct}% contra o período anterior</span>`;
}

// Número "limpo" para o topo do eixo: 4, 5, 10, 20, 50…
function topoDoEixo(max) {
  if (max <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  for (const m of [1, 2, 5, 10]) if (m * p >= max) return m * p;
  return 10 * p;
}

// Colunas de uma série só (visitas ou contatos), uma embaixo da outra — nunca
// dois eixos no mesmo gráfico. Acima de 92 dias, soma por semana. Tocar ou
// passar o dedo numa coluna mostra o dia e o valor na linha de cima.
function graficoColunas(pontos, chave, cor, titulo, unidade) {
  let barras = pontos.map(p => ({ rotulo: diaCurto(p.dia), valor: p[chave] || 0 }));
  let porSemana = false;
  if (barras.length > 92) {
    porSemana = true;
    const semanas = [];
    pontos.forEach((p, i) => {
      if (i % 7 === 0) semanas.push({ rotulo: `semana de ${diaCurto(p.dia)}`, valor: 0 });
      semanas[semanas.length - 1].valor += p[chave] || 0;
    });
    barras = semanas;
  }
  const max = Math.max(0, ...barras.map(b => b.valor));
  const topo = topoDoEixo(max);
  const total = barras.reduce((s, b) => s + b.valor, 0);
  return `
    <figure class="pc-graf" data-graf>
      <figcaption>
        <strong>${esc(titulo)}${porSemana ? " por semana" : " por dia"}</strong>
        <span class="pc-graf-leitura" aria-live="polite">Total ${numeroBonito(total)} · toque numa coluna</span>
      </figcaption>
      <div class="pc-graf-area">
        <div class="pc-graf-eixo" aria-hidden="true"><span>${numeroBonito(topo)}</span><span>${numeroBonito(topo / 2)}</span><span>0</span></div>
        <div class="pc-graf-barras" style="--n:${barras.length}">
          ${barras.map(b => `<button type="button" class="pc-barra" data-tip="${esc(b.rotulo)}: ${numeroBonito(b.valor)} ${esc(unidade)}" aria-label="${esc(b.rotulo)}: ${numeroBonito(b.valor)} ${esc(unidade)}"><i style="height:${b.valor ? Math.max(2, (b.valor / topo) * 100) : 0}%;background:${cor}"></i></button>`).join("")}
        </div>
      </div>
      <div class="pc-graf-x"><span>${esc(barras[0] ? barras[0].rotulo : "")}</span><span>${esc(barras.length ? barras[barras.length - 1].rotulo : "")}</span></div>
    </figure>`;
}

// Barras deitadas com o nome e o número em texto (origem, aparelho, bairro).
function listaBarras(itens, cor) {
  if (!itens || !itens.length) return `<p class="pc-vazio">Ainda sem dados no período.</p>`;
  const max = Math.max(1, ...itens.map(i => i.n));
  return `
    <div class="pc-lista">
      ${itens.map(i => `
        <div class="pc-lista-i">
          <span class="pc-lista-n">${esc(i.nome)}</span>
          <span class="pc-lista-bar"><i style="width:${Math.max(2, (i.n / max) * 100)}%;background:${cor || "var(--green)"}"></i></span>
          <strong>${numeroBonito(i.n)}</strong>
        </div>`).join("")}
    </div>`;
}

// do Google Business Profile e o "ver como a propriedade" do Booking, o

// admin do site); o que é da academia (responder avaliação, pedir plano,
// incluir pessoa, dados de contato) fica só para ver. Nada muda no banco:
// é a conta do admin, com as funções de admin.
const ADMIN_VE_KEY = "guiatennis_admin_ve_academia";
function emVisaoAdmin() {
  return !!(isAdmin && contaAcademia && contaAcademia.visaoAdmin);
}
// Página privada aberta pelo admin: a academia que ele estava vendo, ou a
// escolha da academia. Para quem não é admin, "ver" é a apresentação.
function abaDoAdminNoParceiros(aba) {
  if (aba === "ver") return isAdmin ? "ver" : "inicio";
  if (!isAdmin || contaAcademia) return aba;
  if (!PC_PRIVADAS.includes(aba) && aba !== "entrar") return aba;
  let id = null;
  try { id = sessionStorage.getItem(ADMIN_VE_KEY); } catch {}
  return id && montarVisaoAdmin(id) ? (aba === "entrar" ? "painel" : aba) : "ver";
}
function montarVisaoAdmin(id) {
  const a = todasAsFichas().find(c => c.id === id);
  if (!a) return false;
  contaAcademia = {
    userId: "admin", academiaId: a.id, usuario: EMAIL_ADMIN, login: EMAIL_ADMIN, nome: "GuiaTennis (admin)",
    tratamento: "", cargo: "Admin do GuiaTennis", email: EMAIL_ADMIN, whatsapp: "", cnpj: "", recebeRelatorio: false,
    termosAceitos: true, dadosCompletos: true, senhaTrocada: true, papel: "principal",
    pedidoAcademiaId: null, pedidoNome: "", pedidoEm: null, pedidoDestino: "", emailConfirmado: true,
    avisosPorEmail: false, temAvisos: false, visaoAdmin: true, pedidos: [],
    // Sempre a ficha de agora (pausar e mudar o plano aparecem na hora).
    get academias() {
      const c = todasAsFichas().find(x => x.id === this.academiaId);
      return c ? [{ id: c.id, nome: c.name, papel: "principal", status: c.status || "published", pausada: !!c.pausada,
        plano: c.plano || "basico", bairro: c.bairro || "", cidade: c.cidade || "", pausadaAte: c.pausadaAte || null,
        pausadaPelaAcademia: !!c.pausadaPelaAcademia }] : [];
    },
  };
  try { sessionStorage.setItem(ADMIN_VE_KEY, a.id); } catch {}
  state.numeros = null;
  state.pessoas = null;
  state.pedidosDeAcesso = null;
  return true;
}
const SO_VER_NO_MODO_ADMIN = "No modo admin, isso é só para ver. Para mudar, entre com a conta da academia.";
const RPCS_SO_DA_ACADEMIA = ["adicionar_pessoa", "pedir_plano", "pedir_para_administrar", "cancelar_meu_pedido",
  "mudar_avisos_dos_parceiros", "completar_meu_acesso", "confirmar_meu_codigo", "confirmar_meu_email",
  "contestar_academia", "marcar_senha_trocada", "criar_minha_conta", "ativar_conta_de_jogador", "abrir_minha_academia"];
async function rpcNaVisaoAdmin(nome, a) {
  const id = contaAcademia.academiaId;
  if (RPCS_SO_DA_ACADEMIA.includes(nome)) return { data: null, error: { message: SO_VER_NO_MODO_ADMIN, code: "admin" } };
  if (nome === "numeros_da_academia") return rpcDoBanco(nome, { ...a, p_academia: id });
  if (nome === "pessoas_da_minha_academia") {
    const r = await rpcDoBanco("acessos_das_academias");
    if (r.error) return r;
    return { error: null, data: (r.data || []).filter(x => x.academia_id === id)
      .sort((x, y) => (y.papel === "principal") - (x.papel === "principal"))
      .map(x => ({ user_id: x.user_id, nome: x.nome_responsavel, email: x.email || x.usuario, papel: x.papel,
        dados_completos_em: x.dados_completos_em, ultimo_acesso: x.ultimo_acesso, sou_eu: false })) };
  }
  if (nome === "pedidos_para_minha_academia") {
    const r = await rpcDoBanco("pedidos_de_acesso_admin");
    if (r.error) return r;
    return { error: null, data: (r.data || []).filter(x => x.academia_id === id)
      .map(x => ({ user_id: x.user_id, nome: x.nome_responsavel, email: x.email || x.usuario, cargo: x.cargo, pedido_em: x.pedido_em })) };
  }
  if (nome === "responder_pedido_de_acesso")
    return rpcDoBanco(a.p_aceitar ? "aprovar_pedido_de_acesso" : "recusar_pedido_de_acesso", { p_user: a.p_user, p_academia: id });
  if (nome === "remover_pessoa") return rpcDoBanco("remover_acesso_academia", { p_user: a.p_user, p_academia: id });
  if (nome === "pausar_minha_academia") {
    const pausar = !!a.p_pausar;
    const { error } = await sb.from('academias').update({ pausada: pausar, pausada_ate: pausar ? (a.p_ate || null) : null }).eq('id', a.p_academia || id);
    return { data: null, error };
  }
  return rpcDoBanco(nome, a);
}

// Cadastro no modelo do Google Business Profile: primeiro procura a academia
// (muitas já estão no guia); se achou, pede o acesso; se não, cadastra.
function pcResultadosBusca() {
  const termos = slugTexto(state.pcBusca || "").split("-").filter(Boolean);
  const escolhida = state.pcSelecionada;
  const sugeridaPeloEmail = contaAcademia && !contaAcademia.academiaId ? academiaDoEmail(contaAcademia.email) : null;
  const sugerida = sugeridaPeloEmail && !ehDaMinhaConta(sugeridaPeloEmail) ? sugeridaPeloEmail : null;
  let lista = [];
  if (termos.join("").length >= 2) {
    // Nome, bairro e cidade: "quadra moema" acha a Quadra Locação de Moema.
    lista = state.allCourts.filter(c => {
      const onde = slugTexto([c.name, c.bairro, c.cidade].filter(Boolean).join(" "));
      return termos.every(t => onde.includes(t));
    }).slice(0, 8);
  }
  const fixas = [sugerida, escolhida && state.allCourts.find(c => c.id === escolhida)].filter(Boolean);
  fixas.reverse().forEach(c => { if (!lista.some(x => x.id === c.id)) lista.unshift(c); });
  if (!lista.length) {
    return termos.join("").length >= 2
      ? `<p class="pc-vazio">Não achei nenhuma academia com esse nome no guia. Cadastre a sua logo abaixo.</p>`
      : "";
  }
  return `
    <div class="pc-escolhas" role="radiogroup" aria-label="Academias encontradas">
      ${lista.map(c => ehDaMinhaConta(c) ? `
        <div class="pc-escolha pc-escolha-minha" role="radio" aria-checked="false" aria-disabled="true">
          ${icon('check', 18, 'var(--green)')}
          <span class="pc-escolha-txt">
            <strong>${esc(c.name)}</strong>
            <span>Já é sua · <button type="button" class="pc-linha-link" data-abrir-academia="${c.id}">abrir</button></span>
          </span>
        </div>` : `
        <button type="button" class="pc-escolha ${escolhida === c.id ? "on" : ""}" role="radio" aria-checked="${escolhida === c.id}" data-pc-selecionar="${c.id}">
          <span class="pc-escolha-radio"></span>
          <span class="pc-escolha-txt">
            <strong>${esc(c.name)}</strong>
            <span>${esc([c.bairro, c.cidade].filter(Boolean).join(", ") || c.endereco || "")}${sugerida && sugerida.id === c.id ? " · achamos pelo seu e-mail" : ""}</span>
          </span>
        </button>`).join("")}
    </div>`;
}
// Domínios de e-mail de todo mundo: não dizem de qual academia a pessoa é.
const EMAIL_GERAL = ["gmail.com", "googlemail.com", "hotmail.com", "hotmail.com.br", "outlook.com",
  "outlook.com.br", "live.com", "msn.com", "yahoo.com", "yahoo.com.br", "icloud.com", "me.com",
  "uol.com.br", "bol.com.br", "terra.com.br", "ig.com.br", "globo.com", "globomail.com",
  "proton.me", "protonmail.com"];
function dominioDoSite(site) {
  try { return new URL(/^https?:/i.test(site) ? site : "https://" + site).hostname.replace(/^www\./, "").toLowerCase(); }
  catch { return ""; }
}
// "O próprio site já localiza": e-mail com o domínio do site de uma
// academia do guia (contato@academiax.com.br ↔ academiax.com.br).
function academiaDoEmail(email) {
  const dominio = String(email || "").split("@")[1];
  if (!dominio || EMAIL_GERAL.includes(dominio.toLowerCase())) return null;
  return state.allCourts.find(c => { const site = (c.integral || c).site; return site && dominioDoSite(site) === dominio.toLowerCase(); }) || null;
}

// Barra de etapas com cara de tênis (pedido do Breno em 02/10/2026): uma
// faixa de quadra com a linha do saque no meio, uma marca branca em cada
// etapa e a bolinha andando até a etapa de agora, deixando o rastro
// dourado. Serve ao cadastro do GuiaTennis Parceiros e à conta do jogador,
// como a barra "E-mail · Senha · Economizar" do trivago.
function trilhaTenis(etapas, atual, rotulo) {
  const n = etapas.length;
  const ate = Math.max(0, Math.min(atual, n - 1));
  const feito = ate / (n - 1) * 100;
  const bola = `<svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="#CEDC39" stroke="#A8B62C" stroke-width="1.5"/>
      <path d="M7.3 7.3A20 20 0 0 1 7.3 32.7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M32.7 7.3A20 20 0 0 0 32.7 32.7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </svg>`;
  return `
    <div class="pc-progresso-etapas trilha" role="list" aria-label="${esc(rotulo || "Etapas")}">
      <div class="pc-trilho trilha-quadra">
        <div class="trilha-pista">
          <i style="width:${feito}%"></i>
          ${etapas.map((t, i) => `<span class="pc-trilho-ponto ${i <= ate ? "feito" : ""}" style="left:${i / (n - 1) * 100}%"></span>`).join("")}
          <span class="trilha-bola" style="left:${feito}%">${bola}</span>
        </div>
      </div>
      <ol style="grid-template-columns:repeat(${n}, 1fr)">
        ${etapas.map((t, i) => `<li role="listitem" class="${i < ate ? "feito" : i === ate ? "agora" : ""}" ${i === ate ? 'aria-current="step"' : ""}>${i < ate ? "✓ " : ""}${esc(t)}</li>`).join("")}
      </ol>
    </div>`;
}

function pcEtapas(atual) {
  return trilhaTenis(["Dados de contato", "Sua academia", "Início"], atual, "Etapas do cadastro");
}

// "(11) •••••-0002": o WhatsApp da ficha, sem mostrar o número inteiro.
function telefoneEscondido(telefone) {

  return `(${d.slice(0, 2)}) ${d.length === 11 ? "•••••" : "••••"}-${d.slice(-4)}`;

  if (p.destino === "responsavel") {
    return `

    return `

            <label class="consent-row">
              <input type="checkbox" id="pc-conta-aceite" ${f.aceite ? "checked" : ""} />

            <button class="btn-primary pc-botao-cheio" id="pc-criar-conta" ${state.pcContaSalvando ? "disabled" : ""}>${state.pcContaSalvando ? bolaGirando(16) + " Salvando..." : "Salvar e continuar"}</button>` : ""}

  // Conta sem academia: os pedidos feitos (com o código), ou escolher a

  if (escolhida && !state.pcSelecionada) state.pcSelecionada = escolhida.id;

  if (sugerida && state.pcSelecionada === undefined && !meusPedidos().some(p => p.academiaId === sugerida.id)) state.pcSelecionada = sugerida.id;

// Pedido do Breno (06/10/2026): a declaração de quem pede vira caixinha
// obrigatória, como o "Li e concordo" dos sites grandes. O banco guarda
// quando ela foi marcada (pedidos_de_acesso.declarou_em, SQL
// 20261006130000): é a prova de que a pessoa declarou e responde pelo que
// publicar. Quem mentir responde por isso. Desde 07/10/2026, sem
// responsável e sem disputa, a declaração e o e-mail confirmado bastam; o
// código no WhatsApp da academia é só para a disputa.
const TEXTO_DECLARACAO = "Declaro que estou autorizado(a) pela academia a administrar a ficha dela no GuiaTennis e que respondo pelas informações que publicar.";
const TEXTO_DECLARACAO_CADASTRO = "Declaro que estou autorizado(a) pela academia a cadastrá-la no GuiaTennis e que respondo pelas informações que publicar.";
function caixaDeDeclaracao() {
  return `
    <label class="consent-row pc-declaro ${state.pcDeclaroErro ? "falta" : ""}">

}

// Entrar e Cadastro são a mesma tela, que começa pelo e-mail.
function pcEntrar() {

function pcPrimeiroAcesso() {
  return `

}

function pcSituacao(c) {
  const pausada = c.pausada && (!c.pausadaAte || new Date(c.pausadaAte) > new Date());
  const noAr = c.status !== "pending" && !pausada;
  const ate = c.pausadaAte ? ` até ${dataCurta(c.pausadaAte)}` : "";
  const texto = c.status === "pending" ? "Em análise pelo GuiaTennis: ainda não aparece no site."
    : pausada && c.pausadaPelaAcademia ? `Pausada por vocês${ate}: não aparece na busca agora. Para voltar, use Suas academias.`
    : pausada ? "Pausada pelo GuiaTennis: não aparece na busca agora."
    : c.confirmada ? "No ar, com as informações confirmadas por vocês."
    : "No ar como ficha básica. Revise e salve a ficha para confirmar as informações.";
  const ok = noAr && c.confirmada;
  // Tudo certo só aparece logo depois de a ficha ir ao ar ou ser
  // atualizada (1 dia, pedido de 07/10/2026; antes 3); o que pede ação
  // aparece sempre (06/10/2026).
  const recente = [c.criadaEm, contaAcademia && contaAcademia.fichaAtualizadaEm, state.fichaSalvaEm]
    .some(t => t && Date.now() - new Date(t).getTime() < 86400000);
  // Ficha parada há mais de 3 meses: o jogador vê a data ("atualizada em
  // junho de 2026"), então o painel lembra de conferir e salvar — como o
  // "Confirme as informações da sua empresa" do Google (07/10/2026).
  const velha = ok && !recente && c.dadosAtualizadosEm && Date.now() - new Date(c.dadosAtualizadosEm).getTime() > 90 * 86400000;
  if (velha) return `<p class="conta-situacao">${icon('info', 14, 'var(--muted)')} <span>Na ficha, o jogador vê que ela foi ${esc(quandoFoiAtualizada(c.dadosAtualizadosEm))}. Confira os preços e o horário e salve a ficha: salvar, mesmo sem mudar nada, mostra que está tudo certo.</span></p>`;
  if (ok && !recente) return "";
  return `<p class="conta-situacao ${ok ? "ok" : ""}">${icon(ok ? 'check' : 'info', 14, ok ? 'var(--green)' : 'var(--muted)')} <span>${texto}</span></p>`;
}

function pcDesempenho() {
  const c = minhaAcademia();
  if (!c) return pcSemFicha();

  const plano = planoAtual();
  const periodos = [
    { dias: 7, t: "7 dias", p: ["completo", "premium"] },
    { dias: 30, t: "30 dias", p: ["basico", "completo", "premium"] },
    { dias: 90, t: "90 dias", p: ["completo", "premium"] },
    { dias: 0, t: "Desde o começo", p: ["premium"] },
  ];
  const atual = d ? d.dias : state.numerosDias;
  if (!veNumeros()) return `
    <section class="pc-pagina">
      <p class="pc-eyebrow">${esc(c.name)}</p>
      <h1 class="display">Desempenho</h1>
      ${blocoTrancado(...TRANCADO_NUMEROS)}

  return `

      <div class="chip-row pc-periodos" role="group" aria-label="Período">
        ${periodos.map(p => p.p.includes(plano)

          : `<button type="button" class="chip small pc-chip-trancado" data-pc="plano" title="Disponível em outro plano">${icon('key', 12, 'var(--muted)')} ${p.t}</button>`).join("")}

      ${n.erro ? `<p class="pc-vazio">${esc(n.erro)} <button type="button" class="pc-link-btn" data-pc-dias="${atual ?? 30}">Tentar de novo</button></p>` : ""}

          </div>` : blocoTrancado("completo", "Dia a dia, canais e de onde vieram", "Veja em que dias a ficha mais aparece, por onde chamam vocês e de onde vêm as visitas: Instagram, Google, link compartilhado.")}

function pcFicha() {

async function carregarPedidosDeAcesso() {
  if (!souPrincipal()) { state.pedidosAcesso = []; return; }
  try {
    const r = await sb.rpc('pedidos_para_minha_academia');
    state.pedidosAcesso = r.error ? [] : (r.data || []);
  } catch { state.pedidosAcesso = []; }
  if (state.page === "parceiros") render();
}
async function responderPedidoDeAcesso(userId, aceitar) {
  state.pedidoAcessoErro = "";
  const r = await sb.rpc('responder_pedido_de_acesso', { p_user: userId, p_aceitar: aceitar });
