<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

     automático do Android inverte as cores e desmonta o visual. -->
<meta name="color-scheme" content="light" />
<title>GuiaTennis — quadras e academias de tênis perto de você</title>
<meta name="theme-color" content="#1F4D3D">
<link rel="canonical" href="https://guiatennis.com.br/" id="link-canonical">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Ache e compare quadras e academias de tênis perto de você: preço por hora, estrutura, avaliações e contato direto com a academia.">
<meta property="og:title" content="GuiaTennis">
<meta property="og:description" content="Ache e compare quadras e academias de tênis perto de você.">

<meta name="twitter:description" content="Ache e compare quadras e academias de tênis perto de você.">
<meta name="twitter:image" content="https://guiatennis.com.br/og-image.png">
<meta property="og:url" content="https://guiatennis.com.br">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script type="application/ld+json" id="ld-academia"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F4EC;
    --bg-alt: #EFEADD;
    --card: #FFFFFF;
    --border: #E1DACB;
    --green: #1F4D3D;
    --green-light: #2E6B54;
    --gold: #B8933F;
    --gold-light: #D8B865;
    --text: #211F1A;
    --muted: #7A7362;
    --muted-dark: #A79F8C;
    --red: #A8462C;
  }
  * { box-sizing: border-box; }
  .ficha-basica { display: flex; gap: 6px; align-items: flex-start; margin: 10px 0 0; padding: 8px 10px; background: var(--bg-alt); border-radius: 10px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .ficha-basica svg { flex-shrink: 0; margin-top: 2px; }
  .ficha-dono { margin-top: 14px; }
  .ficha-dono .inline-link { font-size: inherit; font-weight: 700; }
  /* Área da academia */
  .conta-banner { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; background: var(--green-light); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; }
  .conta-banner button { background: none; border: none; color: #fff; text-decoration: underline; cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }
  .conta-rotulo { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  .conta-situacao { display: flex; gap: 7px; align-items: flex-start; margin: 12px 0 0; padding: 9px 11px; background: var(--bg-alt); border-radius: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .conta-situacao.ok { background: var(--green-soft); color: var(--green); }
  .conta-situacao svg, .conta-aviso svg { flex-shrink: 0; margin-top: 1px; }
  .conta-aviso { display: flex; gap: 7px; align-items: center; margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--green); }
  .conta-faltas { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .conta-faltas-t { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  .conta-falta { border: 1px dashed var(--muted-dark); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .conta-revs { grid-template-columns: 1fr !important; }
  .conta-dados { background: var(--bg-alt); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .conta-dados p { margin: 2px 0; overflow-wrap: anywhere; }
  .conta-acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .conta-acoes .cta-btn { flex: 1 1 140px; width: auto; margin: 0; }
  .conta-sair-link { display: block; margin: 18px auto 0; background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; font-family: inherit; }
  .dono-box { background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 14px; padding: 14px; }
  .dono-texto { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
  .rev-resp { margin-top: 12px; padding: 10px 12px; background: var(--bg-alt); border-left: 3px solid var(--green); border-radius: 0 10px 10px 0; }
  .rev-resp-t { margin: 0; font-size: 12px; font-weight: 700; color: var(--green); }
  .rev-resp-texto { margin: 4px 0 2px; font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .rev-resp .inline-link { display: block; margin-top: 6px; color: var(--red); }
  .rev-resp-links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
  .rev-resp-links .inline-link { font-size: 13px; font-weight: 700; }
  .rev-resp-form { margin-top: 12px; }
  .rev-resp-acoes { display: flex; gap: 8px; margin-top: 8px; }
  .rev-resp-acoes .cta-btn { flex: 1; width: auto; margin: 0; padding: 9px; font-size: 13px; }
  .admin-pago-box.acesso-admin { flex-direction: column; align-items: stretch; gap: 8px; margin-right: 0; }
  .acesso-rotulo { font-weight: 700; }
  .acesso-erro { color: var(--red); }
  .acesso-novo { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--green-line); border-radius: 10px; padding: 10px; }
  .acesso-novo strong { font-size: 15px; letter-spacing: 0.04em; user-select: all; }
  .admin-pago-box button.acesso-remover { background: var(--red); }
  .acesso-item { display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer; color: var(--text); }
  .acesso-item .pending-name, .acesso-item .pending-detail { display: block; }
  /* Academia sem foto: nada no lugar da foto, o texto ocupa o espaço. */
  .cmp-add.sem-foto { grid-template-columns: minmax(0, 1fr) auto; }
  .ht-viz-c.sem-foto { grid-template-columns: minmax(0, 1fr) auto; }
  .mini.sem-foto .mini-badge { position: static; display: inline-block; margin: 12px 0 0 12px; }
  .rcard-tag.solto { position: static; display: inline-block; margin: 0 6px 8px 0; }
  .footnote a, .ficha-dono a { color: var(--green); font-weight: 700; }
  .sf-col a.contato-link { display: flex; align-items: center; gap: 7px; }
  .ba-nota a { color: var(--gold-light); font-weight: 700; text-decoration: underline; }
  .mapa-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .mapa-acoes .cta-btn { flex: 1 1 auto; width: auto; margin: 0; padding: 10px 12px; font-size: 13px; }
  .faixa-banco-teste { background: var(--gold-light); color: var(--text); font-size: 12px; font-weight: 700; text-align: center; padding: 6px 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--fonte-texto); font-weight: 400; line-height: 1.55; font-size: 15px;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1;
  }
  input, select, textarea, button { font-family: inherit; }
  .display { font-family: var(--fonte-titulo); }
  .container { max-width: 480px; margin: 0 auto; min-height: 100vh; }

  .admin-banner { background: var(--green); color: #fff; font-weight: 600; font-size: 12px; text-align: center; padding: 6px; letter-spacing: 0.07em; text-transform: uppercase; }

  .header { padding: 32px 20px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  .title { font-size: 34px; font-weight: 700; line-height: 1.05; margin: 0; color: var(--green); }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .logo-mark { flex-shrink: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  .btn-primary { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-family: var(--fonte-texto); font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 10px; }
  .status-error { color: var(--red); }
  .status-info { color: var(--muted); }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { font-family: var(--fonte-texto); font-weight: 600; border-radius: 999px; padding: 6px 13px; font-size: 13px; border: 1px solid var(--border); background: var(--card); color: var(--green); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .chip.small { padding: 5px 11px; font-size: 12px; }
  .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .results { padding: 16px 20px 96px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 0; }
  .footer { text-align: center; padding: 24px 20px 8px; }
  .footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .footer span { color: var(--muted); font-size: 12px; }
  .footer-copy { color: var(--muted-dark); font-size: 12px; margin-top: 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; box-shadow: 0 1px 3px rgba(33,31,26,0.05); }
  .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.35); border: none; border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .compare-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.45); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .compare-btn.active { background: var(--green); border-color: var(--green); }
  .sheet-compare-btn { position: absolute; top: 16px; right: 100px; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .sheet-compare-btn.active { background: var(--green); border-color: var(--green); }
  /* barra de abas do rodapé */
  /* aviso de quantas academias estão na comparação, no botão do menu e no
     próprio item do menu — já que não há mais barra no rodapé */
  .menu-btn { position: relative; }
  .menu-conta { position: absolute; top: -9px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--green-dark); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card); box-sizing: content-box; }
  .menu-item-conta { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--green); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* aba Comparar */
  .cmp-pagina { padding: 18px 20px 24px; }
  .cmp-titulo { font-size: 26px; font-weight: 700; margin: 0; }
  .cmp-sub-topo { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
  .cmp-vazio { font-size: 14px; color: var(--muted); background: var(--bg-alt); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 18px; text-align: center; }
  .cmp-add-lista { display: grid; gap: 10px; }
  .cmp-add { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  .cmp-add.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .cmp-add-foto { width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; border: none; padding: 0; cursor: pointer; }
  .cmp-add-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-add-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .cmp-add-n { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .cmp-add-l { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-add-p { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 3px; }
  .cmp-add-p.sem-valor { font-size: 13px; }
  .cmp-add-btn { flex-shrink: 0; width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--green); background: var(--card); color: var(--green); font-size: 20px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .cmp-add.on .cmp-add-btn { background: var(--green); color: #fff; }
  /* barra de vagas: o cabeçalho da comparação, igual aos comparadores de produto */
  .cmp-vagas-barra { position: sticky; top: 0; z-index: 12; background: var(--bg); margin: 16px -20px 0; padding: 12px 20px 10px; border-bottom: 1px solid var(--border); }
  .cmp-vagas { display: flex; gap: 8px; }
  .cmp-vaga { position: relative; flex: 1 1 0; min-width: 0; min-height: 96px; border: 1px dashed var(--border); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 8px 6px; font-family: inherit; cursor: pointer; }
  .cmp-vaga.on { border-style: solid; border-color: var(--green); cursor: default; }
  .cmp-vaga-mais { font-size: 24px; font-weight: 700; color: var(--green); line-height: 1; }
  .cmp-vaga-add { font-size: 11px; font-weight: 700; color: var(--green); }
  .cmp-vaga-foto { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }
  .cmp-vaga-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-vaga-n { font-size: 11px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cmp-vaga-x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 999px; border: none; background: var(--bg-alt); color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer; font-family: inherit; }
  .cmp-vagas-n { font-size: 11px; color: var(--muted); margin: 8px 0 0; text-align: center; }
  .cmp-dica { font-size: 14px; color: var(--muted); margin: 18px 0 0; text-align: center; line-height: 1.45; }

  /* tabela comparativa: uma linha por característica, uma coluna por academia */
  .ct-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 16px; scrollbar-width: thin; }
  .ct-grade { display: grid; grid-template-columns: 104px repeat(var(--cols), minmax(132px, 1fr)); min-width: min-content; }
  .ct-secao { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); background: var(--bg-alt); padding: 8px 10px; margin-top: 10px; border-radius: 8px; }
  .ct-rot { position: sticky; left: 0; z-index: 2; background: var(--bg); box-shadow: 6px 0 6px -6px rgba(33,31,26,0.14); font-size: 12px; font-weight: 700; color: var(--muted); padding: 11px 10px 11px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .ct-cel { position: relative; font-size: 13px; color: var(--text); padding: 11px 28px 11px 10px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); line-height: 1.35; display: flex; align-items: center; }
  .ct-cel.melhor { background: rgba(31,77,58,0.07); font-weight: 700; }
  .ct-win { position: absolute; top: 11px; right: 8px; display: inline-flex; }
  .ct-acao { border-bottom: none; padding-top: 14px; }
  .ct-wa { display: inline-flex; align-items: center; gap: 6px; background: var(--green); color: #fff; border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 700; text-decoration: none; }
  .ct-sem { font-size: 12px; color: var(--muted); }
  .ct-cel-sem { color: var(--muted); font-weight: 400; }

  /* seletor de academia (folha) */
  .cmp-abas { display: flex; gap: 6px; margin-top: 14px; }
  .cmp-aba { flex: 1 1 0; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 9px 6px; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .cmp-aba.on { background: var(--green); border-color: var(--green); color: #fff; }
  .cmp-pick-lista { display: grid; gap: 8px; margin-top: 12px; max-height: 46vh; overflow-y: auto; }

  .cmp-col { flex: 0 0 240px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .cmp-photo { height: 120px; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }
  .cmp-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cmp-name { font-size: 15px; font-weight: 700; padding: 10px 12px 2px; }
  .cmp-sub { font-size: 12px; color: var(--muted); padding: 0 12px 10px; }
  .cmp-row { border-top: 1px solid var(--border); padding: 8px 12px; }
  .cmp-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .cmp-val { font-size: 13px; color: var(--text); margin-top: 2px; }
  .cmp-remove { width: 100%; background: none; border: none; border-top: 1px solid var(--border); padding: 9px; font-size: 12px; color: var(--red); cursor: pointer; }
  .decide-box { margin-top: 20px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .decide-title { font-size: 17px; font-weight: 700; color: var(--text); margin: 0; }
  .decide-sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .decide-result { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  .decide-verdict { font-size: 20px; font-weight: 700; color: var(--green); margin: 0; }
  .decide-why { font-size: 13px; color: var(--text); margin: 6px 0 0; line-height: 1.45; }
  .decide-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .decide-pos { font-size: 13px; font-weight: 700; color: var(--gold); width: 24px; flex-shrink: 0; }
  .decide-name { font-size: 14px; font-weight: 700; margin: 0; }
  .decide-tags { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .decide-score { font-size: 15px; font-weight: 700; color: var(--green); flex-shrink: 0; }
  .decide-notes-echo { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 8px; padding: 8px 10px; margin: 4px 0 0; white-space: pre-wrap; }
  .note-hit { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; margin-top: 6px; background: var(--card); border-left: 3px solid var(--border); }
  .note-hit strong { font-size: 13px; text-transform: capitalize; flex-shrink: 0; }
  .note-hit span { font-size: 12px; color: var(--muted); }
  .note-hit-some { border-left-color: var(--green); }
  .note-hit-all { border-left-color: var(--gold); }
  .note-hit-none { border-left-color: var(--red); }
  .confirmar-box { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
  .confirmar-txt { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 10px; }
  .confirmar-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .decidida-box { margin-top: 16px; background: var(--green); border-radius: 14px; padding: 16px; }
  .decidida-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin: 0; }
  .decidida-name { font-size: 22px; font-weight: 700; color: #fff; margin: 6px 0 0; }
  .decidida-end { font-size: 13px; color: rgba(255,255,255,0.75); margin: 4px 0 0; }
  .decidida-box .field-label { color: rgba(255,255,255,0.8); }
  .decidida-box .cta-btn { width: 100%; }
  .nav-link-dark { background: rgba(255,255,255,0.12) !important; border-color: rgba(255,255,255,0.35) !important; color: #fff !important; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stat-card { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--green); margin: 0; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.07em; }

  .decidida-voltar { width: 100%; background: none; border: none; color: rgba(255,255,255,0.75); text-decoration: underline; font-size: 13px; padding: 12px 0 2px; cursor: pointer; }
  .card-photo-caption { font-size: 12px; color: var(--muted-dark); }
  .card-badge { position: absolute; top: 10px; left: 10px; background: var(--gold); color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 4px 10px; border-radius: 999px; }

  .price-known { color: var(--text); font-weight: 600; }

  .fab-col { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .fab { width: 54px; height: 54px; border-radius: 999px; background: var(--green); color: #fff; border: none; font-size: 26px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(31,77,61,0.35); display: flex; align-items: center; justify-content: center; }
  .fab-admin { width: 46px; height: 46px; font-size: 18px; background: var(--card); color: var(--green); border: 1px solid var(--green); position: relative; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(10,10,8,0.96); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .lightbox-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; }

  .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; z-index: 2; }
  .lightbox-counter { position: absolute; top: 20px; left: 16px; color: #fff; font-size: 13px; font-weight: 600; z-index: 2; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 999px; width: 40px; height: 40px; font-size: 22px; cursor: pointer; z-index: 2; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .qr-caixa { display: flex; justify-content: center; margin-top: 14px; }
  .qr-caixa svg { border: 1px solid var(--border); border-radius: 14px; max-width: 100%; height: auto; }
  .qr-link { font-size: 12px; color: var(--muted); word-break: break-all; text-align: center; margin: 10px 0 0; }

  .foto-caixa { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; border: 2px dashed var(--green-line); border-radius: 14px; background: var(--green-soft); padding: 22px 16px; margin-top: 4px; cursor: pointer; }
  .foto-caixa.cheia { border-style: solid; border-color: var(--border); background: var(--bg-alt); cursor: default; }
  .foto-caixa input[type="file"] { display: none; }
  .foto-ic { display: flex; }
  .foto-t { font-size: 15px; font-weight: 700; color: var(--green); line-height: 1.3; }
  .foto-caixa.cheia .foto-t { color: var(--text); }
  .foto-s { font-size: 12px; color: var(--muted); line-height: 1.4; max-width: 300px; }

  .photo-thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb-remove { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 999px; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }
  .sheet-content { padding: 20px; position: relative; }
  .sheet-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.85); border: none; color: var(--text); font-size: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .sheet-title { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 700; line-height: 1.1; margin: 4px 0 0; }
  .sheet-meta { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .price-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }
  .price-box p:first-child { color: var(--muted); font-size: 12px; margin: 0; }
  .price-box p:last-child { color: var(--text); font-weight: 600; margin: 2px 0 0; }
  .cta-col { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .cta-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 11px; font-weight: 600; text-decoration: none; font-size: 14px; border: none; cursor: pointer; }
  .cta-primary { background: var(--green); color: #fff; }
  .cta-secondary { border: 1px solid var(--border); color: var(--text); background: transparent; }
  .cta-danger { border: 1px solid var(--red); color: var(--red); background: transparent; }
  .footnote { color: var(--muted-dark); font-size: 12px; margin-top: 16px; }

  .rate-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 20px; text-align: center; }
  .rate-box p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .star-picker { font-size: 30px; letter-spacing: 4px; cursor: pointer; }
  .star-picker span { color: var(--muted-dark); }
  .star-picker span.filled { color: var(--gold); }
  .rate-thanks { color: var(--green); font-size: 13px; font-weight: 600; margin-top: 8px; }

  .form-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: var(--fonte-texto); font-size: 14px; outline: none; margin-top: 10px; }
  .form-field::placeholder { color: var(--muted-dark); }
  .field-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 14px; margin-bottom: 6px; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .quadra-count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .quadra-count-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .quadra-count-item span { font-size: 12px; color: var(--muted); }
  .quadra-count-item input { padding: 6px 10px; margin-top: 6px !important; }
  .price-input-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .price-input-row span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .price-input-row .price-input-label { min-width: 52px; color: var(--text); font-weight: 600; }
  .price-input-row input { margin-top: 0 !important; flex: 1; text-align: center; }
  .form-error { color: var(--red); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .consent-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .consent-row input { margin-top: 2px; flex-shrink: 0; }
  .inline-link { background: none; border: none; padding: 0; color: var(--green); text-decoration: underline; font-size: 12px; cursor: pointer; font-family: inherit; }
  .form-success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 24px 0; }

  .pending-item { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .pending-name { font-family: var(--fonte-texto); font-weight: 700; font-size: 16px; margin: 0; }

  .pending-actions { display: flex; gap: 8px; margin-top: 10px; }
  .pending-actions .cta-btn { flex: 1; padding: 8px; font-size: 13px; }
  .pending-preview-btn { background: none; border: none; padding: 0; text-align: left; width: 100%; cursor: pointer; }
  .pending-preview-btn .pending-name { display: flex; align-items: center; gap: 6px; }
  .admin-pago-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 40px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .admin-pago-box button { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .delete-review-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; }
  /* ======================================================================
     Interface de busca estilo Trivago — listagem, filtros e ficha completa
     ====================================================================== */

  :root { --green-dark: #14332A; --shadow: 0 1px 3px rgba(33,31,26,0.06); --shadow-lg: 0 14px 34px rgba(33,31,26,0.16); }

  @media (min-width: 720px) { .container { max-width: 760px; } }
  @media (min-width: 1024px) { .container { max-width: 1180px; } }

  /* ---- toolbar (contagem + ordenação + filtros) ---- */
  .toolbar { flex-wrap: wrap; row-gap: 10px; }
  .toolbar-left { display: flex; flex-direction: column; min-width: 0; }
  .toolbar-count { font-size: 14px; font-weight: 700; margin: 0; color: var(--text); }
  .toolbar-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fonte-texto); font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .tbtn.on { border-color: var(--green); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .tbtn-badge { background: var(--green); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px; }
  .tbtn .caret { font-size: 11px; opacity: 0.7; }

  .sortwrap { position: relative; }
  .sort-backdrop { position: fixed; inset: 0; z-index: 35; }
  /* No celular a barra quebra a linha e o botão fica na esquerda, então o
     menu abre para a direita. No computador o botão fica na direita e o menu
     abre para a esquerda. O ajuste fino fica por conta do JavaScript. */
  .sort-menu { position: absolute; left: 0; right: auto; top: calc(100% + 6px); z-index: 40; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); width: 262px; max-width: calc(100vw - 32px); overflow: hidden; }
  @media (min-width: 720px) { .sort-menu { left: auto; right: 0; } }
  .sort-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 13px; cursor: pointer; font-size: 13px; font-family: var(--fonte-texto); color: var(--text); font-weight: 600; }
  .sort-opt + .sort-opt { border-top: 1px solid var(--bg-alt); }
  .sort-opt:hover { background: var(--bg-alt); }
  .sort-opt .radio { width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
  .sort-opt.on .radio { border: 5px solid var(--green); }
  .sort-opt small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; line-height: 1.35; }

  /* ---- chips de filtros ativos ---- */
  .active-chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px 0; }
  .achip { display: inline-flex; align-items: center; gap: 6px; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; font-family: var(--fonte-texto); cursor: pointer; }
  .achip .x { font-size: 13px; line-height: 1; opacity: 0.8; }
  .achip-clear { background: transparent; color: var(--green); border: 1px dashed var(--muted-dark); }

  /* ---- gaveta de filtros (mobile/tablet) ---- */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(33,31,26,0.55); z-index: 60; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(390px, 92vw); background: var(--card); display: flex; flex-direction: column; }
  @media (max-width: 560px) { .drawer { top: auto; bottom: 0; height: 90vh; width: 100%; border-radius: 18px 18px 0 0; } }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .drawer-head strong { font-size: 17px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 2px 18px 18px; }
  .drawer-foot { border-top: 1px solid var(--border); padding: 12px 18px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .drawer-foot .cta-btn { flex: 1; margin: 0; }
  .drawer-close { background: none; border: none; font-size: 18px; color: var(--text); cursor: pointer; padding: 4px 6px; }

  /* ---- grupos de filtro ---- */
  .fgroup { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .fgroup:last-child { border-bottom: none; }
  .fgroup-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; color: var(--text); background: none; border: none; width: 100%; text-align: left; font-family: var(--fonte-texto); }
  .opt:disabled { opacity: 0.4; cursor: default; }
  .opt-check { width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; box-sizing: border-box; }
  .opt.on .opt-check { background: var(--green); border-color: var(--green); }
  .opt-radio { width: 17px; height: 17px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; box-sizing: border-box; }
  .opt.on .opt-radio { border: 5px solid var(--green); }
  .opt-label { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .opt-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .range { width: 100%; accent-color: var(--green); margin: 8px 0 2px; }
  .range-val { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .range-now { font-size: 15px; font-weight: 700; color: var(--green); }
  .fgroup-note { font-size: 12px; color: var(--muted-dark); margin: 6px 0 0; line-height: 1.4; }

  /* ---- card horizontal estilo Trivago ---- */
  .card { display: block; transition: box-shadow 0.15s, border-color 0.15s; }
  .card:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .card-media { position: relative; height: 172px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .media-count { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .media-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.9); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text); padding: 0; line-height: 1; }
  .media-prev { left: 8px; } .media-next { right: 8px; }
  .card-rail { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rail-price-col { display: flex; flex-direction: column; }
  .rail-from { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  .rail-price { font-size: 20px; font-weight: 700; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .rail-unit { font-size: 12px; color: var(--muted); }
  .rail-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-family: var(--fonte-texto); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .card-quote { font-size: 12px; color: var(--muted); font-style: italic; margin: 8px 0 0; border-left: 2px solid var(--gold); padding-left: 8px; line-height: 1.4; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 2px 7px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  @media (min-width: 720px) {
    .card { display: grid; grid-template-columns: 250px minmax(0, 1fr) 196px; align-items: stretch; }
    .card-media { height: 100%; min-height: 208px; }
    .card-rail { border-top: none; border-left: 1px solid var(--border); flex-direction: column; align-items: stretch; justify-content: space-between; padding: 14px; text-align: right; }
    .card-rail .rail-btn { width: 100%; }
    .card-rail .score-box { justify-content: flex-end; }
  }

  /* ---- selo de nota (estilo Trivago) ---- */
  .score-box { display: inline-flex; align-items: center; gap: 8px; }
  .score-num { background: var(--green); color: #fff; font-weight: 700; font-size: 15px; border-radius: 8px 8px 8px 2px; padding: 5px 9px; line-height: 1; flex-shrink: 0; }
  .score-num.empty { background: var(--bg-alt); color: var(--muted); font-weight: 700; }
  .score-word { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.15; }
  .score-count { font-size: 12px; color: var(--muted); display: block; font-weight: 500; }

  /* ---- ficha estilo hotel ---- */
  .sheet-wide { max-width: 920px; }
  @media (min-width: 640px) { .sheet-wide { max-height: 92vh; } }
  .hero-act { background: rgba(255,255,255,0.93); border: none; border-radius: 999px; height: 34px; min-width: 34px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: var(--fonte-texto); font-size: 12px; font-weight: 700; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.22); }
  .hero-act.on { background: var(--green); color: #fff; }
  .hero-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 240px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }
  .sheet-wide { display: flex; flex-direction: column; overflow: hidden; }
  .sheet-scroll { flex: 1; overflow-y: auto; min-height: 0; }


  .sec { margin-top: 24px; }
  .sec-title { font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; margin: 0 0 10px; color: var(--text); }

  .rating-panel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .rp-score { text-align: center; flex-shrink: 0; }

  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 2px 0; }

  .rev-avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ---- barra de busca no formato do Trivago ---- */
  .searchcard { border: 1px solid var(--border); border-radius: 14px; background: var(--card); overflow: hidden; margin-top: 18px; box-shadow: var(--shadow); }
  .sc-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .sc-icon { flex-shrink: 0; display: flex; }
  .sc-field { flex: 1; min-width: 0; }
  .sc-label { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .sc-input { width: 100%; border: none; background: transparent; outline: none; font-family: var(--fonte-texto); font-size: 15px; font-weight: 700; color: var(--text); padding: 3px 0 1px; }
  .sc-input::placeholder { color: var(--muted-dark); font-weight: 500; }
  .sc-select { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .sc-caret { flex-shrink: 0; color: var(--muted); font-size: 12px; }

  /* ---- mapa ---- */
  .mapwrap { position: relative; z-index: 0; height: calc(100vh - 98px); height: calc(100dvh - 98px); min-height: 380px; border-top: 1px solid var(--border); background: var(--bg-alt); }
  .map { width: 100%; height: 100%; }
  .leaflet-container { font-family: var(--fonte-texto); background: var(--bg-alt); }
  .pin { display: inline-block; transform: translate(-50%, -100%); background: var(--green); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .pin.on { background: var(--gold); color: var(--green-dark); }
  .pin-me { display: block; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 999px; background: #fff; border: 4px solid var(--green); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .map-card-holder { position: absolute; left: 12px; right: 12px; bottom: 90px; z-index: 900; }
  .map-card-holder.up { bottom: 152px; }
  @media (min-width: 720px) { .map-card-holder { max-width: 440px; right: auto; } }
  .map-card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 12px; padding: 10px 32px 10px 10px; align-items: center; cursor: pointer; text-align: left; }
  .map-card-photo { width: 84px; height: 72px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; }
  .map-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .map-card-name { font-family: var(--fonte-texto); font-size: 16px; font-weight: 700; margin: 0; line-height: 1.15; }
  .map-card-meta { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .map-card-price { font-size: 17px; font-weight: 700; color: var(--green); line-height: 1.1; white-space: nowrap; }
  .map-close { position: absolute; top: 6px; right: 8px; background: none; border: none; font-size: 14px; color: var(--muted); cursor: pointer; padding: 2px 4px; line-height: 1; }
  .map-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; color: var(--muted); font-size: 14px; background: var(--bg-alt); z-index: 900; }
  .map-fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 45; background: var(--green); color: #fff; border: none; border-radius: 999px; padding: 12px 20px; font-family: var(--fonte-texto); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(31,77,61,0.35); display: inline-flex; align-items: center; gap: 8px; }
  .map-fab { bottom: 26px; }
  .map-fab.up { bottom: 88px; }

  /* ======================================================================
     Três telas: página inicial, busca e página da academia
     ====================================================================== */

  :root { --green-soft: #EDF4F0; --green-line: #C6DBD1; }

  /* ---- card de resultado (formato do Trivago) ---- */
  .rcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow 0.15s, border-color 0.15s; }
  .rcard:hover { box-shadow: 0 6px 18px rgba(33,31,26,0.10); border-color: var(--muted-dark); }
  .rcard-top { display: flex; gap: 12px; padding: 12px; }
  .rcard-photo { position: relative; width: 132px; height: 132px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #E4DEC9, #EFEADD); }
  @media (min-width: 720px) { .rcard-photo { width: 220px; height: 190px; } }
  .rcard-strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rcard-strip::-webkit-scrollbar { display: none; }
  .rcard-strip img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; display: block; }
  .rcard-nophoto { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 4px; }
  .rcard-dots { position: absolute; left: 0; right: 0; bottom: 7px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .rcard-dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.55); box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .rcard-dots i.on { background: #fff; }
  .rcard-tag { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; }
  .rcard-info { flex: 1; min-width: 0; }
  .rcard-head { display: flex; align-items: flex-start; gap: 8px; }
  .rcard-name { font-size: 18px; font-weight: 700; line-height: 1.18; margin: 0; flex: 1; min-width: 0; }
  @media (min-width: 720px) { .rcard-name { font-size: 21px; } }
  .rcard-acts { display: flex; gap: 2px; flex-shrink: 0; }
  .rcard-acts button { background: none; border: none; padding: 3px; cursor: pointer; display: flex; line-height: 0; }
  .rcard-stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; margin-top: 3px; }
  .rcard-score { display: flex; align-items: center; gap: 7px; margin-top: 5px; flex-wrap: wrap; }
  .sbadge { background: var(--green); color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 14px; font-weight: 700; line-height: 1.1; }
  .sbadge.none { background: var(--bg-alt); color: var(--muted); }
  .sword { font-size: 14px; font-weight: 700; }
  .scount { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .rcard-line { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--muted); margin: 5px 0 0; line-height: 1.35; }
  .rcard-line span { min-width: 0; }
  .rcard-line .ico { flex-shrink: 0; margin-top: 1px; }

  .offer { margin: 0 12px 12px; background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 10px; padding: 10px 12px; }
  .offer-head { font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .offer-head strong { font-weight: 700; }
  .offer-check { color: var(--green); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .offer-dois { display: flex; gap: 20px; min-width: 0; }
  .offer-um { display: flex; flex-direction: column; min-width: 0; }
  .offer-um-lbl { font-size: 12px; color: var(--muted); }
  .offer-um-val { font-size: 22px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .offer-um-val.sem-valor { font-size: 14px; }
  .offer-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 6px; }
  .offer-price { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.05; white-space: nowrap; }
  .offer-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .offer-btn { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
  .offer-note { font-size: 12px; color: var(--muted); margin: 7px 0 0; }
  .offer-more { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .offer-more strong { color: var(--text); font-weight: 700; margin-right: 5px; }

  /* ---- página inicial ---- */
  .home-head { background: var(--card); border-bottom: 1px solid var(--border); padding: 17px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .home-brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; cursor: pointer; }
  .home-brand h1 { font-size: 26px; font-weight: 700; margin: 0; color: var(--green); line-height: 1; }
  .home-hero { padding: 26px 20px 22px; }
  .home-hero h2 { font-size: 30px; font-weight: 700; line-height: 1.12; margin: 0; color: var(--text); }
  @media (min-width: 720px) { .home-hero { padding: 40px 20px 30px; } .home-hero h2 { font-size: 40px; max-width: 620px; } }
  .home-hero p { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  .home-hero .home-hero-sub { margin-top: 12px; }
  .stats-mapa { height: 260px; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
  .stat-regiao small { font-weight: 600; color: var(--muted); margin-left: 4px; }
  .admin-aviso { background: #FFF6DD; border-bottom: 1px solid #E8D49A; color: #6B5310; font-size: 13px; line-height: 1.45; padding: 9px 16px; }
  .admin-aviso code { display: block; margin-top: 6px; font-size: 12px; background: #fff; border: 1px solid #E8D49A; border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; user-select: all; }
  .est-previa { border: 1px solid var(--green-line); background: var(--green-soft); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.45; }
  .est-previa-t { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: var(--green); }
  .home-sec { padding: 6px 20px 22px; }
  .home-sec h3 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }
  @media (min-width: 720px) { .home-sec h3 { font-size: 25px; } }
  .home-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .home-strip::-webkit-scrollbar { display: none; }
  .mini { display: block; flex: 0 0 210px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-align: left; cursor: pointer; padding: 0; box-shadow: var(--shadow); color: inherit; text-decoration: none; }
  .mini-photo { height: 118px; background: linear-gradient(135deg, #E4DEC9, #EFEADD); display: flex; align-items: center; justify-content: center; }
  .mini-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini-body { padding: 10px 12px 12px; }
  .mini-name { font-size: 15px; font-weight: 700; margin: 0; line-height: 1.2; }
  .mini-score { font-size: 13px; margin: 5px 0 0; }
  .mini-score strong { color: var(--green); font-weight: 700; }
  .mini-score span { color: var(--muted); }
  .mini-stars { font-size: 12px; color: var(--gold); margin: 3px 0 0; letter-spacing: 1px; }
  .mini-stars em { color: var(--muted); font-style: normal; letter-spacing: 0; margin-left: 4px; }
  .city-tabs { display: flex; gap: 18px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 14px; scrollbar-width: none; }
  .city-tabs::-webkit-scrollbar { display: none; }
  .city-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 0 9px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .city-tab.on { color: var(--green); border-bottom-color: var(--green); font-weight: 700; }
  .city-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  /* menu de três barras */
  .menu-btn { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; flex-shrink: 0; }
  .viagem-cartao { margin-top: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; align-items: start; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .viagem-cartao-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .viagem-cartao-eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
  .viagem-cartao-t { margin: 2px 0 0; font-weight: 700; font-size: 17px; color: var(--text); }
  .viagem-cartao-s { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .viagem-cartao-acoes { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .viagem-cartao-acoes .cta-btn { width: auto; padding: 10px 18px; }
  .viagens-lista { display: grid; gap: 10px; margin-top: 18px; }
  .viagem-linha { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: var(--card); }
  .viagem-txt strong { display: block; font-size: 15px; }
  .viagem-txt small { display: block; font-size: 13px; color: var(--muted); }
  .viagem-apagar { color: var(--muted) !important; }
  .viagem-datas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .jog-viagem { margin: 6px 0 4px 34px; padding: 4px 14px 14px; border-left: 2px solid var(--green-soft); }
  .jog-viagem .field-label { margin-top: 14px; }
  .viagem-pergunta { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--green-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; position: relative; padding-right: 38px; }

  .senha-olho { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 10px; cursor: pointer; }
  .senha-olho:hover { background: var(--bg-alt); }
  .senha-forca { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; font-size: 13px; color: var(--muted); min-height: 0; }
  .senha-forca:empty { display: none; }
  .senha-barra { display: inline-flex; gap: 3px; }
  .senha-barra i { width: 22px; height: 4px; border-radius: 2px; background: var(--border); }
  .senha-barra.n0 i:nth-child(1) { background: var(--red, #C0392B); }
  .senha-barra.n1 i:nth-child(-n+2) { background: var(--gold); }
  .senha-barra.n2 i { background: var(--green); }
  .conta-topo { width: 44px; height: 44px; margin-left: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-family: inherit; }
  .conta-topo.destaque { background: #FFF6D8; border-color: #F2D27A; box-shadow: 0 0 0 4px rgba(242, 196, 64, 0.22), 0 0 14px rgba(242, 196, 64, 0.45); }
  .conta-topo.logado { border-radius: 50%; background: var(--green); color: #fff; font-weight: 700; font-size: 17px; border-color: var(--green); }
  .home-head .conta-topo + .menu-btn { margin-left: 0; }
  .convite-conta { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 40; max-width: 520px; margin: 0 auto; display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 16px 16px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.16); }
  .convite-ic { width: 52px; height: 52px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .convite-txt { flex: 1; min-width: 0; }
  .convite-t { margin: 0 24px 4px 0; font-weight: 700; font-size: 16px; }
  .convite-s { margin: 0 0 12px; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .convite-btn { width: 100%; }
  .convite-viagem .convite-ic { background: var(--green); }
  .convite-fechar { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 16px; color: var(--muted); cursor: pointer; padding: 6px; }
  .menu-btn > span:not(.menu-conta) { display: block; width: 20px; height: 2px; border-radius: 2px; background: var(--green); }
  .menu-overlay { justify-content: flex-end; align-items: stretch; }
  .menu-drawer { width: min(340px, 88vw); height: 100%; background: var(--card); overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); box-shadow: -10px 0 30px rgba(33,31,26,0.18); animation: menuEntra 0.18s ease-out; }

  @media (prefers-reduced-motion: reduce) { .menu-drawer { animation: none; } }
  .menu-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .menu-marca { display: flex; align-items: center; gap: 9px; font-size: 17px; color: var(--green); }
  .menu-marca svg { width: 30px; height: 30px; }
  .menu-fechar { width: 38px; height: 38px; border: none; background: var(--bg-alt); border-radius: 999px; font-size: 15px; color: var(--text); cursor: pointer; flex-shrink: 0; }
  .menu-grupo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-dark); margin: 18px 0 4px; }
  .menu-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; border-radius: 10px; padding: 11px 10px; font-family: var(--fonte-texto); font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; cursor: pointer; }
  .menu-item:hover { background: var(--bg-alt); }
  .menu-rodape { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
  .menu-versao { font-size: 12px; color: var(--muted-dark); margin: 10px 10px 0; }

  /* médias mostradas para quem pensa em cadastrar a academia */

     computador. */
  .ba-numeros { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.18); text-align: center; }
  .ban-item { min-width: 0; }
  .ban-item strong { display: block; font-size: 22px; font-weight: 700; color: var(--gold-light); line-height: 1.1; white-space: nowrap; }
  .ban-item span { font-size: 12px; color: rgba(255,255,255,0.72); line-height: 1.35; display: block; margin-top: 4px; }
