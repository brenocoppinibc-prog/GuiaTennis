# Como o Netlify publica o GuiaTennis.
#
# O site é uma página estática só. Não há nada para compilar: o Netlify
# pega os arquivos da raiz deste repositório e coloca no ar.
#
# O projeto guiatennis.com.br está ligado ao GitHub (28/09/2026):
# - branch main → guiatennis.com.br, banco de verdade. Cada publicação
#   gasta 15 dos 300 créditos do mês do plano grátis; acabou, o site sai
#   do ar até o mês virar.
# - pedido de mudança (PR) para a main → prévia de teste
#   deploy-preview-N--….netlify.app, banco de teste. Não gasta crédito.

[build]
  # A raiz do repositório já é o que vai para o ar — o index.html está aqui.
  publish = "."
  # Mudança que não mexe em nenhum arquivo do site (contexto, SQL, testes,
  # pasta supabase/) não vira publicação — e não gasta crédito. Na dúvida
  # (primeira publicação, commit anterior desconhecido), publica.
  ignore = 'test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- index.html 404.html netlify.toml robots.txt sitemap.xml favicon-32.png favicon-192.png apple-touch-icon.png og-image.png google7b66589ffc303f37.html'

# O HTML não fica em cache. Assim, quando você publica uma correção, quem
# já visitou o site recebe a versão nova na hora, sem precisar limpar nada.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# As imagens (favicon, ícone do iPhone, imagem de compartilhamento) mudam
# raramente, então podem ficar guardadas no navegador por uma semana.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Endereços de cada tela (30/09/2026), no padrão dos sites grandes:
#   /academia/<nome>-<fim do id>   ficha da academia
#   /quadras/<cidade>/<bairro>     academias de uma região
#   /busca?q=…&piso=…              busca com filtros
#   /comparar?academias=…          comparação
#   /perfil                        perfil da conta do jogador
#   /parceiros/…                   GuiaTennis Parceiros (site das academias)
# Não são arquivos: o Netlify entrega o index.html (status 200, sem mudar o
# endereço) e o site monta a tela pelo link. Os links antigos (?court=,
# ?busca=) continuam funcionando, porque abrem a própria home.
[[redirects]]
  from = "/academia/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/quadras/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/quadras"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/busca"
  to = "/index.html"
  status = 200

# GuiaTennis Parceiros, o site das academias: /parceiros, /parceiros/planos,
# /parceiros/entrar, /parceiros/painel…
[[redirects]]
  from = "/parceiros"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/parceiros/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/comparar"
  to = "/index.html"
  status = 200

# Perfil da conta do jogador (05/10/2026), como o "Meu trivago".
[[redirects]]
  from = "/perfil"
  to = "/index.html"
  status = 200

# O mesmo cuidado de cache do index.html vale para essas telas.
[[headers]]
  for = "/academia/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/parceiros/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/quadras/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# O sitemap sai do banco de verdade, com a ficha de cada academia publicada
# (função sitemap(), em supabase/migrations), em XML para qualquer pedido.
# Academia nova entra sozinha, sem publicar o site. A chave é a pública, a
# mesma do index.html. O sitemap.xml do repositório fica de reserva: só
# vale se esta regra sair.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://eultezheqwmxyakvgyjy.supabase.co/rest/v1/rpc/sitemap"
  status = 200
  force = true
  headers = {apikey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bHRlemhlcXdteHlha3ZneWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDk5OTcsImV4cCI6MjEwMzg4NTk5N30.JORQlxn0UjezbntZAiQGyA7Mo26zEpnHriPh9IceuuY"}

# Os arquivos de trabalho ficam no repositório, mas não no ar: o contexto do
# projeto e o SQL do banco não interessam a quem visita o site.
[[redirects]]
  from = "/GUIATENNIS-CONTEXTO.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/SQL-ESTATISTICAS.sql"
  to = "/404.html"
  status = 404

# O mesmo para os testes.
[[redirects]]
  from = "/testes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/SQL-SEGURANCA.sql"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/SQL-RETRATO.sql"
  to = "/404.html"
  status = 404

# A estrutura do banco e as academias de exemplo do banco de teste.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404

# A automação do GitHub (aplica o SQL novo nos bancos).
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404

# Imagens de divulgação (perfil e capa do WhatsApp) e o gerador delas.
[[redirects]]
  from = "/divulgacao/*"
  to = "/404.html"
  status = 404
